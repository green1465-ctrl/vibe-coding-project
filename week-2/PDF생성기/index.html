<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans KR', sans-serif; }
    .preview-page {
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      aspect-ratio: auto;
    }
    .block-item { transition: all 0.2s ease; }
    .block-item:hover { background-color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media print { body { display: none; } }
    .fade-in { animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

    // ========================================
    // Constants & Helpers
    // ========================================
    const PAGE_SIZES = {
      A4: { width: 210, height: 297, label: 'A4' },
      Letter: { width: 215.9, height: 279.4, label: 'Letter' },
      A5: { width: 148, height: 210, label: 'A5' },
    };

    const MARGIN_PRESETS = {
      narrow: { top: 15, bottom: 15, left: 15, right: 15, label: '좁게' },
      normal: { top: 25, bottom: 25, left: 20, right: 20, label: '보통' },
      wide: { top: 35, bottom: 35, left: 30, right: 30, label: '넓게' },
    };

    const TEXT_COLORS = {
      black: { value: '#000000', label: '검정' },
      darkgray: { value: '#374151', label: '진회색' },
      navy: { value: '#1e3a5f', label: '남색' },
    };

    const LINE_HEIGHTS = [1.2, 1.5, 1.8, 2.0];

    const BLOCK_TYPES = [
      { value: 'heading', label: '제목' },
      { value: 'paragraph', label: '본문' },
      { value: 'list', label: '목록' },
      { value: 'quote', label: '인용문' },
      { value: 'divider', label: '구분선' },
      { value: 'spacer', label: '빈 줄' },
    ];

    const createBlock = (type = 'paragraph', content = '', level = 'h2') => ({
      id: Date.now() + Math.random(),
      type,
      content,
      level,
    });

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };

    const formatDateForFile = () => {
      const d = new Date();
      return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    };

    // ========================================
    // Templates
    // ========================================
    const TEMPLATES = {
      basic: {
        name: '기본 문서',
        icon: '\uD83D\uDCC4',
        data: {
          title: '문서 제목',
          author: '',
          blocks: [
            createBlock('heading', '문서 제목', 'h1'),
            createBlock('paragraph', '여기에 문서 내용을 작성하세요.'),
          ],
        },
      },
      meeting: {
        name: '회의록',
        icon: '\uD83D\uDCCB',
        data: {
          title: '회의록',
          author: '',
          blocks: [
            createBlock('heading', '회의록', 'h1'),
            createBlock('heading', '회의 정보', 'h2'),
            createBlock('paragraph', '일시: \n장소: \n참석자: '),
            createBlock('divider'),
            createBlock('heading', '안건', 'h2'),
            createBlock('list', '안건 1\n안건 2\n안건 3'),
            createBlock('divider'),
            createBlock('heading', '회의 내용', 'h2'),
            createBlock('paragraph', '회의 내용을 여기에 작성하세요.'),
            createBlock('divider'),
            createBlock('heading', '결정 사항', 'h2'),
            createBlock('list', '결정 사항 1\n결정 사항 2'),
            createBlock('heading', '다음 회의', 'h2'),
            createBlock('paragraph', '일시: \n안건: '),
          ],
        },
      },
      report: {
        name: '보고서',
        icon: '\uD83D\uDCDD',
        data: {
          title: '보고서',
          author: '',
          blocks: [
            createBlock('heading', '보고서 제목', 'h1'),
            createBlock('paragraph', '작성 목적과 배경을 간략히 기술합니다.'),
            createBlock('divider'),
            createBlock('heading', '1. 개요', 'h2'),
            createBlock('paragraph', '보고서의 개요를 작성하세요.'),
            createBlock('heading', '2. 현황 분석', 'h2'),
            createBlock('paragraph', '현재 상황에 대한 분석 내용을 작성하세요.'),
            createBlock('quote', '핵심 내용이나 중요한 인용을 여기에 넣으세요.'),
            createBlock('heading', '3. 결론 및 제안', 'h2'),
            createBlock('list', '제안 사항 1\n제안 사항 2\n제안 사항 3'),
            createBlock('heading', '4. 참고 자료', 'h2'),
            createBlock('paragraph', '참고 자료 목록을 작성하세요.'),
          ],
        },
      },
    };

    // ========================================
    // Design System Components
    // ========================================
    function Button({ children, variant = 'primary', size = 'md', disabled = false, onClick, className = '', type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-blue-600 text-white hover:bg-blue-700 focus:ring-blue-500 shadow-sm',
        secondary: 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 focus:ring-gray-300',
        danger: 'bg-red-50 text-red-600 hover:bg-red-100 focus:ring-red-400',
        ghost: 'text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:ring-gray-300',
      };
      const sizes = {
        sm: 'px-2.5 py-1.5 text-xs gap-1',
        md: 'px-4 py-2 text-sm gap-2',
        lg: 'px-6 py-3 text-base gap-2',
      };
      return (
        <button type={type} disabled={disabled} onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}>
          {children}
        </button>
      );
    }

    function Input({ label, value, onChange, placeholder, type = 'text', className = '', disabled = false, size = 'md' }) {
      const sizes = { sm: 'px-2.5 py-1.5 text-xs', md: 'px-3 py-2 text-sm' };
      return (
        <div className={className}>
          {label && <label className="block text-xs font-medium text-gray-600 mb-1">{label}</label>}
          <input type={type} value={value} onChange={onChange} placeholder={placeholder} disabled={disabled}
            className={`w-full border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition ${sizes[size]} ${disabled ? 'bg-gray-100' : 'bg-white'}`} />
        </div>
      );
    }

    function Select({ label, value, onChange, options, className = '' }) {
      return (
        <div className={className}>
          {label && <label className="block text-xs font-medium text-gray-600 mb-1">{label}</label>}
          <select value={value} onChange={onChange}
            className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      );
    }

    function Textarea({ label, value, onChange, placeholder, rows = 3, className = '' }) {
      return (
        <div className={className}>
          {label && <label className="block text-xs font-medium text-gray-600 mb-1">{label}</label>}
          <textarea value={value} onChange={onChange} placeholder={placeholder} rows={rows}
            className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-y" />
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return <div className={`bg-white rounded-xl shadow-sm border border-gray-200 ${className}`}>{children}</div>;
    }

    function SectionTitle({ children, className = '' }) {
      return <h3 className={`text-sm font-semibold text-gray-800 mb-3 ${className}`}>{children}</h3>;
    }

    function Toggle({ label, checked, onChange }) {
      return (
        <label className="flex items-center justify-between cursor-pointer group">
          <span className="text-sm text-gray-700">{label}</span>
          <div className="relative">
            <input type="checkbox" checked={checked} onChange={onChange} className="sr-only" />
            <div className={`w-9 h-5 rounded-full transition-colors ${checked ? 'bg-blue-600' : 'bg-gray-300'}`}></div>
            <div className={`absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform shadow ${checked ? 'translate-x-4' : ''}`}></div>
          </div>
        </label>
      );
    }

    // ========================================
    // Block Editor Component
    // ========================================
    function BlockEditor({ block, index, total, onUpdate, onDelete, onMove }) {
      const typeInfo = BLOCK_TYPES.find(t => t.value === block.type);

      return (
        <div className="block-item border border-gray-200 rounded-lg p-3 bg-white fade-in">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{typeInfo?.label}</span>
            <select value={block.type} onChange={e => onUpdate(block.id, { type: e.target.value })}
              className="text-xs border border-gray-200 rounded px-1.5 py-0.5 bg-white">
              {BLOCK_TYPES.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
            </select>
            {block.type === 'heading' && (
              <select value={block.level} onChange={e => onUpdate(block.id, { level: e.target.value })}
                className="text-xs border border-gray-200 rounded px-1.5 py-0.5 bg-white">
                <option value="h1">H1 (대제목)</option>
                <option value="h2">H2 (중제목)</option>
                <option value="h3">H3 (소제목)</option>
              </select>
            )}
            <div className="flex-1" />
            <button onClick={() => onMove(index, -1)} disabled={index === 0}
              className="p-1 text-gray-400 hover:text-gray-600 disabled:opacity-30" title="위로">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M14.77 12.79a.75.75 0 01-1.06-.02L10 8.83l-3.71 3.94a.75.75 0 11-1.08-1.04l4.25-4.5a.75.75 0 011.08 0l4.25 4.5a.75.75 0 01-.02 1.06z"/></svg>
            </button>
            <button onClick={() => onMove(index, 1)} disabled={index === total - 1}
              className="p-1 text-gray-400 hover:text-gray-600 disabled:opacity-30" title="아래로">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/></svg>
            </button>
            <button onClick={() => onDelete(block.id)}
              className="p-1 text-gray-400 hover:text-red-500 transition" title="삭제">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"/></svg>
            </button>
          </div>

          {(block.type === 'heading' || block.type === 'paragraph' || block.type === 'quote') && (
            <textarea
              value={block.content}
              onChange={e => onUpdate(block.id, { content: e.target.value })}
              placeholder={block.type === 'heading' ? '제목을 입력하세요' : block.type === 'quote' ? '인용문을 입력하세요' : '내용을 입력하세요'}
              rows={block.type === 'heading' ? 1 : 3}
              className="w-full border border-gray-200 rounded px-2.5 py-1.5 text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y"
            />
          )}
          {block.type === 'list' && (
            <textarea
              value={block.content}
              onChange={e => onUpdate(block.id, { content: e.target.value })}
              placeholder="각 줄이 하나의 항목이 됩니다"
              rows={4}
              className="w-full border border-gray-200 rounded px-2.5 py-1.5 text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y"
            />
          )}
          {block.type === 'divider' && (
            <div className="border-t-2 border-gray-300 my-1"></div>
          )}
          {block.type === 'spacer' && (
            <div className="text-xs text-gray-400 text-center py-1">빈 줄 (여백)</div>
          )}
        </div>
      );
    }

    // ========================================
    // Preview Component
    // ========================================
    function PreviewPage({ docSettings, blocks, styleSettings }) {
      const pageSize = PAGE_SIZES[docSettings.pageSize];
      const margin = MARGIN_PRESETS[docSettings.margin];
      const isLandscape = docSettings.orientation === 'landscape';
      const pw = isLandscape ? pageSize.height : pageSize.width;
      const ph = isLandscape ? pageSize.width : pageSize.height;

      const scale = 0.95;
      const previewWidthPx = pw * scale * 2;

      const headingSizes = { h1: '1.5em', h2: '1.25em', h3: '1.1em' };
      const headingWeights = { h1: 700, h2: 700, h3: 600 };

      const textColor = TEXT_COLORS[styleSettings.textColor]?.value || '#000';

      return (
        <div className="flex flex-col items-center gap-4">
          <div
            className="preview-page bg-white rounded relative overflow-hidden"
            style={{
              width: `${previewWidthPx}px`,
              maxWidth: '100%',
              minHeight: `${ph * scale * 2}px`,
              padding: `${margin.top * scale * 2}px ${margin.right * scale * 2}px ${margin.bottom * scale * 2}px ${margin.left * scale * 2}px`,
              fontSize: `${styleSettings.fontSize * 0.85}px`,
              lineHeight: styleSettings.lineHeight,
              color: textColor,
            }}
          >
            {styleSettings.showHeader && docSettings.title && (
              <div className="text-xs text-gray-400 mb-4 pb-2 border-b border-gray-200 truncate">
                {docSettings.title}
              </div>
            )}

            {blocks.map((block, i) => {
              switch (block.type) {
                case 'heading':
                  return (
                    <div key={block.id} style={{ fontSize: headingSizes[block.level], fontWeight: headingWeights[block.level], marginTop: i > 0 ? '0.8em' : 0, marginBottom: '0.4em' }}>
                      {block.content || '\u00A0'}
                    </div>
                  );
                case 'paragraph':
                  return (
                    <div key={block.id} style={{ marginBottom: '0.6em', whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                      {block.content || '\u00A0'}
                    </div>
                  );
                case 'list':
                  return (
                    <div key={block.id} style={{ marginBottom: '0.6em', paddingLeft: '1.2em' }}>
                      {(block.content || '').split('\n').filter(l => l.trim()).map((line, j) => (
                        <div key={j} style={{ marginBottom: '0.2em' }}>{'\u2022'} {line}</div>
                      ))}
                    </div>
                  );
                case 'quote':
                  return (
                    <div key={block.id} style={{
                      marginBottom: '0.6em', paddingLeft: '1em', borderLeft: '3px solid #93c5fd',
                      color: '#4b5563', fontStyle: 'italic', whiteSpace: 'pre-wrap',
                    }}>
                      {block.content || '\u00A0'}
                    </div>
                  );
                case 'divider':
                  return <hr key={block.id} style={{ border: 'none', borderTop: '1px solid #d1d5db', margin: '0.8em 0' }} />;
                case 'spacer':
                  return <div key={block.id} style={{ height: '1.5em' }} />;
                default:
                  return null;
              }
            })}

            {styleSettings.showFooter && (
              <div className="absolute bottom-3 left-0 right-0 text-center text-xs text-gray-400">
                1 / 1
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================================
    // Hidden Render Target (for PDF)
    // ========================================
    function HiddenPDFRender({ docSettings, blocks, styleSettings, pdfRef }) {
      const pageSize = PAGE_SIZES[docSettings.pageSize];
      const margin = MARGIN_PRESETS[docSettings.margin];
      const isLandscape = docSettings.orientation === 'landscape';
      const pw = isLandscape ? pageSize.height : pageSize.width;
      const ph = isLandscape ? pageSize.width : pageSize.height;

      // Use 3x scale for sharp PDF rendering
      const pxPerMm = 3.78;
      const widthPx = pw * pxPerMm;
      const textColor = TEXT_COLORS[styleSettings.textColor]?.value || '#000';

      const headingSizes = { h1: '1.6em', h2: '1.3em', h3: '1.1em' };
      const headingWeights = { h1: 700, h2: 700, h3: 600 };

      return (
        <div ref={pdfRef} style={{
          position: 'absolute',
          left: '-9999px',
          top: 0,
          width: `${widthPx}px`,
          padding: `${margin.top * pxPerMm}px ${margin.right * pxPerMm}px ${margin.bottom * pxPerMm}px ${margin.left * pxPerMm}px`,
          backgroundColor: '#ffffff',
          fontFamily: "'Noto Sans KR', sans-serif",
          fontSize: `${styleSettings.fontSize * 1.2}px`,
          lineHeight: styleSettings.lineHeight,
          color: textColor,
          boxSizing: 'border-box',
        }}>
          {styleSettings.showHeader && docSettings.title && (
            <div style={{ fontSize: '10px', color: '#9ca3af', marginBottom: '16px', paddingBottom: '8px', borderBottom: '1px solid #e5e7eb' }}>
              {docSettings.title}
            </div>
          )}

          {blocks.map((block, i) => {
            switch (block.type) {
              case 'heading':
                return (
                  <div key={block.id} style={{ fontSize: headingSizes[block.level], fontWeight: headingWeights[block.level], marginTop: i > 0 ? '0.8em' : 0, marginBottom: '0.4em' }}>
                    {block.content || '\u00A0'}
                  </div>
                );
              case 'paragraph':
                return (
                  <div key={block.id} style={{ marginBottom: '0.6em', whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                    {block.content || '\u00A0'}
                  </div>
                );
              case 'list':
                return (
                  <div key={block.id} style={{ marginBottom: '0.6em', paddingLeft: '1.5em' }}>
                    {(block.content || '').split('\n').filter(l => l.trim()).map((line, j) => (
                      <div key={j} style={{ marginBottom: '0.25em' }}>{'\u2022'} {line}</div>
                    ))}
                  </div>
                );
              case 'quote':
                return (
                  <div key={block.id} style={{
                    marginBottom: '0.6em', paddingLeft: '1em', borderLeft: '3px solid #93c5fd',
                    color: '#4b5563', fontStyle: 'italic', whiteSpace: 'pre-wrap',
                  }}>
                    {block.content || '\u00A0'}
                  </div>
                );
              case 'divider':
                return <hr key={block.id} style={{ border: 'none', borderTop: '1px solid #d1d5db', margin: '0.8em 0' }} />;
              case 'spacer':
                return <div key={block.id} style={{ height: '1.5em' }} />;
              default:
                return null;
            }
          })}
        </div>
      );
    }

    // ========================================
    // App Component
    // ========================================
    function App() {
      const STORAGE_KEY = 'pdf-generator-state';

      // --- Document settings ---
      const [docSettings, setDocSettings] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved).docSettings;
        } catch {}
        return { title: '', author: '', date: todayStr(), pageSize: 'A4', orientation: 'portrait', margin: 'normal' };
      });

      // --- Content blocks ---
      const [blocks, setBlocks] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved).blocks;
        } catch {}
        return [createBlock('heading', '', 'h1'), createBlock('paragraph', '')];
      });

      // --- Style settings ---
      const [styleSettings, setStyleSettings] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved).styleSettings;
        } catch {}
        return { fontSize: 14, lineHeight: 1.5, textColor: 'black', showHeader: false, showFooter: true };
      });

      const [activeTab, setActiveTab] = useState('editor'); // editor | preview (mobile)
      const [isGenerating, setIsGenerating] = useState(false);
      const pdfRef = useRef(null);

      // --- Save to localStorage ---
      useEffect(() => {
        const timer = setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ docSettings, blocks, styleSettings }));
          } catch {}
        }, 500);
        return () => clearTimeout(timer);
      }, [docSettings, blocks, styleSettings]);

      // --- Block operations ---
      const addBlock = useCallback((type = 'paragraph') => {
        setBlocks(prev => [...prev, createBlock(type)]);
      }, []);

      const updateBlock = useCallback((id, updates) => {
        setBlocks(prev => prev.map(b => b.id === id ? { ...b, ...updates } : b));
      }, []);

      const deleteBlock = useCallback((id) => {
        setBlocks(prev => prev.filter(b => b.id !== id));
      }, []);

      const moveBlock = useCallback((index, direction) => {
        setBlocks(prev => {
          const arr = [...prev];
          const newIndex = index + direction;
          if (newIndex < 0 || newIndex >= arr.length) return arr;
          [arr[index], arr[newIndex]] = [arr[newIndex], arr[index]];
          return arr;
        });
      }, []);

      // --- Load template ---
      const loadTemplate = useCallback((key) => {
        const tmpl = TEMPLATES[key];
        if (!tmpl) return;
        if (blocks.some(b => b.content) && !confirm('현재 내용이 지워집니다. 템플릿을 불러올까요?')) return;
        setDocSettings(prev => ({ ...prev, title: tmpl.data.title, author: tmpl.data.author || prev.author }));
        setBlocks(tmpl.data.blocks.map(b => ({ ...b, id: Date.now() + Math.random() })));
      }, [blocks]);

      // --- PDF Generation ---
      const generatePDF = useCallback(async () => {
        if (isGenerating) return;
        setIsGenerating(true);

        try {
          const el = pdfRef.current;
          if (!el) throw new Error('Render target not found');

          // Wait for fonts
          await document.fonts.ready;
          await new Promise(r => setTimeout(r, 300));

          const pageSize = PAGE_SIZES[docSettings.pageSize];
          const isLandscape = docSettings.orientation === 'landscape';
          const pw = isLandscape ? pageSize.height : pageSize.width;
          const ph = isLandscape ? pageSize.width : pageSize.height;
          const margin = MARGIN_PRESETS[docSettings.margin];

          const pxPerMm = 3.78;
          const pageWidthPx = pw * pxPerMm;
          const pageHeightPx = ph * pxPerMm;

          const canvas = await html2canvas(el, {
            scale: 2,
            useCORS: true,
            backgroundColor: '#ffffff',
            width: pageWidthPx,
            logging: false,
          });

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: isLandscape ? 'landscape' : 'portrait',
            unit: 'mm',
            format: [pw, ph],
          });

          const canvasWidth = canvas.width;
          const canvasHeight = canvas.height;

          // Calculate how much canvas fits per page
          const contentHeightMm = ph;
          const pageContentPx = (contentHeightMm / ph) * pageHeightPx * 2; // scale=2
          const totalPages = Math.max(1, Math.ceil(canvasHeight / pageContentPx));

          for (let page = 0; page < totalPages; page++) {
            if (page > 0) pdf.addPage([pw, ph], isLandscape ? 'landscape' : 'portrait');

            // Crop canvas for this page
            const srcY = page * pageContentPx;
            const srcH = Math.min(pageContentPx, canvasHeight - srcY);

            const pageCanvas = document.createElement('canvas');
            pageCanvas.width = canvasWidth;
            pageCanvas.height = srcH;
            const ctx = pageCanvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvasWidth, srcH);
            ctx.drawImage(canvas, 0, srcY, canvasWidth, srcH, 0, 0, canvasWidth, srcH);

            const imgData = pageCanvas.toDataURL('image/jpeg', 0.95);
            const imgH = (srcH / (pageContentPx)) * ph;
            pdf.addImage(imgData, 'JPEG', 0, 0, pw, imgH);

            // Footer
            if (styleSettings.showFooter) {
              pdf.setFontSize(9);
              pdf.setTextColor(150);
              const footerText = `${page + 1} / ${totalPages}`;
              pdf.text(footerText, pw / 2, ph - 8, { align: 'center' });
            }
          }

          // Set metadata
          pdf.setProperties({
            title: docSettings.title || '문서',
            author: docSettings.author || '',
            creator: 'PDF 생성기',
          });

          const filename = docSettings.title
            ? `${docSettings.title}_${formatDateForFile()}.pdf`
            : `문서_${formatDateForFile()}.pdf`;

          pdf.save(filename);
        } catch (err) {
          console.error('PDF generation error:', err);
          alert('PDF 생성 중 오류가 발생했습니다: ' + err.message);
        } finally {
          setIsGenerating(false);
        }
      }, [docSettings, styleSettings, isGenerating]);

      // --- Clear all ---
      const clearAll = useCallback(() => {
        if (!confirm('모든 내용을 초기화할까요?')) return;
        setDocSettings({ title: '', author: '', date: todayStr(), pageSize: 'A4', orientation: 'portrait', margin: 'normal' });
        setBlocks([createBlock('heading', '', 'h1'), createBlock('paragraph', '')]);
        setStyleSettings({ fontSize: 14, lineHeight: 1.5, textColor: 'black', showHeader: false, showFooter: true });
      }, []);

      // ---- Render ----
      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <header className="bg-white border-b border-gray-200 sticky top-0 z-30">
            <div className="max-w-screen-2xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white text-sm font-bold">P</div>
                <h1 className="text-lg font-bold text-gray-900">PDF 생성기</h1>
              </div>
              <div className="flex items-center gap-2">
                <Button variant="ghost" size="sm" onClick={clearAll}>초기화</Button>
                <Button variant="primary" size="md" onClick={generatePDF} disabled={isGenerating}>
                  {isGenerating ? (
                    <><svg className="animate-spin w-4 h-4" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none" opacity="0.25"/><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" opacity="0.75"/></svg> 생성 중...</>
                  ) : (
                    <><svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg> PDF 다운로드</>
                  )}
                </Button>
              </div>
            </div>
          </header>

          {/* Mobile tab toggle */}
          <div className="lg:hidden bg-white border-b border-gray-200 px-4 py-2 flex gap-2">
            <button onClick={() => setActiveTab('editor')}
              className={`flex-1 py-2 text-sm font-medium rounded-lg transition ${activeTab === 'editor' ? 'bg-blue-50 text-blue-700' : 'text-gray-500'}`}>
              편집
            </button>
            <button onClick={() => setActiveTab('preview')}
              className={`flex-1 py-2 text-sm font-medium rounded-lg transition ${activeTab === 'preview' ? 'bg-blue-50 text-blue-700' : 'text-gray-500'}`}>
              미리보기
            </button>
          </div>

          <div className="max-w-screen-2xl mx-auto px-4 py-4">
            <div className="flex flex-col lg:flex-row gap-4">

              {/* ---- Left Panel: Editor ---- */}
              <div className={`w-full lg:w-1/2 xl:w-5/12 space-y-4 ${activeTab !== 'editor' ? 'hidden lg:block' : ''}`}>

                {/* Templates */}
                <Card className="p-4">
                  <SectionTitle>템플릿</SectionTitle>
                  <div className="flex gap-2 flex-wrap">
                    {Object.entries(TEMPLATES).map(([key, tmpl]) => (
                      <Button key={key} variant="secondary" size="sm" onClick={() => loadTemplate(key)}>
                        {tmpl.icon} {tmpl.name}
                      </Button>
                    ))}
                  </div>
                </Card>

                {/* Document Settings */}
                <Card className="p-4">
                  <SectionTitle>문서 기본 설정</SectionTitle>
                  <div className="grid grid-cols-2 gap-3">
                    <Input label="문서 제목" value={docSettings.title} className="col-span-2"
                      onChange={e => setDocSettings(p => ({ ...p, title: e.target.value }))} placeholder="문서 제목을 입력하세요" />
                    <Input label="작성자" value={docSettings.author}
                      onChange={e => setDocSettings(p => ({ ...p, author: e.target.value }))} placeholder="이름" />
                    <Input label="날짜" type="date" value={docSettings.date}
                      onChange={e => setDocSettings(p => ({ ...p, date: e.target.value }))} />
                    <Select label="페이지 크기" value={docSettings.pageSize}
                      onChange={e => setDocSettings(p => ({ ...p, pageSize: e.target.value }))}
                      options={Object.entries(PAGE_SIZES).map(([k, v]) => ({ value: k, label: v.label }))} />
                    <Select label="방향" value={docSettings.orientation}
                      onChange={e => setDocSettings(p => ({ ...p, orientation: e.target.value }))}
                      options={[{ value: 'portrait', label: '세로' }, { value: 'landscape', label: '가로' }]} />
                    <Select label="여백" value={docSettings.margin} className="col-span-2"
                      onChange={e => setDocSettings(p => ({ ...p, margin: e.target.value }))}
                      options={Object.entries(MARGIN_PRESETS).map(([k, v]) => ({ value: k, label: v.label }))} />
                  </div>
                </Card>

                {/* Style Settings */}
                <Card className="p-4">
                  <SectionTitle>스타일 설정</SectionTitle>
                  <div className="space-y-3">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-medium text-gray-600 mb-1">본문 크기 ({styleSettings.fontSize}pt)</label>
                        <input type="range" min="10" max="24" value={styleSettings.fontSize}
                          onChange={e => setStyleSettings(p => ({ ...p, fontSize: Number(e.target.value) }))}
                          className="w-full accent-blue-600" />
                      </div>
                      <Select label="줄 간격" value={styleSettings.lineHeight}
                        onChange={e => setStyleSettings(p => ({ ...p, lineHeight: Number(e.target.value) }))}
                        options={LINE_HEIGHTS.map(v => ({ value: v, label: `${v}` }))} />
                    </div>
                    <Select label="텍스트 색상" value={styleSettings.textColor}
                      onChange={e => setStyleSettings(p => ({ ...p, textColor: e.target.value }))}
                      options={Object.entries(TEXT_COLORS).map(([k, v]) => ({ value: k, label: v.label }))} />
                    <div className="pt-2 space-y-2.5 border-t border-gray-100">
                      <Toggle label="헤더 (문서 제목 표시)" checked={styleSettings.showHeader}
                        onChange={e => setStyleSettings(p => ({ ...p, showHeader: e.target.checked }))} />
                      <Toggle label="푸터 (페이지 번호)" checked={styleSettings.showFooter}
                        onChange={e => setStyleSettings(p => ({ ...p, showFooter: e.target.checked }))} />
                    </div>
                  </div>
                </Card>

                {/* Content Blocks */}
                <Card className="p-4">
                  <SectionTitle>콘텐츠 블록 ({blocks.length})</SectionTitle>
                  <div className="space-y-2 mb-3">
                    {blocks.map((block, index) => (
                      <BlockEditor
                        key={block.id}
                        block={block}
                        index={index}
                        total={blocks.length}
                        onUpdate={updateBlock}
                        onDelete={deleteBlock}
                        onMove={moveBlock}
                      />
                    ))}
                  </div>
                  <div className="flex flex-wrap gap-2 pt-2 border-t border-gray-100">
                    {BLOCK_TYPES.map(bt => (
                      <Button key={bt.value} variant="secondary" size="sm" onClick={() => addBlock(bt.value)}>
                        + {bt.label}
                      </Button>
                    ))}
                  </div>
                </Card>
              </div>

              {/* ---- Right Panel: Preview ---- */}
              <div className={`w-full lg:w-1/2 xl:w-7/12 ${activeTab !== 'preview' ? 'hidden lg:block' : ''}`}>
                <div className="lg:sticky lg:top-20">
                  <Card className="p-4">
                    <SectionTitle>미리보기</SectionTitle>
                    <div className="bg-gray-100 rounded-lg p-4 overflow-auto max-h-[calc(100vh-160px)]">
                      <PreviewPage docSettings={docSettings} blocks={blocks} styleSettings={styleSettings} />
                    </div>
                  </Card>
                </div>
              </div>
            </div>
          </div>

          {/* Hidden render target for PDF */}
          <HiddenPDFRender docSettings={docSettings} blocks={blocks} styleSettings={styleSettings} pdfRef={pdfRef} />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
