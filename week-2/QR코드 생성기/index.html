<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR코드 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tab-active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .qr-card {
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 20px 60px rgba(102, 126, 234, 0.15), 0 4px 12px rgba(0,0,0,0.05);
    }
    .input-focus:focus-within {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }
    .history-item {
      transition: all 0.2s ease;
    }
    .history-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: all 0.2s ease;
    }
    .btn-gradient:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .btn-gradient:active {
      transform: translateY(0);
    }
    .fade-in {
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: 2px solid #e2e8f0;
      border-radius: 8px;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

    // ========================================
    // Constants & Utilities
    // ========================================
    const TABS = [
      { id: 'url', label: 'URL', icon: '🔗' },
      { id: 'text', label: '텍스트', icon: '📝' },
      { id: 'vcard', label: '연락처', icon: '👤' },
      { id: 'wifi', label: 'Wi-Fi', icon: '📶' },
      { id: 'email', label: '이메일', icon: '✉️' },
    ];

    const ERROR_LEVELS = [
      { value: 'L', label: 'L (7%)', desc: '낮음' },
      { value: 'M', label: 'M (15%)', desc: '보통' },
      { value: 'Q', label: 'Q (25%)', desc: '높음' },
      { value: 'H', label: 'H (30%)', desc: '최고' },
    ];

    const SIZE_PRESETS = [
      { value: 150, label: '소' },
      { value: 250, label: '중' },
      { value: 400, label: '대' },
    ];

    const HISTORY_KEY = 'qr-generator-history';
    const MAX_HISTORY = 10;

    function getByteLength(str) {
      return new Blob([str]).size;
    }

    function debounce(fn, delay) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    function buildVCard({ name, phone, email, company }) {
      return [
        'BEGIN:VCARD',
        'VERSION:3.0',
        name ? `FN:${name}` : '',
        name ? `N:${name};;;` : '',
        company ? `ORG:${company}` : '',
        phone ? `TEL:${phone}` : '',
        email ? `EMAIL:${email}` : '',
        'END:VCARD',
      ].filter(Boolean).join('\n');
    }

    function buildWifi({ ssid, password, encryption }) {
      const esc = (s) => s.replace(/([\\;,":])/g, '\\$1');
      return `WIFI:T:${encryption};S:${esc(ssid)};P:${esc(password)};;`;
    }

    function buildMailto({ address, subject, body }) {
      const params = [];
      if (subject) params.push(`subject=${encodeURIComponent(subject)}`);
      if (body) params.push(`body=${encodeURIComponent(body)}`);
      return `mailto:${address}${params.length ? '?' + params.join('&') : ''}`;
    }

    // ========================================
    // Design System Components
    // ========================================
    function Button({ children, variant = 'primary', size = 'md', disabled, onClick, className = '', ...props }) {
      const base = 'inline-flex items-center justify-center font-medium rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-400 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'btn-gradient text-white',
        secondary: 'bg-white text-gray-700 border border-gray-200 hover:bg-gray-50 hover:border-gray-300',
        danger: 'bg-red-500 text-white hover:bg-red-600',
        ghost: 'text-gray-600 hover:bg-gray-100',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-5 py-2.5 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          disabled={disabled}
          onClick={onClick}
          {...props}
        >
          {children}
        </button>
      );
    }

    function Input({ label, value, onChange, placeholder, error, type = 'text', className = '', ...props }) {
      return (
        <div className={`space-y-1.5 ${className}`}>
          {label && <label className="block text-sm font-medium text-gray-700">{label}</label>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            className={`w-full px-4 py-2.5 rounded-xl border ${error ? 'border-red-400' : 'border-gray-200'} bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all`}
            {...props}
          />
          {error && <p className="text-xs text-red-500">{error}</p>}
        </div>
      );
    }

    function Textarea({ label, value, onChange, placeholder, rows = 3, className = '' }) {
      return (
        <div className={`space-y-1.5 ${className}`}>
          {label && <label className="block text-sm font-medium text-gray-700">{label}</label>}
          <textarea
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            rows={rows}
            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all resize-none"
          />
        </div>
      );
    }

    function Select({ label, value, onChange, options, className = '' }) {
      return (
        <div className={`space-y-1.5 ${className}`}>
          {label && <label className="block text-sm font-medium text-gray-700">{label}</label>}
          <select
            value={value}
            onChange={onChange}
            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-gray-800 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all"
          >
            {options.map(opt => (
              <option key={opt.value} value={opt.value}>{opt.label}</option>
            ))}
          </select>
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, className = '' }) {
      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${className}`}>
          {children}
        </span>
      );
    }

    function ColorPicker({ label, value, onChange }) {
      return (
        <div className="space-y-1.5">
          <label className="block text-sm font-medium text-gray-700">{label}</label>
          <div className="flex items-center gap-3">
            <input
              type="color"
              value={value}
              onChange={onChange}
              className="w-10 h-10 rounded-lg cursor-pointer"
            />
            <span className="text-sm text-gray-500 font-mono">{value.toUpperCase()}</span>
          </div>
        </div>
      );
    }

    function Toast({ message, visible, type = 'success' }) {
      if (!visible) return null;
      const colors = {
        success: 'bg-green-500',
        error: 'bg-red-500',
        info: 'bg-indigo-500',
      };
      return (
        <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 ${colors[type]} text-white px-6 py-3 rounded-xl shadow-lg z-50 fade-in text-sm font-medium`}>
          {message}
        </div>
      );
    }

    // ========================================
    // Tab Content Components
    // ========================================
    function UrlInput({ data, setData }) {
      return (
        <Input
          label="웹사이트 주소"
          value={data.url || ''}
          onChange={e => setData({ ...data, url: e.target.value })}
          placeholder="https://example.com"
          type="url"
        />
      );
    }

    function TextInput({ data, setData }) {
      return (
        <Textarea
          label="텍스트 내용"
          value={data.text || ''}
          onChange={e => setData({ ...data, text: e.target.value })}
          placeholder="QR코드에 담을 텍스트를 입력하세요"
          rows={4}
        />
      );
    }

    function VCardInput({ data, setData }) {
      const update = (key, val) => setData({ ...data, [key]: val });
      return (
        <div className="space-y-3">
          <Input label="이름" value={data.name || ''} onChange={e => update('name', e.target.value)} placeholder="홍길동" />
          <Input label="전화번호" value={data.phone || ''} onChange={e => update('phone', e.target.value)} placeholder="010-1234-5678" type="tel" />
          <Input label="이메일" value={data.vcEmail || ''} onChange={e => update('vcEmail', e.target.value)} placeholder="hong@example.com" type="email" />
          <Input label="회사" value={data.company || ''} onChange={e => update('company', e.target.value)} placeholder="회사명" />
        </div>
      );
    }

    function WifiInput({ data, setData }) {
      const update = (key, val) => setData({ ...data, [key]: val });
      return (
        <div className="space-y-3">
          <Input label="네트워크 이름 (SSID)" value={data.ssid || ''} onChange={e => update('ssid', e.target.value)} placeholder="MyWiFi" />
          <Input label="비밀번호" value={data.wifiPass || ''} onChange={e => update('wifiPass', e.target.value)} placeholder="비밀번호 입력" type="password" />
          <Select
            label="암호화 방식"
            value={data.encryption || 'WPA'}
            onChange={e => update('encryption', e.target.value)}
            options={[
              { value: 'WPA', label: 'WPA/WPA2' },
              { value: 'WEP', label: 'WEP' },
              { value: 'nopass', label: '없음 (개방형)' },
            ]}
          />
        </div>
      );
    }

    function EmailInput({ data, setData }) {
      const update = (key, val) => setData({ ...data, [key]: val });
      return (
        <div className="space-y-3">
          <Input label="이메일 주소" value={data.emailAddr || ''} onChange={e => update('emailAddr', e.target.value)} placeholder="recipient@example.com" type="email" />
          <Input label="제목" value={data.subject || ''} onChange={e => update('subject', e.target.value)} placeholder="이메일 제목" />
          <Textarea label="본문" value={data.body || ''} onChange={e => update('body', e.target.value)} placeholder="이메일 본문 내용" rows={3} />
        </div>
      );
    }

    // ========================================
    // QR Code Preview Component
    // ========================================
    function QRPreview({ qrContent, size, fgColor, bgColor, errorLevel, onCanvasReady }) {
      const canvasRef = useRef(null);
      const qrRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        if (!qrRef.current) {
          qrRef.current = new QRious({
            element: canvasRef.current,
          });
        }

        const qr = qrRef.current;
        qr.set({
          value: qrContent || ' ',
          size: size,
          foreground: fgColor,
          background: bgColor,
          level: errorLevel,
          padding: 16,
        });

        if (onCanvasReady) onCanvasReady(canvasRef.current);
      }, [qrContent, size, fgColor, bgColor, errorLevel]);

      return (
        <div className="flex flex-col items-center">
          <div className="qr-card p-6 sm:p-8 inline-block">
            <canvas ref={canvasRef} className="block" />
          </div>
          {qrContent && (
            <div className="mt-3 text-center">
              <Badge className="bg-indigo-50 text-indigo-600">
                {qrContent.length}자 / {getByteLength(qrContent)} bytes
              </Badge>
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // History Component
    // ========================================
    function History({ history, onSelect, onClear, onDelete }) {
      if (history.length === 0) return null;

      return (
        <Card className="p-5 sm:p-6">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-base font-semibold text-gray-800">최근 생성 기록</h3>
            <Button variant="ghost" size="sm" onClick={onClear}>
              전체 삭제
            </Button>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
            {history.map((item, idx) => (
              <div
                key={item.id}
                className="history-item bg-gray-50 rounded-xl p-3 cursor-pointer border border-gray-100 relative group"
                onClick={() => onSelect(item)}
              >
                <button
                  onClick={(e) => { e.stopPropagation(); onDelete(item.id); }}
                  className="absolute -top-2 -right-2 w-6 h-6 bg-red-400 text-white rounded-full text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-500"
                  aria-label="삭제"
                >
                  X
                </button>
                <div className="flex justify-center mb-2">
                  <img src={item.thumbnail} alt="QR" className="w-16 h-16 rounded" />
                </div>
                <div className="text-center">
                  <Badge className="bg-indigo-50 text-indigo-600 text-[10px]">
                    {TABS.find(t => t.id === item.tab)?.label || item.tab}
                  </Badge>
                  <p className="text-xs text-gray-500 mt-1 truncate" title={item.preview}>
                    {item.preview}
                  </p>
                </div>
              </div>
            ))}
          </div>
        </Card>
      );
    }

    // ========================================
    // App Component
    // ========================================
    function App() {
      const [activeTab, setActiveTab] = useState('url');
      const [data, setData] = useState({});
      const [size, setSize] = useState(250);
      const [fgColor, setFgColor] = useState('#000000');
      const [bgColor, setBgColor] = useState('#FFFFFF');
      const [errorLevel, setErrorLevel] = useState('M');
      const [history, setHistory] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        } catch { return []; }
      });
      const [toast, setToast] = useState({ visible: false, message: '', type: 'success' });
      const canvasRefCurrent = useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ visible: true, message, type });
        setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 2500);
      };

      // Build QR content based on active tab
      const qrContent = useMemo(() => {
        switch (activeTab) {
          case 'url': return data.url || '';
          case 'text': return data.text || '';
          case 'vcard':
            if (!data.name && !data.phone && !data.vcEmail) return '';
            return buildVCard({ name: data.name, phone: data.phone, email: data.vcEmail, company: data.company });
          case 'wifi':
            if (!data.ssid) return '';
            return buildWifi({ ssid: data.ssid, password: data.wifiPass || '', encryption: data.encryption || 'WPA' });
          case 'email':
            if (!data.emailAddr) return '';
            return buildMailto({ address: data.emailAddr, subject: data.subject, body: data.body });
          default: return '';
        }
      }, [activeTab, data]);

      // Debounced QR content for rendering
      const [debouncedContent, setDebouncedContent] = useState(qrContent);
      const debouncedSetContent = useCallback(
        debounce((val) => setDebouncedContent(val), 300),
        []
      );
      useEffect(() => { debouncedSetContent(qrContent); }, [qrContent]);

      // Save history to localStorage
      useEffect(() => {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      }, [history]);

      const handleCanvasReady = useCallback((canvas) => {
        canvasRefCurrent.current = canvas;
      }, []);

      const getPreviewText = () => {
        switch (activeTab) {
          case 'url': return data.url || '';
          case 'text': return data.text || '';
          case 'vcard': return data.name || '';
          case 'wifi': return data.ssid || '';
          case 'email': return data.emailAddr || '';
          default: return '';
        }
      };

      const saveToHistory = () => {
        if (!debouncedContent || !canvasRefCurrent.current) return;
        const thumbnail = canvasRefCurrent.current.toDataURL('image/png');
        const item = {
          id: Date.now(),
          tab: activeTab,
          data: { ...data },
          preview: getPreviewText().slice(0, 50),
          thumbnail,
          content: debouncedContent,
        };
        setHistory(prev => {
          const next = [item, ...prev].slice(0, MAX_HISTORY);
          return next;
        });
        showToast('기록에 저장되었습니다');
      };

      const handleHistorySelect = (item) => {
        setActiveTab(item.tab);
        setData(item.data);
      };

      const handleHistoryClear = () => {
        setHistory([]);
        showToast('기록이 모두 삭제되었습니다');
      };

      const handleHistoryDelete = (id) => {
        setHistory(prev => prev.filter(item => item.id !== id));
      };

      const downloadPNG = () => {
        if (!canvasRefCurrent.current || !debouncedContent) return;
        const link = document.createElement('a');
        link.download = `qrcode_${Date.now()}.png`;
        link.href = canvasRefCurrent.current.toDataURL('image/png');
        link.click();
        saveToHistory();
        showToast('PNG 파일이 다운로드되었습니다');
      };

      const downloadSVG = () => {
        if (!debouncedContent) return;
        // Generate SVG via a temporary hidden QRious at fixed size
        const tmpCanvas = document.createElement('canvas');
        const tmpQr = new QRious({
          element: tmpCanvas,
          value: debouncedContent,
          size: size,
          foreground: fgColor,
          background: bgColor,
          level: errorLevel,
          padding: 16,
        });
        // Convert canvas to SVG by embedding as image (simple approach)
        const dataUrl = tmpCanvas.toDataURL('image/png');
        const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <image width="${size}" height="${size}" xlink:href="${dataUrl}"/>
</svg>`;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const link = document.createElement('a');
        link.download = `qrcode_${Date.now()}.svg`;
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);
        saveToHistory();
        showToast('SVG 파일이 다운로드되었습니다');
      };

      const copyToClipboard = async () => {
        if (!canvasRefCurrent.current || !debouncedContent) return;
        try {
          const blob = await new Promise(resolve =>
            canvasRefCurrent.current.toBlob(resolve, 'image/png')
          );
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]);
          saveToHistory();
          showToast('클립보드에 복사되었습니다');
        } catch (err) {
          showToast('복사에 실패했습니다. 브라우저 설정을 확인하세요.', 'error');
        }
      };

      const handleTabChange = (tabId) => {
        setActiveTab(tabId);
        setData({});
      };

      const renderTabContent = () => {
        switch (activeTab) {
          case 'url': return <UrlInput data={data} setData={setData} />;
          case 'text': return <TextInput data={data} setData={setData} />;
          case 'vcard': return <VCardInput data={data} setData={setData} />;
          case 'wifi': return <WifiInput data={data} setData={setData} />;
          case 'email': return <EmailInput data={data} setData={setData} />;
          default: return null;
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50">
          {/* Header */}
          <header className="gradient-bg text-white py-6 sm:py-8 px-4">
            <div className="max-w-5xl mx-auto text-center">
              <h1 className="text-2xl sm:text-3xl font-bold tracking-tight">QR코드 생성기</h1>
              <p className="mt-2 text-indigo-100 text-sm sm:text-base">다양한 형식의 QR코드를 간편하게 만들어보세요</p>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 py-6 sm:py-10 space-y-6 sm:space-y-8">
            {/* Main Content Grid */}
            <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
              {/* Left: Input Area */}
              <div className="lg:col-span-3 space-y-5">
                {/* Tab Selector */}
                <Card className="p-2">
                  <div className="flex flex-wrap gap-1">
                    {TABS.map(tab => (
                      <button
                        key={tab.id}
                        onClick={() => handleTabChange(tab.id)}
                        className={`flex-1 min-w-[80px] px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 ${
                          activeTab === tab.id
                            ? 'tab-active shadow-md'
                            : 'text-gray-600 hover:bg-gray-100'
                        }`}
                      >
                        <span className="mr-1">{tab.icon}</span>
                        <span className="hidden sm:inline">{tab.label}</span>
                      </button>
                    ))}
                  </div>
                </Card>

                {/* Tab Content */}
                <Card className="p-5 sm:p-6 fade-in" key={activeTab}>
                  <h2 className="text-lg font-semibold text-gray-800 mb-4">
                    {TABS.find(t => t.id === activeTab)?.icon}{' '}
                    {TABS.find(t => t.id === activeTab)?.label} 입력
                  </h2>
                  {renderTabContent()}
                  {qrContent && (
                    <div className="mt-3 text-right">
                      <Badge className="bg-gray-100 text-gray-500">
                        {qrContent.length}자 / {getByteLength(qrContent)} bytes
                      </Badge>
                    </div>
                  )}
                </Card>

                {/* Customization Options */}
                <Card className="p-5 sm:p-6">
                  <h2 className="text-lg font-semibold text-gray-800 mb-4">설정</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    {/* Size */}
                    <div className="space-y-2">
                      <label className="block text-sm font-medium text-gray-700">
                        크기: {size}px
                      </label>
                      <div className="flex gap-2 mb-2">
                        {SIZE_PRESETS.map(p => (
                          <button
                            key={p.value}
                            onClick={() => setSize(p.value)}
                            className={`px-3 py-1 rounded-lg text-sm font-medium transition-all ${
                              size === p.value
                                ? 'bg-indigo-100 text-indigo-700 border border-indigo-200'
                                : 'bg-gray-50 text-gray-600 border border-gray-200 hover:bg-gray-100'
                            }`}
                          >
                            {p.label}
                          </button>
                        ))}
                      </div>
                      <input
                        type="range"
                        min="100"
                        max="500"
                        step="10"
                        value={size}
                        onChange={e => setSize(Number(e.target.value))}
                        className="w-full accent-indigo-500"
                      />
                    </div>

                    {/* Error Level */}
                    <Select
                      label="에러 보정 레벨"
                      value={errorLevel}
                      onChange={e => setErrorLevel(e.target.value)}
                      options={ERROR_LEVELS}
                    />

                    {/* Colors */}
                    <ColorPicker
                      label="전경색 (QR 코드)"
                      value={fgColor}
                      onChange={e => setFgColor(e.target.value)}
                    />
                    <ColorPicker
                      label="배경색"
                      value={bgColor}
                      onChange={e => setBgColor(e.target.value)}
                    />
                  </div>
                </Card>
              </div>

              {/* Right: QR Preview & Actions */}
              <div className="lg:col-span-2 space-y-5">
                <Card className="p-5 sm:p-6">
                  <h2 className="text-lg font-semibold text-gray-800 mb-4 text-center">미리보기</h2>
                  <div className="flex justify-center">
                    {debouncedContent ? (
                      <QRPreview
                        qrContent={debouncedContent}
                        size={size}
                        fgColor={fgColor}
                        bgColor={bgColor}
                        errorLevel={errorLevel}
                        onCanvasReady={handleCanvasReady}
                      />
                    ) : (
                      <div className="qr-card p-8 text-center" style={{ width: size, minHeight: size }}>
                        <div className="flex flex-col items-center justify-center h-full text-gray-400">
                          <svg className="w-16 h-16 mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5}
                              d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                          </svg>
                          <p className="text-sm">내용을 입력하면<br/>QR코드가 생성됩니다</p>
                        </div>
                      </div>
                    )}
                  </div>
                </Card>

                {/* Action Buttons */}
                <Card className="p-5 sm:p-6">
                  <h2 className="text-lg font-semibold text-gray-800 mb-4">내보내기</h2>
                  <div className="space-y-3">
                    <Button
                      variant="primary"
                      size="lg"
                      className="w-full"
                      disabled={!debouncedContent}
                      onClick={downloadPNG}
                    >
                      <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                      </svg>
                      PNG 다운로드
                    </Button>
                    <Button
                      variant="secondary"
                      size="lg"
                      className="w-full"
                      disabled={!debouncedContent}
                      onClick={downloadSVG}
                    >
                      <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                      </svg>
                      SVG 다운로드
                    </Button>
                    <Button
                      variant="secondary"
                      size="lg"
                      className="w-full"
                      disabled={!debouncedContent}
                      onClick={copyToClipboard}
                    >
                      <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                      </svg>
                      클립보드 복사
                    </Button>
                  </div>
                </Card>
              </div>
            </div>

            {/* History */}
            <History
              history={history}
              onSelect={handleHistorySelect}
              onClear={handleHistoryClear}
              onDelete={handleHistoryDelete}
            />
          </main>

          {/* Footer */}
          <footer className="text-center py-6 text-sm text-gray-400">
            QR코드 생성기 &copy; 2026
          </footer>

          {/* Toast */}
          <Toast message={toast.message} visible={toast.visible} type={toast.type} />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
