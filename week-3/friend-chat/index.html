    /* 커스텀 스크롤바 */
    .custom-scrollbar::-webkit-scrollbar {

    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 9999px;
    }

      background: rgba(0, 0, 0, 0.25);

    /* 메시지 등장 애니메이션 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .msg-enter {
      animation: fadeInUp 0.25s ease-out;
    }

    /* 타이핑 인디케이터 점 애니메이션 */
    @keyframes typingDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    .typing-dot {
      animation: typingDot 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        lg: "w-3.5 h-3.5 border-2",
      };

        "from-pink-300 to-rose-400",
        "from-amber-300 to-orange-400",
        "from-emerald-300 to-teal-400",
        "from-sky-300 to-blue-400",
        "from-violet-300 to-purple-400",
        "from-fuchsia-300 to-pink-400",
        "from-lime-300 to-green-400",
        "from-cyan-300 to-sky-400",
      ];
      const hash = name ? name.charCodeAt(0) % palette.length : 0;
      const gradient = palette[hash];

      return (
        <div className={`relative flex-shrink-0 ${className}`}>
          <div
            className={`${sizes[size]} rounded-full bg-gradient-to-br ${gradient} flex items-center justify-center shadow-sm select-none`}

              aria-label="온라인"

    // 최근 메시지를 OpenAI Chat Completions 형식(role/content)으로 변환.
    // 토큰 비용을 낮추기 위해 최근 10개만 보냄.
    function buildChatHistory(messages) {
      if (!Array.isArray(messages)) return [];
      return messages
        .slice(-10)
        .map((m) => ({
          role: m.sender === "friend" ? "assistant" : "user",
          content: m.text,
        }));
    }

    const API_BASE = "http://localhost:3001";

    async function fetchFriendReply({ friendName, history, message }) {
      const res = await fetch(`${API_BASE}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ friendName, history, message }),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      if (!data || typeof data.reply !== "string") {
        throw new Error("Invalid response from /api/chat");
      }
      return data.reply;
    }

    function getCurrentTimeLabel() {
      const d = new Date();
      const h = d.getHours();
      const m = d.getMinutes().toString().padStart(2, "0");
      const period = h < 12 ? "오전" : "오후";
      const hour12 = h % 12 === 0 ? 12 : h % 12;
      return `${period} ${hour12}:${m}`;
    }

    function getTodayDateString() {
      const d = new Date();
      const y = d.getFullYear();
      const m = (d.getMonth() + 1).toString().padStart(2, "0");
      const day = d.getDate().toString().padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatDateSeparator(dateStr) {
      // dateStr: "YYYY-MM-DD"
      const [y, m, d] = dateStr.split("-").map(Number);
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      const dateObj = new Date(y, m - 1, d);
      const today = new Date();
      const todayStr = getTodayDateString();
      if (dateStr === todayStr) return "오늘";
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);
      const yy = yesterday.getFullYear();
      const ym = (yesterday.getMonth() + 1).toString().padStart(2, "0");
      const yd = yesterday.getDate().toString().padStart(2, "0");
      if (dateStr === `${yy}-${ym}-${yd}`) return "어제";
      return `${y}년 ${m}월 ${d}일 (${days[dateObj.getDay()]})`;
    }

    function getLastMessagePreview(friend) {

      return last.text;
    }

    function getLastMessageTime(friend) {
      if (!friend.messages || friend.messages.length === 0) return "";
      return friend.messages[friend.messages.length - 1].time;

              <span className="typing-dot w-1.5 h-1.5 bg-slate-400 rounded-full inline-block"></span>
              <span className="typing-dot w-1.5 h-1.5 bg-slate-400 rounded-full inline-block"></span>
              <span className="typing-dot w-1.5 h-1.5 bg-slate-400 rounded-full inline-block"></span>
            </div>
          </div>
        </div>
      );
    }

    function MessageList({ friend, isTyping }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current) {
          containerRef.current.scrollTop = containerRef.current.scrollHeight;
        }
      }, [friend.messages, isTyping]);

      // 메시지를 날짜별로 그룹화하여 구분선 삽입
      const items = useMemo(() => {
        const result = [];
        let lastDate = null;
        let lastSender = null;
        friend.messages.forEach((msg, idx) => {
          if (msg.date !== lastDate) {
            result.push({ type: "separator", date: msg.date, key: `sep-${msg.date}-${idx}` });
            lastDate = msg.date;
            lastSender = null;
          }
          // 연속으로 같은 친구가 보낸 메시지 중 첫 번째만 아바타/이름 노출
          const showAvatar = msg.sender === "friend" && lastSender !== "friend";
          result.push({ type: "message", message: msg, showAvatar, key: `msg-${msg.id}-${idx}` });
          lastSender = msg.sender;
        });
        return result;
      }, [friend.messages]);

      return (
        <div
          ref={containerRef}
          className="flex-1 overflow-y-auto custom-scrollbar px-4 py-5 chat-bg"
        >
          {items.map((item) => {
            if (item.type === "separator") {
              return (
                <div key={item.key} className="flex justify-center my-4">
                  <span className="px-3 py-1 bg-slate-200/70 text-slate-600 text-xs rounded-full">
                    {formatDateSeparator(item.date)}
                  </span>
                </div>
              );
            }
            return (
              <MessageBubble
                key={item.key}
                message={item.message}
                friend={friend}
                showAvatar={item.showAvatar}
              />
            );
          })}
          {isTyping && <TypingIndicator friend={friend} />}
        </div>
      );
    }

    function MessageInput({ onSend, disabled }) {
      const [text, setText] = useState("");

      const handleSend = () => {
        const trimmed = text.trim();
        if (!trimmed || disabled) return;
        onSend(trimmed);
        setText("");
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };

      return (
        <div className="px-4 py-3 bg-white border-t border-slate-200">
          <div className="flex items-end gap-2">
            <IconButton ariaLabel="첨부">
              <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
              </svg>
            </IconButton>
            <div className="flex-1 bg-slate-100 rounded-3xl px-4 py-2.5 flex items-center">
              <input
                type="text"
                value={text}
                onChange={(e) => setText(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="메시지를 입력하세요..."
                className="flex-1 bg-transparent outline-none text-sm text-slate-800 placeholder-slate-400"
              />
              <button
                className="ml-2 text-slate-400 hover:text-yellow-500 transition"
                aria-label="이모지"
              >
                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </button>
            </div>
            <button
              onClick={handleSend}
              disabled={!text.trim() || disabled}
              className={`w-11 h-11 rounded-full flex items-center justify-center transition flex-shrink-0 ${
                text.trim() && !disabled
                  ? "bg-gradient-to-br from-blue-500 to-indigo-500 text-white shadow-md hover:shadow-lg hover:scale-105"
                  : "bg-slate-200 text-slate-400 cursor-not-allowed"
              }`}
              aria-label="보내기"
            >
              <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
              </svg>
            </button>
          </div>
        </div>
      );
    }

    function EmptyState() {
      return (
        <div className="flex-1 flex flex-col items-center justify-center chat-bg p-10 text-center">
          <div className="text-7xl mb-4">💭</div>
          <h2 className="text-xl font-bold text-slate-700 mb-2">대화를 시작해볼까요?</h2>
          <p className="text-slate-500 text-sm">왼쪽에서 친구를 선택하면 채팅이 시작됩니다.</p>
        </div>
      );
    }

    // ========================================
    // 📄 App (Main Page)
    // ========================================

    function App() {
      const [friends, setFriends] = useState(INITIAL_FRIENDS);
      const [selectedId, setSelectedId] = useState(INITIAL_FRIENDS[0].id);
      const [searchQuery, setSearchQuery] = useState("");
      const [typingFriendId, setTypingFriendId] = useState(null);
      const [mobileShowChat, setMobileShowChat] = useState(false);

      const selectedFriend = friends.find((f) => f.id === selectedId);

      const handleSelectFriend = (id) => {
        setSelectedId(id);
        setMobileShowChat(true);
        // 읽음 처리
        setFriends((prev) =>
          prev.map((f) => (f.id === id ? { ...f, unread: 0 } : f))
        );
      };

      const handleSendMessage = async (text) => {
        const targetId = selectedId;
        const now = getCurrentTimeLabel();
        const today = getTodayDateString();
        const newMsg = {
          id: Date.now(),
          sender: "me",
          text,
          time: now,
          date: today,
        };

        // 현재 친구의 최근 대화 기록을 먼저 스냅샷으로 떠 둔다 (API로 보낼 용도).
        const currentFriend = friends.find((f) => f.id === targetId);
        const historyForApi = buildChatHistory(
          currentFriend ? currentFriend.messages : []
        );

        // 내 메시지를 즉시 UI에 반영
        setFriends((prev) =>
          prev.map((f) =>
            f.id === targetId
              ? { ...f, messages: [...f.messages, newMsg] }
              : f
          )
        );

        // 타이핑 인디케이터를 살짝 지연 후 표시 (즉각 나오면 어색함)
        const typingTimer = setTimeout(() => {
          setTypingFriendId(targetId);
        }, 400);

        try {
          const replyText = await fetchFriendReply({
            friendName: currentFriend ? currentFriend.name : "친구",
            history: historyForApi,
            message: text,
          });

          const replyMsg = {
            id: Date.now() + 1,
            sender: "friend",
            text: replyText,
            time: getCurrentTimeLabel(),
            date: getTodayDateString(),
          };
          setFriends((prev) =>
            prev.map((f) =>
              f.id === targetId
                ? { ...f, messages: [...f.messages, replyMsg] }
                : f
            )
          );
        } catch (err) {
          console.error("[friend-chat] /api/chat 실패:", err);
          const fallbackMsg = {
            id: Date.now() + 2,
            sender: "friend",
            text: FALLBACK_REPLY,
            time: getCurrentTimeLabel(),
            date: getTodayDateString(),
          };
          setFriends((prev) =>
            prev.map((f) =>
              f.id === targetId
                ? { ...f, messages: [...f.messages, fallbackMsg] }
                : f
            )
          );
        } finally {
          clearTimeout(typingTimer);
          setTypingFriendId((curr) => (curr === targetId ? null : curr));
        }
      };

      const handleBack = () => setMobileShowChat(false);

      return (
        <div className="h-screen w-screen flex items-center justify-center p-0 md:p-4 lg:p-6">
          <div className="w-full h-full md:max-w-6xl md:h-[90vh] md:rounded-3xl overflow-hidden bg-white shadow-2xl flex">
            {/* 사이드바: 모바일에서는 채팅 열리면 숨김 */}
            <div className={`${mobileShowChat ? "hidden" : "flex"} md:flex w-full md:w-auto`}>
              <Sidebar
                friends={friends}
                selectedId={selectedId}
                onSelect={handleSelectFriend}
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
              />
            </div>

            {/* 채팅 영역 */}
            <main
              className={`${
                mobileShowChat ? "flex" : "hidden"
              } md:flex flex-1 flex-col bg-white min-w-0`}
            >
              {selectedFriend ? (
                <>
                  <ChatHeader friend={selectedFriend} onBack={handleBack} />
                  <MessageList
                    friend={selectedFriend}
                    isTyping={typingFriendId === selectedFriend.id}
                  />
                  <MessageInput
                    onSend={handleSendMessage}
                    disabled={typingFriendId === selectedFriend.id}
                  />
                </>
              ) : (
                <EmptyState />
              )}
            </main>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
