<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 도감</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.35s ease-out both; }
    .pokeball-bg {
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.35) 0%, transparent 40%),
        linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }
  </style>
</head>
<body class="pokeball-bg min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useMemo, useEffect } = React;

    // ========================================
    // Type Color Map
    // ========================================
    const TYPE_STYLES = {
      "전기": "bg-yellow-400 text-yellow-900",
      "불꽃": "bg-orange-500 text-white",
      "비행": "bg-sky-300 text-sky-900",
      "풀":   "bg-green-500 text-white",
      "독":   "bg-purple-500 text-white",
      "물":   "bg-blue-500 text-white",
      "에스퍼": "bg-pink-500 text-white",
    };

    // ========================================
    // Design System Components
    // ========================================
    function SearchInput({ value, onChange, placeholder }) {
      return (
        <div className="relative w-full max-w-xl mx-auto">
          <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input
            type="text"
            value={value}
            onChange={(e) => onChange(e.target.value)}
            placeholder={placeholder}
            className="w-full pl-12 pr-4 py-3.5 rounded-full border border-slate-200 bg-white/90 backdrop-blur shadow-sm focus:outline-none focus:ring-4 focus:ring-red-200 focus:border-red-400 transition text-slate-800 placeholder-slate-400"
            aria-label="포켓몬 검색"
          />
        </div>
      );
    }

    function TypeBadge({ type }) {
      const style = TYPE_STYLES[type] || "bg-slate-300 text-slate-800";
      return (
        <span className={`inline-block text-xs font-semibold px-3 py-1 rounded-full shadow-sm ${style}`}>
          {type}
        </span>
      );
    }

    function StatBar({ label, value, max = 150 }) {
      const pct = Math.min(100, (value / max) * 100);
      return (
        <div>
          <div className="flex justify-between text-xs text-slate-600 mb-1">
            <span className="font-medium">{label}</span>
            <span className="tabular-nums">{value}</span>
          </div>
          <div className="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
            <div
              className="h-full bg-gradient-to-r from-red-400 to-orange-400 rounded-full transition-all"
              style={{ width: `${pct}%` }}
            />
          </div>
        </div>
      );
    }

    function PokemonCard({ pokemon, index }) {
      const imgUrl = pokemon.imageUrl || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.id}.png`;
      return (
        <article
          className="group bg-white rounded-2xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 overflow-hidden border border-slate-100 fade-in-up"
          style={{ animationDelay: `${index * 60}ms` }}
        >
          <div className="relative bg-gradient-to-br from-slate-50 to-slate-100 p-5 flex items-center justify-center">
            <span className="absolute top-3 left-3 text-xs font-bold text-slate-400 tabular-nums">
              #{String(pokemon.id).padStart(3, "0")}
            </span>
            <img
              src={imgUrl}
              alt={pokemon.nameKo}
              className="w-32 h-32 object-contain drop-shadow-md group-hover:scale-110 transition-transform duration-300"
              loading="lazy"
            />
          </div>
          <div className="p-5">
            <div className="flex items-baseline justify-between mb-2">
              <h2 className="text-xl font-bold text-slate-800">{pokemon.nameKo}</h2>
              <span className="text-sm text-slate-500 font-medium">{pokemon.nameEn}</span>
            </div>
            <div className="flex flex-wrap gap-1.5 mb-3">
              {pokemon.types.map((t) => <TypeBadge key={t} type={t} />)}
            </div>
            <p className="text-sm text-slate-600 leading-relaxed mb-4 min-h-[3.5rem]">
              {pokemon.description}
            </p>
            <div className="space-y-2">
              {Object.entries(pokemon.stats).map(([k, v]) => (
                <StatBar key={k} label={k} value={v} />
              ))}
            </div>
          </div>
        </article>
      );
    }

    function EmptyState() {
      return (
        <div className="col-span-full flex flex-col items-center justify-center py-20 text-center">
          <div className="text-6xl mb-4">🔍</div>
          <h3 className="text-xl font-bold text-slate-700 mb-1">검색 결과 없음</h3>
          <p className="text-slate-500">다른 포켓몬 이름으로 검색해 보세요.</p>
        </div>
      );
    }

    function LoadingState() {
      return (
        <div className="col-span-full flex flex-col items-center justify-center py-20 text-center">
          <div className="w-12 h-12 border-4 border-red-200 border-t-red-500 rounded-full animate-spin mb-4"></div>
          <p className="text-slate-500">포켓몬을 불러오는 중...</p>
        </div>
      );
    }

    function ErrorState({ message, onRetry }) {
      return (
        <div className="col-span-full flex flex-col items-center justify-center py-20 text-center">
          <div className="text-6xl mb-4">⚠️</div>
          <h3 className="text-xl font-bold text-slate-700 mb-1">불러오기 실패</h3>
          <p className="text-slate-500 mb-4">{message}</p>
          <button
            onClick={onRetry}
            className="px-5 py-2 rounded-full bg-red-500 hover:bg-red-600 text-white font-semibold shadow-sm transition"
          >
            다시 시도
          </button>
        </div>
      );
    }

    // ========================================
    // App Component
    // ========================================
    function App() {
      const [query, setQuery] = useState("");
      const [pokemons, setPokemons] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const fetchPokemons = () => {
        setLoading(true);
        setError(null);
        fetch("/api/pokemon")
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then((data) => {
            setPokemons(data);
            setLoading(false);
          })
          .catch((err) => {
            setError(err.message || "알 수 없는 오류");
            setLoading(false);
          });
      };

      useEffect(() => {
        fetchPokemons();
      }, []);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return pokemons;
        return pokemons.filter((p) =>
          p.nameKo.toLowerCase().includes(q) ||
          p.nameEn.toLowerCase().includes(q)
        );
      }, [query, pokemons]);

      return (
        <div className="min-h-screen">
          <header className="pt-12 pb-8 px-4 text-center">
            <div className="inline-flex items-center gap-2 mb-3">
              <div className="w-8 h-8 rounded-full bg-gradient-to-b from-red-500 to-red-600 border-4 border-slate-800 shadow-md relative">
                <div className="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1 bg-slate-800"></div>
                <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-white border-2 border-slate-800"></div>
              </div>
              <h1 className="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight">
                포켓몬 도감
              </h1>
            </div>
            <p className="text-slate-500 mb-8">이름을 입력해 포켓몬을 검색하세요</p>
            <SearchInput
              value={query}
              onChange={setQuery}
              placeholder="포켓몬 이름을 입력하세요 (예: 피카츄, Pikachu)"
            />
            {!loading && !error && query && (
              <p className="text-sm text-slate-500 mt-3">
                총 <span className="font-semibold text-slate-700">{filtered.length}</span>마리 검색됨
              </p>
            )}
          </header>

          <main className="max-w-6xl mx-auto px-4 pb-16">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {loading ? (
                <LoadingState />
              ) : error ? (
                <ErrorState message={error} onRetry={fetchPokemons} />
              ) : filtered.length > 0 ? (
                filtered.map((p, i) => <PokemonCard key={p.id} pokemon={p} index={i} />)
              ) : (
                <EmptyState />
              )}
            </div>
          </main>

          <footer className="text-center text-xs text-slate-400 pb-6">
            Sprites © The Pokémon Company · Data via PokeAPI · Served from /api/pokemon
          </footer>
        </div>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
