    function formatTime(unixSeconds) {

        minute: "2-digit",

    async function fetchWeather(queryParams) {
      const url = `${BASE_URL}?${queryParams}&units=metric&lang=kr&appid=${API_KEY}`;
      console.log("[Weather API] →", url); // Network 탭에서 확인!
      const res = await fetch(url);
      if (!res.ok) {
        if (res.status === 401) throw new Error("API 키가 유효하지 않습니다. (401)");
        if (res.status === 404) throw new Error("해당 도시를 찾을 수 없습니다. (404)");
        throw new Error(`요청 실패: ${res.status}`);
      }
      const data = await res.json();
      console.log("[Weather API] ←", data);
      return data;
    }

    // Geocoding API 로 한글/다국어 도시명 → 좌표 변환 (fallback)
    async function geocodeCity(query) {
      const url = `${GEO_URL}?q=${encodeURIComponent(query)}&limit=1&appid=${API_KEY}`;
      console.log("[Geocoding API] →", url);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Geocoding 실패: ${res.status}`);
      const data = await res.json();
      console.log("[Geocoding API] ←", data);
      if (!Array.isArray(data) || data.length === 0) {
        throw new Error("해당 도시를 찾을 수 없습니다.");
      }
      return data[0]; // { name, local_names, lat, lon, country, ... }
    }

    // 입력 1개를 "도시 또는 국가"로 해석해서 영문 도시명으로 변환
    function resolveToCityName(token) {
      const t = token.trim();
      if (!t) return null;
      // 1) 국가명이면 수도로 치환
      const capital = lookupCountryCapital(t);
      if (capital) return capital;
      // 2) 한글 도시면 매핑 확인
      if (hasHangul(t) && CITY_MAP[t]) return CITY_MAP[t];
      // 3) 그대로 반환 (영문 도시명일 수 있음)
      return t;
    }

    // 한글/나라별 입력을 처리해서 날씨를 가져오는 통합 함수
    async function fetchWeatherSmart(input) {
      const q = input.trim();
      if (!q) throw new Error("도시 이름을 입력해주세요.");

      // 🟢 "도시, 국가" 형식 (예: "Paris, FR" / "서울, 대한민국" / "London, UK")
      if (q.includes(",")) {
        const [cityRaw, countryRaw] = q.split(",").map((s) => s.trim());
        if (!cityRaw) throw new Error("도시 이름을 입력해주세요.");

        const cityEn = resolveToCityName(cityRaw) || cityRaw;

        // 국가 부분 → ISO 코드
        let code = null;
        if (countryRaw) {
          if (/^[a-zA-Z]{2}$/.test(countryRaw)) {
            code = countryRaw.toUpperCase();
          } else {
            code = lookupCountryCode(countryRaw);
          }
        }

        const cityQ = code
          ? `${cityEn},${code}`
          : cityEn;
        return fetchWeather(`q=${encodeURIComponent(cityQ)}`);
      }

      // 🟢 국가명 단독 입력 → 수도 날씨
      const capital = lookupCountryCapital(q);
      if (capital) {
        console.log(`[Country→Capital] ${q} → ${capital}`);
        return fetchWeather(`q=${encodeURIComponent(capital)}`);
      }

      // 🟢 한글 도시명
      if (hasHangul(q)) {
        const mapped = CITY_MAP[q];
        if (mapped) {
          return fetchWeather(`q=${encodeURIComponent(mapped)}`);
        }
        // 매핑에 없으면 Geocoding API 로 fallback
        const geo = await geocodeCity(q);
        return fetchWeather(`lat=${geo.lat}&lon=${geo.lon}`);
      }

      // 🟢 영문/기타 언어 도시명
      return fetchWeather(`q=${encodeURIComponent(q)}`);
    }

              type="submit"
              disabled={loading}
              className="px-5 py-3 rounded-xl bg-yellow-300 text-gray-900 font-semibold hover:bg-yellow-200 active:scale-95 transition disabled:opacity-60"
            >
              검색
            </button>
            <button
              type="button"
              onClick={onGeo}
              disabled={loading}
              className="px-5 py-3 rounded-xl bg-white/20 text-white font-semibold border border-white/30 hover:bg-white/30 active:scale-95 transition disabled:opacity-60"
            >
              📍 내 위치
            </button>
          </form>

          <div className="mt-3 flex flex-wrap gap-1.5">
            <span className="text-xs text-white/70 self-center mr-1">
              빠른 선택:
            </span>
            {QUICK_COUNTRIES.map((c) => (
              <button
                key={c.key}
                type="button"
                disabled={loading}
                onClick={() => {
                  setCity(c.key);
                  onSearch(c.key);
                }}
                className="px-2.5 py-1 rounded-full bg-white/15 text-white text-xs border border-white/25 hover:bg-white/25 active:scale-95 transition disabled:opacity-60"
              >
                {c.label}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function StatusBanner({ status }) {
      if (!status) return null;
      const base = "rounded-xl p-4 mb-5 text-center text-white";
      const style =
        status.type === "error"
          ? "bg-red-500/30 border border-red-400/50"
          : "glass";
      return <div className={`${base} ${style}`}>{status.message}</div>;
    }

    function Detail({ label, value }) {
      return (
        <div className="glass rounded-xl p-3 flex flex-col gap-0.5">
          <span className="text-xs text-white/65">{label}</span>
          <span className="text-base font-semibold text-white">{value}</span>
        </div>
      );
    }

    function WeatherCard({ data }) {
      const icon = data.weather?.[0]?.icon;
      const iconUrl = icon
        ? `https://openweathermap.org/img/wn/${icon}@4x.png`
        : null;

      return (
        <div className="glass rounded-3xl p-7 shadow-2xl fade-in text-white">
          <div className="flex items-baseline gap-2 mb-1">
            <h2 className="text-3xl font-bold">{data.name || "-"}</h2>
            {data.sys?.country && (
              <span className="text-sm bg-white/20 px-2 py-0.5 rounded-md">
                {data.sys.country}
              </span>
            )}
          </div>

          <div className="flex items-center gap-2 mt-2">
            {iconUrl && (
              <img
                src={iconUrl}
                alt={data.weather?.[0]?.description || "weather"}
                className="w-28 h-28 drop-shadow-xl"
              />
            )}
            <div className="flex items-start font-bold">
              <span className="text-6xl leading-none">
                {Math.round(data.main.temp)}
              </span>
              <span className="text-2xl mt-2">°C</span>
            </div>
          </div>

          <p className="capitalize-first text-lg text-white/85 mb-5">
            {data.weather?.[0]?.description || "-"}
          </p>

          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 mb-4">
            <Detail
              label="체감온도"
              value={`${Math.round(data.main.feels_like)}°C`}
            />
            <Detail label="습도" value={`${data.main.humidity}%`} />
            <Detail label="풍속" value={`${data.wind?.speed ?? 0} m/s`} />
            <Detail label="기압" value={`${data.main.pressure} hPa`} />
            <Detail
              label="최저/최고"
              value={`${Math.round(data.main.temp_min)}° / ${Math.round(
                data.main.temp_max
              )}°`}
            />
            <Detail
              label="가시거리"
              value={
                data.visibility
                  ? `${(data.visibility / 1000).toFixed(1)} km`
                  : "-"
              }
            />
          </div>

          <p className="text-right text-xs text-white/65">
            업데이트: {formatTime(data.dt)}
          </p>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [weather, setWeather] = useState(null);
      const [status, setStatus] = useState(null);
      const [loading, setLoading] = useState(false);

      // 낮/밤에 따라 배경 변경
      useEffect(() => {
        const icon = weather?.weather?.[0]?.icon;
        if (icon && icon.endsWith("n")) {
          document.body.classList.add("night");
        } else {
          document.body.classList.remove("night");
        }
      }, [weather]);

      const loadByCity = useCallback(async (city) => {
        setLoading(true);
        setWeather(null);
        setStatus({ type: "loading", message: "🔄 날씨 정보를 불러오는 중..." });
        try {
          const data = await fetchWeatherSmart(city);
          setWeather(data);
          setStatus(null);
        } catch (err) {
          console.error(err);
          setStatus({ type: "error", message: `⚠️ ${err.message}` });
        } finally {
          setLoading(false);
        }
      }, []);

      const loadByCoords = useCallback(async (lat, lon) => {
        setLoading(true);
        setWeather(null);
        setStatus({
          type: "loading",
          message: "🔄 현재 위치의 날씨를 불러오는 중...",
        });
        try {
          const data = await fetchWeather(`lat=${lat}&lon=${lon}`);
          setWeather(data);
          setStatus(null);
        } catch (err) {
          console.error(err);
          setStatus({ type: "error", message: `⚠️ ${err.message}` });
        } finally {
          setLoading(false);
        }
      }, []);

      const handleGeolocation = useCallback(() => {
        if (!navigator.geolocation) {
          setStatus({
            type: "error",
            message: "⚠️ 이 브라우저는 위치 정보를 지원하지 않습니다.",
          });
          return;
        }
        setStatus({
          type: "loading",
          message: "📍 현재 위치를 확인하는 중...",
        });
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            console.log("[Geolocation]", latitude, longitude);
            loadByCoords(latitude, longitude);
          },
          (err) => {
            console.error(err);
            let msg = "위치 정보를 가져오지 못했습니다.";
            if (err.code === 1) msg = "위치 권한이 거부되었습니다.";
            if (err.code === 2) msg = "위치를 확인할 수 없습니다.";
            if (err.code === 3) msg = "위치 요청 시간이 초과되었습니다.";
            setStatus({ type: "error", message: `⚠️ ${msg}` });
          },
          { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
        );
      }, [loadByCoords]);

      // 첫 로드 시 자동으로 내 위치 날씨 시도
      useEffect(() => {
        handleGeolocation();
      }, [handleGeolocation]);

      return (
        <div className="min-h-screen py-10 px-4">
          <div className="max-w-xl mx-auto">
            <header className="text-center mb-7 text-white">
              <h1 className="text-3xl font-extrabold tracking-tight">
                🌤️ 오늘의 날씨
              </h1>
              <p className="mt-2 text-white/85 text-sm">
                도시 이름을 검색하거나 내 위치로 확인하세요
              </p>
            </header>

            <SearchBox
              onSearch={loadByCity}
              onGeo={handleGeolocation}
              loading={loading}
            />

            <StatusBanner status={status} />

            {weather && <WeatherCard data={weather} />}

            <footer className="mt-8 text-center text-xs text-white/65">
              <p>
                Data by{" "}
                <a
                  href="https://openweathermap.org/"
                  target="_blank"
                  rel="noreferrer"
                  className="text-yellow-300 hover:underline"
                >
                  OpenWeatherMap
                </a>
              </p>
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
