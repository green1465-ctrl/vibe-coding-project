<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>오늘의 우주</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ios-blue: #0A84FF;
      --ios-indigo: #5E5CE6;
      --ios-pink: #FF375F;
      --ios-purple: #BF5AF2;
      --ios-gray: #8E8E93;
      --label-primary: rgba(255,255,255,0.95);
      --label-secondary: rgba(235,235,245,0.6);
      --label-tertiary: rgba(235,235,245,0.3);
    }

    html, body, #root {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
      font-feature-settings: 'cv11', 'ss01', 'ss03';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #000;
      color: var(--label-primary);
      letter-spacing: -0.01em;
      overflow-x: hidden;
    }

    /* iOS wallpaper-like gradient mesh */
    .ios-wallpaper {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 15% 10%, rgba(94, 92, 230, 0.55) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(10, 132, 255, 0.35) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(191, 90, 242, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 20% 90%, rgba(255, 55, 95, 0.18) 0%, transparent 50%),
        linear-gradient(180deg, #0b0620 0%, #050410 45%, #000000 100%);
    }

    .ios-wallpaper::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 3px 3px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* Frosted glass base */
    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .glass-dark {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Hide scrollbar aesthetic */
    ::-webkit-scrollbar { width: 0; background: transparent; }

    /* iOS bounce-in */
    @keyframes ios-pop {
      0% { transform: scale(0.96); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .ios-pop { animation: ios-pop 0.5s cubic-bezier(0.22, 1, 0.36, 1); }

    @keyframes ios-slide-up {
      0% { transform: translateY(24px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .ios-slide-up { animation: ios-slide-up 0.6s cubic-bezier(0.22, 1, 0.36, 1); }

    /* Shimmer skeleton */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.10) 200px, rgba(255,255,255,0.04) 400px);
      background-size: 800px 100%;
      animation: shimmer 1.6s linear infinite;
    }

    /* Dynamic Island entry pulse */
    @keyframes island-breath {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.02); }
    }
    .island-breath { animation: island-breath 4s ease-in-out infinite; }

    /* Image glow */
    .hero-glow {
      box-shadow:
        0 0 80px rgba(94, 92, 230, 0.25),
        0 30px 60px -20px rgba(0,0,0,0.8),
        0 0 0 1px rgba(255,255,255,0.08) inset;
    }

    /* Text selection */
    ::selection { background: rgba(10,132,255,0.4); color: #fff; }

    /* Smooth tap */
    button, a { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div class="ios-wallpaper"></div>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ========================================
    // Constants & Helpers
    // ========================================
    const NASA_KEY = 'M0UfUhBQT2OPXJfBE0hT17PnFQhlDoTLFND8IO3I';
    const APOD_ENDPOINT = 'https://api.nasa.gov/planetary/apod';
    const MIN_DATE = '1995-06-16';

    const todayISO = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    const formatKoreanDate = (iso) => {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${y}년 ${parseInt(m, 10)}월 ${parseInt(d, 10)}일`;
    };

    const shiftDate = (iso, days) => {
      const d = new Date(iso + 'T00:00:00');
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    const clampDate = (iso) => {
      if (!iso) return todayISO();
      if (iso < MIN_DATE) return MIN_DATE;
      const t = todayISO();
      if (iso > t) return t;
      return iso;
    };

    const randomDate = () => {
      const start = new Date(MIN_DATE).getTime();
      const end = new Date(todayISO()).getTime();
      const t = start + Math.random() * (end - start);
      const d = new Date(t);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    // ========================================
    // 🎨 SF Symbols-style Icons (inline SVG)
    // ========================================
    const Icon = ({ name, className = 'w-5 h-5' }) => {
      const common = {
        fill: 'none',
        stroke: 'currentColor',
        strokeWidth: 2,
        strokeLinecap: 'round',
        strokeLinejoin: 'round',
        viewBox: '0 0 24 24',
        className
      };
      switch (name) {
        case 'chevron.left':
          return <svg {...common}><path d="M15 18l-6-6 6-6" /></svg>;
        case 'chevron.right':
          return <svg {...common}><path d="M9 6l6 6-6 6" /></svg>;
        case 'chevron.down':
          return <svg {...common}><path d="M6 9l6 6 6-6" /></svg>;
        case 'shuffle':
          return <svg {...common}><path d="M16 3h5v5" /><path d="M4 20L21 3" /><path d="M21 16v5h-5" /><path d="M15 15l6 6" /><path d="M4 4l5 5" /></svg>;
        case 'calendar':
          return <svg {...common}><rect x="3" y="4" width="18" height="18" rx="3" /><path d="M16 2v4M8 2v4M3 10h18" /></svg>;
        case 'sparkles':
          return <svg {...common}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8" /></svg>;
        case 'photo':
          return <svg {...common}><rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="9" cy="9" r="2" /><path d="M21 15l-5-5L5 21" /></svg>;
        case 'play.circle':
          return <svg {...common}><circle cx="12" cy="12" r="10" /><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none" /></svg>;
        case 'arrow.down.circle':
          return <svg {...common}><circle cx="12" cy="12" r="10" /><path d="M12 8v8M8 12l4 4 4-4" /></svg>;
        case 'arrow.up.right':
          return <svg {...common}><path d="M7 17L17 7M8 7h9v9" /></svg>;
        case 'arrow.clockwise':
          return <svg {...common}><path d="M21 12a9 9 0 11-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg>;
        case 'exclamation':
          return <svg {...common}><circle cx="12" cy="12" r="10" /><path d="M12 8v5M12 16.5v.01" /></svg>;
        case 'info':
          return <svg {...common}><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8v.01" /></svg>;
        case 'person':
          return <svg {...common}><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-7 8-7s8 3 8 7" /></svg>;
        default:
          return null;
      }
    };

    // ========================================
    // 🎨 Design System
    // ========================================
    const PillButton = ({ children, onClick, variant = 'tinted', size = 'md', disabled, className = '', ariaLabel }) => {
      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-5 py-3 text-sm',
        lg: 'px-6 py-3.5 text-base',
        icon: 'p-3'
      };
      const variants = {
        filled: 'bg-[#0A84FF] text-white hover:bg-[#0A84FF]/90',
        tinted: 'bg-[#0A84FF]/15 text-[#64B5FF] hover:bg-[#0A84FF]/25',
        glass: 'glass text-white hover:bg-white/10',
        ghost: 'text-white/80 hover:bg-white/5'
      };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          aria-label={ariaLabel}
          className={`rounded-full font-semibold tracking-tight transition-all active:scale-95 disabled:opacity-40 disabled:active:scale-100 disabled:cursor-not-allowed ${sizes[size]} ${variants[variant]} ${className}`}
        >
          {children}
        </button>
      );
    };

    const SegmentedControl = ({ options, value, onChange }) => {
      return (
        <div className="relative flex p-1 rounded-full bg-white/8 border border-white/10 backdrop-blur-xl">
          {options.map((opt) => {
            const active = value === opt.value;
            return (
              <button
                key={opt.value}
                type="button"
                onClick={() => onChange(opt.value)}
                className={`relative flex-1 px-3 py-2 text-xs sm:text-sm font-semibold rounded-full transition-all active:scale-95 flex items-center justify-center gap-1.5 ${active ? 'bg-white text-black shadow-lg' : 'text-white/70 hover:text-white'}`}
              >
                {opt.icon && <Icon name={opt.icon} className="w-4 h-4" />}
                <span>{opt.label}</span>
              </button>
            );
          })}
        </div>
      );
    };

    const ListRow = ({ icon, label, value, accent }) => (
      <div className="flex items-center gap-3 px-4 py-3.5">
        <div className={`w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ${accent || 'bg-white/10'}`}>
          <Icon name={icon} className="w-4 h-4 text-white" />
        </div>
        <div className="flex-1 min-w-0">
          <div className="text-[11px] uppercase tracking-wider text-white/50 font-medium">{label}</div>
          <div className="text-sm text-white font-medium truncate">{value || '—'}</div>
        </div>
      </div>
    );

    const DynamicIsland = ({ text, pulsing }) => (
      <div className={`fixed top-3 left-1/2 -translate-x-1/2 z-50 ${pulsing ? 'island-breath' : ''}`}>
        <div className="flex items-center gap-2 px-4 py-2 rounded-full bg-black/85 backdrop-blur-2xl border border-white/10 shadow-2xl">
          <div className="w-2 h-2 rounded-full bg-[#30D158] shadow-[0_0_8px_#30D158]" />
          <span className="text-[11px] font-semibold text-white tracking-tight whitespace-nowrap">{text}</span>
        </div>
      </div>
    );

    // ========================================
    // 🧩 Skeleton
    // ========================================
    const HeroSkeleton = () => (
      <div className="w-full aspect-square rounded-[2.5rem] overflow-hidden shimmer" />
    );

    const BottomSheetSkeleton = () => (
      <div className="space-y-4">
        <div className="h-7 rounded-full shimmer w-3/4" />
        <div className="space-y-2">
          <div className="h-3 rounded-full shimmer w-full" />
          <div className="h-3 rounded-full shimmer w-full" />
          <div className="h-3 rounded-full shimmer w-5/6" />
          <div className="h-3 rounded-full shimmer w-4/6" />
        </div>
      </div>
    );

    // ========================================
    // 🧩 Error Panel
    // ========================================
    const ErrorPanel = ({ message, onRetry }) => (
      <div className="ios-pop glass-dark rounded-3xl p-6 text-center">
        <div className="w-14 h-14 mx-auto rounded-full bg-[#FF375F]/15 flex items-center justify-center mb-3">
          <Icon name="exclamation" className="w-7 h-7 text-[#FF375F]" />
        </div>
        <h3 className="text-lg font-bold tracking-tight mb-1">불러오지 못했어요</h3>
        <p className="text-sm text-white/60 mb-5">{message}</p>
        <PillButton variant="filled" onClick={onRetry}>
          <span className="flex items-center gap-2">
            <Icon name="arrow.clockwise" className="w-4 h-4" />
            다시 시도
          </span>
        </PillButton>
      </div>
    );

    // ========================================
    // 📄 Hero Media
    // ========================================
    const HeroMedia = ({ data, onOpenHD }) => {
      if (data.media_type === 'video') {
        return (
          <div className="relative w-full aspect-video rounded-[2.5rem] overflow-hidden hero-glow ios-pop">
            <iframe
              src={data.url}
              title={data.title}
              className="absolute inset-0 w-full h-full"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowFullScreen
            />
            <div className="absolute top-3 left-3 flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-black/60 backdrop-blur-xl border border-white/10">
              <Icon name="play.circle" className="w-3.5 h-3.5 text-white" />
              <span className="text-[10px] font-semibold text-white uppercase tracking-wider">비디오</span>
            </div>
          </div>
        );
      }
      return (
        <button
          type="button"
          onClick={onOpenHD}
          className="group relative block w-full rounded-[2.5rem] overflow-hidden hero-glow ios-pop active:scale-[0.98] transition-transform"
        >
          <img
            src={data.url}
            alt={data.title}
            className="w-full h-auto max-h-[75vh] object-cover block"
            loading="eager"
          />
          <div className="absolute top-3 left-3 flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-black/60 backdrop-blur-xl border border-white/10">
            <Icon name="photo" className="w-3.5 h-3.5 text-white" />
            <span className="text-[10px] font-semibold text-white uppercase tracking-wider">사진</span>
          </div>
          {data.hdurl && (
            <div className="absolute bottom-3 right-3 flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-black/60 backdrop-blur-xl border border-white/10">
              <Icon name="arrow.up.right" className="w-3.5 h-3.5 text-white" />
              <span className="text-[10px] font-semibold text-white uppercase tracking-wider">HD</span>
            </div>
          )}
        </button>
      );
    };

    // ========================================
    // 📄 Bottom Sheet
    // ========================================
    const BottomSheet = ({ data, loading, error, onRetry }) => {
      return (
        <section className="relative mt-6 rounded-t-[2rem] glass-dark p-5 sm:p-7 pb-8 ios-slide-up">
          {/* drag handle */}
          <div className="flex justify-center mb-4">
            <div className="w-10 h-1 rounded-full bg-white/25" />
          </div>

          {loading && <BottomSheetSkeleton />}

          {error && !loading && (
            <ErrorPanel message={error} onRetry={onRetry} />
          )}

          {data && !loading && !error && (
            <div className="space-y-5">
              {/* Title + date */}
              <div>
                <div className="text-[11px] uppercase tracking-[0.15em] text-[#64B5FF] font-bold mb-1.5">
                  NASA · APOD
                </div>
                <h2 className="text-2xl sm:text-[28px] font-bold tracking-tight leading-tight text-white">
                  {data.title}
                </h2>
              </div>

              {/* Explanation */}
              <p className="text-[15px] leading-relaxed text-white/75 whitespace-pre-line">
                {data.explanation}
              </p>

              {/* Info list */}
              <div className="rounded-2xl bg-white/5 border border-white/10 divide-y divide-white/10 overflow-hidden">
                <ListRow
                  icon="calendar"
                  label="날짜"
                  value={formatKoreanDate(data.date)}
                  accent="bg-[#0A84FF]/25"
                />
                <ListRow
                  icon={data.media_type === 'video' ? 'play.circle' : 'photo'}
                  label="미디어 유형"
                  value={data.media_type === 'video' ? '비디오' : '이미지'}
                  accent="bg-[#5E5CE6]/25"
                />
                <ListRow
                  icon="person"
                  label="저작권"
                  value={data.copyright ? data.copyright.replace(/\n/g, ' ') : '퍼블릭 도메인'}
                  accent="bg-[#BF5AF2]/25"
                />
              </div>

              {/* Action buttons */}
              <div className="flex flex-wrap gap-2">
                {data.media_type === 'image' && data.hdurl && (
                  <a
                    href={data.hdurl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex-1 min-w-[140px] flex items-center justify-center gap-2 bg-[#0A84FF] text-white rounded-full px-5 py-3.5 text-sm font-semibold tracking-tight transition-all active:scale-95 hover:bg-[#0A84FF]/90"
                  >
                    <Icon name="arrow.down.circle" className="w-4 h-4" />
                    HD 보기
                  </a>
                )}
                <a
                  href={`https://apod.nasa.gov/apod/ap${data.date.slice(2).replace(/-/g, '')}.html`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="flex-1 min-w-[140px] flex items-center justify-center gap-2 bg-[#0A84FF]/15 text-[#64B5FF] rounded-full px-5 py-3.5 text-sm font-semibold tracking-tight transition-all active:scale-95 hover:bg-[#0A84FF]/25"
                >
                  <Icon name="arrow.up.right" className="w-4 h-4" />
                  NASA 원본
                </a>
              </div>
            </div>
          )}
        </section>
      );
    };

    // ========================================
    // 🚀 App
    // ========================================
    const App = () => {
      const [date, setDate] = useState(todayISO());
      const [mode, setMode] = useState('today'); // today | pick | random
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const requestIdRef = useRef(0);

      const fetchAPOD = useCallback(async (targetDate) => {
        const myId = ++requestIdRef.current;
        setLoading(true);
        setError(null);
        try {
          const url = `${APOD_ENDPOINT}?api_key=${NASA_KEY}&date=${targetDate}&thumbs=true`;
          const res = await fetch(url);
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.msg || `요청 실패 (${res.status})`);
          }
          const json = await res.json();
          if (myId !== requestIdRef.current) return; // stale
          setData(json);
        } catch (err) {
          if (myId !== requestIdRef.current) return;
          setError(err.message || '알 수 없는 오류가 발생했어요.');
          setData(null);
        } finally {
          if (myId === requestIdRef.current) setLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchAPOD(date);
      }, [date, fetchAPOD]);

      const handleDateChange = (newDate) => {
        const clamped = clampDate(newDate);
        setDate(clamped);
      };

      const handlePrev = () => {
        if (date <= MIN_DATE) return;
        setMode('pick');
        handleDateChange(shiftDate(date, -1));
      };

      const handleNext = () => {
        if (date >= todayISO()) return;
        setMode('pick');
        handleDateChange(shiftDate(date, 1));
      };

      const handleToday = () => {
        setMode('today');
        handleDateChange(todayISO());
      };

      const handleRandom = () => {
        setMode('random');
        handleDateChange(randomDate());
      };

      const handleOpenHD = () => {
        if (data && data.hdurl) {
          window.open(data.hdurl, '_blank', 'noopener,noreferrer');
        }
      };

      const islandText = useMemo(() => {
        if (loading) return '불러오는 중';
        if (error) return '오류 발생';
        if (date === todayISO()) return '오늘의 우주';
        return formatKoreanDate(date);
      }, [loading, error, date]);

      const isToday = date === todayISO();
      const isMin = date <= MIN_DATE;

      return (
        <>
          <DynamicIsland text={islandText} pulsing={loading} />

          <main className="min-h-screen px-4 sm:px-6 pt-20 pb-16">
            <div className="max-w-xl mx-auto">
              {/* Large iOS nav title */}
              <header className="mb-5 ios-slide-up">
                <div className="text-[13px] font-semibold text-[#64B5FF] tracking-tight mb-1">
                  NASA · Astronomy Picture of the Day
                </div>
                <h1 className="text-[34px] sm:text-[40px] font-black tracking-tight leading-[1.05] text-white">
                  오늘의 우주
                </h1>
                <p className="mt-1.5 text-[15px] text-white/55 tracking-tight">
                  매일 새로운 우주의 사진과 이야기
                </p>
              </header>

              {/* Segmented control */}
              <div className="mb-5">
                <SegmentedControl
                  value={mode}
                  onChange={(v) => {
                    setMode(v);
                    if (v === 'today') handleDateChange(todayISO());
                    if (v === 'random') handleDateChange(randomDate());
                  }}
                  options={[
                    { value: 'today', label: '오늘', icon: 'sparkles' },
                    { value: 'pick', label: '날짜 선택', icon: 'calendar' },
                    { value: 'random', label: '무작위', icon: 'shuffle' }
                  ]}
                />
              </div>

              {/* Date picker panel (only when pick mode) */}
              {mode === 'pick' && (
                <div className="mb-5 glass rounded-2xl p-4 ios-pop">
                  <label className="block text-[11px] uppercase tracking-wider text-white/55 font-semibold mb-2">
                    날짜 선택
                  </label>
                  <input
                    type="date"
                    value={date}
                    min={MIN_DATE}
                    max={todayISO()}
                    onChange={(e) => handleDateChange(e.target.value)}
                    className="w-full bg-white/10 border border-white/15 rounded-xl px-4 py-3 text-white text-base font-medium tracking-tight focus:outline-none focus:border-[#0A84FF] [color-scheme:dark]"
                  />
                </div>
              )}

              {/* Navigation controls */}
              <div className="flex items-center justify-between gap-2 mb-5">
                <PillButton
                  variant="glass"
                  size="icon"
                  onClick={handlePrev}
                  disabled={isMin || loading}
                  ariaLabel="이전 날짜"
                >
                  <Icon name="chevron.left" className="w-5 h-5" />
                </PillButton>

                <PillButton
                  variant={isToday ? 'tinted' : 'filled'}
                  onClick={handleToday}
                  disabled={loading}
                  className="flex-1 max-w-[200px]"
                >
                  <span className="flex items-center justify-center gap-1.5">
                    <Icon name="sparkles" className="w-4 h-4" />
                    오늘로 이동
                  </span>
                </PillButton>

                <PillButton
                  variant="glass"
                  size="icon"
                  onClick={handleRandom}
                  disabled={loading}
                  ariaLabel="무작위 날짜"
                >
                  <Icon name="shuffle" className="w-5 h-5" />
                </PillButton>

                <PillButton
                  variant="glass"
                  size="icon"
                  onClick={handleNext}
                  disabled={isToday || loading}
                  ariaLabel="다음 날짜"
                >
                  <Icon name="chevron.right" className="w-5 h-5" />
                </PillButton>
              </div>

              {/* Hero */}
              <div className="mb-2">
                {loading && <HeroSkeleton />}
                {error && !loading && (
                  <div className="aspect-square rounded-[2.5rem] glass-dark flex items-center justify-center">
                    <div className="text-center px-6">
                      <Icon name="exclamation" className="w-10 h-10 mx-auto text-[#FF375F] mb-2" />
                      <p className="text-sm text-white/60">이미지를 불러올 수 없어요</p>
                    </div>
                  </div>
                )}
                {data && !loading && !error && (
                  <HeroMedia data={data} onOpenHD={handleOpenHD} />
                )}
              </div>

              {/* Bottom sheet */}
              <BottomSheet
                data={data}
                loading={loading}
                error={error}
                onRetry={() => fetchAPOD(date)}
              />

              {/* Footer */}
              <div className="text-center mt-8 text-[11px] text-white/30 tracking-tight">
                Data courtesy of NASA APOD API
              </div>
            </div>
          </main>
        </>
      );
    };

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
