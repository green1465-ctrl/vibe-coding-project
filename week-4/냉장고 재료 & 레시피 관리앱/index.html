<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Fridge - 냉장고 재료 & 레시피 관리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            samsung: {
              blue: '#1428A0',
              blueLight: '#0F4FBA',
              blueHover: '#0a3a8c',
              gray: '#F5F7FA',
              dark: '#1a1a1a',
              text: '#2c2c2c',
              muted: '#6b7280'
            }
          },
          fontFamily: {
            sans: ['Pretendard Variable', 'Pretendard', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            'soft': '0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04)',
            'card': '0 2px 8px rgba(0,0,0,0.06)',
            'cardHover': '0 8px 24px rgba(20, 40, 160, 0.10)'
          }
        }
      }
    }
  </script>
  <style>
    html, body { font-family: 'Pretendard Variable', Pretendard, Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: #ffffff; color: #2c2c2c; }
    .hero-gradient {
      background: linear-gradient(135deg, #f8faff 0%, #eef3ff 50%, #ffffff 100%);
    }
    .tag-anim {
      animation: tagIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes tagIn {
      from { opacity: 0; transform: scale(0.85) translateY(4px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .card-lift { transition: transform .25s ease, box-shadow .25s ease; }
    .card-lift:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(20, 40, 160, 0.12); }
    /* Subtle scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d8dfeb; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #b8c2d4; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useMemo, useRef, forwardRef } = React;

    // ========================================
    // Constants & API Client (Supabase-backed)
    // ========================================
    const API_BASE = '/api';

    const CATEGORIES = [
      { id: 'vegetable', label: '채소',   tagBg: 'bg-green-100',  tagText: 'text-green-800',  tagBorder: 'border-green-200',  dot: 'bg-green-500'  },
      { id: 'meat',      label: '축산물', tagBg: 'bg-yellow-100', tagText: 'text-yellow-800', tagBorder: 'border-yellow-200', dot: 'bg-yellow-500' },
      { id: 'dairy',     label: '유제품', tagBg: 'bg-blue-100',   tagText: 'text-blue-800',   tagBorder: 'border-blue-200',   dot: 'bg-blue-500'   },
      { id: 'etc',       label: '기타',   tagBg: 'bg-gray-100',   tagText: 'text-gray-700',   tagBorder: 'border-gray-200',   dot: 'bg-gray-400'   }
    ];

    const getCategoryMeta = (id) => CATEGORIES.find(c => c.id === id) || CATEGORIES[3];

    async function apiRequest(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = data && data.error ? data.error : `요청 실패 (${res.status})`;
        throw new Error(msg);
      }
      return data;
    }

    const api = {
      listIngredients:   ()              => apiRequest('/ingredients'),
      addIngredient:     (body)          => apiRequest('/ingredients',          { method: 'POST',   body: JSON.stringify(body) }),
      removeIngredient:  (id)            => apiRequest(`/ingredients/${id}`,    { method: 'DELETE' }),
      listRecipes:       ()              => apiRequest('/recipes'),
      recommendedRecipes:()              => apiRequest('/recipes/recommended'),
      previewRecipe:     (opts)          => apiRequest('/recipes/preview',      { method: 'POST',   body: JSON.stringify(opts || {}) }),
      saveRecipe:        (payload)       => apiRequest('/recipes/save',         { method: 'POST',   body: JSON.stringify(payload || {}) }),
      removeRecipe:      (id)            => apiRequest(`/recipes/${id}`,        { method: 'DELETE' }),
    };

    // ========================================
    // Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', className = '', children, ...rest }) {
      const variants = {
        primary:   'bg-samsung-blue text-white hover:bg-samsung-blueHover shadow-sm',
        secondary: 'bg-white text-samsung-blue border border-samsung-blue/20 hover:border-samsung-blue hover:bg-samsung-blue/5',
        ghost:     'bg-transparent text-samsung-text hover:bg-gray-100',
        danger:    'bg-red-500 text-white hover:bg-red-600'
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm rounded-lg',
        md: 'px-4 py-2.5 text-sm rounded-xl',
        lg: 'px-6 py-3.5 text-base rounded-xl'
      };
      return (
        <button
          {...rest}
          className={`inline-flex items-center justify-center gap-2 font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    const Input = forwardRef(function Input({ label, error, className = '', ...rest }, ref) {
      return (
        <div className="w-full">
          {label && <label className="block text-xs font-medium text-samsung-muted mb-1.5">{label}</label>}
          <input
            ref={ref}
            {...rest}
            className={`w-full px-4 py-3 text-sm bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-samsung-blue/30 focus:border-samsung-blue transition-all placeholder:text-gray-400 ${error ? 'border-red-400' : ''} ${className}`}
          />
          {error && <p className="mt-1 text-xs text-red-500">{error}</p>}
        </div>
      );
    });

    function Select({ label, options = [], className = '', ...rest }) {
      return (
        <div className="w-full">
          {label && <label className="block text-xs font-medium text-samsung-muted mb-1.5">{label}</label>}
          <select
            {...rest}
            className={`w-full px-4 py-3 text-sm bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-samsung-blue/30 focus:border-samsung-blue transition-all ${className}`}
          >
            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white rounded-2xl shadow-card ${className}`}>{children}</div>
      );
    }

    function Badge({ tone = 'gray', className = '', children }) {
      const tones = {
        gray:   'bg-gray-100 text-gray-700',
        red:    'bg-red-100 text-red-700',
        blue:   'bg-blue-100 text-blue-700',
        green:  'bg-green-100 text-green-700',
        yellow: 'bg-yellow-100 text-yellow-800'
      };
      return (
        <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold ${tones[tone]} ${className}`}>{children}</span>
      );
    }

    // ========================================
    // Layout: Header
    // ========================================
    function Header() {
      return (
        <header className="sticky top-0 z-30 bg-white/85 backdrop-blur border-b border-gray-100">
          <div className="max-w-7xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-2xl">🧊</span>
              <span className="text-lg font-bold text-samsung-dark tracking-tight">Smart Fridge</span>
            </div>
            <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-samsung-text">
              <a href="#fridge"         className="hover:text-samsung-blue transition-colors">내 냉장고</a>
              <a href="#ai-recipes"     className="hover:text-samsung-blue transition-colors">✨ AI 레시피</a>
              <a href="#recipes"        className="hover:text-samsung-blue transition-colors">추천 레시피</a>
              <a href="#saved-recipes"  className="hover:text-samsung-blue transition-colors">저장된 레시피</a>
            </nav>
            <div className="flex items-center gap-2">
              <Button variant="secondary" size="sm" className="hidden sm:inline-flex">로그인</Button>
              <Button variant="primary"   size="sm">시작하기</Button>
            </div>
          </div>
        </header>
      );
    }

    // ========================================
    // Hero
    // ========================================
    function Hero({ stats }) {
      return (
        <section className="hero-gradient">
          <div className="max-w-7xl mx-auto px-5 sm:px-8 pt-16 pb-20 sm:pt-24 sm:pb-28">
            <div className="max-w-3xl">
              <Badge tone="blue" className="mb-5 px-3 py-1 text-xs">SMART FRIDGE · BESPOKE AI</Badge>
              <h1 className="text-4xl sm:text-6xl font-extrabold text-samsung-dark tracking-tight leading-[1.05]">
                나만의 스마트 냉장고,<br />
                <span className="text-samsung-blue">재료부터 레시피까지.</span>
              </h1>
              <p className="mt-6 text-base sm:text-lg text-samsung-muted leading-relaxed max-w-2xl">
                오늘 가지고 있는 재료를 등록하면, 유통기한을 한눈에 관리하고
                지금 바로 만들 수 있는 요리를 추천해 드립니다.
              </p>
              <div className="mt-8 flex flex-wrap gap-3">
                <a href="#fridge"><Button variant="primary"   size="lg">재료 등록하기 →</Button></a>
                <a href="#recipes"><Button variant="secondary" size="lg">레시피 보기</Button></a>
              </div>
            </div>

            {/* Stats grid */}
            <div id="stats" className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-5 mt-14">
              <StatCard label="총 재료"     value={stats.total}     suffix="개"    accent="text-samsung-blue" />
              <StatCard label="채소"        value={stats.vegetable} suffix="개"    accent="text-green-600"   />
              <StatCard label="유제품·축산" value={stats.dairyMeat} suffix="개"    accent="text-blue-600"    />
              <StatCard label="기타"        value={stats.etc}       suffix="개"    accent="text-gray-600"    />
            </div>
          </div>
        </section>
      );
    }

    function StatCard({ label, value, suffix, accent }) {
      return (
        <div className="bg-white rounded-2xl p-5 sm:p-6 shadow-soft border border-gray-100 card-lift">
          <div className="text-xs sm:text-sm text-samsung-muted font-medium">{label}</div>
          <div className={`mt-2 text-3xl sm:text-4xl font-extrabold ${accent}`}>
            {value}<span className="text-lg sm:text-xl text-samsung-muted font-semibold ml-1">{suffix}</span>
          </div>
        </div>
      );
    }

    // ========================================
    // Ingredient Form
    // ========================================
    function IngredientForm({ onAdd }) {
      const [name, setName]         = useState('');
      const [category, setCategory] = useState('vegetable');
      const [submitting, setSubmitting] = useState(false);
      const [error, setError]       = useState('');
      const inputRef = useRef(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        if (!trimmed || submitting) return;
        setSubmitting(true);
        setError('');
        try {
          await onAdd({ name: trimmed, category });
          setName('');
          inputRef.current?.focus();
        } catch (err) {
          setError(err.message || '추가에 실패했어요.');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <form onSubmit={handleSubmit} className="bg-white rounded-2xl p-5 sm:p-6 shadow-card border border-gray-100">
          <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
            <div className="md:col-span-7">
              <Input
                ref={inputRef}
                label="재료 이름"
                placeholder="예) 두부, 닭가슴살, 우유..."
                value={name}
                onChange={(e) => setName(e.target.value)}
              />
            </div>
            <div className="md:col-span-3">
              <Select
                label="카테고리"
                value={category}
                onChange={(e) => setCategory(e.target.value)}
                options={CATEGORIES.map(c => ({ value: c.id, label: c.label }))}
              />
            </div>
            <div className="md:col-span-2 flex items-end">
              <Button type="submit" variant="primary" size="lg" className="w-full" disabled={submitting}>
                {submitting ? '저장 중...' : '+ 추가'}
              </Button>
            </div>
          </div>
          {error && <p className="mt-3 text-xs text-red-500 font-medium">⚠ {error}</p>}
          <p className="mt-3 text-xs text-samsung-muted">
            Enter 키로 빠르게 추가할 수 있어요. 추가된 재료는 <span className="text-samsung-blue font-semibold">Supabase DB</span>에 저장됩니다.
          </p>
        </form>
      );
    }

    // ========================================
    // Ingredient Tag
    // ========================================
    function IngredientTag({ item, onRemove }) {
      const meta = getCategoryMeta(item.category);

      return (
        <span className={`tag-anim group inline-flex items-center gap-2 pl-3 pr-1.5 py-2 rounded-full border text-sm font-medium ${meta.tagBg} ${meta.tagText} ${meta.tagBorder} hover:shadow-sm transition-shadow`}>
          <span className={`w-1.5 h-1.5 rounded-full ${meta.dot}`}></span>
          <span className="font-semibold">{item.name}</span>
          <span className="text-[10px] opacity-60">· {meta.label}</span>
          <button
            type="button"
            onClick={() => onRemove(item.id)}
            aria-label={`${item.name} 삭제`}
            className="ml-0.5 w-6 h-6 inline-flex items-center justify-center rounded-full bg-white/60 hover:bg-white text-gray-500 hover:text-red-500 transition-colors"
          >
            ×
          </button>
        </span>
      );
    }

    // ========================================
    // Ingredient List (with search & filter)
    // ========================================
    function IngredientList({ items, onRemove }) {
      const [query, setQuery]       = useState('');
      const [filter, setFilter]     = useState('all');

      const filtered = useMemo(() => {
        return items.filter(it => {
          const matchQuery    = it.name.toLowerCase().includes(query.trim().toLowerCase());
          const matchCategory = filter === 'all' || it.category === filter;
          return matchQuery && matchCategory;
        });
      }, [items, query, filter]);

      const filterButtons = [
        { id: 'all', label: '전체' },
        ...CATEGORIES.map(c => ({ id: c.id, label: c.label }))
      ];

      return (
        <div className="bg-white rounded-2xl p-5 sm:p-6 shadow-card border border-gray-100">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
            <div>
              <h3 className="text-xl font-bold text-samsung-dark">보관 중인 재료</h3>
              <p className="text-xs text-samsung-muted mt-0.5">총 {items.length}개 · 검색 결과 {filtered.length}개</p>
            </div>
            <div className="w-full sm:w-72">
              <Input
                placeholder="🔍 재료 이름으로 검색"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
              />
            </div>
          </div>

          <div className="flex flex-wrap gap-2 mb-5">
            {filterButtons.map(b => {
              const active = filter === b.id;
              return (
                <button
                  key={b.id}
                  onClick={() => setFilter(b.id)}
                  className={`px-3.5 py-1.5 text-xs font-semibold rounded-full border transition-all ${
                    active
                      ? 'bg-samsung-blue text-white border-samsung-blue shadow-sm'
                      : 'bg-white text-samsung-text border-gray-200 hover:border-samsung-blue/40 hover:bg-samsung-blue/5'
                  }`}
                >
                  {b.label}
                </button>
              );
            })}
          </div>

          {filtered.length === 0 ? (
            <EmptyState query={query} hasItems={items.length > 0} />
          ) : (
            <div className="flex flex-wrap gap-2.5">
              {filtered.map(item => (
                <IngredientTag key={item.id} item={item} onRemove={onRemove} />
              ))}
            </div>
          )}
        </div>
      );
    }

    function EmptyState({ query, hasItems }) {
      return (
        <div className="text-center py-12 px-4">
          <div className="text-5xl mb-3">{hasItems ? '🔍' : '🧊'}</div>
          <p className="text-samsung-text font-semibold">
            {hasItems
              ? `"${query}"와 일치하는 재료가 없어요`
              : '아직 등록된 재료가 없어요'}
          </p>
          <p className="text-sm text-samsung-muted mt-1">
            {hasItems ? '다른 키워드로 검색해 보세요' : '위에서 첫 재료를 추가해 보세요'}
          </p>
        </div>
      );
    }

    // ========================================
    // AI Options Form + Preview Modal
    // ========================================
    function OptionsForm({ options, setOptions, onGenerate, loading, disabled, reason }) {
      const update = (patch) => setOptions((prev) => ({ ...prev, ...patch }));

      return (
        <div className="bg-white rounded-2xl p-5 sm:p-6 shadow-card border border-gray-100">
          <h4 className="text-sm font-bold text-samsung-dark mb-3 flex items-center gap-2">
            <span aria-hidden="true">⚙️</span> AI 생성 옵션
          </h4>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div>
              <label className="block text-[11px] font-semibold text-samsung-muted mb-1">난이도</label>
              <select
                value={options.difficulty || ''}
                onChange={(e) => update({ difficulty: e.target.value || null })}
                className="w-full text-sm rounded-xl border border-gray-200 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-violet-300"
              >
                <option value="">상관없음</option>
                <option value="easy">쉬움</option>
                <option value="medium">보통</option>
                <option value="hard">어려움</option>
              </select>
            </div>
            <div>
              <label className="block text-[11px] font-semibold text-samsung-muted mb-1">최대 조리시간(분)</label>
              <input
                type="number" min="1" max="600" placeholder="예: 30"
                value={options.maxMinutes ?? ''}
                onChange={(e) => update({ maxMinutes: e.target.value ? Number(e.target.value) : null })}
                className="w-full text-sm rounded-xl border border-gray-200 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-violet-300"
              />
            </div>
            <div>
              <label className="block text-[11px] font-semibold text-samsung-muted mb-1">목표 칼로리(1인분)</label>
              <input
                type="number" min="1" max="5000" placeholder="예: 500"
                value={options.calorieTarget ?? ''}
                onChange={(e) => update({ calorieTarget: e.target.value ? Number(e.target.value) : null })}
                className="w-full text-sm rounded-xl border border-gray-200 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-violet-300"
              />
            </div>
            <div className="flex items-end">
              <label className="inline-flex items-center gap-2 text-sm text-samsung-text select-none cursor-pointer">
                <input
                  type="checkbox"
                  checked={!!options.dietMode}
                  onChange={(e) => update({ dietMode: e.target.checked })}
                  className="w-4 h-4 accent-violet-600"
                />
                <span className="font-medium">🥗 다이어트 모드</span>
              </label>
            </div>
          </div>
          <div className="mt-3">
            <label className="block text-[11px] font-semibold text-samsung-muted mb-1">추가 요청 (선택)</label>
            <input
              type="text" placeholder="예: 매운맛, 한 그릇, 아이가 먹을 수 있게..."
              value={options.note ?? ''}
              onChange={(e) => update({ note: e.target.value })}
              className="w-full text-sm rounded-xl border border-gray-200 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-violet-300"
            />
          </div>
          <div className="mt-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <p className="text-xs text-samsung-muted">
              생성 결과는 <strong>미리보기</strong>로 확인하고 <strong>저장 / 다시 생성</strong>을 선택할 수 있어요.
            </p>
            <button
              onClick={onGenerate}
              disabled={disabled || loading}
              className="inline-flex items-center justify-center gap-2 rounded-xl px-6 py-3 text-sm sm:text-base font-semibold text-white shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed"
              style={{ backgroundImage: 'linear-gradient(135deg, #7C3AED 0%, #1428A0 100%)' }}
              aria-busy={loading}
            >
              {loading ? <>생성 중... (5~15초)</> : <><span aria-hidden="true">✨</span><span>AI로 미리보기</span></>}
            </button>
          </div>
          {disabled && reason && <p className="mt-2 text-xs text-samsung-muted">{reason}</p>}
        </div>
      );
    }

    function PreviewModal({ open, preview, basedOn, onSave, onRegenerate, onClose, saving, regenerating }) {
      if (!open) return null;
      const r = preview || {};
      const ingr = r.ingredients || [];
      const steps = r.steps || [];
      const ownedSet = new Set((basedOn || []).map((s) => String(s).toLowerCase()));
      const isOwned = (n) => ownedSet.has(String(n).toLowerCase());

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" role="dialog" aria-modal="true">
          <div className="w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div className="px-6 py-4 text-white flex items-center justify-between"
                 style={{ backgroundImage: 'linear-gradient(135deg, #7C3AED 0%, #1428A0 100%)' }}>
              <div className="flex items-center gap-2">
                <span>✨</span><span className="font-semibold tracking-wide text-sm">AI 미리보기</span>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-white/15 grid place-items-center" aria-label="닫기">✕</button>
            </div>
            <div className="p-6 overflow-y-auto flex-1">
              <h3 className="text-2xl font-extrabold text-samsung-dark">{r.title || '제목 없음'}</h3>
              <div className="flex flex-wrap gap-2 mt-2">
                {r.difficulty        && <Badge tone="blue">난이도 · {r.difficulty}</Badge>}
                {r.minutes           && <Badge tone="blue">⏱ {r.minutes}분</Badge>}
                {r.estimatedCalories && <Badge tone="green">🔥 {r.estimatedCalories} kcal</Badge>}
                <Badge tone="gray">{steps.length}단계</Badge>
              </div>
              <div className="mt-5">
                <h4 className="text-xs font-bold text-samsung-muted uppercase tracking-wider mb-2">재료</h4>
                <div className="flex flex-wrap gap-1.5">
                  {ingr.map((name, i) => (
                    <span key={i} className={`text-xs px-2 py-1 rounded-full font-medium border ${
                      isOwned(name)
                        ? 'bg-green-50 text-green-700 border-green-200'
                        : 'bg-gray-50 text-gray-500 border-gray-200'
                    }`}>{isOwned(name) ? '✓ ' : '+ '}{name}</span>
                  ))}
                </div>
              </div>
              <div className="mt-5">
                <h4 className="text-xs font-bold text-samsung-muted uppercase tracking-wider mb-2">조리 순서</h4>
                <ol className="space-y-2 list-decimal pl-5 text-sm text-samsung-text leading-relaxed">
                  {steps.map((s, i) => <li key={i}>{s}</li>)}
                </ol>
              </div>
            </div>
            <div className="border-t border-gray-100 p-4 flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
              <Button variant="ghost"     onClick={onClose}      disabled={saving || regenerating}>취소</Button>
              <Button variant="secondary" onClick={onRegenerate} disabled={saving || regenerating}>
                {regenerating ? '다시 생성 중...' : '🔄 다시 생성'}
              </Button>
              <button onClick={onSave} disabled={saving || regenerating}
                className="inline-flex items-center justify-center gap-2 rounded-xl px-5 py-2.5 text-sm font-semibold text-white shadow-md transition-all disabled:opacity-50"
                style={{ backgroundImage: 'linear-gradient(135deg, #7C3AED 0%, #1428A0 100%)' }}>
                {saving ? '저장 중...' : '💾 마음에 들어요, 저장'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // AI Recipe Section
    function AiRecipeSection({ ingredients, options, setOptions, onGenerate, generating }) {
      const empty = ingredients.length === 0;
      return (
        <section id="ai-recipes" className="bg-gradient-to-b from-violet-50/40 to-white py-16 sm:py-20">
          <div className="max-w-7xl mx-auto px-5 sm:px-8">
            <div className="mb-8">
              <Badge tone="blue" className="mb-3" style={{ background: 'rgba(124,58,237,.12)', color: '#6D28D9' }}>AI POWERED</Badge>
              <h2 className="text-3xl sm:text-4xl font-extrabold text-samsung-dark tracking-tight">
                ✨ AI 레시피 생성
              </h2>
              <p className="text-samsung-muted mt-2">
                지금 냉장고에 있는 재료로 OpenAI가 새 요리를 만들어 드려요. 마음에 들면 저장됩니다.
              </p>
            </div>
            <OptionsForm
              options={options}
              setOptions={setOptions}
              onGenerate={onGenerate}
              loading={generating}
              disabled={empty}
              reason={empty ? '재료를 먼저 추가하세요' : ''}
            />
          </div>
        </section>
      );
    }

    // Saved Recipes Section (DB 모든 레시피, AI 우선 표시)
    function SavedRecipesSection({ recipes, ingredients, onDelete, refreshKey }) {
      const ownedNames = useMemo(() => ingredients.map(i => i.name), [ingredients]);
      return (
        <section id="saved-recipes" className="bg-white py-16 sm:py-20 border-t border-gray-100">
          <div className="max-w-7xl mx-auto px-5 sm:px-8">
            <div className="mb-8 flex items-end justify-between flex-wrap gap-4">
              <div>
                <Badge tone="blue" className="mb-3">SAVED</Badge>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-samsung-dark tracking-tight">저장된 레시피</h2>
                <p className="text-samsung-muted mt-2">총 {recipes.length}개 (AI 생성 · 기본 레시피 포함)</p>
              </div>
            </div>
            {recipes.length === 0 ? (
              <Card className="p-12 text-center border border-dashed border-gray-200">
                <p className="font-semibold text-samsung-dark">아직 저장된 레시피가 없어요</p>
                <p className="text-sm text-samsung-muted mt-1">위 ✨ AI 레시피 생성으로 첫 레시피를 만들어 보세요.</p>
              </Card>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {recipes.map(r => <SavedRecipeCard key={r.id} recipe={r} ownedNames={ownedNames} onDelete={onDelete} />)}
              </div>
            )}
          </div>
        </section>
      );
    }

    function SavedRecipeCard({ recipe, ownedNames, onDelete }) {
      const [expanded, setExpanded] = useState(false);
      const required = recipe.ingredients || [];
      const have = required.filter(r => ownedNames.includes(r));
      const steps = recipe.steps || [];
      const isAi = recipe.source === 'ai-openai';
      const visibleSteps = expanded ? steps : steps.slice(0, 3);

      return (
        <div className="card-lift bg-white rounded-2xl border border-gray-100 shadow-card overflow-hidden flex flex-col relative">
          {isAi && (
            <span className="absolute top-3 right-3 z-10 text-[10px] font-bold tracking-widest text-white px-2 py-1 rounded-full"
                  style={{ backgroundImage: 'linear-gradient(135deg, #7C3AED 0%, #1428A0 100%)' }}>✨ AI</span>
          )}
          <button
            onClick={() => { if (confirm(`"${recipe.title}" 삭제할까요?`)) onDelete(recipe.id); }}
            className="absolute top-3 left-3 z-10 w-7 h-7 rounded-full bg-white/80 hover:bg-red-50 text-gray-400 hover:text-red-500 grid place-items-center text-sm shadow-sm"
            aria-label="삭제">×</button>
          <div className={`h-24 flex items-center justify-center ${isAi ? '' : 'bg-gradient-to-br from-samsung-blue/8 to-blue-50'}`}
               style={isAi ? { backgroundImage: 'linear-gradient(135deg, rgba(124,58,237,.10) 0%, rgba(20,40,160,.10) 100%)' } : undefined}>
            <span className="text-xs font-semibold tracking-widest" style={{ color: isAi ? '#6D28D9' : '#1428A0' }}>RECIPE</span>
          </div>
          <div className="p-5 flex flex-col gap-3 flex-1">
            <h4 className="text-lg font-bold text-samsung-dark pr-8">{recipe.title}</h4>
            <div className="flex flex-wrap gap-1.5">
              {recipe.difficulty        && <Badge tone="blue">난이도 · {recipe.difficulty}</Badge>}
              {recipe.minutes           && <Badge tone="blue">⏱ {recipe.minutes}분</Badge>}
              {recipe.estimatedCalories && <Badge tone="green">🔥 {recipe.estimatedCalories} kcal</Badge>}
              <Badge tone="gray">{steps.length}단계</Badge>
            </div>
            <div className="flex flex-wrap gap-1.5">
              {required.map(r => (
                <span key={r} className={`text-[11px] px-2 py-1 rounded-full font-medium ${
                  have.includes(r) ? 'bg-green-50 text-green-700 border border-green-200'
                                   : 'bg-gray-50 text-gray-400 border border-gray-200 line-through'
                }`}>{have.includes(r) ? '✓ ' : ''}{r}</span>
              ))}
            </div>
            <ol className="text-sm text-samsung-muted leading-relaxed list-decimal pl-5 space-y-1 flex-1">
              {visibleSteps.map((s, i) => <li key={i}>{s}</li>)}
            </ol>
            {steps.length > 3 && (
              <button onClick={() => setExpanded(e => !e)} className="text-xs font-semibold text-samsung-blue hover:underline self-start">
                {expanded ? '접기' : `+ ${steps.length - 3}단계 더`}
              </button>
            )}
          </div>
        </div>
      );
    }

    // ========================================
    // Recipe Card & Section (보유 재료 매칭 — 기존)
    // ========================================
    function RecipeCard({ recipe, ownedNames }) {
      const required = recipe.ingredients || [];
      const have = required.filter(r => ownedNames.includes(r));
      const steps = recipe.steps || [];

      return (
        <div className="card-lift bg-white rounded-2xl border border-gray-100 shadow-card overflow-hidden flex flex-col">
          <div className="bg-gradient-to-br from-samsung-blue/8 to-blue-50 h-28 flex items-center justify-center">
            <span className="text-xs font-semibold text-samsung-blue tracking-widest">RECIPE</span>
          </div>
          <div className="p-5 flex flex-col gap-3 flex-1">
            <div className="flex items-start justify-between gap-2">
              <h4 className="text-lg font-bold text-samsung-dark">{recipe.title}</h4>
              <Badge tone="blue">{steps.length}단계</Badge>
            </div>
            <div className="flex flex-wrap gap-1.5">
              {required.map(r => (
                <span
                  key={r}
                  className={`text-[11px] px-2 py-1 rounded-full font-medium ${
                    have.includes(r)
                      ? 'bg-green-50 text-green-700 border border-green-200'
                      : 'bg-gray-50 text-gray-400 border border-gray-200 line-through'
                  }`}
                >
                  {have.includes(r) ? '✓ ' : ''}{r}
                </span>
              ))}
            </div>
            <ol className="text-sm text-samsung-muted leading-relaxed list-decimal pl-5 space-y-1 flex-1">
              {steps.slice(0, 3).map((s, i) => <li key={i}>{s}</li>)}
              {steps.length > 3 && <li className="text-samsung-blue/80 list-none">+ {steps.length - 3}단계 더…</li>}
            </ol>
          </div>
        </div>
      );
    }

    function RecipeSection({ ingredients, refreshKey }) {
      const [recommended, setRecommended] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');

      const ownedNames = useMemo(() => ingredients.map(i => i.name), [ingredients]);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        api.recommendedRecipes()
          .then(data => { if (!cancelled) { setRecommended(data); setError(''); } })
          .catch(err => { if (!cancelled) setError(err.message || '레시피를 불러오지 못했어요.'); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [refreshKey]);

      return (
        <section id="recipes" className="bg-samsung-gray py-16 sm:py-20">
          <div className="max-w-7xl mx-auto px-5 sm:px-8">
            <div className="flex items-end justify-between flex-wrap gap-4 mb-10">
              <div>
                <Badge tone="blue" className="mb-3">TODAY'S PICK</Badge>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-samsung-dark tracking-tight">
                  오늘의 추천 레시피
                </h2>
                <p className="text-samsung-muted mt-2">
                  보유한 재료로 지금 바로 만들 수 있는 요리예요. (Supabase DB 연동)
                </p>
              </div>
            </div>

            {loading ? (
              <Card className="p-12 text-center"><p className="text-samsung-muted">레시피를 불러오는 중…</p></Card>
            ) : error ? (
              <Card className="p-12 text-center border border-red-200">
                <p className="text-red-500 font-semibold">⚠ {error}</p>
              </Card>
            ) : recommended.length === 0 ? (
              <Card className="p-12 text-center border border-dashed border-gray-200">
                <div className="text-5xl mb-3">🍽️</div>
                <p className="font-semibold text-samsung-dark">추천 가능한 레시피가 없어요</p>
                <p className="text-sm text-samsung-muted mt-1">계란, 토마토, 양파, 치즈 같은 기본 재료를 추가해 보세요.</p>
              </Card>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {recommended.map(r => <RecipeCard key={r.id} recipe={r} ownedNames={ownedNames} />)}
              </div>
            )}
          </div>
        </section>
      );
    }

    // ========================================
    // Footer
    // ========================================
    function Footer() {
      return (
        <footer className="bg-white border-t border-gray-100">
          <div className="max-w-7xl mx-auto px-5 sm:px-8 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-2">
              <span className="text-xl">🧊</span>
              <span className="font-bold text-samsung-dark">Smart Fridge</span>
            </div>
            <p className="text-xs text-samsung-muted">
              © 2026 Smart Fridge. Inspired by Samsung Bespoke. All rights reserved.
            </p>
            <div className="flex gap-5 text-xs text-samsung-muted">
              <a href="#" className="hover:text-samsung-blue">이용약관</a>
              <a href="#" className="hover:text-samsung-blue">개인정보처리방침</a>
              <a href="#" className="hover:text-samsung-blue">고객지원</a>
            </div>
          </div>
        </footer>
      );
    }

    // ========================================
    // App
    // ========================================
    function App() {
      const [ingredients, setIngredients] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState('');
      const [refreshKey, setRefreshKey] = useState(0);

      const [aiOptions, setAiOptions] = useState({
        difficulty: null, maxMinutes: null, calorieTarget: null, dietMode: false, note: '',
      });
      const [generating, setGenerating] = useState(false);
      const [preview, setPreview] = useState(null);
      const [previewBasedOn, setPreviewBasedOn] = useState([]);
      const [previewOpen, setPreviewOpen] = useState(false);
      const [saving, setSaving] = useState(false);
      const [aiError, setAiError] = useState('');

      // Initial load from API (parallel)
      useEffect(() => {
        Promise.allSettled([api.listIngredients(), api.listRecipes()])
          .then(([ing, rec]) => {
            if (ing.status === 'fulfilled') setIngredients(ing.value);
            else setLoadError(ing.reason?.message || '재료를 불러오지 못했어요.');
            if (rec.status === 'fulfilled') setRecipes(rec.value);
          })
          .finally(() => setLoading(false));
      }, []);

      const addIngredient = async (input) => {
        const created = await api.addIngredient(input);
        setIngredients(prev => [created, ...prev]);
        setRefreshKey(k => k + 1);
      };

      const removeIngredient = async (id) => {
        await api.removeIngredient(id);
        setIngredients(prev => prev.filter(i => String(i.id) !== String(id)));
        setRefreshKey(k => k + 1);
      };

      const removeRecipe = async (id) => {
        const prev = recipes;
        setRecipes(arr => arr.filter(r => String(r.id) !== String(id)));
        try { await api.removeRecipe(id); }
        catch (e) { setRecipes(prev); alert(`삭제 실패: ${e.message || e}`); }
      };

      const runPreview = async () => {
        setGenerating(true);
        setAiError('');
        try {
          const data = await api.previewRecipe(aiOptions);
          setPreview(data.preview);
          setPreviewBasedOn(data.basedOnIngredients || []);
          setPreviewOpen(true);
        } catch (err) {
          setAiError(err.message || 'AI 생성 실패');
          alert(`⚠ ${err.message || 'AI 생성 실패'}`);
        } finally {
          setGenerating(false);
        }
      };

      const savePreview = async () => {
        if (!preview) return;
        setSaving(true);
        try {
          const saved = await api.saveRecipe({ recipe: preview, options: aiOptions });
          setRecipes(prev => [saved, ...prev]);
          setPreviewOpen(false);
          setPreview(null);
          setRefreshKey(k => k + 1);
        } catch (err) {
          alert(`⚠ 저장 실패: ${err.message || err}`);
        } finally {
          setSaving(false);
        }
      };

      const stats = useMemo(() => {
        const total      = ingredients.length;
        const vegetable  = ingredients.filter(i => i.category === 'vegetable').length;
        const dairyMeat  = ingredients.filter(i => i.category === 'dairy' || i.category === 'meat').length;
        const etc        = ingredients.filter(i => i.category === 'etc').length;
        return { total, vegetable, dairyMeat, etc };
      }, [ingredients]);

      return (
        <div className="min-h-screen flex flex-col">
          <Header />
          <main className="flex-1">
            <Hero stats={stats} />

            <section id="fridge" className="max-w-7xl mx-auto px-5 sm:px-8 py-16 sm:py-20">
              <div className="mb-10 flex items-end justify-between flex-wrap gap-4">
                <div>
                  <Badge tone="blue" className="mb-3">MY FRIDGE</Badge>
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-samsung-dark tracking-tight">내 냉장고</h2>
                  <p className="text-samsung-muted mt-2">새 재료를 추가하면 Supabase DB에 즉시 저장됩니다.</p>
                </div>
                {loadError && <span className="text-sm text-red-500 font-medium">⚠ {loadError}</span>}
              </div>
              <div className="space-y-5">
                <IngredientForm onAdd={addIngredient} />
                {loading
                  ? <Card className="p-12 text-center"><p className="text-samsung-muted">재료를 불러오는 중…</p></Card>
                  : <IngredientList items={ingredients} onRemove={removeIngredient} />
                }
              </div>
            </section>

            <AiRecipeSection
              ingredients={ingredients}
              options={aiOptions}
              setOptions={setAiOptions}
              onGenerate={runPreview}
              generating={generating}
            />

            <RecipeSection ingredients={ingredients} refreshKey={refreshKey} />

            <SavedRecipesSection
              recipes={recipes}
              ingredients={ingredients}
              onDelete={removeRecipe}
              refreshKey={refreshKey}
            />
          </main>
          <Footer />

          <PreviewModal
            open={previewOpen}
            preview={preview}
            basedOn={previewBasedOn}
            onSave={savePreview}
            onRegenerate={runPreview}
            onClose={() => { if (!saving && !generating) setPreviewOpen(false); }}
            saving={saving}
            regenerating={generating}
          />
        </div>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
