<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메모장</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* 스크롤바 스타일 커스터마이징 */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e5e7eb;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #d1d5db;
    }

    /* textarea에서 기본 리사이즈 핸들 제거 + 포커스 아웃라인 제거 */
    textarea:focus, input:focus {
      outline: none;
    }

    /* 메모 항목의 삭제 버튼은 hover 시에만 나타나게 */
    .note-item .delete-btn {
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
    }
    .note-item:hover .delete-btn {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ========================================
    // 🔧 유틸리티
    // ========================================

    // 현재 시각을 ISO 문자열로 (낙관적 업데이트용)
    const nowIso = () => new Date().toISOString();

    // ========================================
    // 🌐 API 클라이언트
    // ========================================
    const api = {
      list: () =>
        fetch('/api/memos').then((r) => {
          if (!r.ok) throw new Error('list failed');
          return r.json();
        }),
      create: (body) =>
        fetch('/api/memos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {}),
        }).then((r) => {
          if (!r.ok) throw new Error('create failed');
          return r.json();
        }),
      update: (id, patch) =>
        fetch(`/api/memos/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        }).then((r) => {
          if (!r.ok) throw new Error('update failed');
          return r.json();
        }),
      remove: (id) =>
        fetch(`/api/memos/${id}`, { method: 'DELETE' }).then((r) => {
          if (!r.ok) throw new Error('delete failed');
          return r.json();
        }),
    };

    // 날짜를 읽기 좋은 한국어 형식으로 표시
    const formatDate = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const sameDay =
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate();

      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');

      if (sameDay) {
        return `오늘 ${hh}:${mm}`;
      }
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      const isYesterday =
        d.getFullYear() === yesterday.getFullYear() &&
        d.getMonth() === yesterday.getMonth() &&
        d.getDate() === yesterday.getDate();
      if (isYesterday) {
        return `어제 ${hh}:${mm}`;
      }
      return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
    };

    // 본문 1줄 미리보기
    const previewOf = (content) => {
      if (!content) return '';
      const firstLine = content.split('\n').find((l) => l.trim().length > 0);
      return firstLine ? firstLine.trim() : '';
    };

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function IconPlus({ className = 'w-4 h-4' }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      );
    }

    function IconSearch({ className = 'w-4 h-4' }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      );
    }

    function IconTrash({ className = 'w-4 h-4' }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
          <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
        </svg>
      );
    }

    function IconNote({ className = 'w-12 h-12' }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="1.5"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="8" y1="13" x2="16" y2="13" />
          <line x1="8" y1="17" x2="13" y2="17" />
        </svg>
      );
    }

    // 범용 버튼
    function Button({
      children,
      onClick,
      variant = 'primary',
      size = 'md',
      disabled = false,
      className = '',
      type = 'button',
      ...rest
    }) {
      const base =
        'inline-flex items-center justify-center gap-2 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-blue-600 text-white hover:bg-blue-700',
        secondary:
          'bg-white text-gray-700 border border-gray-200 hover:bg-gray-50',
        ghost: 'text-gray-600 hover:bg-gray-100',
        danger: 'bg-red-500 text-white hover:bg-red-600',
      };
      const sizes = {
        sm: 'px-2.5 py-1.5 text-xs',
        md: 'px-3.5 py-2 text-sm',
        lg: 'px-5 py-2.5 text-base',
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    // ========================================
    // 🧩 레이아웃 / 기능 컴포넌트
    // ========================================

    function Sidebar({
      notes,
      selectedId,
      onSelect,
      onCreate,
      onDelete,
      searchQuery,
      onSearchChange,
    }) {
      return (
        <aside className="w-80 border-r border-gray-200 bg-white flex flex-col h-screen">
          {/* 헤더: 타이틀 + 새 메모 버튼 */}
          <div className="px-4 pt-4 pb-2 flex items-center justify-between">
            <h1 className="text-lg font-semibold text-gray-800">메모</h1>
            <Button
              variant="primary"
              size="sm"
              onClick={onCreate}
              aria-label="새 메모 만들기"
            >
              <IconPlus className="w-3.5 h-3.5" />
              새 메모
            </Button>
          </div>

          {/* 검색창 */}
          <div className="px-4 py-2">
            <div className="relative">
              <div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                <IconSearch className="w-4 h-4" />
              </div>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => onSearchChange(e.target.value)}
                placeholder="메모 검색"
                className="w-full pl-9 pr-3 py-2 text-sm bg-gray-100 rounded-lg placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-blue-500 transition-colors"
              />
            </div>
          </div>

          {/* 메모 리스트 */}
          <div className="flex-1 overflow-y-auto custom-scrollbar px-2 pb-4">
            {notes.length === 0 ? (
              <div className="text-center text-sm text-gray-400 py-10 px-4">
                {searchQuery
                  ? '검색 결과가 없습니다.'
                  : '아직 메모가 없습니다.\n"새 메모"를 눌러 시작하세요.'
                    .split('\n')
                    .map((line, i) => (
                      <div key={i}>{line}</div>
                    ))}
              </div>
            ) : (
              <ul className="space-y-1">
                {notes.map((note) => {
                  const isSelected = note.id === selectedId;
                  const title = note.title.trim() || '제목 없음';
                  const preview = previewOf(note.content) || '추가 텍스트 없음';
                  return (
                    <li key={note.id}>
                      <button
                        type="button"
                        onClick={() => onSelect(note.id)}
                        className={`note-item group w-full text-left px-3 py-2.5 rounded-lg relative transition-colors ${
                          isSelected
                            ? 'bg-blue-50 ring-1 ring-blue-200'
                            : 'hover:bg-gray-50'
                        }`}
                      >
                        <div className="flex items-start justify-between gap-2">
                          <div className="min-w-0 flex-1">
                            <div
                              className={`text-sm font-medium truncate ${
                                isSelected ? 'text-blue-700' : 'text-gray-800'
                              }`}
                            >
                              {title}
                            </div>
                            <div className="mt-0.5 flex items-center gap-2 text-xs text-gray-500">
                              <span className="shrink-0">
                                {formatDate(note.updatedAt)}
                              </span>
                              <span className="truncate text-gray-400">
                                {preview}
                              </span>
                            </div>
                          </div>
                          <button
                            type="button"
                            aria-label="메모 삭제"
                            onClick={(e) => {
                              e.stopPropagation();
                              onDelete(note.id);
                            }}
                            className="delete-btn shrink-0 p-1 rounded-md text-gray-400 hover:bg-red-50 hover:text-red-500"
                          >
                            <IconTrash className="w-4 h-4" />
                          </button>
                        </div>
                      </button>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>

          {/* 푸터: 메모 개수 */}
          <div className="border-t border-gray-100 px-4 py-2 text-xs text-gray-400">
            총 {notes.length}개의 메모
          </div>
        </aside>
      );
    }

    function Editor({ note, onChangeTitle, onChangeContent, onDelete }) {
      const titleRef = useRef(null);

      // 새 메모가 선택되면 제목 input에 포커스
      useEffect(() => {
        if (note && titleRef.current) {
          // 빈 메모일 때만 자동 포커스
          if (!note.title && !note.content) {
            titleRef.current.focus();
          }
        }
      }, [note?.id]);

      if (!note) {
        return (
          <main className="flex-1 h-screen flex flex-col items-center justify-center text-gray-400 bg-white">
            <IconNote className="w-16 h-16 mb-4 text-gray-300" />
            <p className="text-lg">메모를 선택하거나 새로 만드세요</p>
            <p className="text-sm text-gray-400 mt-1">
              왼쪽에서 메모를 고르거나, "새 메모" 버튼을 눌러 시작할 수 있어요.
            </p>
          </main>
        );
      }

      return (
        <main className="flex-1 h-screen flex flex-col bg-white">
          {/* 상단 툴바: 마지막 수정 시간 + 삭제 */}
          <div className="flex items-center justify-between px-8 pt-6 pb-2">
            <div className="text-xs text-gray-400">
              마지막 수정: {formatDate(note.updatedAt)}
            </div>
            <Button
              variant="ghost"
              size="sm"
              onClick={() => onDelete(note.id)}
              aria-label="현재 메모 삭제"
              className="text-gray-500 hover:text-red-500"
            >
              <IconTrash className="w-4 h-4" />
              삭제
            </Button>
          </div>

          {/* 제목 */}
          <div className="px-8">
            <input
              ref={titleRef}
              type="text"
              value={note.title}
              onChange={(e) => onChangeTitle(e.target.value)}
              placeholder="제목을 입력하세요"
              className="w-full text-3xl font-bold text-gray-900 placeholder-gray-300 bg-transparent py-2"
            />
          </div>

          {/* 본문 */}
          <div className="flex-1 px-8 pb-8 pt-2">
            <textarea
              value={note.content}
              onChange={(e) => onChangeContent(e.target.value)}
              placeholder="여기에 내용을 입력하세요..."
              className="w-full h-full resize-none text-base leading-7 text-gray-800 placeholder-gray-300 bg-transparent custom-scrollbar"
            />
          </div>
        </main>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      const [notes, setNotes] = useState([]);
      const [selectedId, setSelectedId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');

      // 초기 로드: 서버에서 메모 목록 가져오기
      useEffect(() => {
        api
          .list()
          .then((list) => {
            setNotes(list);
            if (list.length > 0) {
              setSelectedId(list[0].id);
            }
          })
          .catch((err) => console.error('failed to load notes:', err));
      }, []);

      // 디바운스된 PATCH 요청을 위한 타이머 저장소 (메모 id별)
      const debounceTimersRef = useRef(new Map());
      // 보낼 변경사항 버퍼 (id별)
      const pendingPatchRef = useRef(new Map());

      const flushPatch = useCallback((id) => {
        const patch = pendingPatchRef.current.get(id);
        pendingPatchRef.current.delete(id);
        const timer = debounceTimersRef.current.get(id);
        if (timer) {
          clearTimeout(timer);
          debounceTimersRef.current.delete(id);
        }
        if (!patch) return;
        api
          .update(id, patch)
          .then((updated) => {
            // 서버의 updated_at을 반영 (id와 타임스탬프만 최신화)
            setNotes((prev) =>
              prev.map((n) =>
                n.id === id ? { ...n, updatedAt: updated.updatedAt } : n
              )
            );
          })
          .catch((err) => console.error('update failed:', err));
      }, []);

      const scheduleUpdate = useCallback(
        (id, patch) => {
          // 기존 patch와 병합
          const prev = pendingPatchRef.current.get(id) || {};
          pendingPatchRef.current.set(id, { ...prev, ...patch });

          // 타이머 재설정 (400ms 디바운스)
          const existing = debounceTimersRef.current.get(id);
          if (existing) clearTimeout(existing);
          const t = setTimeout(() => flushPatch(id), 400);
          debounceTimersRef.current.set(id, t);
        },
        [flushPatch]
      );

      // 언마운트 시 pending patch 모두 flush
      useEffect(() => {
        return () => {
          for (const id of Array.from(pendingPatchRef.current.keys())) {
            flushPatch(id);
          }
        };
      }, [flushPatch]);

      // 현재 선택된 메모
      const selectedNote = useMemo(
        () => notes.find((n) => n.id === selectedId) || null,
        [notes, selectedId]
      );

      // 검색 + 최신순 정렬된 메모 리스트
      const visibleNotes = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        const filtered = q
          ? notes.filter(
              (n) =>
                (n.title || '').toLowerCase().includes(q) ||
                (n.content || '').toLowerCase().includes(q)
            )
          : notes;
        return [...filtered].sort(
          (a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)
        );
      }, [notes, searchQuery]);

      // 새 메모 생성 → 서버에 즉시 요청, 반환된 id 사용
      const handleCreate = () => {
        api
          .create({ title: '', content: '' })
          .then((created) => {
            setNotes((prev) => [created, ...prev]);
            setSelectedId(created.id);
            setSearchQuery('');
          })
          .catch((err) => console.error('create failed:', err));
      };

      // 메모 선택
      const handleSelect = (id) => {
        setSelectedId(id);
      };

      // 메모 삭제 → 서버 DELETE 후 state 제거
      const handleDelete = (id) => {
        const target = notes.find((n) => n.id === id);
        const hasContent =
          target && ((target.title || '').trim() || (target.content || '').trim());
        if (hasContent) {
          const ok = window.confirm(
            '이 메모를 삭제할까요? 삭제한 메모는 되돌릴 수 없습니다.'
          );
          if (!ok) return;
        }

        // 디바운스 대기 중인 패치는 취소
        const t = debounceTimersRef.current.get(id);
        if (t) clearTimeout(t);
        debounceTimersRef.current.delete(id);
        pendingPatchRef.current.delete(id);

        api
          .remove(id)
          .then(() => {
            setNotes((prev) => {
              const next = prev.filter((n) => n.id !== id);
              if (selectedId === id) {
                const fallback = next[0]?.id ?? null;
                setSelectedId(fallback);
              }
              return next;
            });
          })
          .catch((err) => console.error('delete failed:', err));
      };

      // 낙관적 업데이트 + 디바운스 PATCH
      const updateSelected = (patch) => {
        if (!selectedId) return;
        setNotes((prev) =>
          prev.map((n) =>
            n.id === selectedId
              ? { ...n, ...patch, updatedAt: nowIso() }
              : n
          )
        );
        scheduleUpdate(selectedId, patch);
      };

      const handleChangeTitle = (title) => updateSelected({ title });
      const handleChangeContent = (content) => updateSelected({ content });

      return (
        <div className="flex h-screen w-screen bg-gray-50 text-gray-900">
          <Sidebar
            notes={visibleNotes}
            selectedId={selectedId}
            onSelect={handleSelect}
            onCreate={handleCreate}
            onDelete={handleDelete}
            searchQuery={searchQuery}
            onSearchChange={setSearchQuery}
          />
          <Editor
            note={selectedNote}
            onChangeTitle={handleChangeTitle}
            onChangeContent={handleChangeContent}
            onDelete={handleDelete}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
