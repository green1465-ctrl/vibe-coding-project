<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 밸런스 게임 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pop {
      0%   { transform: scale(0.85); opacity: 0; }
      60%  { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1);    opacity: 1; }
    }
    .animate-pop { animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

    @keyframes float-up {
      0%   { transform: translateY(8px); opacity: 0; }
      100% { transform: translateY(0);   opacity: 1; }
    }
    .animate-float-up { animation: float-up 0.5s ease-out both; }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.5); }
      70%  { box-shadow: 0 0 0 18px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }
    .animate-pulse-ring { animation: pulse-ring 1.5s ease-out infinite; }

    .bar-transition { transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1); }

    .vs-gradient {
      background: linear-gradient(135deg, #f43f5e 0%, #8b5cf6 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // 색상 팔레트 (Tailwind JIT 빌드타임 클래스 캡처용)
    // ========================================
    const COLOR_MAP = {
      rose:    { from: 'from-rose-500',    to: 'to-rose-700',    ring: 'ring-rose-400',    bar: 'bg-rose-500' },
      sky:     { from: 'from-sky-500',     to: 'to-sky-700',     ring: 'ring-sky-400',     bar: 'bg-sky-500' },
      amber:   { from: 'from-amber-500',   to: 'to-amber-700',   ring: 'ring-amber-400',   bar: 'bg-amber-500' },
      red:     { from: 'from-red-500',     to: 'to-red-700',     ring: 'ring-red-400',     bar: 'bg-red-500' },
      indigo:  { from: 'from-indigo-500',  to: 'to-indigo-700',  ring: 'ring-indigo-400',  bar: 'bg-indigo-500' },
      fuchsia: { from: 'from-fuchsia-500', to: 'to-fuchsia-700', ring: 'ring-fuchsia-400', bar: 'bg-fuchsia-500' },
      cyan:    { from: 'from-cyan-500',    to: 'to-cyan-700',    ring: 'ring-cyan-400',    bar: 'bg-cyan-500' },
      violet:  { from: 'from-violet-500',  to: 'to-violet-700',  ring: 'ring-violet-400',  bar: 'bg-violet-500' },
      pink:    { from: 'from-pink-500',    to: 'to-pink-700',    ring: 'ring-pink-400',    bar: 'bg-pink-500' },
      purple:  { from: 'from-purple-500',  to: 'to-purple-700',  ring: 'ring-purple-400',  bar: 'bg-purple-500' },
      orange:  { from: 'from-orange-500',  to: 'to-orange-700',  ring: 'ring-orange-400',  bar: 'bg-orange-500' },
      blue:    { from: 'from-blue-500',    to: 'to-blue-700',    ring: 'ring-blue-400',    bar: 'bg-blue-500' },
      emerald: { from: 'from-emerald-500', to: 'to-emerald-700', ring: 'ring-emerald-400', bar: 'bg-emerald-500' },
      yellow:  { from: 'from-yellow-500',  to: 'to-yellow-700',  ring: 'ring-yellow-400',  bar: 'bg-yellow-500' },
      teal:    { from: 'from-teal-500',    to: 'to-teal-700',    ring: 'ring-teal-400',    bar: 'bg-teal-500' },
      slate:   { from: 'from-slate-500',   to: 'to-slate-700',   ring: 'ring-slate-400',   bar: 'bg-slate-500' },
      lime:    { from: 'from-lime-500',    to: 'to-lime-700',    ring: 'ring-lime-400',    bar: 'bg-lime-500' },
      green:   { from: 'from-green-500',   to: 'to-green-700',   ring: 'ring-green-400',   bar: 'bg-green-500' },
    };
    const colorOf = (c) => COLOR_MAP[c] || COLOR_MAP.rose;

    // ========================================
    // 유틸: voter UUID (브라우저 1대 = 한 명의 투표자)
    // ========================================
    const VOTER_KEY = 'balance-game-voter-id-v2';
    function getVoterId() {
      try {
        let id = localStorage.getItem(VOTER_KEY);
        if (!id) {
          id = (crypto.randomUUID && crypto.randomUUID()) ||
               ('v-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
          localStorage.setItem(VOTER_KEY, id);
        }
        return id;
      } catch (e) {
        return 'v-anon-' + Date.now();
      }
    }

    // ========================================
    // API 클라이언트
    // ========================================
    const api = {
      async getQuestions() {
        const r = await fetch('/api/questions');
        if (!r.ok) throw new Error('failed to fetch questions');
        return r.json();
      },
      async getMyVotes(voterId) {
        const r = await fetch(`/api/votes/me?voterId=${encodeURIComponent(voterId)}`);
        if (!r.ok) throw new Error('failed to fetch my votes');
        return r.json(); // { [questionId]: 'A' | 'B' }
      },
      async castVote(questionId, choice, voterId) {
        const r = await fetch('/api/votes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ questionId, choice, voterId }),
        });
        if (!r.ok) throw new Error('failed to cast vote');
        return r.json();
      },
      async removeVote(questionId, voterId) {
        const r = await fetch('/api/votes', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ questionId, voterId }),
        });
        if (!r.ok) throw new Error('failed to remove vote');
        return r.json();
      },
    };

    // ========================================
    // 백분율 계산
    // ========================================
    function pct(a, b) {
      const total = a + b;
      if (total === 0) return { a: 50, b: 50 };
      const pa = Math.round((a / total) * 100);
      return { a: pa, b: 100 - pa };
    }

    // ========================================
    // 🎨 Design System
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed select-none';
      const variants = {
        primary:   'bg-white text-slate-900 hover:bg-slate-100 shadow-lg shadow-white/10',
        secondary: 'bg-slate-800 text-white hover:bg-slate-700 ring-1 ring-slate-700',
        ghost:     'bg-transparent text-slate-300 hover:text-white hover:bg-white/5',
      };
      const sizes = {
        sm: 'text-sm px-3 py-1.5',
        md: 'text-base px-4 py-2.5',
        lg: 'text-lg px-6 py-3.5',
      };
      return (
        <button
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Badge({ children, className = '' }) {
      return (
        <span className={`inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-full bg-white/10 text-white/80 ${className}`}>
          {children}
        </span>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`rounded-2xl bg-slate-900/60 backdrop-blur ring-1 ring-white/10 ${className}`}>
          {children}
        </div>
      );
    }

    // ========================================
    // 🧩 Header
    // ========================================
    function Header({ totalVotes, uniqueVoters, totalQuestions, currentIndex, online }) {
      return (
        <header className="w-full max-w-3xl mx-auto px-4 pt-8 pb-4">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-500 via-fuchsia-500 to-blue-500 grid place-items-center text-xl shadow-lg shadow-fuchsia-500/30">
                ⚖️
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight">실시간 밸런스 게임</h1>
                <p className="text-xs text-slate-400 flex items-center gap-1.5">
                  <span className={`inline-block w-1.5 h-1.5 rounded-full ${online ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'}`} />
                  {online ? 'DB 연결됨 · 실시간 집계 중' : '연결 끊김'}
                </p>
              </div>
            </div>
            <Badge className="bg-white/5 ring-1 ring-white/10">
              <span className="text-fuchsia-300">●</span>
              <span>{currentIndex + 1} / {totalQuestions}</span>
            </Badge>
          </div>

          <div className="mt-5 flex items-center gap-3 text-sm">
            <div className="flex-1 h-2 rounded-full bg-white/5 overflow-hidden">
              <div
                className="h-full bg-gradient-to-r from-rose-500 via-fuchsia-500 to-blue-500 bar-transition"
                style={{ width: `${((currentIndex + 1) / Math.max(1, totalQuestions)) * 100}%` }}
              />
            </div>
            <div className="text-slate-400">
              누적 <span className="font-bold text-white">{totalVotes.toLocaleString()}</span>표
              <span className="mx-1.5 text-slate-600">·</span>
              참여자 <span className="font-bold text-white">{uniqueVoters.toLocaleString()}</span>명
            </div>
          </div>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="w-full max-w-3xl mx-auto px-4 py-8 text-center text-xs text-slate-500">
          <p>모든 투표는 Supabase Postgres(Q5_votes)에 저장돼 모든 사용자와 실시간으로 합산됩니다</p>
        </footer>
      );
    }

    // ========================================
    // 🃏 ChoiceCard
    // ========================================
    function ChoiceCard({ choice, side, isSelected, hasVoted, percent, voteCount, onClick, isWinning, busy }) {
      const colors = colorOf(choice.color);
      const isLeft = side === 'left';

      return (
        <button
          onClick={onClick}
          disabled={busy}
          aria-label={`${choice.text} 선택`}
          className={`
            group relative w-full overflow-hidden rounded-3xl
            bg-gradient-to-br ${colors.from} ${colors.to}
            ring-1 ring-white/10
            transition-all duration-300
            ${busy ? 'cursor-wait opacity-90' :
              hasVoted ? 'cursor-pointer hover:scale-[1.01]' :
              'cursor-pointer hover:scale-[1.02] hover:ring-2 hover:shadow-2xl hover:shadow-current/20'}
            ${isSelected ? `ring-4 ${colors.ring} shadow-2xl scale-[1.02]` : ''}
            ${hasVoted && !isSelected ? 'opacity-80' : ''}
            min-h-[180px] sm:min-h-[260px] p-6 sm:p-8 text-left
          `}
        >
          <div className="absolute -top-12 -right-12 w-48 h-48 rounded-full bg-white/10 blur-3xl pointer-events-none" />
          <div className="absolute -bottom-16 -left-16 w-56 h-56 rounded-full bg-black/20 blur-3xl pointer-events-none" />

          {hasVoted && (
            <div
              className="absolute inset-y-0 left-0 bg-white/15 backdrop-blur-sm bar-transition pointer-events-none"
              style={{ width: `${percent}%` }}
            />
          )}

          <div className="relative z-10 flex flex-col h-full justify-between">
            <div className="flex items-start justify-between">
              <span className={`text-4xl sm:text-5xl ${!hasVoted ? 'group-hover:scale-110 transition-transform' : ''}`}>
                {choice.emoji}
              </span>
              <span className="px-2 py-0.5 rounded-md bg-black/30 text-xs font-bold text-white/90 uppercase tracking-wider">
                {isLeft ? 'A' : 'B'}
              </span>
            </div>

            <div className="mt-6">
              <p className="text-lg sm:text-2xl font-extrabold leading-snug text-white drop-shadow">
                {choice.text}
              </p>

              {hasVoted ? (
                <div className="mt-4 flex items-end gap-3 animate-float-up">
                  <span className="text-4xl sm:text-5xl font-black text-white drop-shadow-lg tabular-nums">
                    {percent}%
                  </span>
                  <div className="pb-1.5 text-sm text-white/80">
                    <div className="font-semibold">{voteCount.toLocaleString()}표</div>
                    {isSelected && <div className="text-[11px] mt-0.5 font-bold">✓ 내 선택</div>}
                    {isWinning && !isSelected && <div className="text-[11px] mt-0.5 font-bold">👑 1위</div>}
                  </div>
                </div>
              ) : (
                <div className="mt-4 inline-flex items-center gap-2 text-sm font-semibold text-white/90 group-hover:text-white">
                  <span>이거다 !</span>
                  <span className="transition-transform group-hover:translate-x-1">→</span>
                </div>
              )}
            </div>
          </div>

          {isSelected && (
            <span className="absolute top-4 right-4 z-20 w-3 h-3 rounded-full bg-white animate-pulse-ring" />
          )}
        </button>
      );
    }

    // ========================================
    // 📄 메인 페이지
    // ========================================
    function BalancePage() {
      const voterIdRef = useRef(getVoterId());

      const [questions, setQuestions]  = useState([]);    // 서버에서 받아온 질문 + 집계
      const [myVotes, setMyVotes]      = useState({});    // { [qid]: 'A' | 'B' }
      const [currentIdx, setCurrentIdx]= useState(0);
      const [resultsOnly, setResultsOnly] = useState(false);
      const [loading, setLoading]      = useState(true);
      const [busy, setBusy]            = useState(false); // 투표 in-flight
      const [online, setOnline]        = useState(true);
      const [error, setError]          = useState(null);

      // ---- 초기 로드 ----
      useEffect(() => {
        let mounted = true;
        (async () => {
          try {
            const [qs, mv] = await Promise.all([
              api.getQuestions(),
              api.getMyVotes(voterIdRef.current),
            ]);
            if (!mounted) return;
            setQuestions(qs);
            setMyVotes(mv);
            setOnline(true);
            setError(null);
          } catch (e) {
            console.error(e);
            if (mounted) { setOnline(false); setError('서버 연결 실패. npm start 가 켜져 있는지 확인해주세요.'); }
          } finally {
            if (mounted) setLoading(false);
          }
        })();
        return () => { mounted = false; };
      }, []);

      // ---- 폴링: 3초마다 전체 집계 새로고침 (실시간 느낌) ----
      useEffect(() => {
        if (loading) return;
        const t = setInterval(async () => {
          try {
            const qs = await api.getQuestions();
            setQuestions(qs);
            setOnline(true);
          } catch (e) {
            setOnline(false);
          }
        }, 3000);
        return () => clearInterval(t);
      }, [loading]);

      const totalQuestions = questions.length;
      const safeIdx = totalQuestions === 0 ? 0 : Math.min(currentIdx, totalQuestions - 1);
      const question = questions[safeIdx];

      const totalVotes = useMemo(
        () => questions.reduce((s, q) => s + (q.votes?.a || 0) + (q.votes?.b || 0), 0),
        [questions]
      );

      // 폴링/투표만으로는 정확한 unique voter 수를 알 수 없어, 서버 집계가 필요한 경우 별도 호출
      const [uniqueVoters, setUniqueVoters] = useState(0);
      useEffect(() => {
        if (loading) return;
        let active = true;
        const fetchStats = async () => {
          try {
            const r = await fetch('/api/stats');
            if (!r.ok) return;
            const s = await r.json();
            if (active) setUniqueVoters(s.uniqueVoters || 0);
          } catch (_) { /* ignore */ }
        };
        fetchStats();
        const t = setInterval(fetchStats, 5000);
        return () => { active = false; clearInterval(t); };
      }, [loading]);

      // ---- 투표 ----
      const handleVote = useCallback(async (sideUpper /* 'A' | 'B' */) => {
        if (!question || busy) return;
        if (myVotes[question.id]) return; // 이미 투표함
        setBusy(true);
        // 낙관적 업데이트
        setQuestions(prev => prev.map(q => {
          if (q.id !== question.id) return q;
          const v = q.votes || { a: 0, b: 0 };
          return { ...q, votes: sideUpper === 'A' ? { a: v.a + 1, b: v.b } : { a: v.a, b: v.b + 1 } };
        }));
        setMyVotes(prev => ({ ...prev, [question.id]: sideUpper }));
        try {
          const res = await api.castVote(question.id, sideUpper, voterIdRef.current);
          // 서버 진실로 동기화
          setQuestions(prev => prev.map(q => q.id === question.id ? { ...q, votes: res.votes } : q));
          setOnline(true);
        } catch (e) {
          console.error(e);
          setOnline(false);
          // 롤백
          setMyVotes(prev => { const n = { ...prev }; delete n[question.id]; return n; });
          setQuestions(prev => prev.map(q => {
            if (q.id !== question.id) return q;
            const v = q.votes || { a: 0, b: 0 };
            return { ...q, votes: sideUpper === 'A' ? { a: Math.max(0, v.a - 1), b: v.b } : { a: v.a, b: Math.max(0, v.b - 1) } };
          }));
        } finally {
          setBusy(false);
        }
      }, [question, busy, myVotes]);

      // ---- 투표 취소 ----
      const handleResetVote = useCallback(async () => {
        if (!question || busy) return;
        const my = myVotes[question.id];
        if (!my) return;
        setBusy(true);
        try {
          const res = await api.removeVote(question.id, voterIdRef.current);
          setQuestions(prev => prev.map(q => q.id === question.id ? { ...q, votes: res.votes } : q));
          setMyVotes(prev => { const n = { ...prev }; delete n[question.id]; return n; });
          setOnline(true);
        } catch (e) {
          console.error(e);
          setOnline(false);
        } finally {
          setBusy(false);
        }
      }, [question, busy, myVotes]);

      const handleNext = useCallback(() => {
        setResultsOnly(false);
        if (totalQuestions > 0) setCurrentIdx(i => (i + 1) % totalQuestions);
      }, [totalQuestions]);

      const handlePrev = useCallback(() => {
        setResultsOnly(false);
        if (totalQuestions > 0) setCurrentIdx(i => (i - 1 + totalQuestions) % totalQuestions);
      }, [totalQuestions]);

      const toggleResultsOnly = useCallback(() => {
        if (question && myVotes[question.id]) return;
        setResultsOnly(r => !r);
      }, [question, myVotes]);

      // ---- 로딩 / 에러 화면 ----
      if (loading) {
        return (
          <div className="min-h-screen grid place-items-center text-slate-300">
            <div className="text-center">
              <div className="text-5xl mb-3 animate-bounce">⚖️</div>
              <p className="text-sm">서버에서 질문 불러오는 중…</p>
            </div>
          </div>
        );
      }

      if (!question) {
        return (
          <div className="min-h-screen grid place-items-center text-slate-300 px-4">
            <Card className="p-6 max-w-md text-center">
              <div className="text-3xl mb-2">😵</div>
              <p className="text-sm">질문을 불러오지 못했어요.</p>
              {error && <p className="mt-2 text-xs text-rose-300">{error}</p>}
              <Button variant="secondary" className="mt-4" onClick={() => location.reload()}>새로고침</Button>
            </Card>
          </div>
        );
      }

      const userChoiceUpper = myVotes[question.id] || null; // 'A' | 'B' | null
      const hasVoted = !!userChoiceUpper || resultsOnly;
      const qVotes = question.votes || { a: 0, b: 0 };
      const percentages = pct(qVotes.a, qVotes.b);
      const winningSide = qVotes.a === qVotes.b ? null : (qVotes.a > qVotes.b ? 'A' : 'B');
      const totalThisQ = qVotes.a + qVotes.b;

      return (
        <div className="min-h-screen relative">
          <div className="absolute inset-0 -z-10 overflow-hidden pointer-events-none">
            <div className="absolute -top-40 -left-40 w-[500px] h-[500px] rounded-full bg-rose-600/20 blur-[120px]" />
            <div className="absolute -bottom-40 -right-40 w-[500px] h-[500px] rounded-full bg-blue-600/20 blur-[120px]" />
            <div className="absolute top-1/3 left-1/2 -translate-x-1/2 w-[400px] h-[400px] rounded-full bg-fuchsia-600/10 blur-[120px]" />
          </div>

          <Header
            totalVotes={totalVotes}
            uniqueVoters={uniqueVoters}
            totalQuestions={totalQuestions}
            currentIndex={safeIdx}
            online={online}
          />

          <main className="w-full max-w-3xl mx-auto px-4 pb-8">
            <div key={`q-${question.id}`} className="animate-pop">
              <Card className="p-5 sm:p-6 mb-5">
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <Badge>
                    <span>🏷️</span>
                    <span>{question.category}</span>
                  </Badge>
                  <div className="text-xs text-slate-400">
                    이 질문 누적 <span className="font-bold text-white">{totalThisQ.toLocaleString()}</span>표
                  </div>
                </div>
                <h2 className="mt-3 text-center text-base sm:text-lg text-slate-300">
                  당신의 선택은?
                </h2>
                <div className="mt-1 text-center">
                  <span className="text-3xl sm:text-4xl font-black vs-gradient">VS</span>
                </div>
              </Card>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 relative">
                <ChoiceCard
                  choice={question.a}
                  side="left"
                  isSelected={userChoiceUpper === 'A'}
                  hasVoted={hasVoted}
                  percent={percentages.a}
                  voteCount={qVotes.a}
                  onClick={() => userChoiceUpper ? null : handleVote('A')}
                  isWinning={winningSide === 'A'}
                  busy={busy}
                />

                <div className="hidden sm:grid absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none">
                  <div className="w-12 h-12 rounded-full bg-slate-950 ring-2 ring-white/20 grid place-items-center text-sm font-black vs-gradient shadow-2xl">
                    VS
                  </div>
                </div>

                <ChoiceCard
                  choice={question.b}
                  side="right"
                  isSelected={userChoiceUpper === 'B'}
                  hasVoted={hasVoted}
                  percent={percentages.b}
                  voteCount={qVotes.b}
                  onClick={() => userChoiceUpper ? null : handleVote('B')}
                  isWinning={winningSide === 'B'}
                  busy={busy}
                />
              </div>

              {hasVoted && (
                <Card className="mt-5 p-5 animate-float-up">
                  <div className="flex items-center justify-between text-sm mb-2">
                    <div className="flex items-center gap-2">
                      <span className={`w-3 h-3 rounded-full ${colorOf(question.a.color).bar}`} />
                      <span className="font-semibold text-white">A</span>
                      <span className="text-slate-400">{qVotes.a.toLocaleString()}표</span>
                    </div>
                    <div className="text-slate-400">총 {totalThisQ.toLocaleString()}표</div>
                    <div className="flex items-center gap-2">
                      <span className="text-slate-400">{qVotes.b.toLocaleString()}표</span>
                      <span className="font-semibold text-white">B</span>
                      <span className={`w-3 h-3 rounded-full ${colorOf(question.b.color).bar}`} />
                    </div>
                  </div>
                  <div className="relative h-5 rounded-full overflow-hidden bg-slate-800 ring-1 ring-white/5">
                    <div
                      className={`absolute inset-y-0 left-0 ${colorOf(question.a.color).bar} bar-transition flex items-center justify-end pr-2`}
                      style={{ width: `${percentages.a}%` }}
                    >
                      {percentages.a >= 12 && (
                        <span className="text-xs font-black text-white drop-shadow tabular-nums">{percentages.a}%</span>
                      )}
                    </div>
                    <div
                      className={`absolute inset-y-0 right-0 ${colorOf(question.b.color).bar} bar-transition flex items-center justify-start pl-2`}
                      style={{ width: `${percentages.b}%` }}
                    >
                      {percentages.b >= 12 && (
                        <span className="text-xs font-black text-white drop-shadow tabular-nums">{percentages.b}%</span>
                      )}
                    </div>
                  </div>
                  <p className="mt-3 text-center text-xs text-slate-400">
                    실시간으로 투표가 들어오고 있어요 <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse ml-1 align-middle" />
                  </p>
                </Card>
              )}
            </div>

            <div className="mt-6 flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
              <Button
                variant="ghost"
                size="md"
                onClick={handlePrev}
                className="sm:w-auto"
                aria-label="이전 질문"
              >
                ← 이전
              </Button>

              <div className="flex-1 flex flex-col sm:flex-row gap-3 sm:justify-end">
                {userChoiceUpper ? (
                  <Button
                    variant="secondary"
                    size="md"
                    onClick={handleResetVote}
                    disabled={busy}
                    className="sm:w-auto"
                  >
                    🔄 투표 다시하기
                  </Button>
                ) : (
                  <Button
                    variant="ghost"
                    size="md"
                    onClick={toggleResultsOnly}
                    className="sm:w-auto"
                  >
                    {resultsOnly ? '👁️‍🗨️ 다시 가리기' : '👀 결과만 보기'}
                  </Button>
                )}

                <Button
                  variant="primary"
                  size="md"
                  onClick={handleNext}
                  className="sm:w-auto"
                >
                  다음 질문 →
                </Button>
              </div>
            </div>

            {!hasVoted && (
              <p className="mt-6 text-center text-xs text-slate-500">
                둘 중 하나를 골라 클릭하면 다른 사람들의 결과가 공개돼요
              </p>
            )}
            {!online && (
              <p className="mt-3 text-center text-xs text-rose-300">
                ⚠ 서버 연결이 끊겼어요. 자동으로 재시도 중…
              </p>
            )}
          </main>

          <Footer />
        </div>
      );
    }

    function App() { return <BalancePage />; }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
