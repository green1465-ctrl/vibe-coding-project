<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>익명 연봉 · 지출 비교 | SalaryCheck</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    html, body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
                   'Malgun Gothic', system-ui, sans-serif;
      background-color: #F5F7FA;
      color: #111827;
    }
    /* Hide number input spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] { -moz-appearance: textfield; }

    /* Smooth fade-in animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.4s ease-out both; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ========================================
    // API client (서버 + Supabase Postgres 연동)
    // ========================================
    const API = {
      async getCount() {
        const r = await fetch('/api/q6/count');
        if (!r.ok) throw new Error('count failed');
        return r.json();
      },
      async submit(data) {
        const r = await fetch('/api/q6/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (!r.ok) throw new Error('submit failed');
        return r.json();
      },
      async getStats(job, level, userSalary) {
        const qs = new URLSearchParams({ job, level });
        if (userSalary != null) qs.set('userSalary', String(userSalary));
        const r = await fetch(`/api/q6/stats?${qs.toString()}`);
        if (!r.ok) throw new Error('stats failed');
        return r.json();
      },
      async getDistribution(job, level) {
        const qs = new URLSearchParams({ job, level });
        const r = await fetch(`/api/q6/distribution?${qs.toString()}`);
        if (!r.ok) throw new Error('distribution failed');
        return r.json();
      },
    };

    // 표본이 이 개수 이상이면 "DB 통계 사용", 미만이면 시드 폴백
    const MIN_SAMPLES_FOR_REAL_STATS = 5;

    // ========================================
    // Constants & Seed Data (DB 표본이 부족할 때 폴백)
    // ========================================
    const STORAGE_KEY = 'salarycheck_submissions_v1';

    const JOB_OPTIONS = [
      { value: 'developer', label: '개발자' },
      { value: 'designer', label: '디자이너' },
      { value: 'pm', label: '기획자/PM' },
      { value: 'marketer', label: '마케터' },
      { value: 'sales', label: '영업' },
      { value: 'hr', label: 'HR' },
      { value: 'finance', label: '재무/회계' },
      { value: 'data', label: '데이터분석가' },
      { value: 'etc', label: '기타' },
    ];

    const LEVEL_OPTIONS = [
      { value: 'junior0', label: '신입 (0~1년)' },
      { value: 'junior',  label: '주니어 (2~4년)' },
      { value: 'middle',  label: '미들 (5~7년)' },
      { value: 'senior',  label: '시니어 (8~10년)' },
      { value: 'lead',    label: '리드 (10년+)' },
    ];

    const EXPENSE_CATEGORIES = [
      { key: 'food',      label: '식비',                     emoji: '🍱' },
      { key: 'housing',   label: '주거비 (월세/관리비/이자)', emoji: '🏠' },
      { key: 'transport', label: '교통비',                   emoji: '🚇' },
      { key: 'subscription', label: '구독료 (넷플릭스 등)',  emoji: '📺' },
      { key: 'shopping',  label: '쇼핑/의류',                emoji: '🛍️' },
      { key: 'culture',   label: '문화/여가',                emoji: '🎬' },
      { key: 'savings',   label: '저축/투자',                emoji: '💰' },
      { key: 'etc',       label: '기타',                     emoji: '✨' },
    ];

    // 직군별 base salary (만원, 신입 기준)
    const JOB_BASE_SALARY = {
      developer: 320, designer: 280, pm: 300, marketer: 270,
      sales: 290, hr: 260, finance: 280, data: 330, etc: 250,
    };

    // 연차별 multiplier
    const LEVEL_MULTIPLIER = {
      junior0: 1.00, junior: 1.30, middle: 1.65, senior: 2.05, lead: 2.45,
    };

    // 표준편차 비율 (평균 대비)
    const SIGMA_RATIO = 0.22;

    // 직군별 카테고리 지출 패턴 (월급 대비 비율, 신입 기준)
    const EXPENSE_PATTERN = {
      developer:  { food: 0.13, housing: 0.28, transport: 0.05, subscription: 0.04, shopping: 0.08, culture: 0.07, savings: 0.20, etc: 0.05 },
      designer:   { food: 0.14, housing: 0.30, transport: 0.05, subscription: 0.05, shopping: 0.12, culture: 0.09, savings: 0.13, etc: 0.05 },
      pm:         { food: 0.13, housing: 0.29, transport: 0.05, subscription: 0.04, shopping: 0.09, culture: 0.08, savings: 0.18, etc: 0.05 },
      marketer:   { food: 0.14, housing: 0.30, transport: 0.06, subscription: 0.04, shopping: 0.11, culture: 0.09, savings: 0.14, etc: 0.05 },
      sales:      { food: 0.15, housing: 0.28, transport: 0.08, subscription: 0.03, shopping: 0.10, culture: 0.08, savings: 0.16, etc: 0.05 },
      hr:         { food: 0.13, housing: 0.30, transport: 0.06, subscription: 0.03, shopping: 0.10, culture: 0.07, savings: 0.18, etc: 0.05 },
      finance:    { food: 0.12, housing: 0.28, transport: 0.05, subscription: 0.03, shopping: 0.08, culture: 0.07, savings: 0.25, etc: 0.05 },
      data:       { food: 0.13, housing: 0.28, transport: 0.05, subscription: 0.05, shopping: 0.08, culture: 0.07, savings: 0.22, etc: 0.05 },
      etc:        { food: 0.14, housing: 0.30, transport: 0.06, subscription: 0.04, shopping: 0.09, culture: 0.08, savings: 0.16, etc: 0.05 },
    };

    // 연차별 지출 비율 보정 (시니어가 될수록 저축률 증가)
    const LEVEL_SAVINGS_BOOST = {
      junior0: 0, junior: 0.02, middle: 0.04, senior: 0.06, lead: 0.08,
    };

    // ========================================
    // Statistics Helpers
    // ========================================
    function getMeanSalary(job, level) {
      return JOB_BASE_SALARY[job] * LEVEL_MULTIPLIER[level];
    }

    function getStdSalary(job, level) {
      return getMeanSalary(job, level) * SIGMA_RATIO;
    }

    function getMeanExpenses(job, level) {
      const meanSalary = getMeanSalary(job, level);
      const pattern = { ...EXPENSE_PATTERN[job] };
      // 연차에 따른 저축 boost (다른 카테고리에서 약간 차감)
      const boost = LEVEL_SAVINGS_BOOST[level];
      if (boost > 0) {
        pattern.savings += boost;
        pattern.shopping = Math.max(0.05, pattern.shopping - boost * 0.4);
        pattern.culture  = Math.max(0.04, pattern.culture  - boost * 0.3);
        pattern.etc      = Math.max(0.03, pattern.etc      - boost * 0.3);
      }
      const result = {};
      EXPENSE_CATEGORIES.forEach(c => {
        result[c.key] = Math.round(meanSalary * pattern[c.key]);
      });
      return result;
    }

    // 표준 정규분포 CDF (Abramowitz & Stegun approximation)
    function normalCdf(z) {
      const t = 1 / (1 + 0.2316419 * Math.abs(z));
      const d = 0.3989422804014327 * Math.exp(-z * z / 2);
      const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      return z > 0 ? 1 - p : p;
    }

    // 본인 월급 → 상위 % (월급이 높을수록 "상위"이므로 1 - cdf)
    function percentileFromSalary(salary, mean, std) {
      if (std <= 0) return 50;
      const z = (salary - mean) / std;
      const cdf = normalCdf(z);          // 본인 이하 비율
      const topPercent = (1 - cdf) * 100; // 상위 %
      return Math.max(0.1, Math.min(99.9, topPercent));
    }

    // 정규분포 PDF (분포 차트 곡선용)
    function normalPdf(x, mean, std) {
      const z = (x - mean) / std;
      return Math.exp(-z * z / 2) / (std * Math.sqrt(2 * Math.PI));
    }

    // ========================================
    // Format Helpers
    // ========================================
    const fmt = n => Number(n || 0).toLocaleString('ko-KR');
    const fmtMan = n => `${fmt(Math.round(n))}만원`;

    // ========================================
    // Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, type = 'button', children, className = '' }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-lg transition-all duration-150 focus:outline-none focus:ring-4 disabled:opacity-50 disabled:cursor-not-allowed';
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-5 py-2.5 text-sm', lg: 'px-6 py-3.5 text-base' };
      const variants = {
        primary:   'bg-blue-600 text-white hover:bg-blue-700 active:bg-blue-800 focus:ring-blue-100 shadow-sm',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-slate-100',
        ghost:     'bg-transparent text-blue-600 hover:bg-blue-50 focus:ring-blue-100',
        danger:    'bg-red-600 text-white hover:bg-red-700 focus:ring-red-100',
      };
      return (
        <button type={type} disabled={disabled} onClick={onClick}
                className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
          {children}
        </button>
      );
    }

    function Label({ children, required, hint }) {
      return (
        <div className="flex items-baseline justify-between mb-1.5">
          <label className="text-sm font-semibold text-slate-700">
            {children}{required && <span className="text-red-500 ml-0.5">*</span>}
          </label>
          {hint && <span className="text-xs text-slate-400">{hint}</span>}
        </div>
      );
    }

    function Select({ value, onChange, options, placeholder, className = '' }) {
      return (
        <div className={`relative ${className}`}>
          <select value={value} onChange={onChange}
            className="w-full appearance-none bg-white border border-slate-300 rounded-lg px-3.5 py-2.5 pr-10 text-sm text-slate-800
                       focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition">
            {placeholder && <option value="">{placeholder}</option>}
            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
          <svg className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"
               viewBox="0 0 20 20" fill="currentColor">
            <path fillRule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.06l3.71-3.83a.75.75 0 111.08 1.04l-4.25 4.39a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clipRule="evenodd" />
          </svg>
        </div>
      );
    }

    function MoneyInput({ value, onChange, placeholder, suffix = '만원' }) {
      return (
        <div className="relative">
          <input type="number" min="0" step="1" inputMode="numeric" value={value}
            onChange={e => onChange(e.target.value)} placeholder={placeholder}
            className="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2.5 pr-12 text-sm text-right text-slate-800
                       focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition" />
          <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-sm text-slate-500 pointer-events-none">{suffix}</span>
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-[0_2px_12px_rgba(15,23,42,0.06)] border border-slate-100 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, color = 'blue' }) {
      const colors = {
        blue:  'bg-blue-50 text-blue-700 border-blue-100',
        green: 'bg-emerald-50 text-emerald-700 border-emerald-100',
        red:   'bg-red-50 text-red-700 border-red-100',
        gray:  'bg-slate-100 text-slate-600 border-slate-200',
      };
      return (
        <span className={`inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold border ${colors[color]}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // Layout: Header
    // ========================================
    function Header({ submissionCount }) {
      return (
        <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
          <div className="max-w-5xl mx-auto px-5 lg:px-8 h-16 flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                S
              </div>
              <div className="leading-tight">
                <div className="text-base font-bold text-slate-900 tracking-tight">SalaryCheck</div>
                <div className="text-[11px] text-slate-500">익명 연봉 · 지출 비교</div>
              </div>
            </div>
            <div className="hidden sm:flex items-center gap-2">
              <Badge color="blue">
                <svg className="w-3 h-3 mr-1" viewBox="0 0 20 20" fill="currentColor">
                  <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                </svg>
                100% 익명
              </Badge>
              <Badge color="gray">누적 {fmt(submissionCount)}명 참여</Badge>
            </div>
          </div>
        </header>
      );
    }

    // ========================================
    // Page: Input Form
    // ========================================
    const initialForm = {
      job: 'developer',
      level: 'junior',
      salary: '',
      expenses: EXPENSE_CATEGORIES.reduce((acc, c) => ({ ...acc, [c.key]: '' }), {}),
    };

    function InputFormPage({ submissionCount, onSubmit, serverError }) {
      const [form, setForm] = useState(initialForm);
      const [error, setError] = useState('');

      useEffect(() => { if (serverError) setError(serverError); }, [serverError]);

      const totalExpense = useMemo(() => {
        return EXPENSE_CATEGORIES.reduce((sum, c) => sum + Number(form.expenses[c.key] || 0), 0);
      }, [form.expenses]);

      const salaryNum = Number(form.salary || 0);
      const remaining = salaryNum - totalExpense;
      const savingsRate = salaryNum > 0 ? (remaining / salaryNum) * 100 : 0;

      const updateExpense = (key, value) => {
        setForm(f => ({ ...f, expenses: { ...f.expenses, [key]: value } }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.job || !form.level) { setError('직군과 연차를 선택해주세요.'); return; }
        if (!form.salary || salaryNum <= 0) { setError('월급(세후)을 정확히 입력해주세요.'); return; }
        const filledExpenses = EXPENSE_CATEGORIES.filter(c => Number(form.expenses[c.key] || 0) > 0).length;
        if (filledExpenses === 0) { setError('월 지출 항목을 1개 이상 입력해주세요.'); return; }
        setError('');
        onSubmit({
          job: form.job,
          level: form.level,
          salary: salaryNum,
          expenses: EXPENSE_CATEGORIES.reduce((acc, c) => ({ ...acc, [c.key]: Number(form.expenses[c.key] || 0) }), {}),
        });
      };

      const handleReset = () => {
        setForm(initialForm);
        setError('');
      };

      return (
        <div className="max-w-3xl mx-auto px-5 lg:px-0 py-8 lg:py-12 fade-up">
          {/* Hero */}
          <div className="mb-8">
            <div className="inline-flex items-center gap-1.5 px-3 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-full mb-4 border border-blue-100">
              <span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
              완전 익명 · 데이터 수집 없음
            </div>
            <h1 className="text-2xl lg:text-3xl font-bold text-slate-900 leading-snug tracking-tight">
              내 월급과 지출,<br className="lg:hidden" /> 같은 직군에서 어디쯤일까?
            </h1>
            <p className="mt-3 text-slate-500 text-sm lg:text-base leading-relaxed">
              직군과 연차, 월급, 카테고리별 지출을 입력하면<br className="hidden md:inline" />
              전체 분포 안에서 내 위치(상위 %)와 카테고리별 평균을 비교해드려요.
            </p>
          </div>

          <form onSubmit={handleSubmit}>
            {/* Profile Card */}
            <Card className="p-6 lg:p-8 mb-5">
              <div className="flex items-center gap-2 mb-5">
                <div className="w-7 h-7 rounded-md bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold">1</div>
                <h2 className="text-base font-bold text-slate-900">내 프로필</h2>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                  <Label required>직군</Label>
                  <Select value={form.job} onChange={e => setForm({ ...form, job: e.target.value })} options={JOB_OPTIONS} />
                </div>
                <div>
                  <Label required>연차</Label>
                  <Select value={form.level} onChange={e => setForm({ ...form, level: e.target.value })} options={LEVEL_OPTIONS} />
                </div>
              </div>
            </Card>

            {/* Salary Card */}
            <Card className="p-6 lg:p-8 mb-5">
              <div className="flex items-center gap-2 mb-5">
                <div className="w-7 h-7 rounded-md bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold">2</div>
                <h2 className="text-base font-bold text-slate-900">월급 (세후 실수령액)</h2>
              </div>
              <div className="md:max-w-sm">
                <Label required hint="만원 단위 (예: 350)">월 실수령액</Label>
                <MoneyInput value={form.salary} onChange={v => setForm({ ...form, salary: v })} placeholder="350" />
                {salaryNum > 0 && (
                  <p className="mt-2 text-xs text-slate-500">
                    월 <span className="font-semibold text-slate-700">{fmtMan(salaryNum)}</span>
                    {' · '}연환산 약 <span className="font-semibold text-slate-700">{fmtMan(salaryNum * 12)}</span>
                  </p>
                )}
              </div>
            </Card>

            {/* Expenses Card */}
            <Card className="p-6 lg:p-8 mb-5">
              <div className="flex items-center justify-between mb-5">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-md bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold">3</div>
                  <h2 className="text-base font-bold text-slate-900">카테고리별 월 지출</h2>
                </div>
                <span className="text-xs text-slate-400 hidden sm:inline">모르는 항목은 비워두셔도 돼요</span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-5 gap-y-4">
                {EXPENSE_CATEGORIES.map(c => (
                  <div key={c.key}>
                    <Label>
                      <span className="mr-1">{c.emoji}</span>{c.label}
                    </Label>
                    <MoneyInput value={form.expenses[c.key]} onChange={v => updateExpense(c.key, v)} placeholder="0" />
                  </div>
                ))}
              </div>

              {/* Summary strip */}
              <div className="mt-6 pt-5 border-t border-slate-100 grid grid-cols-3 gap-3 text-center">
                <div>
                  <div className="text-[11px] text-slate-500 mb-1">총 지출</div>
                  <div className="text-sm font-bold text-slate-900">{fmtMan(totalExpense)}</div>
                </div>
                <div>
                  <div className="text-[11px] text-slate-500 mb-1">잔여</div>
                  <div className={`text-sm font-bold ${remaining >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                    {remaining >= 0 ? '+' : ''}{fmtMan(remaining)}
                  </div>
                </div>
                <div>
                  <div className="text-[11px] text-slate-500 mb-1">저축률</div>
                  <div className={`text-sm font-bold ${savingsRate >= 0 ? 'text-blue-600' : 'text-red-600'}`}>
                    {salaryNum > 0 ? savingsRate.toFixed(1) : '0.0'}%
                  </div>
                </div>
              </div>
            </Card>

            {error && (

    // ========================================
    // Charts (Chart.js)
    // ========================================
    function SalaryDistributionChart({ mean, std, userSalary }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();

        // Build curve points
        const minX = Math.max(0, mean - 3.2 * std);
        const maxX = mean + 3.2 * std;
        const steps = 60;
        const labels = [];
        const data = [];
        for (let i = 0; i <= steps; i++) {
          const x = minX + (maxX - minX) * (i / steps);
          labels.push(x);
          data.push(normalPdf(x, mean, std));
        }
        const peak = Math.max(...data);
        const userY = normalPdf(userSalary, mean, std);

        chartRef.current = new Chart(canvasRef.current, {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: '같은 직군 · 연차 분포',
                data,
                borderColor: '#2563EB',
                backgroundColor: 'rgba(37, 99, 235, 0.12)',
                fill: true,
                tension: 0.35,
                pointRadius: 0,
                borderWidth: 2,
              },
              {
                label: '내 월급',
                data: labels.map(x => Math.abs(x - userSalary) < (maxX - minX) / steps / 2 ? peak * 1.05 : null),
                borderColor: '#DC2626',
                backgroundColor: '#DC2626',
                pointRadius: 0,
                showLine: false,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  title: (items) => `${fmt(Math.round(Number(items[0].label)))}만원`,
                  label: () => '',
                },
                displayColors: false,
                backgroundColor: '#0F172A',
              },
            },
            scales: {
              x: {
                type: 'linear',
                min: minX, max: maxX,
                ticks: {
                  callback: v => `${fmt(Math.round(v))}만`,
                  color: '#64748B', font: { size: 11 },
                  maxTicksLimit: 6,
                },
                grid: { display: false },
                border: { color: '#E2E8F0' },
              },
              y: { display: false, beginAtZero: true, max: peak * 1.15 },
            },
          },
          plugins: [{
            id: 'userMarker',
            afterDatasetsDraw(chart) {
              const { ctx, chartArea, scales } = chart;
              const x = scales.x.getPixelForValue(userSalary);
              if (x < chartArea.left || x > chartArea.right) return;
              // Vertical line
              ctx.save();
              ctx.strokeStyle = '#DC2626';
              ctx.lineWidth = 2;
              ctx.setLineDash([4, 4]);
              ctx.beginPath();
              ctx.moveTo(x, chartArea.top + 8);
              ctx.lineTo(x, chartArea.bottom);
              ctx.stroke();
              ctx.setLineDash([]);
              // Marker pin
              ctx.fillStyle = '#DC2626';
              ctx.beginPath();
              ctx.moveTo(x, chartArea.top - 2);
              ctx.lineTo(x - 6, chartArea.top - 12);
              ctx.lineTo(x + 6, chartArea.top - 12);
              ctx.closePath();
              ctx.fill();
              // Label
              ctx.fillStyle = '#DC2626';
              ctx.font = 'bold 11px Pretendard, sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(`내 월급 ${fmt(Math.round(userSalary))}만원`, x, chartArea.top - 16);
              ctx.restore();
            }
          }],
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [mean, std, userSalary]);

      return (
        <div className="relative h-64">
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

      return (
        <footer className="border-t border-slate-200 bg-white mt-12">
          <div className="max-w-5xl mx-auto px-5 lg:px-8 py-6 text-xs text-slate-500 flex flex-col sm:flex-row justify-between gap-2">
            <div>© 2026 SalaryCheck — 익명 연봉 · 지출 비교 서비스</div>
            <div className="flex gap-4">
              <span>익명 데이터 · Postgres 저장</span>
              <span className="text-slate-400">·</span>
              <span>참고용 통계 (실제 시장과 다를 수 있음)</span>
            </div>
          </div>
        </footer>
      );
    }

    // ========================================
    // App Root
    // ========================================
    function App() {
      const [view, setView] = useState('form'); // 'form' | 'result' | 'submitting'
      const [currentResult, setCurrentResult] = useState(null);
      const [submissionCount, setSubmissionCount] = useState(0); // DB 의 실제 누적
      const [submitError, setSubmitError] = useState('');

      // 페이지 로드 시 DB 누적 카운트 가져오기
      const refreshCount = useCallback(async () => {
        try {
          const { total } = await API.getCount();
          setSubmissionCount(total);
        } catch {
          // 서버 다운 등 → 0 유지
        }
      }, []);

      useEffect(() => { refreshCount(); }, [refreshCount]);

      const handleSubmit = useCallback(async (data) => {
        setSubmitError('');
        setView('submitting');
        try {
          await API.submit(data);
          setCurrentResult(data);
          setView('result');
          refreshCount(); // 카운트 갱신
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          setSubmitError('서버에 저장하지 못했어요. 잠시 후 다시 시도해주세요.');
          setView('form');
        }
      }, [refreshCount]);

      const handleReset = useCallback(() => {
        setView('form');
        setCurrentResult(null);
        setSubmitError('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, []);

      return (
        <div className="min-h-screen flex flex-col">
          <Header submissionCount={submissionCount} />
          <main className="flex-1">
            {view === 'form' && (
              <InputFormPage
                submissionCount={submissionCount}
                onSubmit={handleSubmit}
                serverError={submitError}
              />
            )}
            {view === 'submitting' && (
              <div className="max-w-3xl mx-auto px-5 py-20 text-center fade-up">
                <div className="inline-block w-10 h-10 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                <p className="text-slate-600 text-sm">데이터 저장 중...</p>
              </div>
            )}
            {view === 'result' && currentResult && (
              <ResultPage data={currentResult} submissionCount={submissionCount} onReset={handleReset} />
            )}
          </main>
          <Footer />
        </div>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
