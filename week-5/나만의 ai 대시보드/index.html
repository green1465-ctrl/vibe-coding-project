<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 AI 대시보드</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            ink: {
              900: '#1a1a1f',
              700: '#3a3a44',
              500: '#6b6b78',
              400: '#9aa0ad',
              300: '#c8ccd6',
              200: '#e5e7ee',
              100: '#f3f4f8',
              50: '#fafbfd',
            },
            lavender: {
              50: '#f7f4ff',
              100: '#efe9ff',
              200: '#dccffe',
              300: '#c2adfb',
              400: '#a586f5',
              500: '#8a64ec',
              600: '#7048d9',
            },
            peach: {
              50: '#fff5f0',
              100: '#ffe7da',
              200: '#ffcfb6',
              300: '#ffb38a',
              400: '#ff9866',
              500: '#f57a47',
            },
            mint: {
              50: '#eefaf5',
              100: '#d6f3e5',
              500: '#3ec39a',
            },
          },
          boxShadow: {
            'soft': '0 1px 2px rgba(20, 20, 30, 0.04), 0 8px 24px rgba(20, 20, 30, 0.05)',
            'softer': '0 1px 1px rgba(20, 20, 30, 0.03), 0 2px 8px rgba(20, 20, 30, 0.04)',
            'glow': '0 10px 40px -10px rgba(138, 100, 236, 0.35)',
          },
          borderRadius: {
            '2xl': '1.25rem',
            '3xl': '1.75rem',
          },
        }
      }
    }
  </script>
  <style>
    html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background:
      radial-gradient(1200px 600px at 10% -10%, #efe9ff 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 0%, #ffe7da 0%, transparent 55%),
      #fafbfd;
      min-height: 100vh;
    }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #dcdfe7; border-radius: 999px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .35s ease-out both; }
    @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    .skeleton { background: linear-gradient(90deg, #eef0f5 0%, #f6f7fb 50%, #eef0f5 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: .75rem; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body class="text-ink-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

    // ========================================
    // Constants
    // ========================================
    const SESSION_KEY = 'aidash.session.v1';
    const TODOS_KEY = 'aidash.todos.v1';
    const NOTES_KEY = 'aidash.notes.v1';

    // ========================================
    // Utilities
    // ========================================
    const formatKRDate = (d) => {
      const date = new Date(d);
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 (${days[date.getDay()]})`;
    };

    const formatKRW = (n) => `₩ ${(n || 0).toLocaleString('ko-KR')}`;

    // 'YYYY-MM-DD' → 오늘 기준 D-day (양수: 미래, 0: 오늘, 음수: 과거)
    const dDayFrom = (isoDate) => {
      if (!isoDate) return null;
      const today = new Date(); today.setHours(0,0,0,0);
      const target = new Date(isoDate); target.setHours(0,0,0,0);
      return Math.round((target - today) / 86400000);
    };

    const dDayLabel = (isoDate) => {
      const d = dDayFrom(isoDate);
      if (d == null) return '';
      if (d === 0) return 'D-Day';
      if (d > 0) return `D-${d}`;
      return `D+${Math.abs(d)}`;
    };

    const useLocalStorage = (key, initial) => {
      const [value, setValue] = useState(() => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : initial;
        } catch { return initial; }
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }, [key, value]);
      return [value, setValue];
    };

    // ========================================
    // Design System
    // ========================================
    const Button = ({ variant = 'primary', size = 'md', className = '', children, ...rest }) => {
      const base = 'inline-flex items-center justify-center gap-1.5 font-medium rounded-xl transition-all duration-150 active:scale-[.98] disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-lavender-300';
      const sizes = { sm: 'h-8 px-3 text-xs', md: 'h-10 px-4 text-sm', lg: 'h-12 px-5 text-[15px]' };
      const variants = {
        primary: 'bg-ink-900 text-white hover:bg-ink-700 shadow-softer',
        accent:  'bg-lavender-500 text-white hover:bg-lavender-600 shadow-glow',
        secondary: 'bg-white text-ink-700 border border-ink-200 hover:bg-ink-50',
        ghost: 'text-ink-700 hover:bg-ink-100',
        danger: 'text-red-600 hover:bg-red-50',
      };
      return <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...rest}>{children}</button>;
    };

    const Input = ({ label, error, className = '', id, ...rest }) => {
      const inputId = id || `in-${Math.random().toString(36).slice(2, 8)}`;
      return (
        <div className={`flex flex-col gap-1.5 ${className}`}>
          {label && <label htmlFor={inputId} className="text-xs font-medium text-ink-500">{label}</label>}
          <input
            id={inputId}
            className={`h-11 px-3.5 text-sm bg-white border rounded-xl outline-none transition-colors placeholder:text-ink-400
              ${error ? 'border-red-300 focus:border-red-400 focus:ring-2 focus:ring-red-100'
                     : 'border-ink-200 focus:border-lavender-300 focus:ring-2 focus:ring-lavender-100'}`}
            {...rest}
          />
          {error && <span className="text-xs text-red-500">{error}</span>}
        </div>
      );
    };

    const Card = ({ className = '', children }) => (
      <div className={`bg-white border border-ink-100 rounded-3xl shadow-soft ${className}`}>{children}</div>
    );

    const Badge = ({ tone = 'neutral', children }) => {
      const tones = {
        neutral: 'bg-ink-100 text-ink-700',
        lavender: 'bg-lavender-100 text-lavender-600',
        peach: 'bg-peach-100 text-peach-500',
        mint: 'bg-mint-100 text-mint-500',
        ink: 'bg-ink-900 text-white',
        red: 'bg-red-50 text-red-500',
      };
      return <span className={`inline-flex items-center px-2.5 h-6 rounded-full text-[11px] font-medium tracking-wide ${tones[tone]}`}>{children}</span>;
    };

    const Icon = ({ name, className = 'w-4 h-4' }) => {
      const paths = {
        sparkle: <path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3zM18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9L18 14z" />,
        plus: <path d="M12 5v14M5 12h14" />,
        check: <path d="M5 12l4 4L19 7" />,
        trash: <path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-7 0v12a2 2 0 002 2h6a2 2 0 002-2V7" />,
        logout: <path d="M15 17l5-5-5-5M20 12H9M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />,
        folder: <path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />,
        money: <path d="M12 1v22M17 5H9.5a3.5 3.5 0 100 7h5a3.5 3.5 0 110 7H6" />,
        clipboard: <path d="M9 4h6a1 1 0 011 1v1h2a1 1 0 011 1v13a1 1 0 01-1 1H6a1 1 0 01-1-1V7a1 1 0 011-1h2V5a1 1 0 011-1z" />,
        clock: <><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></>,
        external: <><path d="M14 5h5v5" /><path d="M19 5l-9 9" /><path d="M19 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6" /></>,
        arrowDown: <path d="M12 5v14M5 12l7 7 7-7" />,
        arrowUp: <path d="M12 19V5M5 12l7-7 7 7" />,
        refresh: <><path d="M3 12a9 9 0 0115.5-6.3L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 01-15.5 6.3L3 16" /><path d="M3 21v-5h5" /></>,
        chart: <><path d="M3 3v18h18" /><path d="M7 14l3-3 4 4 5-7" /></>,
      };
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name]}
        </svg>
      );
    };

    // ========================================
    // Auth
    // ========================================
    const AuthContext = createContext(null);

    const AuthProvider = ({ children }) => {
      const [session, setSession] = useState(() => {
        try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
        catch { return null; }
      });

      const login = useCallback(async (email, password) => {
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok) {
            const s = { email: data.email, loggedInAt: new Date().toISOString() };
            localStorage.setItem(SESSION_KEY, JSON.stringify(s));
            setSession(s);
            return { ok: true };
          }
          return { ok: false, error: data.error || '로그인에 실패했습니다.' };
        } catch (err) {
          return { ok: false, error: '서버에 연결할 수 없습니다.' };
        }
      }, []);

      const logout = useCallback(() => {
        localStorage.removeItem(SESSION_KEY);
        setSession(null);
      }, []);

      return <AuthContext.Provider value={{ session, login, logout }}>{children}</AuthContext.Provider>;
    };

    const useAuth = () => useContext(AuthContext);

    // ========================================
    // Login
    // ========================================
    const LoginPage = () => {
      const { login } = useAuth();
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const onSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setSubmitting(true);
        const res = await login(email, password);
        if (!res.ok) setError(res.error);
        setSubmitting(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-5 py-10">
          <div className="w-full max-w-[420px] fade-up">
            <div className="flex items-center gap-2 mb-8 justify-center">
              <div className="w-9 h-9 rounded-2xl bg-ink-900 text-white flex items-center justify-center shadow-softer">
                <Icon name="sparkle" className="w-5 h-5" />
              </div>
              <span className="text-[15px] font-semibold tracking-tight">AI Dashboard</span>
            </div>

            <Card className="p-7 sm:p-8">
              <h1 className="text-[22px] sm:text-2xl font-semibold tracking-tight">다시 만나서 반가워요</h1>
              <p className="text-sm text-ink-500 mt-1.5">이메일로 로그인하고 오늘의 작업을 시작해보세요.</p>

              <form onSubmit={onSubmit} className="mt-6 flex flex-col gap-4">
                <Input label="이메일" type="email" autoComplete="email" placeholder="you@example.com"
                  value={email} onChange={(e) => setEmail(e.target.value)} required />
                <Input label="비밀번호" type="password" autoComplete="current-password" placeholder="••••••••"
                  value={password} onChange={(e) => setPassword(e.target.value)} error={error || undefined} required />
                <Button type="submit" variant="accent" size="lg" disabled={submitting} className="mt-1">
                  {submitting ? '로그인 중…' : '로그인'}
                </Button>
              </form>
            </Card>

            <p className="text-center text-xs text-ink-400 mt-6">
              © {new Date().getFullYear()} AI Dashboard · 미니멀 워크스페이스
            </p>
          </div>
        </div>
      );
    };

    // ========================================
    // Data hooks (Notion + Postgres)
    // ========================================
    const useProjects = () => {
      const [data, setData] = useState({ projects: [], loading: true, error: null, fetched_at: null });
      useEffect(() => {
        let alive = true;
        fetch('/projects.json')
          .then(r => { if (!r.ok) throw new Error('projects.json 로드 실패'); return r.json(); })
          .then(json => { if (alive) setData({ projects: json.projects || [], loading: false, error: null, fetched_at: json.fetched_at }); })
          .catch(err => { if (alive) setData({ projects: [], loading: false, error: err.message, fetched_at: null }); });
        return () => { alive = false; };
      }, []);
      return data;
    };

    const useBudget = () => {
      const [state, setState] = useState({ summary: null, recent: [], loading: true, error: null });
      const refresh = useCallback(() => {
        setState(s => ({ ...s, loading: true, error: null }));
        Promise.all([
          fetch('/api/budget/summary').then(r => { if (!r.ok) throw new Error('summary 실패'); return r.json(); }),
          fetch('/api/budget/recent?limit=5').then(r => { if (!r.ok) throw new Error('recent 실패'); return r.json(); }),
        ])
          .then(([summary, recent]) => setState({ summary, recent: recent.transactions || [], loading: false, error: null }))
          .catch(err => setState(s => ({ ...s, loading: false, error: err.message })));
      }, []);
      useEffect(() => { refresh(); }, [refresh]);
      return { ...state, refresh };
    };

    // ========================================
    // Header
    // ========================================
    const DashboardHeader = ({ email, onLogout }) => (
      <header className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
          <div className="flex items-center gap-2 text-xs text-ink-500 mb-1.5">
            <Icon name="clock" className="w-3.5 h-3.5" />
            <span>{formatKRDate(new Date())}</span>
          </div>
          <h1 className="text-2xl sm:text-[28px] font-semibold tracking-tight">
            안녕하세요 <span className="bg-gradient-to-r from-lavender-500 to-peach-400 bg-clip-text text-transparent">✨</span>
          </h1>
          <p className="text-sm text-ink-500 mt-1">{email}</p>
        </div>
        <div className="flex items-center gap-2">
          <div className="hidden sm:flex items-center gap-2 px-3 h-10 rounded-xl bg-white border border-ink-100 shadow-softer">
            <span className="w-2 h-2 rounded-full bg-mint-500"></span>
            <span className="text-xs text-ink-700 font-medium">Notion · Postgres 연결됨</span>
          </div>
          <Button variant="secondary" onClick={onLogout}><Icon name="logout" /> 로그아웃</Button>
        </div>
      </header>
    );

    // ========================================
    // Summary cards
    // ========================================
    const StatCard = ({ icon, label, value, sub, tone, loading }) => {
      const tones = {
        lavender: 'bg-lavender-100 text-lavender-600',
        peach:    'bg-peach-100 text-peach-500',
        mint:     'bg-mint-100 text-mint-500',
        ink:      'bg-ink-100 text-ink-700',
      };
      return (
        <Card className="p-5">
          <div className={`w-10 h-10 rounded-2xl flex items-center justify-center ${tones[tone]}`}>
            <Icon name={icon} className="w-5 h-5" />
          </div>
          <div className="mt-5">
            <div className="text-xs text-ink-500 font-medium">{label}</div>
            {loading
              ? <div className="mt-1.5 skeleton h-7 w-20"></div>
              : <div className="mt-1 text-[26px] font-semibold tracking-tight leading-none">{value}</div>}
            {sub && <div className="mt-2 text-xs text-ink-400">{sub}</div>}
          </div>
        </Card>
      );
    };

    const SummaryGrid = ({ projects, projectsLoading, budget, budgetLoading }) => {
      const stats = useMemo(() => {
        const inProgress = projects.filter(p => p.status === '진행 중' || p.status === '계획 중').length;
        const done = projects.filter(p => p.status === '완료').length;
        // 마감 = 진행/계획 중 + 시작일 또는 종료일이 미래인 것
        const upcoming = projects.filter(p => {
          if (p.status === '완료' || p.status === '취소') return false;
          const target = p.end || p.start;
          const d = dDayFrom(target);
          return d != null && d >= 0;
        });
        const nearestDeadline = upcoming
          .map(p => ({ p, d: dDayFrom(p.end || p.start) }))
          .filter(x => x.d != null)
          .sort((a, b) => a.d - b.d)[0];
        return { inProgress, done, upcomingCount: upcoming.length, nearest: nearestDeadline };
      }, [projects]);

      const expense = budget?.expense ?? 0;
      const income = budget?.income ?? 0;
      const monthLabel = budget ? `${budget.month}월 기준` : '이번 달';

      return (
        <section className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <StatCard icon="folder" label="진행중인 프로젝트"
            value={stats.inProgress}
            sub={`완료 ${stats.done}건 · Notion DB`}
            tone="lavender" loading={projectsLoading} />
          <StatCard icon="money" label={`이번 달 지출 (${monthLabel})`}
            value={formatKRW(expense)}
            sub={income > 0 ? `수입 ${formatKRW(income)}` : '실시간 가계부 DB'}
            tone="peach" loading={budgetLoading} />
          <StatCard icon="check" label="완료한 프로젝트"
            value={stats.done}
            sub={`총 ${projects.length}건 중`}
            tone="mint" loading={projectsLoading} />
          <StatCard icon="clipboard" label="다가오는 마감"
            value={stats.upcomingCount}
            sub={stats.nearest ? `가장 가까운 ${dDayLabel(stats.nearest.p.end || stats.nearest.p.start)}` : '마감 없음'}
            tone="ink" loading={projectsLoading} />
        </section>
      );
    };

    // ========================================
    // Todo widget (LocalStorage)
    // ========================================
    const TodoWidget = ({ todos, setTodos }) => {
      const [text, setText] = useState('');
      const inputRef = useRef(null);

      const add = (e) => {
        e?.preventDefault();
        const trimmed = text.trim();
        if (!trimmed) return;
        setTodos([{ id: Date.now(), text: trimmed, done: false }, ...todos]);
        setText('');
        inputRef.current?.focus();
      };
      const toggle = (id) => setTodos(todos.map(t => t.id === id ? { ...t, done: !t.done } : t));
      const remove = (id) => setTodos(todos.filter(t => t.id !== id));

      const remaining = todos.filter(t => !t.done).length;

      return (
        <Card className="p-6 flex flex-col h-full">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h2 className="text-[15px] font-semibold tracking-tight">오늘의 할 일</h2>
              <p className="text-xs text-ink-500 mt-0.5">남은 작업 {remaining}개</p>
            </div>
            <Badge tone="lavender">{todos.length}</Badge>
          </div>

          <form onSubmit={add} className="flex gap-2 mb-4">
            <input ref={inputRef} value={text} onChange={(e) => setText(e.target.value)}
              placeholder="새 작업 추가…"
              className="flex-1 h-10 px-3.5 text-sm bg-ink-50 border border-ink-100 rounded-xl outline-none focus:bg-white focus:border-lavender-300 focus:ring-2 focus:ring-lavender-100 transition placeholder:text-ink-400" />
            <Button type="submit" variant="accent" size="md" disabled={!text.trim()}>
              <Icon name="plus" /> 추가
            </Button>
          </form>

          <ul className="flex-1 flex flex-col gap-1.5 overflow-y-auto scrollbar-thin pr-1 max-h-[280px] min-h-[120px]">
            {todos.length === 0 && (
              <li className="text-sm text-ink-400 text-center py-10">
                아직 할 일이 없어요. 첫 번째 작업을 추가해 보세요 ✨
              </li>
            )}
            {todos.map(t => (
              <li key={t.id} className="group flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-ink-50 transition">
                <button onClick={() => toggle(t.id)} aria-label={t.done ? '완료 취소' : '완료 표시'}
                  className={`w-5 h-5 rounded-md border flex items-center justify-center transition shrink-0
                    ${t.done ? 'bg-lavender-500 border-lavender-500 text-white' : 'border-ink-300 hover:border-lavender-400'}`}>
                  {t.done && <Icon name="check" className="w-3.5 h-3.5" />}
                </button>
                <span className={`flex-1 text-sm ${t.done ? 'line-through text-ink-400' : 'text-ink-900'}`}>{t.text}</span>
                <button onClick={() => remove(t.id)} aria-label="삭제"
                  className="opacity-0 group-hover:opacity-100 text-ink-400 hover:text-red-500 transition">
                  <Icon name="trash" />
                </button>
              </li>
            ))}
          </ul>
        </Card>
      );
    };

    // ========================================
    // Notes widget (LocalStorage)
    // ========================================
    const NotesWidget = ({ notes, setNotes }) => {
      const [savedAt, setSavedAt] = useState(null);
      const debounceRef = useRef(null);

      const onChange = (e) => {
        const v = e.target.value;
        setNotes(v);
        if (debounceRef.current) clearTimeout(debounceRef.current);
        debounceRef.current = setTimeout(() => setSavedAt(new Date()), 400);
      };

      const charCount = notes?.length || 0;

      return (
        <Card className="p-6 flex flex-col h-full">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h2 className="text-[15px] font-semibold tracking-tight flex items-center gap-1.5">
                <Icon name="sparkle" className="w-4 h-4 text-lavender-500" />
                AI 영감 메모
              </h2>
              <p className="text-xs text-ink-500 mt-0.5">디자인·브랜딩 아이디어를 빠르게 기록</p>
            </div>
            <Badge tone="peach">자동 저장</Badge>
          </div>

          <textarea value={notes || ''} onChange={onChange}
            placeholder={"예) 한 글자 로고 — 굵은 산세리프 + 그라디언트 액센트…\n클라이언트 A 무드보드: 살구·라벤더·아이보리 톤"}
            className="flex-1 min-h-[200px] resize-none bg-ink-50 border border-ink-100 rounded-2xl p-4 text-sm leading-relaxed outline-none focus:bg-white focus:border-lavender-300 focus:ring-2 focus:ring-lavender-100 transition placeholder:text-ink-400" />

          <div className="mt-3 flex items-center justify-between text-[11px] text-ink-400">
            <span>{charCount.toLocaleString()}자</span>
            <span>{savedAt
              ? `저장됨 · ${savedAt.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`
              : '입력하면 자동으로 저장됩니다'}</span>
          </div>
        </Card>
      );
    };

    // ========================================
    // Budget widget (Postgres - W5_budget_transactions)
    // ========================================
    const CategoryBar = ({ category, total, max, type }) => {
      const pct = max > 0 ? Math.max(4, Math.round((total / max) * 100)) : 0;
      const isExpense = type === '지출';
      return (
        <div className="flex items-center gap-3">
          <div className="w-20 sm:w-24 text-xs text-ink-700 truncate shrink-0">{category}</div>
          <div className="flex-1 h-2 bg-ink-100 rounded-full overflow-hidden">
            <div className={`h-full rounded-full ${isExpense ? 'bg-gradient-to-r from-peach-300 to-peach-500' : 'bg-gradient-to-r from-mint-100 to-mint-500'}`}
              style={{ width: `${pct}%` }} />
          </div>
          <div className="text-xs font-medium text-ink-900 tabular-nums w-24 text-right shrink-0">{formatKRW(total)}</div>
        </div>
      );
    };

    const BudgetWidget = ({ summary, recent, loading, error, onRefresh }) => {
      const expense = summary?.expense ?? 0;
      const income = summary?.income ?? 0;
      const balance = summary?.balance ?? 0;

      const expenseCats = useMemo(() => {
        if (!summary) return [];
        return summary.byCategory.filter(c => c.type === '지출').slice(0, 4);
      }, [summary]);
      const maxCat = expenseCats[0]?.total || 1;

      return (
        <Card className="p-6">
          <div className="flex items-center justify-between mb-5">
            <div>
              <h2 className="text-[15px] font-semibold tracking-tight flex items-center gap-1.5">
                <Icon name="chart" className="w-4 h-4 text-peach-500" />
                가계부 요약
              </h2>
              <p className="text-xs text-ink-500 mt-0.5">
                {summary ? `${summary.year}년 ${summary.month}월 · Supabase Postgres` : 'Supabase Postgres 라이브'}
              </p>
            </div>
            <button onClick={onRefresh} aria-label="새로고침"
              className="w-8 h-8 rounded-xl text-ink-500 hover:bg-ink-100 hover:text-ink-900 transition flex items-center justify-center">
              <Icon name="refresh" className="w-4 h-4" />
            </button>
          </div>

          {error && (
            <div className="mb-4 p-3 rounded-xl bg-red-50 border border-red-100 text-xs text-red-600">
              데이터 로딩 실패: {error}. server.js가 실행 중인지 확인해 주세요.
            </div>
          )}

          <div className="grid grid-cols-3 gap-3 mb-6">
            <div className="p-4 rounded-2xl bg-mint-50 border border-mint-100">
              <div className="flex items-center gap-1.5 text-[11px] text-mint-500 font-medium">
                <Icon name="arrowDown" className="w-3 h-3" /> 수입
              </div>
              {loading ? <div className="mt-2 skeleton h-5 w-20"></div>
                : <div className="mt-1.5 text-base font-semibold text-ink-900 tabular-nums">{formatKRW(income)}</div>}
            </div>
            <div className="p-4 rounded-2xl bg-peach-50 border border-peach-100">
              <div className="flex items-center gap-1.5 text-[11px] text-peach-500 font-medium">
                <Icon name="arrowUp" className="w-3 h-3" /> 지출
              </div>
              {loading ? <div className="mt-2 skeleton h-5 w-20"></div>
                : <div className="mt-1.5 text-base font-semibold text-ink-900 tabular-nums">{formatKRW(expense)}</div>}
            </div>
            <div className="p-4 rounded-2xl bg-lavender-50 border border-lavender-100">
              <div className="text-[11px] text-lavender-600 font-medium">잔액</div>
              {loading ? <div className="mt-2 skeleton h-5 w-20"></div>
                : <div className={`mt-1.5 text-base font-semibold tabular-nums ${balance < 0 ? 'text-red-500' : 'text-ink-900'}`}>{formatKRW(balance)}</div>}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <h3 className="text-[12px] font-semibold text-ink-500 mb-3 uppercase tracking-wider">지출 카테고리 Top 4</h3>
              {loading && <div className="space-y-2.5">{[0,1,2,3].map(i => <div key={i} className="skeleton h-5"></div>)}</div>}
              {!loading && expenseCats.length === 0 && (
                <p className="text-sm text-ink-400 py-6 text-center">이번 달 지출 데이터가 없어요.</p>
              )}
              {!loading && expenseCats.length > 0 && (
                <div className="space-y-3">
                  {expenseCats.map(c => <CategoryBar key={c.category + c.type} category={c.category} total={c.total} max={maxCat} type={c.type} />)}
                </div>
              )}
            </div>

            <div>
              <h3 className="text-[12px] font-semibold text-ink-500 mb-3 uppercase tracking-wider">최근 거래 5건</h3>
              {loading && <div className="space-y-2">{[0,1,2,3,4].map(i => <div key={i} className="skeleton h-9"></div>)}</div>}
              {!loading && recent.length === 0 && (
                <p className="text-sm text-ink-400 py-6 text-center">최근 거래가 없어요.</p>
              )}
              {!loading && recent.length > 0 && (
                <ul className="divide-y divide-ink-100">
                  {recent.map(t => (
                    <li key={t.id} className="flex items-center justify-between gap-3 py-2.5 first:pt-0 last:pb-0">
                      <div className="min-w-0">
                        <div className="flex items-center gap-1.5">
                          <Badge tone={t.type === '지출' ? 'peach' : 'mint'}>{t.category}</Badge>
                        </div>
                        <div className="text-[11px] text-ink-400 mt-1 truncate">{t.memo || '메모 없음'} · {t.date}</div>
                      </div>
                      <div className={`text-sm font-medium tabular-nums shrink-0 ${t.type === '지출' ? 'text-peach-500' : 'text-mint-500'}`}>
                        {t.type === '지출' ? '-' : '+'}{formatKRW(t.amount)}
                      </div>
                    </li>
                  ))}
                </ul>
              )}
            </div>
          </div>
        </Card>
      );
    };

    // ========================================
    // Projects widget (Notion - 프로젝트(삭제X))
    // ========================================
    const statusTone = (status) => {
      if (status === '진행 중') return 'lavender';
      if (status === '계획 중') return 'peach';
      if (status === '완료') return 'mint';
      if (status === '취소') return 'red';
      return 'neutral';
    };

    const ProjectsWidget = ({ projects, loading, error, fetched_at }) => {
      const sorted = useMemo(() => {
        const order = { '진행 중': 0, '계획 중': 1, '백로그': 2, '완료': 3, '취소': 4 };
        return [...projects].sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
      }, [projects]);

      return (
        <Card className="p-6">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h2 className="text-[15px] font-semibold tracking-tight flex items-center gap-1.5">
                <Icon name="folder" className="w-4 h-4 text-lavender-500" />
                내 프로젝트 (Notion)
              </h2>
              <p className="text-xs text-ink-500 mt-0.5">
                프로젝트(삭제X) DB · {fetched_at ? `${new Date(fetched_at).toLocaleDateString('ko-KR')} 동기화` : '스냅샷'}
              </p>
            </div>
            <Badge tone="lavender">{projects.length}건</Badge>
          </div>

          {error && (
            <div className="mb-4 p-3 rounded-xl bg-red-50 border border-red-100 text-xs text-red-600">
              {error}
            </div>
          )}

          {loading && (
            <div className="space-y-2">
              {[0,1,2,3].map(i => <div key={i} className="skeleton h-14"></div>)}
            </div>
          )}

          {!loading && (
            <ul className="divide-y divide-ink-100">
              {sorted.map(p => {
                const tone = statusTone(p.status);
                const dday = dDayLabel(p.end || p.start);
                const isPast = p.status === '완료' || p.status === '취소';
                return (
                  <li key={p.id} className="flex items-start sm:items-center justify-between gap-4 py-3.5 first:pt-0 last:pb-0">
                    <div className="flex items-start gap-3 min-w-0 flex-1">
                      <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-lg
                        ${tone === 'lavender' ? 'bg-lavender-100' :
                          tone === 'peach' ? 'bg-peach-100' :
                          tone === 'mint' ? 'bg-mint-100' :
                          tone === 'red' ? 'bg-red-50' : 'bg-ink-100'}`}>
                        <span>{p.icon || '📁'}</span>
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="text-sm font-medium text-ink-900 truncate">{p.name}</div>
                        {p.summary && (
                          <div className="text-xs text-ink-500 mt-1 line-clamp-2">{p.summary}</div>
                        )}
                        <div className="flex items-center gap-2 mt-1.5 text-[11px] text-ink-400">
                          {p.priority && <span>우선순위 {p.priority}</span>}
                          {p.priority && p.start && <span>·</span>}
                          {p.start && <span>{p.start}{p.end ? ` → ${p.end}` : ''}</span>}
                        </div>
                      </div>
                    </div>
                    <div className="flex flex-col sm:flex-row items-end sm:items-center gap-2 shrink-0">
                      {!isPast && p.start && (
                        <span className="text-[11px] text-ink-400 tabular-nums">{dday}</span>
                      )}
                      <div className="flex items-center gap-1">
                        <Badge tone={tone}>{p.status}</Badge>
                        {p.url && (
                          <a href={p.url} target="_blank" rel="noopener noreferrer"
                            className="w-7 h-7 rounded-lg text-ink-400 hover:text-ink-900 hover:bg-ink-100 transition flex items-center justify-center"
                            aria-label="Notion에서 열기">
                            <Icon name="external" className="w-3.5 h-3.5" />
                          </a>
                        )}
                      </div>
                    </div>
                  </li>
                );
              })}
            </ul>
          )}
        </Card>
      );
    };

    // ========================================
    // Dashboard
    // ========================================
    const DashboardPage = () => {
      const { session, logout } = useAuth();
      const [todos, setTodos] = useLocalStorage(TODOS_KEY, [
        { id: 1, text: 'Studio Mira 무드보드 v2 정리', done: false },
        { id: 2, text: '로고 브랜딩 가이드 1차 시안', done: false },
        { id: 3, text: 'Framer 인터랙션 레퍼런스 아카이빙', done: true },
      ]);
      const [notes, setNotes] = useLocalStorage(NOTES_KEY, '');

      const projectsState = useProjects();
      const budgetState = useBudget();

      return (
        <div className="min-h-screen">
          <div className="max-w-6xl mx-auto px-5 sm:px-8 py-8 sm:py-10 fade-up">
            <DashboardHeader email={session.email} onLogout={logout} />

            <SummaryGrid
              projects={projectsState.projects}
              projectsLoading={projectsState.loading}
              budget={budgetState.summary}
              budgetLoading={budgetState.loading}
            />

            <section className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
              <TodoWidget todos={todos} setTodos={setTodos} />
              <NotesWidget notes={notes} setNotes={setNotes} />
            </section>

            <section className="mb-4">
              <BudgetWidget
                summary={budgetState.summary}
                recent={budgetState.recent}
                loading={budgetState.loading}
                error={budgetState.error}
                onRefresh={budgetState.refresh}
              />
            </section>

            <section className="mb-10">
              <ProjectsWidget
                projects={projectsState.projects}
                loading={projectsState.loading}
                error={projectsState.error}
                fetched_at={projectsState.fetched_at}
              />
            </section>

            <footer className="text-center text-xs text-ink-400 pb-4">
              Notion · Supabase Postgres · Pretendard · React 18 · Tailwind
            </footer>
          </div>
        </div>
      );
    };

    // ========================================
    // App Root
    // ========================================
    const Gate = () => {
      const { session } = useAuth();
      return session ? <DashboardPage /> : <LoginPage />;
    };

    const App = () => <AuthProvider><Gate /></AuthProvider>;

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
