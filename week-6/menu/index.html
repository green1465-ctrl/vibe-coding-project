<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — 시즌 캠페인 카드뉴스 자동 생성</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #f8fafc; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .toast-in { animation: toast-in .18s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // Constants & Helpers
    // ========================================
    const API_BASE_URL = window.location.origin + '/api';

    const CATEGORY_OPTIONS = ['한식', '분식', '카페', '중식', '일식', '양식', '디저트'];

    // 좌측 리스트 뱃지 + 슬라이드 액센트 컬러를 동시에 사용
    const CATEGORY_COLOR = {
      한식:   { bg: 'bg-stone-100',   text: 'text-stone-700',   accent: 'bg-stone-500',   ring: 'ring-stone-300' },
      분식:   { bg: 'bg-orange-100',  text: 'text-orange-700',  accent: 'bg-orange-500',  ring: 'ring-orange-300' },
      카페:   { bg: 'bg-amber-100',   text: 'text-amber-800',   accent: 'bg-amber-500',   ring: 'ring-amber-300' },
      중식:   { bg: 'bg-red-100',     text: 'text-red-700',     accent: 'bg-red-500',     ring: 'ring-red-300' },
      일식:   { bg: 'bg-sky-100',     text: 'text-sky-700',     accent: 'bg-sky-500',     ring: 'ring-sky-300' },
      양식:   { bg: 'bg-violet-100',  text: 'text-violet-700',  accent: 'bg-violet-500',  ring: 'ring-violet-300' },
      디저트: { bg: 'bg-pink-100',    text: 'text-pink-700',    accent: 'bg-pink-500',    ring: 'ring-pink-300' },
    };

    const STATUS_META = {
      pending:   { dot: 'bg-slate-300',   label: '미작업' },
      generated: { dot: 'bg-yellow-400',  label: '카피 생성됨' },
      ok:        { dot: 'bg-emerald-500', label: 'OK' },
      skip:      { dot: 'bg-rose-500',    label: '스킵' },
    };

    // 최근/예정 12개월 옵션 — default 2026-05
    const MONTHS = (() => {
      const out = [];
      const base = new Date(2026, 4, 1); // 2026-05
      for (let i = -2; i <= 9; i++) {
        const d = new Date(base.getFullYear(), base.getMonth() + i, 1);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        out.push(`${y}-${m}`);
      }
      return out;
    })();

    const monthLabel = (ym) => {
      if (!ym) return '';
      const [y, m] = ym.split('-');
      return `${y}년 ${parseInt(m, 10)}월`;
    };

    // fetch wrapper
    const API = {
      async _req(path, opts = {}) {
        const res = await fetch(`${API_BASE_URL}${path}`, {
          headers: { 'Content-Type': 'application/json' },
          ...opts,
        });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch (_) { /* ignore */ }
        if (!res.ok) {
          const msg = (data && data.message) || `HTTP ${res.status}`;
          throw new Error(msg);
        }
        return data;
      },
      listClients()        { return this._req('/clients'); },
      createClient(body)   { return this._req('/clients', { method: 'POST', body: JSON.stringify(body) }); },
      updateClient(id, b)  { return this._req(`/clients/${id}`, { method: 'PUT', body: JSON.stringify(b) }); },
      deleteClient(id)     { return this._req(`/clients/${id}`, { method: 'DELETE' }); },
      collectTrends(month) { return this._req('/collect-trends', { method: 'POST', body: JSON.stringify({ month }) }); },
      generateCopy(client_id, month) { return this._req('/generate-copy', { method: 'POST', body: JSON.stringify({ client_id, month }) }); },
      regenerateImage(client_id, month) { return this._req('/regenerate-image', { method: 'POST', body: JSON.stringify({ client_id, month }) }); },
      renderSlides(client_id, month, copy, image_url) {
        return this._req('/render-slides', {
          method: 'POST',
          body: JSON.stringify({ client_id, month, copy, image_url }),
        });
      },
      downloadZipUrl(client_id, month) {
        return `${API_BASE_URL}/download-zip/${encodeURIComponent(client_id)}?month=${encodeURIComponent(month)}`;
      },
    };

    // ========================================
    // Design System
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, type = 'button', className = '', title, children }) {
      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-5 py-2.5 text-base',
      };
      const variants = {
        primary:   'bg-emerald-600 text-white hover:bg-emerald-700 active:bg-emerald-800',
        secondary: 'bg-white text-slate-800 border border-slate-300 hover:bg-slate-50',
        danger:    'bg-rose-600 text-white hover:bg-rose-700',
        ghost:     'bg-transparent text-slate-600 hover:bg-slate-100',
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          title={title}
          className={`inline-flex items-center justify-center gap-1.5 font-medium rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed ${sizes[size]} ${variants[variant]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ label, error, className = '', ...rest }) {
      return (
        <label className="block">
          {label && <span className="block text-xs font-medium text-slate-600 mb-1">{label}</span>}
          <input
            {...rest}
            className={`w-full px-3 py-2 text-sm border rounded-lg outline-none transition bg-white
              ${error ? 'border-rose-400 focus:ring-2 focus:ring-rose-200' : 'border-slate-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100'}
              ${className}`}
          />
          {error && <span className="block text-xs text-rose-600 mt-1">{error}</span>}
        </label>
      );
    }

    function Textarea({ label, rows = 3, className = '', ...rest }) {
      return (
        <label className="block">
          {label && <span className="block text-xs font-medium text-slate-600 mb-1">{label}</span>}
          <textarea
            rows={rows}
            {...rest}
            className={`w-full px-3 py-2 text-sm border border-slate-300 rounded-lg outline-none bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 resize-y ${className}`}
          />
        </label>
      );
    }

    function Select({ label, options = [], className = '', ...rest }) {
      return (
        <label className="block">
          {label && <span className="block text-xs font-medium text-slate-600 mb-1">{label}</span>}
          <select
            {...rest}
            className={`w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 ${className}`}
          >
            {options.map((opt) => {
              const value = typeof opt === 'string' ? opt : opt.value;
              const labelText = typeof opt === 'string' ? opt : opt.label;
              return <option key={value} value={value}>{labelText}</option>;
            })}
          </select>
        </label>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white border border-slate-200 rounded-xl shadow-sm ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, color = 'slate', className = '' }) {
      const palette = {
        slate:  'bg-slate-100 text-slate-700',
        stone:  'bg-stone-100 text-stone-700',
        orange: 'bg-orange-100 text-orange-700',
        amber:  'bg-amber-100 text-amber-800',
        red:    'bg-red-100 text-red-700',
        sky:    'bg-sky-100 text-sky-700',
        violet: 'bg-violet-100 text-violet-700',
        pink:   'bg-pink-100 text-pink-700',
      };
      return (
        <span className={`inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-full ${palette[color] || palette.slate} ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, children, size = 'md' }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose && onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };
      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-slate-900/40" onClick={onClose}>
          <div
            onClick={(e) => e.stopPropagation()}
            className={`bg-white rounded-2xl shadow-xl w-full ${sizes[size]} max-h-[90vh] overflow-auto`}
            role="dialog"
            aria-modal="true"
          >
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-200">
              <h2 className="text-base font-semibold text-slate-900">{title}</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700" aria-label="닫기">✕</button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function Toast({ toast, onClose }) {
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => onClose && onClose(), 2400);
        return () => clearTimeout(t);
      }, [toast, onClose]);
      if (!toast) return null;
      const tone = toast.tone || 'info';
      const palette = {
        info:    'bg-slate-900 text-white',
        success: 'bg-emerald-600 text-white',
        error:   'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-white',
      };
      return (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
          <div className={`toast-in px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium ${palette[tone]}`}>
            {toast.message}
          </div>
        </div>
      );
    }

    // ========================================
    // Common atoms
    // ========================================
    function CategoryBadge({ category, className = '' }) {
      const c = CATEGORY_COLOR[category] || CATEGORY_COLOR.한식;
      return (
        <span className={`inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-full ${c.bg} ${c.text} ${className}`}>
          {category}
        </span>
      );
    }

    function StatusDot({ status, withLabel = false, className = '' }) {
      const meta = STATUS_META[status] || STATUS_META.pending;
      return (
        <span className={`inline-flex items-center gap-1.5 ${className}`}>
          <span className={`w-2.5 h-2.5 rounded-full ${meta.dot}`} aria-label={meta.label} />
          {withLabel && <span className="text-xs text-slate-600">{meta.label}</span>}
        </span>
      );
    }

    // ========================================
    // Header
    // ========================================
    function Header({ month, onMonthChange, onCollect, collecting, hasTrends, sourcesUsed }) {
      const sourcesLabel = Array.isArray(sourcesUsed) && sourcesUsed.length
        ? ` (${sourcesUsed.join(' + ')})`
        : '';
      return (
        <header className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h1 className="text-lg sm:text-xl font-bold text-slate-900">
                🍽️ Menu — 시즌 캠페인 카드뉴스 자동 생성
              </h1>
              <p className="text-xs text-slate-500 mt-0.5">
                클라이언트별 5장 카드뉴스를 한 번에 — Week 1 mock 단계
              </p>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              {hasTrends && (
                <span className="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-full">
                  ✓ {monthLabel(month)} 트렌드 수집됨{sourcesLabel}
                </span>
              )}
              <select
                value={month}
                onChange={(e) => onMonthChange(e.target.value)}
                className="px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
              >
                {MONTHS.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
              </select>
              <Button onClick={onCollect} disabled={collecting}>
                {collecting ? '수집 중...' : '이번 달 트렌드 가져오기'}
              </Button>
            </div>
          </div>
        </header>
      );
    }

    // ========================================
    // Slide components — 1080x1080 (aspect-square)
    // ========================================
    function SlideShell({ children, className = '' }) {
      return (
        <div className={`relative w-full aspect-square rounded-2xl overflow-hidden shadow-lg ring-1 ring-slate-200 ${className}`}>
          {children}
        </div>
      );
    }

    function Slide1Cover({ client, copy }) {
      return (
        <SlideShell>
          {/* 회색 그라데이션 배경 (Week 3에 fal.ai 이미지로 교체) */}
          <div className="absolute inset-0 bg-gradient-to-br from-slate-300 to-slate-500 flex items-center justify-center">
            <div className="text-[20vmin] sm:text-[14rem] opacity-60 select-none">🍽️</div>
          </div>
          {/* 좌상단 클라이언트 이름 */}
          <div className="absolute top-4 left-4 text-xs sm:text-sm font-medium text-white/90 bg-black/30 px-2.5 py-1 rounded-full backdrop-blur-sm">
            {client.name}
          </div>
          {/* 하단 50% 그라데이션 + 헤드라인 */}
          <div className="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/85 via-black/55 to-transparent flex items-end">
            <div className="p-5 sm:p-7 w-full">
              <h2 className="text-white font-black leading-tight tracking-tight text-2xl sm:text-3xl md:text-4xl drop-shadow-sm">
                {copy?.headline || '헤드라인이 여기에 표시됩니다'}
              </h2>
            </div>
          </div>
        </SlideShell>
      );
    }

    function SlideTextBase({ client, body, accent, footer, slideLabel }) {
      const c = CATEGORY_COLOR[client.category] || CATEGORY_COLOR.한식;
      return (
        <SlideShell className="bg-slate-50">
          {/* 상단 카테고리 액센트 바 */}
          <div className={`absolute top-0 inset-x-0 h-1.5 ${c.accent}`} />
          <div className="absolute inset-0 flex flex-col p-6 sm:p-8">
            {/* 상단: 카테고리 + 이름 */}
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <CategoryBadge category={client.category} />
                <span className="text-xs sm:text-sm font-medium text-slate-700">{client.name}</span>
              </div>
              {slideLabel && (
                <span className="text-[10px] sm:text-xs uppercase tracking-widest text-slate-400 font-semibold">
                  {slideLabel}
                </span>
              )}
            </div>

            {/* 중앙 본문 */}
            <div className="flex-1 flex items-center">
              <p className={`font-bold text-slate-900 leading-snug whitespace-pre-wrap break-keep
                ${accent ? 'text-2xl sm:text-3xl md:text-4xl' : 'text-xl sm:text-2xl md:text-3xl'}`}>
                {body || <span className="text-slate-300 font-medium">내용이 여기에 표시됩니다</span>}
              </p>
            </div>

            {/* 하단 출처 (옵션) */}
            {footer && (
              <div className="text-xs text-slate-500 pt-2 border-t border-slate-200">
                {footer}
              </div>
            )}
          </div>
        </SlideShell>
      );
    }

    function Slide2Insight({ client, copy }) {
      return <SlideTextBase client={client} body={copy?.slide2} slideLabel="01 · INSIGHT" />;
    }
    function Slide3Menu({ client, copy }) {
      return <SlideTextBase client={client} body={copy?.slide3} slideLabel="02 · MENU" accent />;
    }
    function Slide4Menu({ client, copy }) {
      return <SlideTextBase client={client} body={copy?.slide4} slideLabel="03 · MENU" accent />;
    }
    function Slide5Cta({ client, copy }) {
      const footer = copy?.source ? `출처: ${copy.source}` : null;
      return <SlideTextBase client={client} body={copy?.cta} slideLabel="04 · CTA" accent footer={footer} />;
    }

    function SlideCarousel({ client, copy, slides: pngSlides }) {
      const [idx, setIdx] = useState(0);
      const total = 5;

      // 클라이언트 바뀌면 첫 슬라이드로
      useEffect(() => { setIdx(0); }, [client?.id]);

      // PNG가 5장 다 있으면 PNG 모드, 아니면 HTML fallback
      const usePng = Array.isArray(pngSlides) && pngSlides.length === total
        && pngSlides.every((s) => s && typeof s.url === 'string');

      const htmlSlides = [
        <Slide1Cover  key="s1" client={client} copy={copy} />,
        <Slide2Insight key="s2" client={client} copy={copy} />,
        <Slide3Menu   key="s3" client={client} copy={copy} />,
        <Slide4Menu   key="s4" client={client} copy={copy} />,
        <Slide5Cta    key="s5" client={client} copy={copy} />,
      ];

      const renderSlide = (i) => {
        if (usePng) {
          const s = pngSlides[i];
          return (
            <SlideShell>
              <img
                src={s.url}
                alt={`Slide ${s.slide_n}`}
                className="absolute inset-0 w-full h-full object-cover"
                draggable={false}
              />
            </SlideShell>
          );
        }
        return htmlSlides[i];
      };

      const prev = () => setIdx((i) => (i - 1 + total) % total);
      const next = () => setIdx((i) => (i + 1) % total);

      return (
        <div className="w-full max-w-[480px] mx-auto">
          <div className="relative">
            {renderSlide(idx)}

            {/* 좌우 화살표 */}
            <button
              onClick={prev}
              aria-label="이전 슬라이드"
              className="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 hover:bg-white shadow-md flex items-center justify-center text-slate-700"
            >‹</button>
            <button
              onClick={next}
              aria-label="다음 슬라이드"
              className="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 hover:bg-white shadow-md flex items-center justify-center text-slate-700"
            >›</button>
          </div>

          {/* 인디케이터 */}
          <div className="flex items-center justify-center gap-2 mt-3">
            {Array.from({ length: total }).map((_, i) => (
              <button
                key={i}
                onClick={() => setIdx(i)}
                aria-label={`${i + 1}번 슬라이드로 이동`}
                className={`h-2 rounded-full transition-all ${i === idx ? 'w-6 bg-emerald-600' : 'w-2 bg-slate-300 hover:bg-slate-400'}`}
            />
            ))}
            <span className="ml-2 text-xs text-slate-500 tabular-nums">{idx + 1}/{total}</span>
          </div>
        </div>
      );
    }

    // ========================================
    // ClientList (left panel)
    // ========================================
    function ClientList({ clients, selectedId, onSelect, onAdd, onEdit, onDelete, statusMap }) {
      return (
        <aside className="w-full lg:w-80 lg:shrink-0">
          <div className="lg:sticky lg:top-[88px]">
            <Card className="p-3">
              <div className="flex items-center justify-between mb-3 px-1">
                <h3 className="text-sm font-semibold text-slate-900">클라이언트</h3>
                <span className="text-xs text-slate-500">{clients.length}곳</span>
              </div>
              <Button className="w-full" onClick={onAdd}>+ 클라이언트 추가</Button>

              <ul className="mt-3 space-y-1.5">
                {clients.length === 0 && (
                  <li className="text-xs text-slate-500 text-center py-6">
                    아직 클라이언트가 없습니다.<br />
                    상단 버튼으로 추가하세요.
                  </li>
                )}
                {clients.map((client) => {
                  const status = statusMap[client.id] || 'pending';
                  const isActive = client.id === selectedId;
                  return (
                    <li key={client.id}>
                      <div
                        onClick={() => onSelect(client.id)}
                        role="button"
                        tabIndex={0}
                        onKeyDown={(e) => { if (e.key === 'Enter') onSelect(client.id); }}
                        className={`group relative w-full text-left px-3 py-2.5 rounded-lg cursor-pointer transition border
                          ${isActive
                            ? 'bg-emerald-50 border-emerald-300'
                            : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                      >
                        <div className="flex items-start justify-between gap-2">
                          <div className="min-w-0">
                            <div className="flex items-center gap-1.5">
                              <StatusDot status={status} />
                              <span className="text-sm font-medium text-slate-900 truncate">{client.name}</span>
                            </div>
                            <div className="mt-1.5 flex items-center gap-1.5 flex-wrap">
                              <CategoryBadge category={client.category} />
                              <span className="text-[11px] text-slate-500 truncate">
                                {(client.menu_keywords || []).slice(0, 2).join(' · ')}
                              </span>
                            </div>
                          </div>
                          <div className="opacity-0 group-hover:opacity-100 transition flex flex-col gap-1 shrink-0">
                            <button
                              onClick={(e) => { e.stopPropagation(); onEdit(client); }}
                              aria-label="수정"
                              className="text-xs px-1.5 py-0.5 rounded hover:bg-slate-200 text-slate-700"
                            >✏️</button>
                            <button
                              onClick={(e) => { e.stopPropagation(); onDelete(client); }}
                              aria-label="삭제"
                              className="text-xs px-1.5 py-0.5 rounded hover:bg-rose-100 text-rose-600"
                            >🗑️</button>
                          </div>
                        </div>
                      </div>
                    </li>
                  );
                })}
              </ul>
            </Card>
          </div>
        </aside>
      );
    }

    // ========================================
    // ClientForm (modal body)
    // ========================================
    function ClientForm({ initial, onSubmit, onDelete, submitting }) {
      const [form, setForm] = useState(() => ({
        name: initial?.name || '',
        category: initial?.category || '한식',
        email: initial?.email || '',
        tone: initial?.tone || '',
        menu_keywords_text: Array.isArray(initial?.menu_keywords) ? initial.menu_keywords.join(', ') : '',
      }));
      const [errors, setErrors] = useState({});

      const handle = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

      const submit = (e) => {
        e.preventDefault();
        const errs = {};
        if (!form.name.trim()) errs.name = '이름은 필수입니다';
        if (!form.email.trim()) errs.email = '이메일은 필수입니다';
        setErrors(errs);
        if (Object.keys(errs).length) return;

        const menu_keywords = form.menu_keywords_text
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean);

        onSubmit({
          name: form.name.trim(),
          category: form.category,
          email: form.email.trim(),
          tone: form.tone.trim(),
          menu_keywords,
        });
      };

      return (
        <form onSubmit={submit} className="space-y-3">
          <Input label="이름 *" value={form.name} onChange={handle('name')} error={errors.name} placeholder="예: 정담한정식" />
          <div className="grid grid-cols-2 gap-3">
            <Select label="업종" options={CATEGORY_OPTIONS} value={form.category} onChange={handle('category')} />
            <Input label="이메일 *" type="email" value={form.email} onChange={handle('email')} error={errors.email} placeholder="owner@example.com" />
          </div>
          <Input label="톤" value={form.tone} onChange={handle('tone')} placeholder="예: 정중하고 따뜻한" />
          <Input
            label="메뉴 키워드 (쉼표로 구분)"
            value={form.menu_keywords_text}
            onChange={handle('menu_keywords_text')}
            placeholder="비빔밥, 된장찌개, 김치찌개"
          />

          <div className="flex items-center justify-between pt-2 border-t border-slate-100 mt-4">
            <div>
              {initial && onDelete && (
                <Button variant="danger" size="sm" onClick={onDelete} type="button">
                  🗑️ 삭제
                </Button>
              )}
            </div>
            <Button type="submit" disabled={submitting}>
              {submitting ? '저장 중...' : '저장'}
            </Button>
          </div>
        </form>
      );
    }

    // ========================================
    // CopyEditor (5 sections)
    // ========================================
    const COPY_FIELDS = [
      { key: 'headline', label: 'Slide 1 — 헤드라인', rows: 2 },
      { key: 'slide2',   label: 'Slide 2 — 시즌 인사이트', rows: 3 },
      { key: 'slide3',   label: 'Slide 3 — 추천 메뉴 ①', rows: 3 },
      { key: 'slide4',   label: 'Slide 4 — 추천 메뉴 ② / 포인트', rows: 3 },
      { key: 'cta',      label: 'Slide 5 — CTA', rows: 2 },
    ];

    function CopyEditor({ copy, onChange, disabled }) {
      const change = (key) => (e) => {
        onChange({ ...(copy || {}), [key]: e.target.value });
      };
      return (
        <div className="space-y-3">
          {COPY_FIELDS.map((f) => (
            <Textarea
              key={f.key}
              label={f.label}
              rows={f.rows}
              disabled={disabled}
              value={(copy && copy[f.key]) || ''}
              onChange={change(f.key)}
              placeholder={disabled ? '먼저 "카피 생성" 버튼을 눌러주세요' : ''}
            />
          ))}
          <Input
            label="출처 (Slide 5 하단)"
            disabled={disabled}
            value={(copy && copy.source) || ''}
            onChange={(e) => onChange({ ...(copy || {}), source: e.target.value })}
            placeholder="예: ahatrend.com"
          />
        </div>
      );
    }

    // ========================================
    // StatusToggle (3-segment)
    // ========================================
    function StatusToggle({ value, onChange }) {
      const options = [
        { v: 'ok',        label: 'OK',   activeCls: 'bg-emerald-600 text-white' },
        { v: 'generated', label: '수정중', activeCls: 'bg-yellow-400 text-yellow-900' },
        { v: 'skip',      label: '스킵', activeCls: 'bg-rose-500 text-white' },
      ];
      return (
        <div className="inline-flex rounded-lg border border-slate-300 bg-white overflow-hidden">
          {options.map((o, i) => {
            const active = value === o.v;
            return (
              <button
                key={o.v}
                type="button"
                onClick={() => onChange(o.v)}
                className={`px-3 py-1.5 text-xs font-medium ${i === 0 ? '' : 'border-l border-slate-300'}
                  ${active ? o.activeCls : 'bg-white text-slate-600 hover:bg-slate-50'}`}
              >
                {o.label}
              </button>
            );
          })}
        </div>
      );
    }

    // ========================================
    // WorkArea (right panel)
    // ========================================
    function WorkArea({
      client, copy, onCopyChange,
      onGenerate, onRender, onRegenImage, onDownload,
      status, onStatusChange,
      generating, rendering, regeneratingImage, downloading,
      hasTrends, slidesData, isStale, hasFalImage,
    }) {
      if (!client) {
        return (
          <Card className="p-10 text-center text-slate-500">
            왼쪽에서 클라이언트를 선택하세요.
          </Card>
        );
      }

      return (
        <div className="space-y-5">
          {/* Header row */}
          <Card className="p-4 sm:p-5">
            <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
              <div className="min-w-0">
                <div className="flex items-center gap-2">
                  <h2 className="text-lg sm:text-xl font-bold text-slate-900">{client.name}</h2>
                  <CategoryBadge category={client.category} />
                </div>
                <p className="text-xs text-slate-500 mt-1 truncate">
                  {client.email} · {client.tone || '톤 미지정'}
                </p>
                {Array.isArray(client.menu_keywords) && client.menu_keywords.length > 0 && (
                  <div className="mt-1.5 flex flex-wrap gap-1">
                    {client.menu_keywords.map((k, i) => (
                      <Badge key={i} color="slate">{k}</Badge>
                    ))}
                  </div>
                )}
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <StatusToggle value={status} onChange={onStatusChange} />
              </div>
            </div>

            <div className="mt-4 flex items-center gap-2 flex-wrap">
              <Button
                onClick={onGenerate}
                disabled={generating || !hasTrends}
                title={!hasTrends ? '먼저 상단 "이번 달 트렌드 가져오기"를 실행하세요' : ''}
              >
                {generating ? '카피 생성 중...' : '카피 생성'}
              </Button>
              <Button
                variant="secondary"
                onClick={onRender}
                disabled={!copy || rendering}
                title={!copy ? '먼저 카피를 생성하세요' : '5장 PNG를 다시 합성합니다'}
              >
                {rendering ? '합성 중... (10~20초)' : '다시 합성'}
              </Button>
              <Button
                variant="secondary"
                onClick={onRegenImage}
                disabled={regeneratingImage || !hasTrends}
                title={hasFalImage ? '이미지가 캐시되어 있습니다 — 재생성 시 덮어씁니다' : 'fal.ai로 음식 이미지 생성'}
              >
                {regeneratingImage ? '이미지 생성 중...' : (hasFalImage ? '이미지 재생성 ✓' : '이미지 재생성')}
              </Button>
              <Button
                variant="secondary"
                onClick={onDownload}
                disabled={!slidesData || downloading}
                title={!slidesData ? '먼저 "다시 합성"을 실행하세요' : 'PNG 5장을 ZIP으로 다운로드'}
              >
                {downloading ? '다운로드 중...' : '다운로드'}
              </Button>
            </div>

            {!hasTrends && (
              <p className="mt-3 text-xs text-amber-700 bg-amber-50 border border-amber-200 px-3 py-2 rounded-lg">
                상단 "이번 달 트렌드 가져오기"를 먼저 실행하면 카테고리별 트렌드를 기반으로 카피가 생성됩니다.
              </p>
            )}
          </Card>

          {/* Carousel + editor: side-by-side on lg+ */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <Card className="p-4 sm:p-5">
              <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
                <h3 className="text-sm font-semibold text-slate-900">슬라이드 미리보기</h3>
                {slidesData && !isStale && (
                  <Badge color="amber">PNG 합성됨</Badge>
                )}
                {!slidesData && (
                  <Badge color="slate">HTML 미리보기</Badge>
                )}
              </div>
              {isStale && (
                <p className="mb-3 text-[11px] text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1.5 rounded-lg">

                </p>
              )}
              <SlideCarousel
                client={client}
                copy={copy}
                slides={isStale ? null : (slidesData?.slides || null)}

                1080×1080 · {slidesData && !isStale ? 'Playwright로 합성된 PNG' : 'HTML 실시간 미리보기'}

            <Card className="p-4 sm:p-5">
              <h3 className="text-sm font-semibold text-slate-900 mb-3">카피 편집 (실시간 미리보기)</h3>

    // ========================================
    // App (root)
    // ========================================
    function App() {
      const [clients, setClients] = useState([]);
      const [selectedClientId, setSelectedClientId] = useState(null);
      const [month, setMonth] = useState('2026-05');
      const [campaignsByMonth, setCampaignsByMonth] = useState({}); // { '2026-05': campaign }
      const [copies, setCopies] = useState({}); // { client_id: copy }
      const [statusMap, setStatusMap] = useState({}); // { client_id: status }

      // 합성된 PNG / fal.ai 이미지 캐시 (client_id 단위)
      const [slidesByClient, setSlidesByClient] = useState({}); // { client_id: { slides: [{slide_n,url,kind}], renderedAt, month } }
      const [imagesByClient, setImagesByClient] = useState({}); // { client_id: { image_url, month } }
      // PNG가 stale인지: 합성 이후 카피가 바뀌었으면 true
      const [staleByClient, setStaleByClient] = useState({}); // { client_id: true }

      const [loading, setLoading] = useState(true);
      const [collecting, setCollecting] = useState(false);
      const [generating, setGenerating] = useState(false);
      const [rendering, setRendering] = useState(false);
      const [regeneratingImage, setRegeneratingImage] = useState(false);
      const [downloading, setDownloading] = useState(false);

      const [modal, setModal] = useState(null); // { mode: 'add'|'edit', client? }
      const [confirmDelete, setConfirmDelete] = useState(null); // client | null
      const [submitting, setSubmitting] = useState(false);

      const [toast, setToast] = useState(null);
      const showToast = useCallback((message, tone = 'info') => {
        setToast({ message, tone, id: Date.now() });
      }, []);

      // Initial load
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const list = await API.listClients();
            if (cancelled) return;
            setClients(list);
            if (list.length > 0) setSelectedClientId(list[0].id);
            const init = {};
            list.forEach((c) => { init[c.id] = 'pending'; });
            setStatusMap(init);
          } catch (err) {
            showToast('클라이언트 목록을 불러오지 못했습니다: ' + err.message, 'error');
          } finally {
            if (!cancelled) setLoading(false);
          }
        })();
        return () => { cancelled = true; };
      }, [showToast]);

      const selectedClient = useMemo(
        () => clients.find((c) => c.id === selectedClientId) || null,
        [clients, selectedClientId]
      );

      const currentCampaign = campaignsByMonth[month] || null;
      const hasTrends = !!currentCampaign;
      const sourcesUsed = (currentCampaign && Array.isArray(currentCampaign.sources_used))
        ? currentCampaign.sources_used
        : null;

      // ============ Handlers ============

      const handleCollectTrends = useCallback(async () => {
        setCollecting(true);
        try {
          const camp = await API.collectTrends(month);
          setCampaignsByMonth((prev) => ({ ...prev, [month]: camp }));
          // 새 달이면 status/copies/slides/images 캐시 모두 초기화
          setCopies({});
          setSlidesByClient({});
          setImagesByClient({});
          setStaleByClient({});
          const reset = {};
          clients.forEach((c) => { reset[c.id] = 'pending'; });
          setStatusMap(reset);
          const sources = Array.isArray(camp.sources_used) && camp.sources_used.length
            ? ` (${camp.sources_used.join(' + ')})`
            : '';
          showToast(`${monthLabel(month)} 트렌드를 수집했습니다${sources}`, 'success');
        } catch (err) {
          showToast('트렌드 수집 실패: ' + err.message, 'error');
        } finally {
          setCollecting(false);
        }
      }, [month, clients, showToast]);

      const handleGenerateCopy = useCallback(async () => {
        if (!selectedClient) return;
        if (!hasTrends) {
          showToast('먼저 상단 "이번 달 트렌드 가져오기"를 실행하세요', 'warning');
          return;
        }
        setGenerating(true);
        try {
          const res = await API.generateCopy(selectedClient.id, month);
          setCopies((prev) => ({ ...prev, [selectedClient.id]: res.copy }));
          setStatusMap((prev) => ({ ...prev, [selectedClient.id]: 'generated' }));
          // 기존 합성 PNG가 있으면 stale 처리
          setStaleByClient((prev) => {
            if (slidesByClient[selectedClient.id]) {
              return { ...prev, [selectedClient.id]: true };
            }
            return prev;
          });
          showToast(`${selectedClient.name} 카피를 생성했습니다`, 'success');
        } catch (err) {
          showToast('카피 생성 실패: ' + err.message, 'error');
        } finally {
          setGenerating(false);
        }
      }, [selectedClient, hasTrends, month, showToast, slidesByClient]);

      const handleCopyChange = useCallback((newCopy) => {
        if (!selectedClient) return;
        setCopies((prev) => ({ ...prev, [selectedClient.id]: newCopy }));
        setStatusMap((prev) => {
          const cur = prev[selectedClient.id];
          if (cur === 'pending') return { ...prev, [selectedClient.id]: 'generated' };
          return prev;
        });
        // 합성된 PNG가 있다면 카피 변경 시 stale 표시
        setStaleByClient((prev) => {
          if (slidesByClient[selectedClient.id]) {
            return { ...prev, [selectedClient.id]: true };
          }
          return prev;
        });
      }, [selectedClient, slidesByClient]);

      const handleRender = useCallback(async () => {
        if (!selectedClient) return;
        const copy = copies[selectedClient.id];
        if (!copy) {
          showToast('먼저 카피를 생성하세요', 'warning');
          return;
        }
        setRendering(true);
        showToast('PNG 5장 합성 중... (10~20초)', 'info');
        try {
          const cachedImage = imagesByClient[selectedClient.id]?.image_url || null;
          const res = await API.renderSlides(selectedClient.id, month, copy, cachedImage);
          // 캐시 버스팅: 같은 파일 경로라도 새로 합성됐음을 보장
          const ts = Date.now();
          const slidesWithBust = (res.slides || []).map((s) => ({
            ...s,
            url: s.url + (s.url.includes('?') ? '&' : '?') + 'v=' + ts,
          }));
          setSlidesByClient((prev) => ({
            ...prev,
            [selectedClient.id]: {
              slides: slidesWithBust,
              renderedAt: new Date().toISOString(),
              month,
            },
          }));
          setStaleByClient((prev) => {
            const next = { ...prev };
            delete next[selectedClient.id];
            return next;
          });
          showToast('슬라이드 5장 합성 완료', 'success');
        } catch (err) {
          showToast('합성 실패: ' + err.message, 'error');
        } finally {
          setRendering(false);
        }
      }, [selectedClient, copies, imagesByClient, month, showToast]);

      const handleRegenImage = useCallback(async () => {
        if (!selectedClient) return;
        if (!hasTrends) {
          showToast('먼저 상단 "이번 달 트렌드 가져오기"를 실행하세요', 'warning');
          return;
        }
        setRegeneratingImage(true);
        showToast('fal.ai 이미지 생성 중...', 'info');
        try {
          const res = await API.regenerateImage(selectedClient.id, month);
          if (!res.image_url) {
            showToast(res.message || '이미지 생성 실패 (FAL_KEY 미설정?)', 'error');
            return;
          }
          setImagesByClient((prev) => ({
            ...prev,
            [selectedClient.id]: { image_url: res.image_url, month },
          }));
          // 새 이미지가 들어왔으니 기존 PNG는 stale
          setStaleByClient((prev) => {
            if (slidesByClient[selectedClient.id]) {
              return { ...prev, [selectedClient.id]: true };
            }
            return prev;
          });
          showToast('음식 이미지 생성 완료 — "다시 합성"으로 Slide 1에 적용', 'success');
        } catch (err) {
          showToast('이미지 재생성 실패: ' + err.message, 'error');
        } finally {
          setRegeneratingImage(false);
        }
      }, [selectedClient, hasTrends, month, showToast, slidesByClient]);

      const handleDownload = useCallback(() => {
        if (!selectedClient) return;
        const slidesData = slidesByClient[selectedClient.id];
        if (!slidesData) {
          showToast('먼저 "다시 합성"을 실행하세요', 'warning');
          return;
        }
        setDownloading(true);
        try {
          const dlMonth = slidesData.month || month;
          const url = API.downloadZipUrl(selectedClient.id, dlMonth);
          // 보이지 않는 a 태그로 다운로드 트리거 (window.open은 새 탭으로 빈 페이지가 남을 수 있음)
          const a = document.createElement('a');
          a.href = url;
          a.rel = 'noopener';
          // download 속성은 same-origin일 때만 파일명 적용 — 서버 Content-Disposition이 우선
          a.download = '';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast('ZIP 다운로드 시작', 'success');
        } catch (err) {
          showToast('다운로드 실패: ' + err.message, 'error');
        } finally {
          // 다운로드는 사용자 확인 다이얼로그/스트림이라 즉시 false
          setDownloading(false);
        }
      }, [selectedClient, slidesByClient, month, showToast]);

      const handleStatusChange = useCallback((status) => {
        if (!selectedClient) return;
        setStatusMap((prev) => ({ ...prev, [selectedClient.id]: status }));
      }, [selectedClient]);

      // ============ Client CRUD ============

      const openAdd = () => setModal({ mode: 'add' });
      const openEdit = (client) => setModal({ mode: 'edit', client });

      const handleSubmitClient = useCallback(async (payload) => {
        setSubmitting(true);
        try {
          if (modal?.mode === 'add') {
            const created = await API.createClient(payload);
            setClients((prev) => [...prev, created]);
            setStatusMap((prev) => ({ ...prev, [created.id]: 'pending' }));
            setSelectedClientId(created.id);
            showToast(`${created.name} 추가됨`, 'success');
          } else if (modal?.mode === 'edit' && modal.client) {
            const updated = await API.updateClient(modal.client.id, payload);
            setClients((prev) => prev.map((c) => (c.id === updated.id ? updated : c)));
            showToast(`${updated.name} 수정됨`, 'success');
          }
          setModal(null);
        } catch (err) {
          showToast('저장 실패: ' + err.message, 'error');
        } finally {
          setSubmitting(false);
        }
      }, [modal, showToast]);

      const handleDeleteFromForm = useCallback(() => {
        if (modal?.mode !== 'edit' || !modal.client) return;
        setConfirmDelete(modal.client);
      }, [modal]);

      const handleConfirmDelete = useCallback(async () => {
        const target = confirmDelete;
        if (!target) return;
        setSubmitting(true);
        try {
          await API.deleteClient(target.id);
          setClients((prev) => prev.filter((c) => c.id !== target.id));
          setCopies((prev) => {
            const next = { ...prev };
            delete next[target.id];
            return next;
          });
          setStatusMap((prev) => {
            const next = { ...prev };
            delete next[target.id];
            return next;
          });
          setSlidesByClient((prev) => {
            const next = { ...prev };
            delete next[target.id];
            return next;
          });
          setImagesByClient((prev) => {
            const next = { ...prev };
            delete next[target.id];
            return next;
          });
          setStaleByClient((prev) => {
            const next = { ...prev };
            delete next[target.id];
            return next;
          });
          if (selectedClientId === target.id) {
            const remaining = clients.filter((c) => c.id !== target.id);
            setSelectedClientId(remaining[0]?.id || null);
          }
          setConfirmDelete(null);
          setModal(null);
          showToast(`${target.name} 삭제됨`, 'success');
        } catch (err) {
          showToast('삭제 실패: ' + err.message, 'error');
        } finally {
          setSubmitting(false);
        }
      }, [confirmDelete, selectedClientId, clients, showToast]);

      // ============ Render ============

      return (
        <div className="min-h-screen">
          <Header
            month={month}
            onMonthChange={setMonth}
            onCollect={handleCollectTrends}
            collecting={collecting}
            hasTrends={hasTrends}
            sourcesUsed={sourcesUsed}
          />

          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-5">
            {loading ? (
              <div className="flex items-center justify-center py-24 text-slate-500 text-sm">
                불러오는 중...
              </div>
            ) : (
              <div className="flex flex-col lg:flex-row gap-5">
                <ClientList
                  clients={clients}
                  selectedId={selectedClientId}
                  onSelect={setSelectedClientId}
                  onAdd={openAdd}
                  onEdit={openEdit}
                  onDelete={(client) => setConfirmDelete(client)}
                  statusMap={statusMap}
                />
                <section className="flex-1 min-w-0">
                  <WorkArea
                    client={selectedClient}
                    copy={selectedClient ? copies[selectedClient.id] : null}
                    onCopyChange={handleCopyChange}
                    onGenerate={handleGenerateCopy}
                    onRender={handleRender}
                    onRegenImage={handleRegenImage}
                    onDownload={handleDownload}
                    status={selectedClient ? (statusMap[selectedClient.id] || 'pending') : 'pending'}
                    onStatusChange={handleStatusChange}
                    generating={generating}
                    rendering={rendering}
                    regeneratingImage={regeneratingImage}
                    downloading={downloading}
                    hasTrends={hasTrends}
                    slidesData={selectedClient ? slidesByClient[selectedClient.id] : null}
                    isStale={selectedClient ? !!staleByClient[selectedClient.id] : false}
                    hasFalImage={selectedClient ? !!imagesByClient[selectedClient.id] : false}
                  />
                </section>
              </div>
            )}
          </main>

          {/* Add/Edit modal */}
          <Modal
            isOpen={!!modal}
            onClose={() => setModal(null)}
            title={modal?.mode === 'edit' ? '클라이언트 수정' : '클라이언트 추가'}
          >
            {modal && (
              <ClientForm
                initial={modal.mode === 'edit' ? modal.client : null}
                onSubmit={handleSubmitClient}
                onDelete={modal.mode === 'edit' ? handleDeleteFromForm : null}
                submitting={submitting}
              />
            )}
          </Modal>

          {/* Delete confirmation */}
          <Modal
            isOpen={!!confirmDelete}
            onClose={() => setConfirmDelete(null)}
            title="클라이언트 삭제"
            size="sm"
          >
            {confirmDelete && (
              <div className="space-y-4">
                <p className="text-sm text-slate-700">
                  <span className="font-semibold text-slate-900">{confirmDelete.name}</span>을(를) 정말 삭제하시겠습니까?<br />
                  이 작업은 되돌릴 수 없습니다.
                </p>
                <div className="flex justify-end gap-2">
                  <Button variant="secondary" onClick={() => setConfirmDelete(null)}>취소</Button>
                  <Button variant="danger" onClick={handleConfirmDelete} disabled={submitting}>
                    {submitting ? '삭제 중...' : '삭제'}
                  </Button>
                </div>
              </div>
            )}
          </Modal>

          <Toast toast={toast} onClose={() => setToast(null)} />
        </div>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
