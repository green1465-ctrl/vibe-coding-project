<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Slide Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  rel="stylesheet"
/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic",
      "Noto Sans KR", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #1f2937;
    background: #f8fafc;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    word-break: keep-all;
    line-height: 1.4;
  }

  .slide {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }

  /* === Slide 1: 음식 이미지 + 헤드라인 === */
  .s1 .bg {
    position: absolute; inset: 0;
    width: 1080px; height: 1080px;
    object-fit: cover;
    object-position: center;
  }
  .s1 .bg-fallback {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #d1d5db 0%, #6b7280 50%, #374151 100%);
  }
  .s1 .grad {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 65%;
    background: linear-gradient(
      to top,
      rgba(0,0,0,0.92) 0%,
      rgba(0,0,0,0.75) 35%,
      rgba(0,0,0,0.35) 70%,
      rgba(0,0,0,0) 100%
    );
  }
  .s1 .client-tag {
    position: absolute; top: 56px; left: 64px;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 14px 24px;
    background: rgba(255,255,255,0.92);
    border-radius: 999px;
    font-size: 26px; font-weight: 700;
    color: #111827;
    letter-spacing: -0.02em;
  }
  .s1 .client-tag .dot {
    width: 12px; height: 12px; border-radius: 999px;
  }
  .s1 .headline {
    position: absolute; left: 64px; right: 64px; bottom: 96px;
    color: #ffffff;
    font-size: 84px;
    font-weight: 900;
    line-height: 1.18;
    letter-spacing: -0.03em;
    text-shadow: 0 4px 24px rgba(0,0,0,0.55);
  }
  .s1 .badge-bottom {
    position: absolute; left: 64px; bottom: 56px;
    color: rgba(255,255,255,0.85);
    font-size: 22px; font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* === Slide 2: 시즌 인사이트 === */
  .s2 {
    background: #f1f5f9;
    padding: 96px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .s2 .accent-bar {
    width: 96px; height: 10px; border-radius: 999px;
    margin-bottom: 32px;
  }
  .s2 .label {
    font-size: 30px; font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 16px;
  }
  .s2 .body {
    font-size: 60px; font-weight: 800;
    line-height: 1.32;
    letter-spacing: -0.025em;
    color: #0f172a;
  }
  .s2 .footer-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 22px; color: #475569; font-weight: 600;
  }

  /* === Slide 3, 4: 추천 메뉴 === */
  .s3, .s4 {
    background: #ffffff;
    padding: 100px 80px;
    display: flex; flex-direction: column;
  }
  .s3 .badge, .s4 .badge {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 16px 28px;
    border-radius: 999px;
    font-size: 26px; font-weight: 800;
    align-self: flex-start;
    margin-bottom: 48px;
    letter-spacing: 0.01em;
  }
  .s3 .title, .s4 .title {
    font-size: 64px; font-weight: 900;
    line-height: 1.22;
    letter-spacing: -0.03em;
    color: #0f172a;
    margin-bottom: 36px;
  }
  .s3 .body, .s4 .body {
    font-size: 36px; font-weight: 500;
    line-height: 1.55;
    color: #334155;
  }
  .s3 .footer, .s4 .footer {
    margin-top: auto;
    font-size: 22px; color: #64748b; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* === Slide 5: CTA === */
  .s5 {
    padding: 120px 80px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    color: #ffffff;
    background-size: cover; background-position: center;
  }
  .s5 .top-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 24px; font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .s5 .cta {
    font-size: 92px; font-weight: 900;
    line-height: 1.16;
    letter-spacing: -0.035em;
    text-shadow: 0 4px 24px rgba(0,0,0,0.45);
  }
  .s5 .cta .small {
    display: block;
    font-size: 36px; font-weight: 700;
    margin-bottom: 32px;
    opacity: 0.85;
    letter-spacing: -0.02em;
  }
  .s5 .source {
    font-size: 20px;
    opacity: 0.8;
    font-weight: 500;
    letter-spacing: 0.02em;
    word-break: break-all;
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // === Query string parsing ===
  function parseParams() {
    var raw = window.location.search.replace(/^\?/, '') ||
              window.location.hash.replace(/^#/, '');
    var out = {};
    if (!raw) return out;
    raw.split('&').forEach(function (pair) {
      if (!pair) return;
      var eq = pair.indexOf('=');
      var k = eq === -1 ? pair : pair.slice(0, eq);
      var v = eq === -1 ? '' : pair.slice(eq + 1);
      try {
        out[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' '));
      } catch (_) {
        out[k] = v;
      }
    });
    return out;
  }

  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // === Category accent palette ===
  var PALETTE = {
    한식:   { bar: '#78716c', tagBg: '#f5f5f4', tagText: '#44403c', dot: '#a8a29e', s5bg: 'linear-gradient(135deg, #44403c 0%, #1c1917 100%)' },
    분식:   { bar: '#f97316', tagBg: '#ffedd5', tagText: '#9a3412', dot: '#fb923c', s5bg: 'linear-gradient(135deg, #ea580c 0%, #7c2d12 100%)' },
    카페:   { bar: '#d97706', tagBg: '#fef3c7', tagText: '#78350f', dot: '#f59e0b', s5bg: 'linear-gradient(135deg, #b45309 0%, #422006 100%)' },
    default:{ bar: '#10b981', tagBg: '#d1fae5', tagText: '#065f46', dot: '#34d399', s5bg: 'linear-gradient(135deg, #047857 0%, #064e3b 100%)' },
  };

  function paletteFor(cat) {
    return PALETTE[cat] || PALETTE.default;
  }

  // === Render ===
  function render() {
    var p = parseParams();
    var slide = parseInt(p.slide || '1', 10);
    var category = p.category || '';
    var clientName = p.client_name || '';
    var headline = p.headline || '';
    var slide2 = p.slide2 || '';
    var slide3 = p.slide3 || '';
    var slide4 = p.slide4 || '';
    var cta = p.cta || '';
    var source = p.source || '';
    var imageUrl = p.image_url || '';
    var pal = paletteFor(category);

    var root = document.getElementById('root');
    var html = '';

    if (slide === 1) {
      var bg = imageUrl
        ? '<img id="slide1-bg" class="bg" alt="" crossorigin="anonymous" referrerpolicy="no-referrer" src="' + escHtml(imageUrl) + '" />'
        : '<div class="bg-fallback"></div>';
      html =
        '<section class="slide s1">' +
          bg +
          '<div class="grad"></div>' +
          '<div class="client-tag">' +
            '<span class="dot" style="background:' + pal.dot + '"></span>' +
            '<span>' + escHtml(clientName) + '</span>' +
          '</div>' +
          '<div class="headline">' + escHtml(headline) + '</div>' +
          '<div class="badge-bottom">' + escHtml(category) + ' · 시즌 카드뉴스</div>' +
        '</section>';
    } else if (slide === 2) {
      html =
        '<section class="slide s2">' +
          '<div>' +
            '<div class="accent-bar" style="background:' + pal.bar + '"></div>' +
            '<div class="label" style="color:' + pal.bar + '">' +
              escHtml(category) + ' · 이번 시즌 인사이트' +
            '</div>' +
            '<div class="body">' + escHtml(slide2) + '</div>' +
          '</div>' +
          '<div class="footer-row">' +
            '<span>' + escHtml(clientName) + '</span>' +
            '<span>02 / 05</span>' +
          '</div>' +
        '</section>';
    } else if (slide === 3) {
      html =
        '<section class="slide s3">' +
          '<div class="badge" style="background:' + pal.tagBg + ';color:' + pal.tagText + '">' +
            '추천 메뉴 ①' +
          '</div>' +
          '<div class="title">' + escHtml(headline) + '</div>' +
          '<div class="body">' + escHtml(slide3) + '</div>' +
          '<div class="footer">' +
            '<span>' + escHtml(clientName) + ' · ' + escHtml(category) + '</span>' +
            '<span>03 / 05</span>' +
          '</div>' +
        '</section>';
    } else if (slide === 4) {
      html =
        '<section class="slide s4">' +
          '<div class="badge" style="background:' + pal.tagBg + ';color:' + pal.tagText + '">' +
            '추천 메뉴 ② · 마케팅 포인트' +
          '</div>' +
          '<div class="title">' + escHtml(headline) + '</div>' +
          '<div class="body">' + escHtml(slide4) + '</div>' +
          '<div class="footer">' +
            '<span>' + escHtml(clientName) + ' · ' + escHtml(category) + '</span>' +
            '<span>04 / 05</span>' +
          '</div>' +
        '</section>';
    } else {
      // Slide 5: CTA
      html =
        '<section class="slide s5" style="background:' + pal.s5bg + '">' +
          '<div class="top-row">' +
            '<span>' + escHtml(clientName) + '</span>' +
            '<span>05 / 05</span>' +
          '</div>' +
          '<div class="cta">' +
            '<span class="small">' + escHtml(category) + ' 시즌 캠페인</span>' +
            escHtml(cta) +
          '</div>' +
          '<div class="source">' +
            (source ? 'Source · ' + escHtml(source) : '') +
          '</div>' +
        '</section>';
    }

    root.innerHTML = html;

    var pending = [];
    // 폰트 로드 대기
    if (document.fonts && document.fonts.ready) {
      pending.push(document.fonts.ready.catch(function () {}));
    }
    // Slide 1 이미지 로드 대기 (있을 때만)
    var img = document.getElementById('slide1-bg');
    if (img) {
      pending.push(
        new Promise(function (resolve) {
          if (img.complete && img.naturalWidth > 0) return resolve();
          img.addEventListener('load', resolve);
          img.addEventListener('error', resolve);
          // 안전망: 8초 안에 못 받으면 그냥 진행
          setTimeout(resolve, 8000);
        })
      );
    }

    Promise.all(pending).then(function () {
      document.body.dataset.ready = '1';
    });
  }

  render();
</script>
</body>
</html>
