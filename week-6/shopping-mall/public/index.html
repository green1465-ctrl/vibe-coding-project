<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MUJI SHOP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- TossPayments SDK v2 (UMD) — exposes window.TossPayments -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Noto Sans KR", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-white text-neutral-900">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useContext, createContext, useCallback, useMemo } = React;

    // ========================================
    // Constants & Helpers
    // ========================================
    const API_BASE_URL = '/api';
    const TOKEN_KEY = 'token';

    const formatPrice = (price) => {
      if (price == null || isNaN(price)) return '';
      return '₩' + Number(price).toLocaleString('ko-KR');
    };

    // fetch wrapper with automatic Authorization header
    async function apiFetch(path, options = {}) {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {}),
      };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const res = await fetch(`${API_BASE_URL}${path}`, {
        ...options,
        headers,
      });

      let data = null;
      try {
        data = await res.json();
      } catch (e) {
        data = null;
      }

      return { ok: res.ok, status: res.status, data };
    }

    // ========================================
    // Auth Context
    // ========================================
    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      useEffect(() => {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) {
          setAuthLoading(false);
          return;
        }
        apiFetch('/auth/me')
          .then(({ ok, status, data }) => {
            if (ok && data?.user) {
              setUser(data.user);
            } else if (status === 401) {
              localStorage.removeItem(TOKEN_KEY);
              setUser(null);
            }
          })
          .catch(() => {
            // silent — leave unauthenticated
          })
          .finally(() => setAuthLoading(false));
      }, []);

      const login = useCallback((token, userObj) => {
        localStorage.setItem(TOKEN_KEY, token);
        setUser(userObj);
      }, []);

      const logout = useCallback(() => {
        localStorage.removeItem(TOKEN_KEY);
        setUser(null);
      }, []);

      const value = useMemo(
        () => ({ user, authLoading, login, logout }),
        [user, authLoading, login, logout]
      );

      return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }

    const useAuth = () => useContext(AuthContext);

    // ========================================
    // Cart Context
    // ========================================
    const CartContext = createContext(null);

    function CartProvider({ children }) {
      const { user } = useAuth();
      const [items, setItems] = useState([]);
      const [total, setTotal] = useState(0);
      const [itemCount, setItemCount] = useState(0);
      const [loading, setLoading] = useState(false);

      const refresh = useCallback(async () => {
        if (!user) {
          setItems([]);
          setTotal(0);
          setItemCount(0);
          return;
        }
        setLoading(true);
        try {
          const { ok, data } = await apiFetch('/cart');
          if (ok && data) {
            setItems(data.items || []);
            setTotal(data.total || 0);
            setItemCount(data.itemCount || 0);
          }
        } catch (e) {
          // silent
        } finally {
          setLoading(false);
        }
      }, [user]);

      // user 바뀌면 자동 새로고침
      useEffect(() => {
        refresh();
      }, [refresh]);

      const addItem = useCallback(
        async (productId, quantity = 1) => {
          const { ok, data } = await apiFetch('/cart', {
            method: 'POST',
            body: JSON.stringify({ product_id: productId, quantity }),
          });
          if (ok) await refresh();
          return { ok, data };
        },
        [refresh]
      );

      const updateQty = useCallback(
        async (itemId, qty) => {
          // optimistic 업데이트
          setItems((prev) =>
            prev.map((it) =>
              it.id === itemId
                ? { ...it, quantity: qty, subtotal: it.product.price * qty }
                : it
            )
          );
          const { ok, data } = await apiFetch(`/cart/${itemId}`, {
            method: 'PATCH',
            body: JSON.stringify({ quantity: qty }),
          });
          await refresh();
          return { ok, data };
        },
        [refresh]
      );

      const removeItem = useCallback(
        async (itemId) => {
          // optimistic 업데이트
          setItems((prev) => prev.filter((it) => it.id !== itemId));
          const { ok, data } = await apiFetch(`/cart/${itemId}`, {
            method: 'DELETE',
          });
          await refresh();
          return { ok, data };
        },
        [refresh]
      );

      const value = useMemo(
        () => ({ items, total, itemCount, loading, refresh, addItem, updateQty, removeItem }),
        [items, total, itemCount, loading, refresh, addItem, updateQty, removeItem]
      );

      return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
    }

    const useCart = () => useContext(CartContext);

    // ========================================
    // Design System Components
    // ========================================
    function Button({
      children,
      variant = 'primary',
      size = 'md',
      type = 'button',
      disabled = false,
      onClick,
      className = '',
      ...rest
    }) {
      const base =
        'inline-flex items-center justify-center font-medium rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-neutral-900 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-neutral-900 text-white hover:bg-neutral-800',
        secondary: 'bg-white text-neutral-900 border border-neutral-300 hover:bg-neutral-50',
        ghost: 'bg-transparent text-neutral-700 hover:bg-neutral-100',
        danger: 'bg-red-600 text-white hover:bg-red-700',
      };
      const sizes = {
        sm: 'h-8 px-3 text-sm',
        md: 'h-10 px-4 text-sm',
        lg: 'h-12 px-6 text-base',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({
      label,
      type = 'text',
      value,
      onChange,
      placeholder,
      error,
      disabled = false,
      id,
      autoComplete,
      className = '',
    }) {
      const inputId = id || `input-${Math.random().toString(36).slice(2, 9)}`;
      return (
        <div className={`flex flex-col gap-1.5 ${className}`}>
          {label && (
            <label htmlFor={inputId} className="text-sm font-medium text-neutral-800">
              {label}
            </label>
          )}
          <input
            id={inputId}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            autoComplete={autoComplete}
            className={`h-11 px-3 rounded-md border bg-white text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-neutral-900 disabled:bg-neutral-50 ${
              error ? 'border-red-500' : 'border-neutral-300'
            }`}
          />
          {error && <span className="text-xs text-red-600">{error}</span>}
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white border border-neutral-200 rounded-md ${className}`}>
          {children}
        </div>
      );
    }

    // ========================================
    // Router (Hash-based)
    // ========================================
    const RouterContext = createContext({ path: '/', navigate: () => {} });

    function getHashPath() {
      const h = window.location.hash || '#/';
      return h.startsWith('#') ? h.slice(1) || '/' : '/';
    }

    function Router({ children }) {
      const [path, setPath] = useState(getHashPath());

      useEffect(() => {
        const onHashChange = () => setPath(getHashPath());
        window.addEventListener('hashchange', onHashChange);
        // Normalize empty hash on first load
        if (!window.location.hash) window.location.hash = '#/';
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      const navigate = useCallback((to) => {
        const next = to.startsWith('/') ? to : `/${to}`;
        window.location.hash = `#${next}`;
      }, []);

      const value = useMemo(() => ({ path, navigate }), [path, navigate]);
      return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
    }

    const useRouter = () => useContext(RouterContext);

    // matchRoute: returns { params } if pattern matches, else null
    function matchRoute(pattern, path) {
      const pSeg = pattern.split('/').filter(Boolean);
      const aSeg = path.split('/').filter(Boolean);
      if (pSeg.length !== aSeg.length) return null;
      const params = {};
      for (let i = 0; i < pSeg.length; i++) {
        if (pSeg[i].startsWith(':')) {
          params[pSeg[i].slice(1)] = decodeURIComponent(aSeg[i]);
        } else if (pSeg[i] !== aSeg[i]) {
          return null;
        }
      }
      return { params };
    }

    function Link({ to, children, className = '', onClick }) {
      const { navigate } = useRouter();
      const handleClick = (e) => {
        e.preventDefault();
        if (onClick) onClick(e);
        navigate(to);
      };
      return (
        <a href={`#${to}`} onClick={handleClick} className={className}>
          {children}
        </a>
      );
    }

    // ========================================
    // Layout: Header
    // ========================================
    function CartIcon({ count }) {
      return (
        <Link
          to="/cart"
          className="relative inline-flex items-center justify-center w-9 h-9 text-neutral-700 hover:text-neutral-900 rounded-md hover:bg-neutral-100"
          aria-label="장바구니"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          {count > 0 && (
            <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-neutral-900 text-white text-[10px] font-semibold flex items-center justify-center">
              {count > 99 ? '99+' : count}
            </span>
          )}
        </Link>
      );
    }

    function Header() {
      const { user, logout, authLoading } = useAuth();
      const { itemCount } = useCart();
      const { navigate } = useRouter();

      const handleLogout = () => {
        logout();
        navigate('/');
      };

      return (
        <header className="sticky top-0 z-30 bg-white border-b border-neutral-200">
          <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <Link
              to="/"
              className="text-xl font-semibold tracking-widest text-neutral-900 hover:opacity-70"
            >
              MUJI SHOP
            </Link>
            <nav className="flex items-center gap-3 sm:gap-4 text-sm">
              {authLoading ? (
                <span className="text-neutral-400">…</span>
              ) : user ? (
                <>
                  {user.role === 'admin' && (
                    <Link
                      to="/admin"
                      className="hidden sm:inline-flex items-center h-8 px-2.5 rounded-md text-xs font-medium text-neutral-700 border border-neutral-300 hover:bg-neutral-50"
                    >
                      관리자
                    </Link>
                  )}
                  <CartIcon count={itemCount} />
                  <Link
                    to="/mypage"
                    className="hidden sm:inline text-neutral-700 hover:text-neutral-900 hover:underline"
                  >
                    마이페이지
                  </Link>
                  <span className="hidden lg:inline text-neutral-600 truncate max-w-[200px]">
                    {user.email}
                  </span>
                  <Button variant="secondary" size="sm" onClick={handleLogout}>
                    로그아웃
                  </Button>
                </>
              ) : (
                <>
                  <Link
                    to="/login"
                    className="text-neutral-700 hover:text-neutral-900 hover:underline"
                  >
                    로그인
                  </Link>
                  <Link
                    to="/signup"
                    className="text-neutral-700 hover:text-neutral-900 hover:underline"
                  >
                    회원가입
                  </Link>
                </>
              )}
            </nav>
          </div>
        </header>
      );
    }

    // ========================================
    // Page: Home (Product List)
    // ========================================
    function ProductCardSkeleton() {
      return (
        <div className="animate-pulse">
          <div className="aspect-square bg-neutral-100 rounded-md" />
          <div className="mt-3 h-4 bg-neutral-100 rounded w-3/4" />
          <div className="mt-2 h-4 bg-neutral-100 rounded w-1/3" />
          <div className="mt-2 h-3 bg-neutral-100 rounded w-full" />
        </div>
      );
    }

    function ProductCard({ product }) {
      const { user } = useAuth();
      const { addItem } = useCart();
      const { navigate } = useRouter();
      const [busy, setBusy] = useState(false);

      const handleAdd = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!user) {
          alert('로그인이 필요합니다');
          navigate('/login');
          return;
        }
        if (busy) return;
        setBusy(true);
        const { ok, data } = await addItem(product.id, 1);
        setBusy(false);
        if (!ok) {
          alert(data?.error || '담기에 실패했습니다');
        }
      };

      return (
        <div className="group block">
          <Link to={`/products/${product.id}`} className="block focus:outline-none">
            <div className="aspect-square overflow-hidden rounded-md bg-neutral-100">
              {product.image_url ? (
                <img
                  src={product.image_url}
                  alt={product.name}
                  className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                  loading="lazy"
                  onError={(e) => {
                    e.currentTarget.style.display = 'none';
                  }}
                />
              ) : (
                <div className="w-full h-full flex items-center justify-center text-neutral-300 text-sm">
                  no image
                </div>
              )}
            </div>
            <div className="mt-3 px-0.5">
              <h3 className="text-sm font-medium text-neutral-900 truncate">
                {product.name}
              </h3>
              <p className="mt-1 text-sm text-neutral-900">{formatPrice(product.price)}</p>
              {product.description && (
                <p className="mt-1 text-xs text-neutral-500 line-clamp-2">
                  {product.description}
                </p>
              )}
            </div>
          </Link>
          <div className="mt-3 px-0.5">
            <Button
              variant="secondary"
              size="sm"
              onClick={handleAdd}
              disabled={busy}
              className="w-full"
            >
              {busy ? '담는 중…' : '장바구니 담기'}
            </Button>
          </div>
        </div>
      );
    }

    function HomePage() {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        apiFetch('/products')
          .then(({ ok, data }) => {
            if (cancelled) return;
            if (ok && Array.isArray(data?.products)) {
              setProducts(data.products);
              setError(null);
            } else {
              setError(data?.error || '상품을 불러오지 못했습니다.');
            }
          })
          .catch(() => !cancelled && setError('네트워크 오류가 발생했습니다.'))
          .finally(() => !cancelled && setLoading(false));
        return () => {
          cancelled = true;
        };
      }, []);

      return (
        <main className="max-w-6xl mx-auto px-4 py-10">
          <div className="mb-8">
            <h1 className="text-2xl font-semibold tracking-tight text-neutral-900">
              전체 상품
            </h1>
            <p className="mt-1 text-sm text-neutral-500">
              간결한 일상을 위한 셀렉션
            </p>
          </div>

          {loading && (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-6 gap-y-10">
              {Array.from({ length: 8 }).map((_, i) => (
                <ProductCardSkeleton key={i} />
              ))}
            </div>
          )}

          {!loading && error && (
            <div className="text-center py-20 text-red-600 text-sm">{error}</div>
          )}

          {!loading && !error && products.length === 0 && (
            <div className="text-center py-20 text-neutral-500 text-sm">
              등록된 상품이 없습니다.
            </div>
          )}

          {!loading && !error && products.length > 0 && (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-6 gap-y-10">
              {products.map((p) => (
                <ProductCard key={p.id} product={p} />
              ))}
            </div>
          )}
        </main>
      );
    }

    // ========================================
    // Page: Product Detail
    // ========================================
    function ProductDetailPage({ id }) {
      const { user } = useAuth();
      const { addItem } = useCart();
      const { navigate } = useRouter();
      const [product, setProduct] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [adding, setAdding] = useState(false);
      const [qty, setQty] = useState(1);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        setError(null);
        setProduct(null);
        apiFetch(`/products/${encodeURIComponent(id)}`)
          .then(({ ok, status, data }) => {
            if (cancelled) return;
            if (ok && data?.product) {
              setProduct(data.product);
            } else if (status === 404) {
              setError('상품을 찾을 수 없습니다.');
            } else {
              setError(data?.error || '상품을 불러오지 못했습니다.');
            }
          })
          .catch(() => !cancelled && setError('네트워크 오류가 발생했습니다.'))
          .finally(() => !cancelled && setLoading(false));
        return () => {
          cancelled = true;
        };
      }, [id]);

      const handleAddToCart = async () => {
        if (!user) {
          alert('로그인이 필요합니다');
          navigate('/login');
          return;
        }
        if (adding || !product) return;
        setAdding(true);
        const { ok, data } = await addItem(product.id, qty);
        setAdding(false);
        if (ok) {
          if (confirm('장바구니에 담겼습니다. 장바구니로 이동할까요?')) {
            navigate('/cart');
          }
        } else {
          alert(data?.error || '담기에 실패했습니다');
        }
      };

      return (
        <main className="max-w-5xl mx-auto px-4 py-10">
          <div className="mb-6">
            <Link
              to="/"
              className="inline-flex items-center text-sm text-neutral-600 hover:text-neutral-900"
            >
              ← 목록으로
            </Link>
          </div>

          {loading && (
            <div className="text-center py-20 text-neutral-500 text-sm">불러오는 중…</div>
          )}

          {!loading && error && (
            <div className="text-center py-20 text-red-600 text-sm">{error}</div>
          )}

          {!loading && !error && product && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
              <div className="aspect-square overflow-hidden rounded-md bg-neutral-100">
                {product.image_url ? (
                  <img
                    src={product.image_url}
                    alt={product.name}
                    className="w-full h-full object-cover"
                  />
                ) : (
                  <div className="w-full h-full flex items-center justify-center text-neutral-300 text-sm">
                    no image
                  </div>
                )}
              </div>

              <div className="flex flex-col">
                <h1 className="text-2xl font-semibold tracking-tight text-neutral-900">
                  {product.name}
                </h1>
                <p className="mt-3 text-xl text-neutral-900">
                  {formatPrice(product.price)}
                </p>

                {product.description && (
                  <p className="mt-6 text-sm leading-6 text-neutral-700 whitespace-pre-line">
                    {product.description}
                  </p>
                )}

                <div className="mt-8 flex flex-col sm:flex-row gap-3 sm:items-center">
                  <div className="inline-flex items-center border border-neutral-300 rounded-md h-12 self-start">
                    <button
                      type="button"
                      onClick={() => setQty((q) => Math.max(1, q - 1))}
                      className="w-10 h-full flex items-center justify-center text-neutral-700 hover:bg-neutral-100 disabled:opacity-30"
                      disabled={qty <= 1}
                      aria-label="수량 감소"
                    >
                      −
                    </button>
                    <span className="w-10 text-center text-sm font-medium select-none">
                      {qty}
                    </span>
                    <button
                      type="button"
                      onClick={() => setQty((q) => Math.min(99, q + 1))}
                      className="w-10 h-full flex items-center justify-center text-neutral-700 hover:bg-neutral-100 disabled:opacity-30"
                      disabled={qty >= 99}
                      aria-label="수량 증가"
                    >
                      +
                    </button>
                  </div>
                  <Button
                    size="lg"
                    onClick={handleAddToCart}
                    disabled={adding}
                    className="flex-1"
                  >
                    {adding ? '담는 중…' : '장바구니에 담기'}
                  </Button>
                </div>
              </div>
            </div>
          )}
        </main>
      );
    }

    // ========================================
    // Page: Login
    // ========================================
    function LoginPage() {
      const { login } = useAuth();
      const { navigate } = useRouter();
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (submitting) return;
        setError(null);

        if (!email.trim() || !password) {
          setError('이메일과 비밀번호를 입력해주세요.');
          return;
        }

        setSubmitting(true);
        try {
          const { ok, data } = await apiFetch('/auth/login', {
            method: 'POST',

    function SignupPage() {
      const { login } = useAuth();

      const [email, setEmail] = useState('');

      const [passwordConfirm, setPasswordConfirm] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (submitting) return;
        setError(null);

        if (!email.trim() || !password) {
          setError('이메일과 비밀번호를 입력해주세요.');

        }
        if (password.length < 6) {
          setError('비밀번호는 6자 이상이어야 합니다.');
          return;
        }
        if (password !== passwordConfirm) {
          setError('비밀번호가 일치하지 않습니다.');
          return;
        }

        setSubmitting(true);
        try {
          const { ok, data } = await apiFetch('/auth/signup', {
            method: 'POST',
            body: JSON.stringify({ email: email.trim(), password }),
          });
          if (ok && data?.token && data?.user) {
            login(data.token, data.user);
            navigate('/');
          } else {
            setError(data?.error || '회원가입에 실패했습니다.');
          }
        } catch (err) {
          setError('네트워크 오류가 발생했습니다.');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <main className="max-w-md mx-auto px-4 py-16">

            <h1 className="text-xl font-semibold tracking-tight text-neutral-900 text-center">

            <form onSubmit={handleSubmit} className="mt-8 flex flex-col gap-4">
              <Input
                label="이메일"
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="you@example.com"
                autoComplete="email"
              />
              <Input
                label="비밀번호"
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="6자 이상"
                autoComplete="new-password"
              />
              <Input
                label="비밀번호 확인"

                placeholder="비밀번호 재입력"

              />

              {error && (
                <div className="text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2">

              <Button type="submit" size="lg" disabled={submitting} className="mt-2">

            </form>

            <p className="mt-6 text-sm text-center text-neutral-600">

    function CartLineItem({ item }) {
      const { updateQty, removeItem } = useCart();
      const [busy, setBusy] = useState(false);

      const handleDec = async () => {
        if (item.quantity <= 1 || busy) return;
        setBusy(true);
        await updateQty(item.id, item.quantity - 1);
        setBusy(false);
      };
      const handleInc = async () => {
        if (item.quantity >= 99 || busy) return;
        setBusy(true);
        await updateQty(item.id, item.quantity + 1);
        setBusy(false);
      };
      const handleRemove = async () => {
        if (busy) return;
        if (!confirm(`'${item.product.name}'을(를) 삭제하시겠어요?`)) return;
        setBusy(true);
        await removeItem(item.id);
        // (after refresh, this component will be unmounted)
      };

      return (
        <li className="flex gap-4 py-5 border-b border-neutral-200">
          <Link to={`/products/${item.product.id}`} className="shrink-0">
            <div className="w-20 h-20 sm:w-24 sm:h-24 rounded-md overflow-hidden bg-neutral-100">
              {item.product.image_url ? (
                <img
                  src={item.product.image_url}
                  alt={item.product.name}
                  className="w-full h-full object-cover"
                />
              ) : null}
            </div>
          </Link>

          <div className="flex-1 min-w-0 flex flex-col">
            <div className="flex items-start justify-between gap-3">
              <div className="min-w-0">
                <Link
                  to={`/products/${item.product.id}`}
                  className="text-sm font-medium text-neutral-900 hover:underline line-clamp-1"
                >
                  {item.product.name}
                </Link>
                <p className="mt-1 text-sm text-neutral-500">
                  {formatPrice(item.product.price)}
                </p>
              </div>
              <button
                type="button"
                onClick={handleRemove}
                disabled={busy}
                className="text-xs text-neutral-400 hover:text-red-600 disabled:opacity-50 shrink-0"
                aria-label="삭제"
              >
                삭제
              </button>
            </div>

            <div className="mt-auto flex items-end justify-between pt-3">
              <div className="inline-flex items-center border border-neutral-300 rounded-md h-9">
                <button
                  type="button"
                  onClick={handleDec}

                  className="w-8 h-full flex items-center justify-center text-neutral-700 hover:bg-neutral-100 disabled:opacity-30"
                  aria-label="수량 감소"

                </button>

                  aria-label="수량 증가"

                </button>
              </div>
              <p className="text-sm font-semibold text-neutral-900">
                {formatPrice(item.subtotal)}
              </p>
            </div>
          </div>
        </li>
      );

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${yyyy}.${mm}.${dd} ${hh}:${mi}`;
    }

    // ========================================
    // ImageKit Upload Helper
    // ========================================
    // 1) /api/imagekit/auth 에서 token/expire/signature/publicKey/urlEndpoint 받기
    // 2) FormData 로 ImageKit Upload API에 직접 POST
    //    privateKey 는 절대 클라이언트로 내려오지 않음
    async function uploadImageToImagekit(file, { folder = '/products' } = {}) {
      const authRes = await apiFetch('/imagekit/auth');
      if (!authRes.ok) {
        const msg = authRes.data?.error || 'ImageKit 인증 실패';
        throw new Error(msg);
      }
      const { token, expire, signature, publicKey } = authRes.data;

      const fd = new FormData();
      fd.append('file', file);
      // 파일명: 타임스탬프 + 원본 확장자
      const ext = (file.name.match(/\.[a-zA-Z0-9]+$/) || ['.png'])[0];
      fd.append('fileName', `product-${Date.now()}${ext}`);
      fd.append('publicKey', publicKey);
      fd.append('signature', signature);
      fd.append('expire', String(expire));
      fd.append('token', token);
      fd.append('folder', folder);
      fd.append('useUniqueFileName', 'true');

      const r = await fetch('https://upload.imagekit.io/api/v1/files/upload', {
        method: 'POST',
        body: fd,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        throw new Error(data?.message || `업로드 실패 (${r.status})`);
      }
      // ImageKit 응답: { url, fileId, name, ... }
      return data;
    }

    // ========================================
    // Page: Admin
    // ========================================
    function ImageDropzone({ value, onChange, disabled }) {
      const [uploading, setUploading] = useState(false);
      const [progress, setProgress] = useState('');
      const [error, setError] = useState(null);
      const inputRef = React.useRef(null);

      const handleFile = async (file) => {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setError('이미지 파일만 업로드할 수 있습니다');
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          setError('10MB 이하 파일만 업로드할 수 있습니다');
          return;
        }
        setError(null);
        setUploading(true);
        setProgress('업로드 중…');
        try {
          const result = await uploadImageToImagekit(file);
          if (result?.url) {
            onChange(result.url);
            setProgress('업로드 완료');
          } else {
            setError('응답에서 URL 을 찾을 수 없습니다');
          }
        } catch (e) {
          setError(e.message || '업로드 실패');
        } finally {
          setUploading(false);
        }
      };

      const handleClear = () => {
        onChange('');
        setProgress('');
        setError(null);
        if (inputRef.current) inputRef.current.value = '';
      };

      return (
        <div className="flex flex-col gap-2">
          <label className="text-sm font-medium text-neutral-800">상품 이미지</label>
          <div className="flex gap-3">
            <div className="w-28 h-28 shrink-0 rounded-md overflow-hidden border border-neutral-200 bg-neutral-50 flex items-center justify-center">
              {value ? (
                <img src={value} alt="" className="w-full h-full object-cover" />
              ) : (
                <span className="text-xs text-neutral-400">미리보기</span>
              )}
            </div>
            <div className="flex-1 flex flex-col gap-2">
              <input
                ref={inputRef}
                type="file"
                accept="image/*"
                disabled={disabled || uploading}
                onChange={(e) => handleFile(e.target.files?.[0])}
                className="text-sm file:mr-3 file:h-9 file:px-3 file:rounded-md file:border-0 file:bg-neutral-900 file:text-white file:cursor-pointer hover:file:bg-neutral-800 disabled:opacity-50"
              />
              <Input
                placeholder="또는 이미지 URL 직접 입력"
                value={value}
                onChange={(e) => onChange(e.target.value)}
                disabled={disabled || uploading}
              />
              {uploading && (
                <span className="text-xs text-neutral-500">{progress}</span>
              )}
              {!uploading && value && (
                <div className="flex items-center gap-2">
                  <span className="text-xs text-emerald-600 truncate flex-1" title={value}>
                    ✓ {value}
                  </span>
                  <button
                    type="button"
                    onClick={handleClear}
                    disabled={disabled}
                    className="text-xs text-neutral-400 hover:text-red-600"
                  >
                    제거
                  </button>
                </div>
              )}
              {error && <span className="text-xs text-red-600">{error}</span>}
            </div>
          </div>
        </div>
      );
    }

    function ProductForm({ initial, onSubmit, onCancel, submitting }) {
      const [name, setName] = useState(initial?.name || '');
      const [price, setPrice] = useState(initial?.price != null ? String(initial.price) : '');
      const [imageUrl, setImageUrl] = useState(initial?.image_url || '');
      const [description, setDescription] = useState(initial?.description || '');
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        if (!name.trim()) return setError('상품명을 입력해주세요');
        const p = Number(price);
        if (!Number.isFinite(p) || p < 0 || !Number.isInteger(p)) {
          return setError('가격은 0 이상의 정수여야 합니다');
        }
        await onSubmit({
          name: name.trim(),
          price: p,
          image_url: imageUrl.trim() || null,
          description: description || null,
        }, (msg) => setError(msg));
      };

      return (
        <form onSubmit={handleSubmit} className="flex flex-col gap-5">
          <Input
            label="상품명"
            value={name}
            onChange={(e) => setName(e.target.value)}
            placeholder="예: 베이직 화이트 티셔츠"
            disabled={submitting}
          />
          <Input
            label="가격 (원)"
            type="number"
            value={price}
            onChange={(e) => setPrice(e.target.value)}
            placeholder="예: 19900"
            disabled={submitting}
          />
          <ImageDropzone
            value={imageUrl}
            onChange={setImageUrl}
            disabled={submitting}
          />
          <div className="flex flex-col gap-1.5">
            <label className="text-sm font-medium text-neutral-800">설명</label>
            <textarea
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              placeholder="상품에 대한 간단한 설명"
              rows={4}
              disabled={submitting}
              className="px-3 py-2 rounded-md border border-neutral-300 bg-white text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-neutral-900 resize-y"
            />
          </div>

          {error && (
            <div className="text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2">
              {error}
            </div>
          )}

          <div className="flex gap-3 pt-2">
            <Button type="submit" disabled={submitting}>
              {submitting ? '저장 중…' : initial ? '수정 저장' : '상품 추가'}
            </Button>
            {onCancel && (
              <Button type="button" variant="secondary" onClick={onCancel} disabled={submitting}>
                취소
              </Button>
            )}
          </div>
        </form>
      );
    }

    function AdminProductRow({ product, onEdit, onDelete, busy }) {
      return (
        <tr className="border-b border-neutral-200">
          <td className="py-3 pr-3 w-16">
            <div className="w-12 h-12 rounded-md overflow-hidden bg-neutral-100">
              {product.image_url ? (
                <img src={product.image_url} alt="" className="w-full h-full object-cover" />
              ) : null}
            </div>
          </td>
          <td className="py-3 pr-3 text-sm text-neutral-900">{product.name}</td>
          <td className="py-3 pr-3 text-sm text-neutral-700 hidden md:table-cell">
            {formatPrice(product.price)}
          </td>
          <td className="py-3 pr-3 text-sm text-neutral-500 hidden lg:table-cell max-w-xs truncate">
            {product.description}
          </td>
          <td className="py-3 text-right whitespace-nowrap">
            <button
              type="button"
              onClick={() => onEdit(product)}
              disabled={busy}
              className="text-xs text-neutral-700 hover:text-neutral-900 disabled:opacity-50 mr-3"
            >
              수정
            </button>
            <button
              type="button"
              onClick={() => onDelete(product)}
              disabled={busy}
              className="text-xs text-red-600 hover:text-red-700 disabled:opacity-50"
            >
              삭제
            </button>
          </td>
        </tr>
      );
    }

    function AdminPage() {
      const { user, authLoading } = useAuth();
      const { navigate } = useRouter();
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [mode, setMode] = useState('list'); // list | create | edit
      const [editing, setEditing] = useState(null);
      const [submitting, setSubmitting] = useState(false);
      const [busyId, setBusyId] = useState(null);

      // 권한 체크
      useEffect(() => {
        if (authLoading) return;
        if (!user) {
          alert('로그인이 필요합니다');
          navigate('/login');
        } else if (user.role !== 'admin') {
          alert('관리자만 접근할 수 있습니다');
          navigate('/');
        }
      }, [authLoading, user, navigate]);

      const refresh = useCallback(async () => {
        setLoading(true);
        const { ok, data } = await apiFetch('/products');
        if (ok && data?.products) setProducts(data.products);
        setLoading(false);
      }, []);

      useEffect(() => {
        if (user?.role === 'admin') refresh();
      }, [user, refresh]);

      const handleCreate = async (payload, setError) => {
        setSubmitting(true);
        const { ok, data } = await apiFetch('/admin/products', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        setSubmitting(false);
        if (ok) {
          setMode('list');
          setEditing(null);
          await refresh();
        } else {
          setError(data?.error || '저장에 실패했습니다');
        }
      };

      const handleUpdate = async (payload, setError) => {
        if (!editing) return;
        setSubmitting(true);
        const { ok, data } = await apiFetch(`/admin/products/${editing.id}`, {
          method: 'PATCH',
          body: JSON.stringify(payload),
        });
        setSubmitting(false);
        if (ok) {
          setMode('list');
          setEditing(null);
          await refresh();
        } else {
          setError(data?.error || '수정에 실패했습니다');
        }
      };

      const handleDelete = async (product) => {
        if (!confirm(`'${product.name}' 을(를) 삭제하시겠어요?\n관련 장바구니 항목도 함께 삭제됩니다.`)) return;
        setBusyId(product.id);
        const { ok, data } = await apiFetch(`/admin/products/${product.id}`, {
          method: 'DELETE',
        });
        setBusyId(null);
        if (ok) {
          await refresh();
        } else {
          alert(data?.error || '삭제에 실패했습니다');
        }
      };

      if (authLoading || !user || user.role !== 'admin') {
        return (
          <main className="max-w-3xl mx-auto px-4 py-16 text-center text-neutral-500 text-sm">
            …
          </main>
        );
      }

      return (
        <main className="max-w-5xl mx-auto px-4 py-10">
          <div className="mb-8 flex items-end justify-between">
            <div>
              <h1 className="text-2xl font-semibold tracking-tight text-neutral-900">
                관리자
              </h1>
              <p className="mt-1 text-sm text-neutral-500">
                상품 등록 · 수정 · 삭제
              </p>
            </div>
            {mode === 'list' && (
              <Button onClick={() => { setEditing(null); setMode('create'); }}>
                + 상품 추가
              </Button>
            )}
          </div>

          {mode === 'list' && (
            <Card className="overflow-hidden">
              {loading ? (
                <div className="text-center py-16 text-neutral-500 text-sm">불러오는 중…</div>
              ) : products.length === 0 ? (
                <div className="text-center py-16 text-neutral-500 text-sm">
                  등록된 상품이 없습니다
                </div>
              ) : (
                <table className="w-full">
                  <thead>
                    <tr className="border-b border-neutral-200 text-left text-xs text-neutral-500">
                      <th className="py-3 px-4 w-16"></th>
                      <th className="py-3 pr-3">상품명</th>
                      <th className="py-3 pr-3 hidden md:table-cell">가격</th>
                      <th className="py-3 pr-3 hidden lg:table-cell">설명</th>
                      <th className="py-3 px-4 text-right">관리</th>
                    </tr>
                  </thead>
                  <tbody>
                    {products.map((p) => (
                      <AdminProductRow
                        key={p.id}
                        product={p}
                        busy={busyId === p.id}
                        onEdit={(prod) => { setEditing(prod); setMode('edit'); }}
                        onDelete={handleDelete}
                      />
                    ))}
                  </tbody>
                </table>
              )}
            </Card>
          )}

          {mode === 'create' && (
            <Card className="p-6">
              <h2 className="text-lg font-semibold mb-6">새 상품 추가</h2>
              <ProductForm
                onSubmit={handleCreate}
                onCancel={() => { setMode('list'); setEditing(null); }}
                submitting={submitting}
              />
            </Card>
          )}

          {mode === 'edit' && editing && (
            <Card className="p-6">
              <h2 className="text-lg font-semibold mb-6">상품 수정 · #{editing.id}</h2>
              <ProductForm
                initial={editing}
                onSubmit={handleUpdate}
                onCancel={() => { setMode('list'); setEditing(null); }}
                submitting={submitting}
              />
            </Card>
          )}
        </main>
      );
    }

    // ========================================
    // Page: Checkout (TossPayments 결제 위젯)
    // ========================================
    //
    // 흐름:
    //   1) /api/payments/config 로 clientKey 받기
    //   2) /api/payments/intent 로 orderId/amount/orderName 발급
    //   3) TossPayments(clientKey).widgets({ customerKey })
    //   4) widgets.setAmount + renderPaymentMethods + renderAgreement (한 번만)
    //   5) [결제하기] 클릭 → widgets.requestPayment({ successUrl, failUrl, ... })
    //
    // 주의:
    //   - 위젯 렌더는 페이지당 한 번만! (isRendered ref로 가드)
    //   - 금액은 setAmount만 다시 호출. renderPaymentMethods는 재호출 금지.
    //   - successUrl은 hash 라우팅 회피용으로 `${origin}/?payment=success` 사용.
    //     (App 마운트 시 location.search 감지 → confirm 분기)
    function CheckoutPage() {
      const { user, authLoading } = useAuth();
      const { items: cartItems, total: cartTotal, refresh: refreshCart } = useCart();
      const { navigate } = useRouter();

      const [clientKey, setClientKey] = useState(null);
      const [intent, setIntent] = useState(null); // { orderId, amount, orderName, customerKey }
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [paying, setPaying] = useState(false);
      // cart fetch가 적어도 한 번 끝났는지 — race condition 방지용
      const [cartReady, setCartReady] = useState(false);

      const widgetsRef = React.useRef(null);
      const isRenderedRef = React.useRef(false);

      // 비로그인 차단
      useEffect(() => {
        if (authLoading) return;
        if (!user) {
          alert('로그인이 필요합니다');
          navigate('/login');
        }
      }, [authLoading, user, navigate]);

      // 진입 시 카트 한 번 강제 새로고침 → 완료 후 cartReady=true
      useEffect(() => {
        if (!user) return;
        let cancelled = false;
        (async () => {
          try { await refreshCart(); } catch (_) {}
          if (!cancelled) setCartReady(true);
        })();
        return () => { cancelled = true; };
      }, [user, refreshCart]);

      // 카트 비어있으면 장바구니로 (cart fetch 완료 후, intent 발급 전)
      useEffect(() => {
        if (!user) return;
        if (!cartReady) return;
        if (intent) return; // 이미 결제 진행 중 — cart 비워졌어도 OK
        if (cartItems.length === 0) {
          alert('장바구니가 비어 있습니다');
          navigate('/cart');
        }
      }, [user, cartItems.length, cartReady, intent, navigate]);

      // 1) clientKey + intent 동시에 가져오기 (한 번만)
      // cart fetch가 끝나고, 카트에 항목이 있을 때만 intent 발급.
      useEffect(() => {
        if (!user) return;
        if (!cartReady) return;
        if (cartItems.length === 0) return; // 빈 카트면 위쪽 effect가 redirect 처리
        if (intent) return; // 이미 발급됨 — 재호출 금지

        let cancelled = false;
        setLoading(true);
        setError(null);

        Promise.all([
          apiFetch('/payments/config'),
          apiFetch('/payments/intent', { method: 'POST', body: JSON.stringify({}) }),
        ])
          .then(([configRes, intentRes]) => {
            if (cancelled) return;
            if (!configRes.ok || !configRes.data?.clientKey) {
              setError(configRes.data?.error || '결제 설정을 불러오지 못했습니다');
              return;
            }
            if (!intentRes.ok || !intentRes.data?.orderId) {
              setError(intentRes.data?.error || '결제 준비에 실패했습니다');
              return;
            }
            setClientKey(configRes.data.clientKey);
            setIntent({
              orderId: intentRes.data.orderId,
              amount: intentRes.data.amount,
              orderName: intentRes.data.orderName,
              customerKey: intentRes.data.customerKey,
            });
          })
          .catch(() => !cancelled && setError('네트워크 오류가 발생했습니다'))
          .finally(() => !cancelled && setLoading(false));

        return () => { cancelled = true; };
      }, [user, cartReady, cartItems.length, intent]);

      // 2) 위젯 렌더 (clientKey + intent + SDK 준비되면)
      useEffect(() => {
        if (!clientKey || !intent) return;
        if (typeof window.TossPayments !== 'function') {
          setError('TossPayments SDK가 로드되지 않았습니다. 새로고침 해주세요.');
          return;
        }

        let cancelled = false;
        (async () => {
          try {
            // widgets 인스턴스는 한 번만 생성
            if (!widgetsRef.current) {
              const tossPayments = window.TossPayments(clientKey);
              widgetsRef.current = tossPayments.widgets({ customerKey: intent.customerKey });
            }
            // 금액 설정
            await widgetsRef.current.setAmount({
              currency: 'KRW',
              value: intent.amount,
            });
            // 위젯 렌더는 한 번만
            if (!isRenderedRef.current && !cancelled) {
              await Promise.all([
                widgetsRef.current.renderPaymentMethods({
                  selector: '#payment-method',
                  variantKey: 'DEFAULT',
                }),
                widgetsRef.current.renderAgreement({
                  selector: '#agreement',
                  variantKey: 'AGREEMENT',
                }),
              ]);
              if (!cancelled) isRenderedRef.current = true;
            }
          } catch (err) {
            console.error('widget render error:', err);
            if (!cancelled) setError('결제 위젯을 불러오지 못했습니다');
          }
        })();

        return () => { cancelled = true; };
      }, [clientKey, intent]);

      const handlePay = async () => {
        if (paying || !widgetsRef.current || !intent || !user) return;
        setPaying(true);
        try {
          await widgetsRef.current.requestPayment({
            orderId: intent.orderId,
            orderName: intent.orderName,
            // hash 라우팅 회피: 일반 path + query 사용
            // App.jsx 의 마운트 시 location.search 의 payment=success 감지 → confirm 분기
            successUrl: `${window.location.origin}/?payment=success`,
            failUrl: `${window.location.origin}/?payment=fail`,
            customerEmail: user.email || undefined,
          });
          // 성공 시 토스가 successUrl로 redirect → 이 코드는 도달 안 함
        } catch (err) {
          // 사용자 취소 또는 위젯 에러
          setPaying(false);
          if (err?.code === 'USER_CANCEL') return; // 조용히 무시
          alert(err?.message || '결제 요청 중 오류가 발생했습니다');
        }
      };

      if (authLoading || !user) {
        return (
          <main className="max-w-3xl mx-auto px-4 py-16 text-center text-neutral-500 text-sm">…</main>
        );
      }

      return (
        <main className="max-w-3xl mx-auto px-4 py-10">
          <div className="mb-8">
            <h1 className="text-2xl font-semibold tracking-tight text-neutral-900">결제</h1>
            <p className="mt-1 text-sm text-neutral-500">주문 정보를 확인하고 결제를 진행하세요</p>
          </div>

          {/* 주문 요약 */}
          <Card className="p-6 mb-6">
            <h2 className="text-base font-semibold text-neutral-900 mb-4">주문 상품</h2>
            {cartItems.length === 0 ? (
              <p className="text-sm text-neutral-500">상품이 없습니다</p>
            ) : (
              <ul className="divide-y divide-neutral-200">
                {cartItems.map((it) => (
                  <li key={it.id} className="flex gap-3 py-3 first:pt-0 last:pb-0">
                    <div className="w-14 h-14 shrink-0 rounded-md overflow-hidden bg-neutral-100">
                      {it.product.image_url ? (
                        <img src={it.product.image_url} alt="" className="w-full h-full object-cover" />
                      ) : null}
                    </div>
                    <div className="flex-1 min-w-0 flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <p className="text-sm text-neutral-900 line-clamp-1">{it.product.name}</p>
                        <p className="mt-0.5 text-xs text-neutral-500">
                          {formatPrice(it.product.price)} × {it.quantity}
                        </p>
                      </div>
                      <p className="text-sm font-medium text-neutral-900 whitespace-nowrap">
                        {formatPrice(it.subtotal)}
                      </p>
                    </div>
                  </li>
                ))}
              </ul>
            )}
            <div className="mt-4 pt-4 border-t border-neutral-200 flex justify-between text-base font-semibold text-neutral-900">
              <span>총 결제 금액</span>
              <span>{formatPrice(intent?.amount ?? cartTotal)}</span>
            </div>
          </Card>

          {/* 에러 / 로딩 */}
          {loading && (
            <div className="text-center py-10 text-neutral-500 text-sm">결제 위젯 준비 중…</div>
          )}
          {!loading && error && (
            <div className="text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-4 py-3 mb-6">
              {error}
            </div>
          )}

          {/* TossPayments 위젯 영역 — 항상 마운트되어야 SDK가 selector를 찾음 */}
          <div className={loading || error ? 'hidden' : ''}>
            <Card className="p-6 mb-4">
              <div id="payment-method"></div>
            </Card>
            <Card className="p-6 mb-6">
              <div id="agreement"></div>
            </Card>

            <Button
              size="lg"
              className="w-full"
              onClick={handlePay}
              disabled={paying || !intent}
            >
              {paying ? '결제 진행 중…' : `${formatPrice(intent?.amount ?? cartTotal)} 결제하기`}
            </Button>

            <p className="mt-4 text-xs text-neutral-400 text-center">
              테스트 결제 환경입니다. 실제로 청구되지 않습니다.
            </p>
          </div>
        </main>
      );
    }

    // ========================================
    // Payment Success Handler
    // ========================================
    // App 마운트 시 location.search 의 payment=success 가 있으면 자동으로 호출됨.
    // confirm API 를 호출하고 결과에 따라 페이지 분기.
    function PaymentSuccessHandler({ params, onDone }) {
      const { paymentKey, orderId, amount } = params;
      const { refresh: refreshCart } = useCart();
      const { navigate } = useRouter();
      const [status, setStatus] = useState('processing'); // processing | success | error
      const [order, setOrder] = useState(null);
      const [errorMessage, setErrorMessage] = useState(null);
      const startedRef = React.useRef(false);

      useEffect(() => {
        if (startedRef.current) return;
        startedRef.current = true;

        // URL에서 결제 파라미터 즉시 제거 — 새로고침 시 재confirm 방지 + 보안
        try {
          const cleanUrl = window.location.pathname + window.location.hash;
          window.history.replaceState({}, '', cleanUrl);
        } catch (_) {}

        (async () => {
          const { ok, data } = await apiFetch('/payments/confirm', {
            method: 'POST',
            body: JSON.stringify({ paymentKey, orderId, amount: Number(amount) }),
          });
          if (ok && data?.order) {
            setOrder(data.order);
            setStatus('success');
            // 카트 새로고침 (헤더 카운트 0으로)
            try { await refreshCart(); } catch (_) {}
          } else {
            setErrorMessage(data?.error || '결제 승인에 실패했습니다');
            setStatus('error');
          }
          onDone(); // App 측 paymentParams 상태 정리
        })();
        // eslint-disable-next-line
      }, []);

      if (status === 'processing') {
        return (
          <main className="max-w-md mx-auto px-4 py-24 text-center">
            <div className="inline-block w-10 h-10 border-2 border-neutral-300 border-t-neutral-900 rounded-full animate-spin mb-6" />
            <h1 className="text-lg font-semibold text-neutral-900">결제 승인 중…</h1>
            <p className="mt-2 text-sm text-neutral-500">잠시만 기다려주세요</p>
          </main>
        );
      }

      if (status === 'error') {
        return (
          <main className="max-w-md mx-auto px-4 py-24 text-center">
            <div className="w-12 h-12 rounded-full bg-red-50 text-red-600 mx-auto flex items-center justify-center text-2xl">
              !
            </div>
            <h1 className="mt-4 text-lg font-semibold text-neutral-900">결제 승인에 실패했습니다</h1>
            <p className="mt-2 text-sm text-red-600">{errorMessage}</p>
            <div className="mt-8 flex gap-3 justify-center">
              <Button variant="secondary" onClick={() => navigate('/cart')}>장바구니로</Button>
              <Button onClick={() => navigate('/checkout')}>다시 시도</Button>
            </div>
          </main>
        );
      }

      // success
      return (
        <main className="max-w-md mx-auto px-4 py-20 text-center">
          <div className="w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 mx-auto flex items-center justify-center text-3xl">
            ✓
          </div>
          <h1 className="mt-5 text-xl font-semibold text-neutral-900">결제가 완료되었습니다</h1>
          <p className="mt-2 text-sm text-neutral-500">
            주문번호: <span className="font-mono text-neutral-900">{order?.order_number}</span>
          </p>
          <p className="mt-1 text-sm text-neutral-500">
            결제 금액: <span className="font-semibold text-neutral-900">{formatPrice(order?.total)}</span>
          </p>
          <div className="mt-8 flex gap-3 justify-center">
            <Button variant="secondary" onClick={() => navigate('/')}>쇼핑 계속하기</Button>
            <Button onClick={() => navigate('/mypage')}>주문 내역 보기</Button>
          </div>
        </main>
      );
    }

    // ========================================
    // Payment Fail Handler
    // ========================================
    function PaymentFailHandler({ params, onDone }) {
      const { code, message, orderId } = params;
      const { navigate } = useRouter();

      useEffect(() => {
        // URL 파라미터 정리
        try {
          const cleanUrl = window.location.pathname + window.location.hash;
          window.history.replaceState({}, '', cleanUrl);
        } catch (_) {}
        onDone();
        // eslint-disable-next-line
      }, []);

      return (
        <main className="max-w-md mx-auto px-4 py-24 text-center">
          <div className="w-12 h-12 rounded-full bg-red-50 text-red-600 mx-auto flex items-center justify-center text-2xl">
            ×
          </div>
          <h1 className="mt-4 text-lg font-semibold text-neutral-900">결제에 실패했습니다</h1>
          {message && (
            <p className="mt-2 text-sm text-red-600">{decodeURIComponent(message)}</p>
          )}
          {code && (
            <p className="mt-1 text-xs text-neutral-400">에러 코드: {code}</p>
          )}
          {orderId && (
            <p className="mt-1 text-xs text-neutral-400">주문 ID: {orderId}</p>
          )}
          <div className="mt-8 flex gap-3 justify-center">
            <Button variant="secondary" onClick={() => navigate('/cart')}>장바구니로</Button>
            <Button onClick={() => navigate('/checkout')}>다시 시도</Button>
          </div>
        </main>
      );
    }

    // ========================================
    // Page: Not Found
    // ========================================
    function NotFoundPage() {
      return (
        <main className="max-w-md mx-auto px-4 py-24 text-center">
          <h1 className="text-2xl font-semibold text-neutral-900">404</h1>
          <p className="mt-2 text-sm text-neutral-500">페이지를 찾을 수 없습니다.</p>
          <div className="mt-6">
            <Link
              to="/"
              className="inline-block text-sm text-neutral-900 underline hover:opacity-70"
            >
              홈으로
            </Link>
          </div>
        </main>
      );
    }

    // ========================================
    // Routes resolver
    // ========================================
    function AppRoutes() {
      const { path } = useRouter();

      // Home
      if (path === '/' || path === '') return <HomePage />;
      // Login
      if (matchRoute('/login', path)) return <LoginPage />;
      // Signup
      if (matchRoute('/signup', path)) return <SignupPage />;
      // Cart
      if (matchRoute('/cart', path)) return <CartPage />;
      // Checkout (TossPayments 결제 위젯)
      if (matchRoute('/checkout', path)) return <CheckoutPage />;
      // My page
      if (matchRoute('/mypage', path)) return <MyPage />;
      // Admin
      if (matchRoute('/admin', path)) return <AdminPage />;
      // Product detail
      const detailMatch = matchRoute('/products/:id', path);
      if (detailMatch) return <ProductDetailPage id={detailMatch.params.id} />;

      return <NotFoundPage />;
    }

    // ========================================
    // Payment redirect detection
    // ========================================
    // TossPayments는 successUrl 뒤에 ?paymentKey=&orderId=&amount= 쿼리를 붙여 redirect.
    // hash 라우팅 환경에서도 location.search에는 정상적으로 붙는다 (hash 앞에 위치).
    // App 마운트 시 한 번만 검사.
    function detectPaymentRedirect() {
      try {
        const search = new URLSearchParams(window.location.search);
        const payment = search.get('payment');
        if (payment === 'success') {
          const paymentKey = search.get('paymentKey');
          const orderId = search.get('orderId');
          const amount = search.get('amount');
          if (paymentKey && orderId && amount) {
            return { kind: 'success', params: { paymentKey, orderId, amount } };
          }
          // 파라미터 누락 — 결제 시작도 안 한 경우일 수 있음
          return { kind: 'success-malformed' };
        }
        if (payment === 'fail') {
          return {
            kind: 'fail',
            params: {
              code: search.get('code') || '',
              message: search.get('message') || '',
              orderId: search.get('orderId') || '',
            },
          };
        }
      } catch (_) {}
      return null;
    }

    // ========================================
    // App
    // ========================================
    function App() {
      // 마운트 시 1회만 결제 redirect 감지
      const [paymentRedirect, setPaymentRedirect] = useState(() => detectPaymentRedirect());

      const handleDone = useCallback(() => {
        // SuccessHandler/FailHandler가 자체적으로 history.replaceState로 URL 정리하지만,
        // 추가 보호: 부모 상태도 비워서 다음 navigate 시 일반 라우트가 보이도록 한다.
        // (단, 결과 화면은 사용자가 버튼으로 이동할 때까지 유지되어야 하므로
        //  여기서는 paymentRedirect를 비우지 않고 핸들러 내부에서 navigate로 처리)
      }, []);

      return (
        <Router>
          <AuthProvider>
            <CartProvider>
              <div className="min-h-screen flex flex-col bg-white">
                <Header />
                <div className="flex-1">
                  {paymentRedirect?.kind === 'success' ? (
                    <PaymentSuccessHandler
                      params={paymentRedirect.params}
                      onDone={handleDone}
                    />
                  ) : paymentRedirect?.kind === 'fail' ? (
                    <PaymentFailHandler
                      params={paymentRedirect.params}
                      onDone={handleDone}
                    />
                  ) : (
                    <AppRoutes />
                  )}
                </div>
                <footer className="border-t border-neutral-200 mt-16">
                  <div className="max-w-6xl mx-auto px-4 py-8 text-xs text-neutral-400">
                    © {new Date().getFullYear()} MUJI SHOP. All rights reserved.
                  </div>
                </footer>
              </div>
            </CartProvider>
          </AuthProvider>
        </Router>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
