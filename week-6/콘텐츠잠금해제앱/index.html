    // 🌐 API helpers
    // ========================================
    const API_BASE_URL = '/api';
    const TOKEN_KEY = 'unlock_token';

    async function apiFetch(path, options = {}) {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || `요청 실패 (${res.status})`);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    // ========================================
    // 🔀 Router (hash-based)
    // ========================================
    function useHashRoute() {
      const [hash, setHash] = useState(() => window.location.hash || '#/');
      useEffect(() => {
        const onChange = () => setHash(window.location.hash || '#/');
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      return hash;
    }

    function navigate(to) {
      window.location.hash = to;
    }

    // hash가 "#/foo?bar=1" 또는 "#/foo" + location.search 두 형태 모두 지원
    function parseHash(hash) {
      const raw = hash.replace(/^#/, '') || '/';
      const qIdx = raw.indexOf('?');
      const path = qIdx >= 0 ? raw.slice(0, qIdx) : raw;
      const queryFromHash = qIdx >= 0 ? raw.slice(qIdx + 1) : '';
      // hash에 query가 없으면 location.search도 본다 (토스가 search에 붙이는 케이스)
      const queryStr = queryFromHash || (window.location.search ? window.location.search.slice(1) : '');
      const query = {};
      if (queryStr) {
        for (const pair of queryStr.split('&')) {
          if (!pair) continue;
          const [k, v = ''] = pair.split('=');
          query[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' '));
        }
      }
      return { path, query };
    }

    function matchRoute(hash) {
      const { path, query } = parseHash(hash);
      const articleMatch = path.match(/^\/article\/(.+)$/);
      if (articleMatch) return { name: 'article', params: { id: articleMatch[1] }, query };
      if (path === '/login') return { name: 'login', params: {}, query };
      if (path === '/signup') return { name: 'signup', params: {}, query };
      if (path === '/checkout') return { name: 'checkout', params: {}, query };
      if (path === '/payment/success') return { name: 'paymentSuccess', params: {}, query };
      if (path === '/payment/fail') return { name: 'paymentFail', params: {}, query };
      if (path === '/purchases') return { name: 'purchases', params: {}, query };
      return { name: 'home', params: {}, query };
    }

    // ========================================
    // 🔐 Auth Context
    // ========================================
    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [token, setToken] = useState(() => localStorage.getItem(TOKEN_KEY));
      const [user, setUser] = useState(null);
      const [bootstrapping, setBootstrapping] = useState(!!localStorage.getItem(TOKEN_KEY));

      // mount 시 토큰 있으면 /api/me 호출해서 user 복원
      useEffect(() => {
        const t = localStorage.getItem(TOKEN_KEY);
        if (!t) { setBootstrapping(false); return; }
        let cancelled = false;
        apiFetch('/me')
          .then(({ user }) => { if (!cancelled) setUser(user); })
          .catch(() => {
            if (cancelled) return;
            localStorage.removeItem(TOKEN_KEY);
            setToken(null);
            setUser(null);
          })
          .finally(() => { if (!cancelled) setBootstrapping(false); });
        return () => { cancelled = true; };
      }, []);

      const login = useCallback(async (email, password) => {
        const data = await apiFetch('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
        localStorage.setItem(TOKEN_KEY, data.token);
        setToken(data.token);
        setUser(data.user);
        return data;
      }, []);

      const signup = useCallback(async (email, password, name) => {
        const data = await apiFetch('/auth/signup', { method: 'POST', body: JSON.stringify({ email, password, name }) });
        localStorage.setItem(TOKEN_KEY, data.token);
        setToken(data.token);
        setUser(data.user);
        return data;
      }, []);

      const logout = useCallback(() => {
        localStorage.removeItem(TOKEN_KEY);
        setToken(null);
        setUser(null);
      }, []);

      const refresh = useCallback(async () => {
        try {
          const { user } = await apiFetch('/me');
          setUser(user);
        } catch {
          localStorage.removeItem(TOKEN_KEY);
          setToken(null);
          setUser(null);
        }
      }, []);

      const value = useMemo(() => ({ token, user, login, signup, logout, refresh, bootstrapping }), [token, user, login, signup, logout, refresh, bootstrapping]);
      return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDateTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${yyyy}.${mm}.${dd} ${hh}:${mi}`;
    }

    function formatWon(n) {
      return '₩' + Number(n || 0).toLocaleString('ko-KR');

              <Button onClick={() => navigate('/')}>← 목록으로</Button>
            </div>
          </PageContainer>
        );
      }

      if (!content || bootstrapping) {
        return (
          <PageContainer>
            <div className="flex justify-center py-20"><Spinner /></div>
          </PageContainer>
        );
      }

      const body = ARTICLE_BODIES[id] || [];
      const readingTime = READING_TIMES[id] || 5;

      // 잠금 판단
      // - 무료(isPremium=false): 항상 전체 공개
      // - 유료 + 비로그인: 잠금 (앞 2문단 + 로그인 CTA)
      // - 유료 + 로그인: access 결과로 판단
      let unlocked, lockReason;
      if (!content.isPremium) {
        unlocked = true;
        lockReason = 'free';
      } else if (!user) {
        unlocked = false;
        lockReason = 'login';
      } else if (accessLoading || !access) {
        // access 호출 중 — 일단 잠긴 것처럼 보여주되 CTA를 비활성화
        unlocked = false;
        lockReason = 'loading';
      } else {
        unlocked = !!access.unlocked;
        lockReason = unlocked ? (access.reason || 'purchased') : 'buy';
      }

      const visibleParagraphs = unlocked ? body : body.slice(0, 2);
      const hiddenParagraphs = unlocked ? [] : body.slice(2);

      return (
        <PageContainer className="max-w-3xl">
          <div className="fade-in">

              목록으로

            <div className="flex items-center gap-2 mb-4 flex-wrap">
              <Badge variant="category">{content.category}</Badge>
              <Badge variant={content.isPremium ? 'premium' : 'free'}>{content.isPremium ? 'PREMIUM' : 'FREE'}</Badge>
              {unlocked && lockReason === 'purchased' && <Badge variant="purchased">구매 완료</Badge>}
            </div>

            <h1 className="text-3xl sm:text-4xl font-bold text-stone-900 tracking-tight font-serif-article leading-tight mb-5">
              {content.title}
            </h1>

            <div className="flex items-center gap-3 pb-6 mb-8 border-b border-stone-200">
              <div className="w-10 h-10 rounded-full bg-gradient-to-br from-stone-300 to-stone-400 flex items-center justify-center text-white font-semibold">
                {content.author.charAt(0)}
              </div>
              <div className="text-sm">
                <div className="font-semibold text-stone-900">{content.author}</div>
                <div className="text-stone-500 text-xs">{formatDate(content.publishedAt)} · {readingTime}분 읽기</div>
              </div>
            </div>

            <article className="font-serif-article text-stone-800 text-lg leading-[1.85] space-y-6">
              {visibleParagraphs.map((p, i) => <p key={i}>{p}</p>)}
            </article>

            {!unlocked && (
              <div className="relative mt-6">
                <div className="locked-content font-serif-article text-stone-800 text-lg leading-[1.85] space-y-6" aria-hidden="true">
                  {hiddenParagraphs.map((p, i) => <p key={i}>{p}</p>)}
                </div>

                <div className="absolute inset-0 lock-fade flex items-start justify-center pt-12 sm:pt-20">
                  <div className="bg-white rounded-2xl shadow-xl border border-stone-200 p-6 sm:p-8 max-w-md mx-4 text-center">
                    <div className="w-14 h-14 mx-auto mb-4 rounded-full bg-amber-100 flex items-center justify-center">
                      <svg className="w-7 h-7 text-amber-600" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clipRule="evenodd"/></svg>
                    </div>

                    {lockReason === 'login' && (
                      <>
                        <h3 className="text-xl font-bold text-stone-900 mb-2">이 글의 나머지는 로그인 후 구매해 읽을 수 있어요</h3>
                        <p className="text-sm text-stone-600 mb-5">로그인하고 {formatWon(content.price)}에 이 콘텐츠를 잠금 해제하세요.</p>
                        <Button size="lg" onClick={() => navigate(`/login?redirect=/article/${id}`)} className="w-full">
                          로그인 후 구매하고 끝까지 읽기
                        </Button>
                        <p className="text-[11px] text-stone-400 mt-3">계정이 없으신가요? <a href="#/signup" className="underline">회원가입</a></p>
                      </>
                    )}

                    {lockReason === 'loading' && (
                      <>
                        <h3 className="text-lg font-bold text-stone-900 mb-2">잠금 상태를 확인 중입니다</h3>
                        <div className="flex justify-center my-4"><Spinner size="sm" /></div>
                      </>
                    )}

                    {lockReason === 'buy' && (
                      <>
                        <h3 className="text-xl font-bold text-stone-900 mb-2">이 글의 나머지는 유료 콘텐츠입니다</h3>
                        <p className="text-sm text-stone-600 mb-5">{formatWon(price)}에 이 콘텐츠를 영구 잠금 해제할 수 있어요. 구매한 글은 언제든 다시 읽을 수 있습니다.</p>
                        <Button size="lg" onClick={() => navigate(`/checkout?contentId=${id}`)} className="w-full">
                          {formatWon(price)} 결제하고 끝까지 읽기
                        </Button>
                      </>
                    )}
                  </div>
                </div>
              </div>
            )}

            {unlocked && (
              <div className="mt-12 pt-8 border-t border-stone-200 text-center">
                {lockReason === 'purchased' && access && access.purchasedAt && (
                  <p className="text-xs text-stone-400 mb-2">{formatDateTime(access.purchasedAt)}에 구매하셨어요</p>
                )}
                <p className="text-stone-500 text-sm mb-3">이 글이 좋았다면, 다른 글도 읽어보세요</p>
                <Button variant="outline" onClick={() => navigate('/')}>← 다른 글 보러 가기</Button>
              </div>
            )}
          </div>
        </PageContainer>
      );
    }

      const onSubmit = async (e) => {

          navigate(redirect || '/');
        } catch (err) {
          setError(err.message || '로그인에 실패했습니다.');

      return (

          <div className="max-w-md mx-auto fade-in">

                type="email"
                value={email}
                onChange={e => setEmail(e.target.value)}
                placeholder="you@example.com"
                autoComplete="email"

              <Input

                type="password"
                value={password}
                onChange={e => setPassword(e.target.value)}

                autoComplete="current-password"
                disabled={submitting}

            <p className="text-sm text-stone-500 mt-6 text-center">

              <a href={`#/signup${redirect ? `?redirect=${encodeURIComponent(redirect)}` : ''}`} className="text-amber-600 hover:text-amber-700 underline underline-offset-2 font-medium">

    // ========================================
    // 📄 Page: Signup
    // ========================================
    function SignupPage({ redirect }) {
      const { signup } = useAuth();
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [errors, setErrors] = useState({});
      const [submitError, setSubmitError] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      const validate = () => {
        const e = {};
        if (!email.trim()) e.email = '이메일을 입력해주세요';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) e.email = '올바른 이메일 형식이 아닙니다';
        if (!password) e.password = '비밀번호를 입력해주세요';
        else if (password.length < 8) e.password = '비밀번호는 8자 이상이어야 합니다';
        if (!name.trim()) e.name = '이름을 입력해주세요';
        setErrors(e);
        return Object.keys(e).length === 0;
      };

      const onSubmit = async (e) => {
        e.preventDefault();
        setSubmitError(null);
        if (!validate()) return;
        setSubmitting(true);
        try {
          await signup(email.trim(), password, name.trim());
          navigate(redirect || '/');
        } catch (err) {
          setSubmitError(err.message || '회원가입에 실패했습니다.');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <PageContainer>
          <div className="max-w-md mx-auto fade-in">
            <h1 className="text-3xl font-bold text-stone-900 mb-2 font-serif-article">회원가입</h1>
            <p className="text-stone-600 mb-8">계정을 만들고 매주 깊이 있는 글을 받아보세요.</p>

            <form onSubmit={onSubmit} className="bg-white rounded-2xl border border-stone-200 p-6 space-y-4">
              {submitError && <Alert kind="error">{submitError}</Alert>}
              <Input
                label="이메일"
                type="email"
                value={email}
                onChange={e => setEmail(e.target.value)}
                placeholder="you@example.com"
                autoComplete="email"
                error={errors.email}
                disabled={submitting}
              />
              <Input
                label="비밀번호 (8자 이상)"
                type="password"
                value={password}
                onChange={e => setPassword(e.target.value)}
                placeholder="••••••••"
                autoComplete="new-password"
                error={errors.password}
                disabled={submitting}
              />
              <Input
                label="이름"
                value={name}
                onChange={e => setName(e.target.value)}
                placeholder="홍길동"
                autoComplete="name"
                error={errors.name}
                disabled={submitting}
              />
              <Button type="submit" size="lg" disabled={submitting} className="w-full">
                {submitting ? '가입 중...' : '가입하고 시작하기'}
              </Button>
            </form>

            <p className="text-sm text-stone-500 mt-6 text-center">
              이미 계정이 있으신가요?{' '}
              <a href={`#/login${redirect ? `?redirect=${encodeURIComponent(redirect)}` : ''}`} className="text-amber-600 hover:text-amber-700 underline underline-offset-2 font-medium">
                로그인 하러 가기
              </a>
            </p>
          </div>
        </PageContainer>
      );
    }

    // ========================================
    // 📄 Page: Checkout (Toss Payments Widget)
    // ========================================
    function CheckoutPage({ contentId }) {
      const { user, bootstrapping } = useAuth();
      const { config, error: configError } = useConfig();
      const [content, setContent] = useState(null);
      const [loadError, setLoadError] = useState(null);
      const [widgetError, setWidgetError] = useState(null);
      const [widgetReady, setWidgetReady] = useState(false);
      const [paying, setPaying] = useState(false);

      const widgetsRef = useRef(null);
      const renderedRef = useRef(false);

      // 비로그인이면 로그인 페이지로 리다이렉트
      useEffect(() => {
        if (bootstrapping) return;
        if (!user) {
          navigate(`/login?redirect=${encodeURIComponent(`/checkout?contentId=${contentId}`)}`);
        }
      }, [user, bootstrapping, contentId]);

      // 콘텐츠 로드
      useEffect(() => {
        if (!contentId) { setLoadError('contentId가 없습니다'); return; }
        let cancelled = false;
        fetch(`${API_BASE_URL}/contents`)
          .then(r => r.ok ? r.json() : Promise.reject(new Error('콘텐츠를 불러오지 못했습니다')))
          .then(({ contents }) => {
            if (cancelled) return;
            const c = contents.find(x => x.id === contentId);
            if (!c) setLoadError('해당 콘텐츠를 찾을 수 없습니다');
            else if (!c.isPremium) setLoadError('이 콘텐츠는 무료입니다');
            else setContent(c);
          })
          .catch(e => { if (!cancelled) setLoadError(e.message); });
        return () => { cancelled = true; };
      }, [contentId]);

      // 토스 위젯 초기화 (Strict Mode 중복 호출 방지: renderedRef)
      useEffect(() => {
        if (!user || !content || !config?.tossClientKey) return;
        if (renderedRef.current) return;
        renderedRef.current = true;

        let destroyed = false;
        (async () => {
          try {
            const tossPayments = window.TossPayments(config.tossClientKey);
            const widgets = tossPayments.widgets({ customerKey: String(user.id) });
            widgetsRef.current = widgets;

            await widgets.setAmount({ currency: 'KRW', value: content.price });
            if (destroyed) return;
            await widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' });
            if (destroyed) return;
            await widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' });
            if (destroyed) return;
            setWidgetReady(true);
          } catch (e) {
            console.error('Toss widget init failed', e);
            if (!destroyed) setWidgetError(e.message || '결제 위젯 로드에 실패했습니다');
          }
        })();

        return () => {
          destroyed = true;
          try { widgetsRef.current?.destroy?.(); } catch {}
        };
      }, [user, content, config]);

      const onPay = async () => {
        if (!widgetsRef.current || !content) return;
        setPaying(true);
        try {
          const orderId = (crypto.randomUUID && crypto.randomUUID()) || `order_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
          sessionStorage.setItem('pending_order', JSON.stringify({ orderId, contentId: content.id, amount: content.price }));
          await widgetsRef.current.requestPayment({
            orderId,
            orderName: content.title,
            successUrl: window.location.origin + '/#/payment/success',
            failUrl: window.location.origin + '/#/payment/fail',
            customerEmail: user.email,
            customerName: user.name || user.email,
          });
          // requestPayment는 보통 페이지를 떠나므로 여기까지 오지 않음
        } catch (e) {
          console.error('requestPayment error', e);
          setWidgetError(e.message || '결제 요청에 실패했습니다');
          setPaying(false);
        }
      };

      if (bootstrapping || (!user && !bootstrapping)) {
        return <PageContainer><div className="flex justify-center py-20"><Spinner /></div></PageContainer>;
      }

      if (loadError) {
        return (
          <PageContainer>
            <div className="max-w-2xl mx-auto text-center py-20">
              <div className="text-5xl mb-4">⚠️</div>
              <h2 className="text-2xl font-bold mb-3">{loadError}</h2>
              <Button onClick={() => navigate('/')}>← 목록으로</Button>
            </div>
          </PageContainer>
        );
      }

      if (configError) {
        return (
          <PageContainer>
            <div className="max-w-2xl mx-auto py-10">
              <Alert kind="error">결제 설정을 불러오지 못했습니다: {configError}</Alert>
            </div>
          </PageContainer>
        );
      }

      return (
        <PageContainer>
          <div className="max-w-2xl mx-auto fade-in">
            <a href={content ? `#/article/${content.id}` : '#/'} className="inline-flex items-center text-sm text-stone-500 hover:text-stone-900 mb-6">
              <svg className="w-4 h-4 mr-1" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"/></svg>
              뒤로
            </a>

            <h1 className="text-3xl font-bold text-stone-900 mb-2 font-serif-article">결제하기</h1>
            <p className="text-stone-600 mb-8">아래 콘텐츠를 영구 잠금 해제합니다.</p>

            {content && (
              <Card className="p-5 mb-6">
                <div className="flex items-start gap-4">
                  <div className="w-16 h-16 flex-shrink-0 rounded-lg bg-gradient-to-br from-stone-100 to-amber-50 flex items-center justify-center text-3xl">
                    {categoryEmoji(content.category)}
                  </div>
                  <div className="flex-1 min-w-0">
                    <Badge variant="category" className="mb-1.5">{content.category}</Badge>
                    <h3 className="font-bold text-stone-900 leading-snug font-serif-article">{content.title}</h3>
                    <p className="text-xs text-stone-500 mt-1">{content.author} · {formatDate(content.publishedAt)}</p>
                  </div>
                  <div className="text-right flex-shrink-0">
                    <div className="text-xs text-stone-400">결제 금액</div>
                    <div className="text-xl font-bold text-stone-900">{formatWon(content.price)}</div>
                  </div>
                </div>
              </Card>
            )}

            {widgetError && <div className="mb-4"><Alert kind="error">{widgetError}</Alert></div>}

            <div className="bg-white rounded-2xl border border-stone-200 p-4 sm:p-6">
              <div id="payment-method" />
              <div id="agreement" />
            </div>

            <div className="mt-6">
              <Button
                size="lg"
                onClick={onPay}
                disabled={!widgetReady || paying || !content}
                className="w-full"
              >
                {paying ? '결제 창으로 이동 중...' : content ? `${formatWon(content.price)} 결제하기` : '준비 중...'}
              </Button>
              {!widgetReady && !widgetError && (
                <p className="text-xs text-stone-400 text-center mt-3">결제 위젯을 불러오는 중...</p>
              )}
            </div>
          </div>
        </PageContainer>
      );
    }

    // ========================================
    // 📄 Page: Payment Success
    // ========================================
    function PaymentSuccessPage({ query }) {
      const { user, bootstrapping } = useAuth();
      const [status, setStatus] = useState('processing'); // processing | success | error
      const [errorMsg, setErrorMsg] = useState('');
      const [purchase, setPurchase] = useState(null);
      const [contentTitle, setContentTitle] = useState('');
      const [contentId, setContentId] = useState(null);
      const calledRef = useRef(false);

      useEffect(() => {
        if (bootstrapping) return;
        if (calledRef.current) return;
        calledRef.current = true;

        const paymentKey = query.paymentKey;
        const orderId = query.orderId;
        const amount = query.amount;

        if (!paymentKey || !orderId || !amount) {
          setStatus('error');
          setErrorMsg('결제 정보를 확인할 수 없습니다 (paymentKey/orderId/amount 누락)');
          return;
        }

        let pending = null;
        try {
          const raw = sessionStorage.getItem('pending_order');
          if (raw) pending = JSON.parse(raw);
        } catch {}

        const cId = pending?.contentId;
        if (!cId) {
          setStatus('error');
          setErrorMsg('주문 정보를 찾을 수 없습니다. 다시 시도해주세요.');
          return;
        }
        setContentId(cId);

        apiFetch('/payments/confirm', {
          method: 'POST',
          body: JSON.stringify({
            paymentKey,
            orderId,
            amount: Number(amount),
            contentId: cId,
          }),
        })
          .then((data) => {
            setPurchase(data.purchase || null);
            // 콘텐츠 제목 가져오기 (purchase에 title이 있으면 그걸 우선 사용)
            if (data.purchase?.title) {
              setContentTitle(data.purchase.title);
            } else {
              fetch(`${API_BASE_URL}/contents`)
                .then(r => r.json())
                .then(({ contents }) => {
                  const c = contents.find(x => x.id === cId);
                  if (c) setContentTitle(c.title);
                })
                .catch(() => {});
            }
            setStatus('success');
            sessionStorage.removeItem('pending_order');
          })
          .catch((err) => {
            setStatus('error');
            setErrorMsg(err.message || '결제 승인에 실패했습니다');
            sessionStorage.removeItem('pending_order');
          });
      }, [bootstrapping, query]);

      if (status === 'processing') {
        return (
          <PageContainer>
            <div className="max-w-md mx-auto py-20 text-center fade-in">
              <div className="flex justify-center mb-6"><Spinner size="lg" /></div>
              <h2 className="text-2xl font-bold text-stone-900 mb-2">결제 승인 중...</h2>
              <p className="text-stone-500">잠시만 기다려주세요. 결제를 안전하게 처리하고 있어요.</p>
            </div>
          </PageContainer>
        );
      }

      if (status === 'error') {
        return (
          <PageContainer>
            <div className="max-w-md mx-auto py-16 text-center fade-in">
              <div className="w-20 h-20 mx-auto mb-6 rounded-full bg-red-100 flex items-center justify-center">
                <svg className="w-10 h-10 text-red-500" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </div>
              <h2 className="text-2xl font-bold text-stone-900 mb-3 font-serif-article">결제 승인에 실패했습니다</h2>
              <p className="text-stone-600 mb-6 break-words">{errorMsg}</p>
              <div className="flex gap-3 justify-center">
                <Button variant="outline" onClick={() => navigate('/')}>목록으로</Button>
                {contentId && <Button onClick={() => navigate(`/checkout?contentId=${contentId}`)}>다시 시도</Button>}
              </div>
            </div>
          </PageContainer>
        );
      }

      // success
      return (
        <PageContainer>
          <div className="max-w-md mx-auto py-12 text-center fade-in">
            <div className="pop-in w-20 h-20 mx-auto rounded-full bg-emerald-100 flex items-center justify-center mb-6">
              <svg className="w-12 h-12 text-emerald-500" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24">
                <path className="check-path" strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <h2 className="text-3xl font-bold text-stone-900 mb-3 font-serif-article">결제가 완료되었어요</h2>
            {contentTitle && <p className="text-stone-700 font-semibold mb-2">{contentTitle}</p>}
            <p className="text-stone-600 mb-8">이제 모든 내용을 읽을 수 있어요.</p>

            {purchase && (
              <Card className="text-left p-5 mb-8">
                <div className="space-y-2.5 text-sm">
                  <div className="flex justify-between">
                    <span className="text-stone-500">결제 금액</span>
                    <span className="font-semibold text-stone-900">{formatWon(purchase.amount)}</span>
                  </div>
                  {purchase.cardBrand && (
                    <div className="flex justify-between">
                      <span className="text-stone-500">결제 수단</span>
                      <span className="font-semibold text-stone-900">{purchase.cardBrand} ****-{purchase.cardLast4}</span>
                    </div>
                  )}
                  {purchase.paidAt && (
                    <div className="flex justify-between">
                      <span className="text-stone-500">결제 일시</span>
                      <span className="font-semibold text-stone-900">{formatDateTime(purchase.paidAt)}</span>
                    </div>
                  )}
                </div>
              </Card>
            )}

            <div className="flex flex-col sm:flex-row gap-3">
              <Button size="lg" onClick={() => navigate(`/article/${contentId}`)} className="flex-1">콘텐츠 보러 가기</Button>
              <Button variant="outline" size="lg" onClick={() => navigate('/purchases')} className="flex-1">구매 이력</Button>
            </div>
          </div>
        </PageContainer>
      );
    }

    // ========================================
    // 📄 Page: Payment Fail
    // ========================================
    function PaymentFailPage({ query }) {
      const code = query.code || '';
      const message = query.message || '결제가 취소되었거나 실패했습니다.';

      useEffect(() => {
        // 실패 시 pending_order 정리
        sessionStorage.removeItem('pending_order');
      }, []);

      // pending_order에서 contentId 복구 시도(이미 위에서 지웠으므로 sessionStorage 다른 키나 query로 추정)
      // 토스는 fail에 contentId를 안 넘기므로, "다시 시도"는 그냥 목록으로 이동
      return (
        <PageContainer>
          <div className="max-w-md mx-auto py-16 text-center fade-in">
            <div className="w-20 h-20 mx-auto mb-6 rounded-full bg-red-100 flex items-center justify-center">
              <svg className="w-10 h-10 text-red-500" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.84-2.75L13.74 4a2 2 0 00-3.48 0L3.16 16.25A2 2 0 005 19z"/></svg>
            </div>
            <h2 className="text-2xl font-bold text-stone-900 mb-3 font-serif-article">결제가 완료되지 않았어요</h2>
            <Card className="text-left p-5 mb-6">
              <div className="text-sm text-stone-700 break-words">{message}</div>
              {code && <div className="text-xs text-stone-400 mt-2">에러 코드: {code}</div>}
            </Card>
            <div className="flex gap-3 justify-center">
              <Button variant="outline" onClick={() => navigate('/')}>목록으로</Button>
              <Button onClick={() => window.history.back()}>다시 시도</Button>
            </div>
          </div>
        </PageContainer>
      );
    }

    // ========================================
    // 📄 Page: Purchases
    // ========================================
    function PurchasesPage() {
      const { user, bootstrapping } = useAuth();
      const [purchases, setPurchases] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        if (bootstrapping) return;
        if (!user) {
          navigate('/login?redirect=/purchases');
          return;
        }
        let cancelled = false;
        apiFetch('/purchases')
          .then(({ purchases }) => { if (!cancelled) setPurchases(purchases); })
          .catch(e => { if (!cancelled) setError(e.message); });
        return () => { cancelled = true; };
      }, [user, bootstrapping]);

      if (bootstrapping || !user) {
        return <PageContainer><div className="flex justify-center py-20"><Spinner /></div></PageContainer>;
      }

      return (
        <PageContainer>
          <div className="fade-in">
            <h1 className="text-3xl font-bold text-stone-900 mb-2 font-serif-article">내 구매 이력</h1>
            <p className="text-stone-600 mb-8">결제하신 콘텐츠는 언제든 다시 읽을 수 있어요.</p>

            {error && <Alert kind="error">{error}</Alert>}

            {!purchases && !error && (
              <div className="flex justify-center py-20"><Spinner /></div>
            )}

            {purchases && purchases.length === 0 && (
              <div className="bg-white rounded-2xl border border-stone-200 py-16 text-center">
                <div className="text-5xl mb-3">📭</div>
                <h2 className="text-xl font-bold text-stone-900 mb-2">아직 구매한 콘텐츠가 없어요</h2>
                <p className="text-stone-500 mb-6">마음에 드는 글을 골라 결제하면 여기에 표시됩니다.</p>
                <Button onClick={() => navigate('/')}>콘텐츠 둘러보기</Button>
              </div>
            )}

            {purchases && purchases.length > 0 && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {purchases.map(p => (
                  <Card key={p.id} className="p-5 flex flex-col">
                    <div className="flex items-start justify-between gap-3 mb-2">
                      <Badge variant="category">{p.category}</Badge>
                      <Badge variant="purchased">구매 완료</Badge>
                    </div>
                    <a
                      href={`#/article/${p.contentId}`}
                      className="font-bold text-stone-900 text-lg leading-snug font-serif-article hover:text-amber-700 mb-1"
                    >
                      {p.title}
                    </a>
                    <p className="text-xs text-stone-500 mb-4">{p.author}</p>

                    <div className="border-t border-stone-100 pt-3 mt-auto space-y-1.5 text-xs text-stone-500">
                      <div className="flex justify-between">
                        <span>결제일</span>
                        <span className="text-stone-700">{formatDateTime(p.paidAt)}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>결제 금액</span>
                        <span className="text-stone-700 font-semibold">{formatWon(p.amount)}</span>
                      </div>
                      {p.cardBrand && (
                        <div className="flex justify-between">
                          <span>결제 수단</span>
                          <span className="text-stone-700">{p.cardBrand} ****-****-****-{p.cardLast4}</span>
                        </div>
                      )}
                    </div>

                    <Button size="sm" variant="outline" className="mt-4" onClick={() => navigate(`/article/${p.contentId}`)}>
                      다시 읽기 →
                    </Button>
                  </Card>
                ))}
              </div>
            )}
          </div>
        </PageContainer>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const hash = useHashRoute();
      const route = matchRoute(hash);

      useEffect(() => {
        window.scrollTo(0, 0);
      }, [hash]);

      const redirect = route.query.redirect || '';
      const contentId = route.query.contentId || '';

      return (
        <ConfigProvider>
          <AuthProvider>
            <div className="min-h-screen flex flex-col">
              <Header />
              <div className="flex-1">
                {route.name === 'home' && <HomePage />}
                {route.name === 'article' && <ArticlePage id={route.params.id} />}
                {route.name === 'login' && <LoginPage redirect={redirect} />}
                {route.name === 'signup' && <SignupPage redirect={redirect} />}
                {route.name === 'checkout' && <CheckoutPage contentId={contentId} />}
                {route.name === 'paymentSuccess' && <PaymentSuccessPage query={route.query} />}
                {route.name === 'paymentFail' && <PaymentFailPage query={route.query} />}
                {route.name === 'purchases' && <PurchasesPage />}
              </div>
              <footer className="border-t border-stone-200 bg-white mt-12">
                <div className="max-w-5xl mx-auto px-5 py-8 text-center text-xs text-stone-400">
                  © 2026 Weekly Insight · 매주 화요일 발행 · 단건 구매 · 토스페이먼츠 연동
                </div>
              </footer>
            </div>
          </AuthProvider>
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
