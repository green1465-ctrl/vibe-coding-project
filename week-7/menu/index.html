<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — 시즌 캠페인 카드뉴스 자동 생성</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/imagekit-javascript@2.0.0/dist/imagekit.min.js"></script>
  <style>
    /* Launchfolio-inspired dark theme */
    html, body {
      background: #0a0a0a;
      color: #e5e7eb;
      font-family: 'Inter', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(132, 204, 22, 0.10), transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 10%, rgba(16, 185, 129, 0.08), transparent 60%),
        linear-gradient(180deg, #0a0a0a 0%, #0e0f12 100%);
      min-height: 100vh;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .toast-in { animation: toast-in .18s ease-out; }
    /* Hero headline gradient */
    .hero-gradient {
      background: linear-gradient(135deg, #ffffff 0%, #a3e635 50%, #34d399 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    /* Glassmorphism card */
    .glass-card {
      background: rgba(20, 22, 26, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    /* Custom scrollbar dark */
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // Constants & Helpers
    // ========================================
    const API_BASE_URL = window.location.origin + '/api';

    const CATEGORY_OPTIONS = ['한식', '분식', '카페', '중식', '일식', '양식', '디저트'];

    // 좌측 리스트 뱃지 + 슬라이드 액센트 컬러를 동시에 사용
    const CATEGORY_COLOR = {
      한식:   { bg: 'bg-stone-100',   text: 'text-stone-700',   accent: 'bg-stone-500',   ring: 'ring-stone-300' },
      분식:   { bg: 'bg-orange-100',  text: 'text-orange-700',  accent: 'bg-orange-500',  ring: 'ring-orange-300' },
      카페:   { bg: 'bg-amber-100',   text: 'text-amber-800',   accent: 'bg-amber-500',   ring: 'ring-amber-300' },
      중식:   { bg: 'bg-red-100',     text: 'text-red-700',     accent: 'bg-red-500',     ring: 'ring-red-300' },
      일식:   { bg: 'bg-sky-100',     text: 'text-sky-700',     accent: 'bg-sky-500',     ring: 'ring-sky-300' },
      양식:   { bg: 'bg-violet-100',  text: 'text-violet-700',  accent: 'bg-violet-500',  ring: 'ring-violet-300' },
      디저트: { bg: 'bg-pink-100',    text: 'text-pink-700',    accent: 'bg-pink-500',    ring: 'ring-pink-300' },
    };

    const STATUS_META = {
      pending:   { dot: 'bg-slate-300',   label: '미작업' },
      generated: { dot: 'bg-yellow-400',  label: '카피 생성됨' },
      ok:        { dot: 'bg-emerald-500', label: 'OK' },
      skip:      { dot: 'bg-rose-500',    label: '스킵' },
    };

    // 최근/예정 12개월 옵션 — default 2026-05
    const MONTHS = (() => {
      const out = [];
      const base = new Date(2026, 4, 1); // 2026-05
      for (let i = -2; i <= 9; i++) {
        const d = new Date(base.getFullYear(), base.getMonth() + i, 1);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        out.push(`${y}-${m}`);
      }
      return out;
    })();

    const monthLabel = (ym) => {
      if (!ym) return '';
      const [y, m] = ym.split('-');
      return `${y}년 ${parseInt(m, 10)}월`;
    };

    // fetch wrapper
    const API = {
      async _req(path, opts = {}) {
        const res = await fetch(`${API_BASE_URL}${path}`, {
          headers: { 'Content-Type': 'application/json' },
          ...opts,
        });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch (_) { /* ignore */ }
        if (!res.ok) {
          const msg = (data && data.message) || `HTTP ${res.status}`;
          throw new Error(msg);
        }
        return data;
      },
      listClients()        { return this._req('/clients'); },
      createClient(body)   { return this._req('/clients', { method: 'POST', body: JSON.stringify(body) }); },
      updateClient(id, b)  { return this._req(`/clients/${id}`, { method: 'PUT', body: JSON.stringify(b) }); },
      deleteClient(id)     { return this._req(`/clients/${id}`, { method: 'DELETE' }); },
      collectTrends(month) { return this._req('/collect-trends', { method: 'POST', body: JSON.stringify({ month }) }); },
      generateCopy(client_id, month) { return this._req('/generate-copy', { method: 'POST', body: JSON.stringify({ client_id, month }) }); },
      regenerateImage(client_id, month) { return this._req('/regenerate-image', { method: 'POST', body: JSON.stringify({ client_id, month }) }); },
      renderSlides(client_id, month, copy, image_url) {
        return this._req('/render-slides', {
          method: 'POST',
          body: JSON.stringify({ client_id, month, copy, image_url }),
        });
      },
      downloadZipUrl(client_id, month) {
        return `${API_BASE_URL}/download-zip/${encodeURIComponent(client_id)}?month=${encodeURIComponent(month)}`;
      },
      quickCopy(client_id, menu_name, style) {
        return this._req('/quick-copy', {
          method: 'POST',
          body: JSON.stringify({ client_id, menu_name, style }),
        });
      },
    };

    // ========================================
    // Design System
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, type = 'button', className = '', title, children }) {
      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-5 py-2.5 text-base',
      };
      // Launchfolio 톤: primary는 라임 + 검정, secondary는 ghost(흰 외곽선)
      const variants = {
        primary:   'bg-lime-400 text-slate-950 hover:bg-lime-300 active:bg-lime-500 shadow-[0_0_20px_rgba(163,230,53,0.25)]',
        secondary: 'bg-white/5 text-slate-100 border border-white/15 hover:bg-white/10 hover:border-white/25',
        danger:    'bg-rose-500/90 text-white hover:bg-rose-500',
        ghost:     'bg-transparent text-slate-300 hover:bg-white/5',
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          title={title}
          className={`inline-flex items-center justify-center gap-1.5 font-semibold rounded-full transition disabled:opacity-40 disabled:cursor-not-allowed ${sizes[size]} ${variants[variant]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ label, error, className = '', ...rest }) {
      return (
        <label className="block">
          {label && <span className="block text-xs font-medium text-slate-400 mb-1.5">{label}</span>}
          <input
            {...rest}
            className={`w-full px-3.5 py-2.5 text-sm border rounded-xl outline-none transition bg-white/5 text-slate-100 placeholder-slate-500
              ${error ? 'border-rose-400/50 focus:ring-2 focus:ring-rose-500/20' : 'border-white/10 focus:border-lime-400/60 focus:ring-2 focus:ring-lime-400/10'}
              ${className}`}
          />
          {error && <span className="block text-xs text-rose-400 mt-1">{error}</span>}
        </label>
      );
    }

    function Textarea({ label, rows = 3, className = '', ...rest }) {
      return (
        <label className="block">
          {label && <span className="block text-xs font-medium text-slate-400 mb-1.5">{label}</span>}
          <textarea
            rows={rows}
            {...rest}
            className={`w-full px-3.5 py-2.5 text-sm border border-white/10 rounded-xl outline-none bg-white/5 text-slate-100 placeholder-slate-500 focus:border-lime-400/60 focus:ring-2 focus:ring-lime-400/10 resize-y ${className}`}
          />
        </label>
      );
    }

    function Select({ label, options = [], className = '', ...rest }) {
      return (
        <label className="block">
          {label && <span className="block text-xs font-medium text-slate-400 mb-1.5">{label}</span>}
          <select
            {...rest}
            className={`w-full px-3.5 py-2.5 text-sm border border-white/10 rounded-xl bg-slate-900 text-slate-100 outline-none focus:border-lime-400/60 focus:ring-2 focus:ring-lime-400/10 ${className}`}
          >
            {options.map((opt) => {
              const value = typeof opt === 'string' ? opt : opt.value;
              const labelText = typeof opt === 'string' ? opt : opt.label;
              return <option key={value} value={value} className="bg-slate-900 text-slate-100">{labelText}</option>;
            })}
          </select>
        </label>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`glass-card rounded-2xl shadow-[0_4px_30px_rgba(0,0,0,0.3)] ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, color = 'slate', className = '' }) {
      // 다크 톤 배지 — 어두운 반투명 배경 + 액센트 텍스트
      const palette = {
        slate:  'bg-white/5 text-slate-300 border border-white/10',
        stone:  'bg-stone-500/10 text-stone-300 border border-stone-500/20',
        orange: 'bg-orange-500/15 text-orange-300 border border-orange-500/20',
        amber:  'bg-amber-500/15 text-amber-300 border border-amber-500/20',
        red:    'bg-rose-500/15 text-rose-300 border border-rose-500/20',
        sky:    'bg-sky-500/15 text-sky-300 border border-sky-500/20',
        violet: 'bg-violet-500/15 text-violet-300 border border-violet-500/20',
        pink:   'bg-pink-500/15 text-pink-300 border border-pink-500/20',
        emerald:'bg-emerald-500/15 text-emerald-300 border border-emerald-500/20',
        lime:   'bg-lime-400/15 text-lime-300 border border-lime-400/25',
      };
      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 text-xs font-semibold rounded-full ${palette[color] || palette.slate} ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, children, size = 'md' }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose && onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };
      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" onClick={onClose}>
          <div
            onClick={(e) => e.stopPropagation()}
            className={`glass-card rounded-2xl shadow-2xl w-full ${sizes[size]} max-h-[90vh] overflow-auto`}
            role="dialog"
            aria-modal="true"
          >
            <div className="flex items-center justify-between px-5 py-4 border-b border-white/10">
              <h2 className="text-base font-semibold text-slate-100">{title}</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-100" aria-label="닫기">✕</button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function Toast({ toast, onClose }) {
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => onClose && onClose(), 2400);
        return () => clearTimeout(t);
      }, [toast, onClose]);
      if (!toast) return null;
      const tone = toast.tone || 'info';
      const palette = {
        info:    'bg-white/10 text-slate-100 border border-white/15 backdrop-blur',
        success: 'bg-lime-400/20 text-lime-200 border border-lime-400/30 backdrop-blur',
        error:   'bg-rose-500/20 text-rose-200 border border-rose-500/30 backdrop-blur',
        warning: 'bg-amber-500/20 text-amber-200 border border-amber-500/30 backdrop-blur',
      };
      return (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
          <div className={`toast-in px-4 py-2.5 rounded-full shadow-2xl text-sm font-medium ${palette[tone]}`}>
            {toast.message}
          </div>
        </div>
      );
    }

    // ========================================
    // Common atoms
    // ========================================
    function CategoryBadge({ category, className = '' }) {
      const c = CATEGORY_COLOR[category] || CATEGORY_COLOR.한식;
      return (
        <span className={`inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-full ${c.bg} ${c.text} ${className}`}>
          {category}
        </span>
      );
    }

    function StatusDot({ status, withLabel = false, className = '' }) {
      const meta = STATUS_META[status] || STATUS_META.pending;
      return (
        <span className={`inline-flex items-center gap-1.5 ${className}`}>
          <span className={`w-2.5 h-2.5 rounded-full ${meta.dot}`} aria-label={meta.label} />
          {withLabel && <span className="text-xs text-slate-400">{meta.label}</span>}
        </span>
      );
    }

    // ========================================
    // Header
    // ========================================
    function Header({ month, onMonthChange, onCollect, collecting, hasTrends, sourcesUsed }) {
      const sourcesLabel = Array.isArray(sourcesUsed) && sourcesUsed.length
        ? ` · ${sourcesUsed.join(' · ')}`
        : '';
      return (
        <header className="sticky top-0 z-20 bg-black/40 backdrop-blur-xl border-b border-white/10">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex flex-col gap-2.5 sm:flex-row sm:items-end sm:justify-between">
            <div className="max-w-2xl">
              <div className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-lime-400/10 border border-lime-400/25 text-lime-300 text-[10px] font-semibold tracking-wide uppercase mb-1.5">
                <span className="w-1 h-1 rounded-full bg-lime-400 animate-pulse"></span>
                Season campaign auto-generator
              </div>
              <h1 className="text-lg sm:text-2xl font-black tracking-tight leading-[1.1] text-slate-50">
                외식 가맹점 카드뉴스를 <span className="hero-gradient">한 번의 클릭으로</span>
              </h1>
              <p className="text-[11px] sm:text-xs text-slate-400 mt-1 max-w-md leading-snug">
                트렌드 자동 수집 · AI 카피 재창조 · 슬라이드 합성까지 한 사이클 30분 이내.
              </p>
              {hasTrends && (
                <div className="inline-flex items-center gap-1.5 mt-2 text-[11px] text-lime-300 bg-lime-400/10 border border-lime-400/25 px-2 py-0.5 rounded-full">
                  <span className="w-1 h-1 rounded-full bg-lime-400"></span>
                  {monthLabel(month)} 트렌드 수집됨<span className="text-slate-400 hidden sm:inline">{sourcesLabel}</span>
                </div>
              )}
            </div>
            <div className="flex items-center gap-2 flex-wrap sm:justify-end">
              <select
                value={month}
                onChange={(e) => onMonthChange(e.target.value)}
                className="px-3 py-1.5 text-xs border border-white/15 rounded-full bg-white/5 text-slate-100 outline-none focus:border-lime-400/60 focus:ring-2 focus:ring-lime-400/10 cursor-pointer"
              >
                {MONTHS.map((m) => <option key={m} value={m} className="bg-slate-900 text-slate-100">{monthLabel(m)}</option>)}
              </select>
              <Button onClick={onCollect} disabled={collecting} size="sm">
                {collecting ? '수집 중...' : '이번 달 트렌드 가져오기 →'}
              </Button>
            </div>
          </div>
        </header>
      );
    }

    // ========================================
    // Slide components — 1080x1080 (aspect-square)
    // ========================================
    function SlideShell({ children, className = '' }) {
      return (
        <div className={`relative w-full aspect-square rounded-2xl overflow-hidden shadow-2xl ring-1 ring-white/10 ${className}`}>
          {children}
        </div>
      );
    }

    function Slide1Cover({ client, copy }) {
      return (
        <SlideShell>
          {/* 회색 그라데이션 배경 (Week 3에 fal.ai 이미지로 교체) */}
          <div className="absolute inset-0 bg-gradient-to-br from-slate-300 to-slate-500 flex items-center justify-center">
            <div className="text-[20vmin] sm:text-[14rem] opacity-60 select-none">🍽️</div>
          </div>
          {/* 좌상단 클라이언트 이름 */}
          <div className="absolute top-4 left-4 text-xs sm:text-sm font-medium text-white/90 bg-black/30 px-2.5 py-1 rounded-full backdrop-blur-sm">
            {client.name}
          </div>
          {/* 하단 50% 그라데이션 + 헤드라인 */}
          <div className="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/85 via-black/55 to-transparent flex items-end">
            <div className="p-5 sm:p-7 w-full">
              <h2 className="text-white font-black leading-tight tracking-tight text-2xl sm:text-3xl md:text-4xl drop-shadow-sm">
                {copy?.headline || '헤드라인이 여기에 표시됩니다'}
              </h2>
            </div>
          </div>
        </SlideShell>
      );
    }

    function SlideTextBase({ client, body, accent, footer, slideLabel }) {
      const c = CATEGORY_COLOR[client.category] || CATEGORY_COLOR.한식;
      return (
        <SlideShell className="bg-white/5">
          {/* 상단 카테고리 액센트 바 */}
          <div className={`absolute top-0 inset-x-0 h-1.5 ${c.accent}`} />
          <div className="absolute inset-0 flex flex-col p-6 sm:p-8">
            {/* 상단: 카테고리 + 이름 */}
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <CategoryBadge category={client.category} />
                <span className="text-xs sm:text-sm font-medium text-slate-300">{client.name}</span>
              </div>
              {slideLabel && (
                <span className="text-[10px] sm:text-xs uppercase tracking-widest text-slate-400 font-semibold">
                  {slideLabel}
                </span>
              )}
            </div>

            {/* 중앙 본문 */}
            <div className="flex-1 flex items-center">
              <p className={`font-bold text-slate-100 leading-snug whitespace-pre-wrap break-keep
                ${accent ? 'text-2xl sm:text-3xl md:text-4xl' : 'text-xl sm:text-2xl md:text-3xl'}`}>
                {body || <span className="text-slate-300 font-medium">내용이 여기에 표시됩니다</span>}
              </p>
            </div>

            {/* 하단 출처 (옵션) */}
            {footer && (
              <div className="text-xs text-slate-400 pt-2 border-t border-white/10">
                {footer}
              </div>
            )}
          </div>
        </SlideShell>
      );
    }

    function Slide2Insight({ client, copy }) {
      return <SlideTextBase client={client} body={copy?.slide2} slideLabel="01 · INSIGHT" />;
    }
    function Slide3Menu({ client, copy }) {
      return <SlideTextBase client={client} body={copy?.slide3} slideLabel="02 · MENU" accent />;
    }
    function Slide4Menu({ client, copy }) {
      return <SlideTextBase client={client} body={copy?.slide4} slideLabel="03 · MENU" accent />;
    }
    function Slide5Cta({ client, copy }) {
      const footer = copy?.source ? `출처: ${copy.source}` : null;
      return <SlideTextBase client={client} body={copy?.cta} slideLabel="04 · CTA" accent footer={footer} />;
    }

    function SlideCarousel({ client, copy, slides: pngSlides }) {
      const [idx, setIdx] = useState(0);
      // 슬라이드 수는 합성된 PNG 개수에 따라 동적 (캘린더 페이지 가변)
      const total = Array.isArray(pngSlides) && pngSlides.length > 0 ? pngSlides.length : 9;

      // 클라이언트 바뀌면 첫 슬라이드로
      useEffect(() => { setIdx(0); }, [client?.id]);

      // PNG가 9장 다 있으면 PNG 모드, 아니면 HTML fallback (간단 cover)
      const usePng = Array.isArray(pngSlides) && pngSlides.length === total
        && pngSlides.every((s) => s && typeof s.url === 'string');

      // HTML fallback: 9장은 PNG 없을 때만 보이고, 보통 Slide 1만 컨셉으로 보여줌
      const htmlSlides = Array.from({ length: total }, (_, i) => (
        <Slide1Cover key={"hp" + i} client={client} copy={copy} />
      ));

      const renderSlide = (i) => {
        if (usePng) {
          const s = pngSlides[i];
          return (
            <SlideShell>
              <img
                src={s.url}
                alt={`Slide ${s.slide_n}`}
                className="absolute inset-0 w-full h-full object-cover"
                draggable={false}
              />
            </SlideShell>
          );
        }
        return htmlSlides[i];
      };

      const prev = () => setIdx((i) => (i - 1 + total) % total);
      const next = () => setIdx((i) => (i + 1) % total);

      return (
        <div className="w-full max-w-[480px] mx-auto">
          <div className="relative">
            {renderSlide(idx)}

            {/* 좌우 화살표 */}
            <button
              onClick={prev}

    // ========================================
    // ClientForm (modal body)
    // ========================================
    function ClientForm({ initial, onSubmit, onDelete, submitting }) {
      const [form, setForm] = useState(() => ({
        name: initial?.name || '',
        category: initial?.category || '한식',
        email: initial?.email || '',
        tone: initial?.tone || '',
        menu_keywords_text: Array.isArray(initial?.menu_keywords) ? initial.menu_keywords.join(', ') : '',
      }));
      const [errors, setErrors] = useState({});

      const handle = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

      const submit = (e) => {
        e.preventDefault();
        const errs = {};
        if (!form.name.trim()) errs.name = '이름은 필수입니다';
        if (!form.email.trim()) errs.email = '이메일은 필수입니다';
        setErrors(errs);
        if (Object.keys(errs).length) return;

        const menu_keywords = form.menu_keywords_text
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean);

        onSubmit({
          name: form.name.trim(),
          category: form.category,
          email: form.email.trim(),
          tone: form.tone.trim(),
          menu_keywords,
        });
      };

      return (
        <form onSubmit={submit} className="space-y-3">
          <Input label="이름 *" value={form.name} onChange={handle('name')} error={errors.name} placeholder="예: 정담한정식" />
          <div className="grid grid-cols-2 gap-3">
            <Select label="업종" options={CATEGORY_OPTIONS} value={form.category} onChange={handle('category')} />
            <Input label="이메일 *" type="email" value={form.email} onChange={handle('email')} error={errors.email} placeholder="owner@example.com" />
          </div>
          <Input label="톤" value={form.tone} onChange={handle('tone')} placeholder="예: 정중하고 따뜻한" />
          <Input
            label="메뉴 키워드 (쉼표로 구분)"
            value={form.menu_keywords_text}
            onChange={handle('menu_keywords_text')}
            placeholder="비빔밥, 된장찌개, 김치찌개"
          />

          <div className="flex items-center justify-between pt-2 border-t border-slate-100 mt-4">
            <div>
              {initial && onDelete && (
                <Button variant="danger" size="sm" onClick={onDelete} type="button">
                  🗑️ 삭제
                </Button>
              )}
            </div>
            <Button type="submit" disabled={submitting}>
              {submitting ? '저장 중...' : '저장'}

    // ========================================
    // CopyEditor — 8장 카드뉴스 구조 (헤드라인 + 트렌드 + 추천 메뉴 3개 + CTA + 출처)
    // ========================================
    // 메뉴 슬라이드용 ImageKit 업로더 — 파일 선택 → ImageKit 업로드 → URL을 onUpload로 전달
    function MenuImageUploader({ slideN, currentUrl, onUpload, disabled }) {
      const [uploading, setUploading] = useState(false);
      const [error, setError] = useState('');
      const inputRef = useRef(null);

      const handleFile = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!window.ImageKit) {
          setError('ImageKit SDK 로드 실패 — 새로고침 후 다시 시도하세요');
          return;
        }
        setError('');
        setUploading(true);
        try {
          // 인증 토큰 받기
          const auth = await fetch('/api/imagekit-auth').then((r) => r.json());
          if (!auth || !auth.publicKey || !auth.token) {
            throw new Error(auth?.message || 'ImageKit 인증 실패 (.env에 IMAGEKIT_* 설정 필요)');
          }
          const ik = new window.ImageKit({
            publicKey: auth.publicKey,
            urlEndpoint: auth.urlEndpoint,
          });
          const result = await new Promise((resolve, reject) => {
            ik.upload(
              {
                file,
                fileName: `menu-${slideN}-${Date.now()}.${(file.name.split('.').pop() || 'jpg').toLowerCase()}`,
                token: auth.token,
                expire: auth.expire,
                signature: auth.signature,
                useUniqueFileName: true,
                folder: '/menu-cards',
              },
              (err, res) => (err ? reject(err) : resolve(res))
            );
          });
          if (!result || !result.url) throw new Error('업로드 응답에 URL 없음');
          onUpload(result.url);
        } catch (err) {
          setError(err.message || '업로드 실패');
        } finally {
          setUploading(false);
          // 같은 파일을 다시 선택할 수 있게 input 리셋
          if (inputRef.current) inputRef.current.value = '';
        }
      };

      return (
        <div className="mt-2">
          <div className="flex items-center justify-between gap-2 mb-1">
            <span className="text-[11px] font-semibold text-slate-400">메뉴 이미지 (선택)</span>
            {currentUrl && (
              <button
                type="button"
                className="text-[11px] text-rose-400 hover:underline"
                onClick={() => onUpload('')}
              >이미지 제거</button>
            )}
          </div>
          {currentUrl && (
            <div className="mb-2 rounded-lg overflow-hidden border border-white/10">
              <img src={currentUrl} alt="" className="w-full h-32 object-cover" />
            </div>
          )}
          <label className={`block text-xs ${disabled || uploading ? 'opacity-60' : 'cursor-pointer'}`}>
            <input
              ref={inputRef}
              type="file"
              accept="image/*"
              disabled={disabled || uploading}
              onChange={handleFile}
              className="hidden"
            />
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-white/15 bg-white/5 hover:bg-white/10 text-slate-100">
              {uploading ? '업로드 중...' : (currentUrl ? '이미지 교체' : '이미지 업로드')}
            </span>
          </label>
          {error && (
            <p className="mt-1 text-[11px] text-rose-300 bg-rose-500/10 border border-rose-500/25 px-2 py-1 rounded">
              {error}
            </p>
          )}
        </div>
      );
    }

                  />
                  <MenuImageUploader
                    slideN={slideN}

          })}
          <Textarea
            label="Slide 9 — CTA (공휴일 분위기 반영)"
            rows={2}

          <Input

    // ========================================
    // StatusToggle (3-segment)
    // ========================================
    function StatusToggle({ value, onChange }) {
      const options = [
        { v: 'ok',        label: 'OK',   activeCls: 'bg-lime-400 text-slate-950' },
        { v: 'generated', label: '수정중', activeCls: 'bg-amber-400 text-slate-950' },
        { v: 'skip',      label: '스킵', activeCls: 'bg-rose-500 text-white' },
      ];
      return (
        <div className="inline-flex rounded-full border border-white/15 bg-white/5 overflow-hidden">
          {options.map((o, i) => {
            const active = value === o.v;
            return (
              <button
                key={o.v}
                type="button"
                onClick={() => onChange(o.v)}
                className={`px-3 py-1.5 text-xs font-medium ${i === 0 ? '' : 'border-l border-white/15'}

    // ========================================
    // WorkArea (right panel)
    // ========================================
    // 메뉴명 1개를 받아 OpenAI로 짧은 카피를 즉석 생성하는 도구 카드
    function QuickCopyCard({ client, showToast }) {
      const [menuName, setMenuName] = useState('');
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState('');

      const onGenerate = async () => {
        const name = menuName.trim();
        if (!name) {
          showToast('메뉴 이름을 먼저 입력하세요', 'warning');
          return;
        }
        setLoading(true);
        setError('');
        try {
          const res = await API.quickCopy(client.id, name);
          setResult(res);
        } catch (err) {
          setError(err.message || '카피 생성 실패');
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = (text) => {
        if (!navigator.clipboard) {
          showToast('복사 미지원 브라우저', 'warning');
          return;
        }
        navigator.clipboard.writeText(text).then(
          () => showToast('복사됨', 'success'),
          () => showToast('복사 실패', 'error')
        );
      };

      return (
        <Card className="p-4 sm:p-5">
          <div className="flex items-center justify-between gap-2 mb-3">
            <div>
              <h3 className="text-sm font-semibold text-slate-100">메뉴 카피 즉석 생성</h3>
              <p className="text-[11px] text-slate-400 mt-0.5">
                {client.name}의 톤으로 메뉴 1개에 어울리는 짧은 카피를 만들어 드립니다.
              </p>
            </div>
            <Badge color="emerald">OpenAI</Badge>
          </div>

          <div className="flex flex-col sm:flex-row gap-2">
            <input
              type="text"
              value={menuName}
              onChange={(e) => setMenuName(e.target.value)}
              placeholder="예: 새우 봄나물 비빔밥"
              className="flex-1 px-3 py-2 text-sm border border-white/15 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400"
              onKeyDown={(e) => { if (e.key === 'Enter' && !loading) onGenerate(); }}
            />
            <Button onClick={onGenerate} disabled={loading || !menuName.trim()}>
              {loading ? '생성 중...' : '카피 생성'}
            </Button>
          </div>

          {error && (
            <p className="mt-3 text-xs text-rose-300 bg-rose-500/10 border border-rose-500/25 px-3 py-2 rounded-lg">
              {error}
            </p>
          )}

          {result && !error && (
            <div className="mt-4 space-y-3">
              <div className="bg-white/5 border border-white/10 rounded-lg p-3">
                <div className="flex items-start justify-between gap-2 mb-1">
                  <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Headline</span>
                  <button
                    type="button"
                    onClick={() => copyToClipboard(result.headline)}
                    className="text-[11px] text-lime-300 hover:underline"
                  >복사</button>
                </div>
                <p className="text-sm font-bold text-slate-100">{result.headline}</p>
              </div>
              <div className="bg-white/5 border border-white/10 rounded-lg p-3">
                <div className="flex items-start justify-between gap-2 mb-1">
                  <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Line</span>
                  <button
                    type="button"
                    onClick={() => copyToClipboard(result.line)}
                    className="text-[11px] text-lime-300 hover:underline"
                  >복사</button>
                </div>
                <p className="text-sm text-slate-300 leading-relaxed">{result.line}</p>
              </div>
              <p className="text-[10px] text-slate-400">
                provider: {result.provider || 'unknown'} · 메뉴: {result.menu_name}
              </p>
            </div>
          )}
        </Card>
      );
    }

              >
                {generating ? '카피 생성 중...' : '카피 생성'}
              </Button>

                variant="secondary"

              </Button>
              <Button

              >
                {downloading ? '다운로드 중...' : '다운로드'}
              </Button>
            </div>

            {!hasTrends && (
              <p className="mt-3 text-xs text-amber-300 bg-amber-500/10 border border-amber-500/25 px-3 py-2 rounded-lg">
                상단 "이번 달 트렌드 가져오기"를 먼저 실행하면 카테고리별 트렌드를 기반으로 카피가 생성됩니다.
              </p>
            )}
          </Card>

          {/* Carousel + editor: side-by-side on lg+ */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <Card className="p-4 sm:p-5">
              <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
                <h3 className="text-sm font-semibold text-slate-100">슬라이드 미리보기</h3>
                {slidesData && !isStale && (
                  <Badge color="amber">PNG 합성됨</Badge>
                )}
                {!slidesData && (
                  <Badge color="slate">HTML 미리보기</Badge>
                )}
              </div>
              {isStale && (
                <p className="mb-3 text-[11px] text-amber-300 bg-amber-500/10 border border-amber-500/25 px-2.5 py-1.5 rounded-lg">
                  ✏️ 카피 수정됨 — 우측 '수정 완료' 버튼을 누르면 PNG에 반영됩니다
                </p>
              )}
              <SlideCarousel
                client={client}
                copy={copy}
                slides={isStale ? null : (slidesData?.slides || null)}
              />
              <p className="text-[11px] text-slate-400 text-center mt-3">
                1080×1080 · {slidesData && !isStale ? 'Playwright로 합성된 PNG' : 'HTML 실시간 미리보기'}
              </p>
            </Card>

            <Card className="p-4 sm:p-5">
              <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
                <h3 className="text-sm font-semibold text-slate-100">카피 편집</h3>
                {isStale && (
                  <Badge color="amber">변경됨 — 재합성 필요</Badge>
                )}
              </div>
              <CopyEditor copy={copy} onChange={onCopyChange} disabled={!copy} />

              {/* 수정 완료 버튼 — 편집 내용을 PNG 카드뉴스에 반영 */}
              <div className="mt-4 pt-4 border-t border-white/10">
                <Button
                  className="w-full"
                  variant={isStale ? 'primary' : 'secondary'}
                  onClick={onRender}
                  disabled={!copy || rendering}
                  title={!copy ? '먼저 카피를 생성하세요' : '편집한 카피로 PNG 9장을 다시 합성합니다'}
                >
                  {rendering
                    ? '재합성 중... (10~20초)'
                    : (isStale ? '✓ 수정 완료 — 카드뉴스 재합성' : '수정 완료 — 카드뉴스 재합성')}
                </Button>
                <p className="mt-2 text-[11px] text-slate-400 text-center">
                  카피 편집 후 이 버튼을 누르면 카드뉴스 PNG에 반영됩니다.
                </p>
              </div>
            </Card>
          </div>

          {/* 메뉴 카피 즉석 생성 도구 */}
          <QuickCopyCard client={client} showToast={showToast} />
        </div>
      );
    }

    // ========================================
    // App (root)
    // ========================================
    // ========================================
    // LoginGate — 비밀번호 입력 페이지 (다크 톤)
    // ========================================
    function LoginGate({ onSuccess }) {
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e?.preventDefault();
        if (!password) return;
        setLoading(true);
        setError('');
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            throw new Error(data.message || '로그인 실패');
          }
          onSuccess();
        } catch (err) {
          setError(err.message || '로그인 실패');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4">
          <div className="w-full max-w-sm">
            <div className="glass-card rounded-2xl p-7 shadow-[0_0_40px_rgba(163,230,53,0.08)]">
              <div className="text-center mb-6">
                <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-lime-400/10 border border-lime-400/25 text-lime-300 text-[10px] font-semibold tracking-wide uppercase mb-3">
                  <span className="w-1 h-1 rounded-full bg-lime-400 animate-pulse"></span>
                  Private workspace
                </div>
                <h1 className="text-2xl font-black tracking-tight text-slate-50">
                  🍽️ <span className="hero-gradient">Menu</span>
                </h1>
                <p className="text-[12px] text-slate-400 mt-1.5 leading-snug">
                  외식 가맹점 카드뉴스 자동 생성<br />접근하려면 비밀번호를 입력하세요.
                </p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-3">
                <Input
                  label="비밀번호"
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  autoFocus
                  placeholder="••••••••"
                  disabled={loading}
                />
                {error && (
                  <p className="text-[11px] text-rose-300 bg-rose-500/10 border border-rose-500/25 px-3 py-2 rounded-lg">
                    {error}
                  </p>
                )}
                <Button
                  type="submit"
                  className="w-full"
                  size="lg"
                  disabled={loading || !password}
                  onClick={handleSubmit}
                >
                  {loading ? '확인 중...' : '입장 →'}
                </Button>
              </form>

              <p className="mt-5 text-[10px] text-slate-500 text-center">
                7일간 자동 로그인 유지 · 쿠키 기반
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // Root — 인증 상태에 따라 LoginGate 또는 App 분기
    // ========================================
    function Root() {
      const [authState, setAuthState] = useState({ loading: true, authed: false, required: false });

      const checkAuth = useCallback(async () => {
        try {
          const res = await fetch('/api/me');
          const data = await res.json();
          setAuthState({
            loading: false,
            authed: !!data.authed,
            required: !!data.auth_required,
          });
        } catch {
          setAuthState({ loading: false, authed: false, required: true });
        }
      }, []);

      useEffect(() => { checkAuth(); }, [checkAuth]);

      if (authState.loading) {
        return (
          <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">
            불러오는 중...
          </div>
        );
      }
      // 비밀번호 미설정(required=false)이면 바로 App
      if (authState.required && !authState.authed) {
        return <LoginGate onSuccess={() => setAuthState((s) => ({ ...s, authed: true }))} />;
      }
      return <App />;
    }

    function App() {
      const [clients, setClients] = useState([]);
      const [selectedClientId, setSelectedClientId] = useState(null);
      const [month, setMonth] = useState('2026-05');
      const [campaignsByMonth, setCampaignsByMonth] = useState({}); // { '2026-05': campaign }
      // 모든 작업 캐시는 (client_id, month) 조합 키 — 월을 바꿔도 서로 덮어쓰지 않음
      const [copies, setCopies] = useState({}); // { "cid::month": copy }
      const [statusMap, setStatusMap] = useState({}); // { "cid::month": status }

      // 합성된 PNG / fal.ai 이미지 캐시 (cid::month 단위)
      const [slidesByClient, setSlidesByClient] = useState({}); // { "cid::month": { slides, renderedAt, month } }
      const [imagesByClient, setImagesByClient] = useState({}); // { "cid::month": { image_url, month } }
      // PNG가 stale인지: 합성 이후 카피가 바뀌었으면 true
      const [staleByClient, setStaleByClient] = useState({}); // { "cid::month": true }

      const k = (cid, m) => `${cid}::${m}`;

      const [loading, setLoading] = useState(true);
      const [collecting, setCollecting] = useState(false);
      const [generating, setGenerating] = useState(false);
      const [rendering, setRendering] = useState(false);
      const [regeneratingImage, setRegeneratingImage] = useState(false);
      const [downloading, setDownloading] = useState(false);

      const [modal, setModal] = useState(null); // { mode: 'add'|'edit', client? }
      const [confirmDelete, setConfirmDelete] = useState(null); // client | null
      const [submitting, setSubmitting] = useState(false);

      const [toast, setToast] = useState(null);
      const showToast = useCallback((message, tone = 'info') => {
        setToast({ message, tone, id: Date.now() });
      }, []);

      // Initial load
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const list = await API.listClients();
            if (cancelled) return;
            setClients(list);
            if (list.length > 0) setSelectedClientId(list[0].id);
            // statusMap은 (cid::month) 단위로 채워지며, 없으면 'pending' fallback
          } catch (err) {
            showToast('클라이언트 목록을 불러오지 못했습니다: ' + err.message, 'error');
          } finally {
            if (!cancelled) setLoading(false);
          }
        })();
        return () => { cancelled = true; };
      }, [showToast]);

      const selectedClient = useMemo(
        () => clients.find((c) => c.id === selectedClientId) || null,
        [clients, selectedClientId]
      );

      const currentCampaign = campaignsByMonth[month] || null;
      const hasTrends = !!currentCampaign;
      const sourcesUsed = (currentCampaign && Array.isArray(currentCampaign.sources_used))
        ? currentCampaign.sources_used
        : null;

      // ============ Handlers ============

      const handleCollectTrends = useCallback(async () => {
        setCollecting(true);
        try {
          const camp = await API.collectTrends(month);
          setCampaignsByMonth((prev) => ({ ...prev, [month]: camp }));
          // 각 월별 캐시는 (cid::month) 단위로 보존됨 — 다른 월 데이터는 건드리지 않음
          const sources = Array.isArray(camp.sources_used) && camp.sources_used.length
            ? ` (${camp.sources_used.join(' + ')})`
            : '';
          showToast(`${monthLabel(month)} 트렌드를 수집했습니다${sources}`, 'success');
        } catch (err) {
          showToast('트렌드 수집 실패: ' + err.message, 'error');
        } finally {
          setCollecting(false);
        }
      }, [month, clients, showToast]);

      const handleGenerateCopy = useCallback(async () => {
        if (!selectedClient) return;
        if (!hasTrends) {
          showToast('먼저 상단 "이번 달 트렌드 가져오기"를 실행하세요', 'warning');
          return;
        }
        const key = k(selectedClient.id, month);
        setGenerating(true);
        try {
          const res = await API.generateCopy(selectedClient.id, month);
          const newCopy = res.copy;
          setCopies((prev) => ({ ...prev, [key]: newCopy }));
          setStatusMap((prev) => ({ ...prev, [key]: 'generated' }));
          showToast(`${selectedClient.name} ${month} 카피 생성 완료 — 슬라이드 5장 합성 중...`, 'info');

          // 카피 생성 직후 자동 합성: 새 copy + 캐시된 fal.ai 이미지를 함께 넘김 (해당 월의 캐시)
          setRendering(true);
          try {
            const cachedImage = imagesByClient[key]?.image_url || null;
            const renderRes = await API.renderSlides(selectedClient.id, month, newCopy, cachedImage);
            const ts = Date.now();
            const slidesWithBust = (renderRes.slides || []).map((s) => ({
              ...s,
              url: s.url + (s.url.includes('?') ? '&' : '?') + 'v=' + ts,
            }));
            setSlidesByClient((prev) => ({
              ...prev,
              [key]: {
                slides: slidesWithBust,
                renderedAt: new Date().toISOString(),
                month,
              },
            }));
            setStaleByClient((prev) => {
              const next = { ...prev };
              delete next[key];
              return next;
            });
            showToast(`${month} 카피 생성 + 슬라이드 5장 합성 완료`, 'success');
          } catch (renderErr) {
            // 합성만 실패한 경우 — 카피는 살아있으니 "다시 합성"으로 복구 가능
            setStaleByClient((prev) => ({ ...prev, [key]: true }));
            showToast('카피는 생성됐지만 합성 실패: ' + renderErr.message + ' — "다시 합성"을 눌러주세요', 'error');
          } finally {
            setRendering(false);
          }
        } catch (err) {
          showToast('카피 생성 실패: ' + err.message, 'error');
        } finally {
          setGenerating(false);
        }
      }, [selectedClient, hasTrends, month, showToast, imagesByClient]);

      const handleCopyChange = useCallback((newCopy) => {
        if (!selectedClient) return;
        const key = k(selectedClient.id, month);
        setCopies((prev) => ({ ...prev, [key]: newCopy }));
        setStatusMap((prev) => {
          const cur = prev[key];
          if (!cur || cur === 'pending') return { ...prev, [key]: 'generated' };
          return prev;
        });
        // 합성된 PNG가 있다면 카피 변경 시 stale 표시 (자동 재합성 트리거)
        setStaleByClient((prev) => {
          if (slidesByClient[key]) {
            return { ...prev, [key]: true };
          }
          return prev;
        });
      }, [selectedClient, month, slidesByClient]);

      const handleRender = useCallback(async () => {
        if (!selectedClient) return;
        const key = k(selectedClient.id, month);
        const copy = copies[key];
        if (!copy) {
          showToast('먼저 카피를 생성하세요', 'warning');
          return;
        }
        setRendering(true);
        showToast('PNG 5장 합성 중... (10~20초)', 'info');
        try {
          const cachedImage = imagesByClient[key]?.image_url || null;
          const res = await API.renderSlides(selectedClient.id, month, copy, cachedImage);
          // 캐시 버스팅: 같은 파일 경로라도 새로 합성됐음을 보장
          const ts = Date.now();
          const slidesWithBust = (res.slides || []).map((s) => ({
            ...s,
            url: s.url + (s.url.includes('?') ? '&' : '?') + 'v=' + ts,
          }));
          setSlidesByClient((prev) => ({
            ...prev,
            [key]: {
              slides: slidesWithBust,
              renderedAt: new Date().toISOString(),
              month,
            },
          }));
          setStaleByClient((prev) => {
            const next = { ...prev };
            delete next[key];
            return next;
          });
          showToast('슬라이드 5장 합성 완료', 'success');
        } catch (err) {
          showToast('합성 실패: ' + err.message, 'error');
        } finally {
          setRendering(false);
        }
      }, [selectedClient, copies, imagesByClient, month, showToast]);

      const handleRegenImage = useCallback(async () => {
        if (!selectedClient) return;
        if (!hasTrends) {
          showToast('먼저 상단 "이번 달 트렌드 가져오기"를 실행하세요', 'warning');
          return;
        }
        const key = k(selectedClient.id, month);
        setRegeneratingImage(true);
        showToast('fal.ai 이미지 생성 중...', 'info');
        try {
          const res = await API.regenerateImage(selectedClient.id, month);
          if (!res.image_url) {
            showToast(res.message || '이미지 생성 실패 (FAL_KEY 미설정?)', 'error');
            return;
          }
          setImagesByClient((prev) => ({
            ...prev,
            [key]: { image_url: res.image_url, month },
          }));
          // 새 이미지가 들어왔으니 같은 월의 기존 PNG는 stale
          setStaleByClient((prev) => {
            if (slidesByClient[key]) {
              return { ...prev, [key]: true };
            }
            return prev;
          });
          showToast('음식 이미지 생성 완료 — "다시 합성"으로 Slide 1에 적용', 'success');
        } catch (err) {
          showToast('이미지 재생성 실패: ' + err.message, 'error');
        } finally {
          setRegeneratingImage(false);
        }
      }, [selectedClient, hasTrends, month, showToast, slidesByClient]);

      const handleDownload = useCallback(() => {
        if (!selectedClient) return;
        const slidesData = slidesByClient[k(selectedClient.id, month)];
        if (!slidesData) {
          showToast('먼저 "다시 합성"을 실행하세요', 'warning');
          return;
        }
        setDownloading(true);
        try {
          const dlMonth = slidesData.month || month;
          const url = API.downloadZipUrl(selectedClient.id, dlMonth);
          // 보이지 않는 a 태그로 다운로드 트리거 (window.open은 새 탭으로 빈 페이지가 남을 수 있음)
          const a = document.createElement('a');
          a.href = url;
          a.rel = 'noopener';
          // download 속성은 same-origin일 때만 파일명 적용 — 서버 Content-Disposition이 우선
          a.download = '';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast('ZIP 다운로드 시작', 'success');
        } catch (err) {
          showToast('다운로드 실패: ' + err.message, 'error');
        } finally {
          // 다운로드는 사용자 확인 다이얼로그/스트림이라 즉시 false
          setDownloading(false);
        }
      }, [selectedClient, slidesByClient, month, showToast]);

      const handleStatusChange = useCallback((status) => {
        if (!selectedClient) return;
        setStatusMap((prev) => ({ ...prev, [k(selectedClient.id, month)]: status }));
      }, [selectedClient, month]);

      // ============ Client CRUD ============

      const openAdd = () => setModal({ mode: 'add' });
      const openEdit = (client) => setModal({ mode: 'edit', client });

      const handleSubmitClient = useCallback(async (payload) => {
        setSubmitting(true);
        try {
          if (modal?.mode === 'add') {
            const created = await API.createClient(payload);
            setClients((prev) => [...prev, created]);
            // status는 (cid::month) 단위 + 없으면 'pending' fallback이라 추가 init 불필요
            setSelectedClientId(created.id);
            showToast(`${created.name} 추가됨`, 'success');
          } else if (modal?.mode === 'edit' && modal.client) {
            const updated = await API.updateClient(modal.client.id, payload);
            setClients((prev) => prev.map((c) => (c.id === updated.id ? updated : c)));
            showToast(`${updated.name} 수정됨`, 'success');
          }
          setModal(null);
        } catch (err) {
          showToast('저장 실패: ' + err.message, 'error');
        } finally {
          setSubmitting(false);
        }
      }, [modal, showToast]);

      const handleDeleteFromForm = useCallback(() => {
        if (modal?.mode !== 'edit' || !modal.client) return;
        setConfirmDelete(modal.client);
      }, [modal]);

      const handleConfirmDelete = useCallback(async () => {
        const target = confirmDelete;
        if (!target) return;
        setSubmitting(true);
        try {
          await API.deleteClient(target.id);
          setClients((prev) => prev.filter((c) => c.id !== target.id));
          // 키가 (cid::month) 형식 — 해당 cid로 시작하는 모든 월 entry 제거
          const prefix = `${target.id}::`;
          const dropPrefix = (obj) => {
            const next = {};
            for (const [key, val] of Object.entries(obj)) {
              if (!key.startsWith(prefix)) next[key] = val;
            }
            return next;
          };
          setCopies(dropPrefix);
          setStatusMap(dropPrefix);
          setSlidesByClient(dropPrefix);
          setImagesByClient(dropPrefix);
          setStaleByClient(dropPrefix);
          if (selectedClientId === target.id) {
            const remaining = clients.filter((c) => c.id !== target.id);
            setSelectedClientId(remaining[0]?.id || null);
          }
          setConfirmDelete(null);
          setModal(null);
          showToast(`${target.name} 삭제됨`, 'success');
        } catch (err) {
          showToast('삭제 실패: ' + err.message, 'error');
        } finally {
          setSubmitting(false);
        }
      }, [confirmDelete, selectedClientId, clients, showToast]);

      // ============ Render ============

      return (
        <div className="min-h-screen">
          <Header
            month={month}
            onMonthChange={setMonth}
            onCollect={handleCollectTrends}
            collecting={collecting}
            hasTrends={hasTrends}
            sourcesUsed={sourcesUsed}
          />

          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-5">
            {loading ? (
              <div className="flex items-center justify-center py-24 text-slate-400 text-sm">
                불러오는 중...
              </div>
            ) : (
              <div className="flex flex-col lg:flex-row gap-5">
                <ClientList
                  clients={clients}
                  selectedId={selectedClientId}
                  onSelect={setSelectedClientId}
                  onAdd={openAdd}
                  onEdit={openEdit}
                  onDelete={(client) => setConfirmDelete(client)}
                  statusMap={statusMap}
                  month={month}
                />
                <section className="flex-1 min-w-0">
                  <WorkArea
                    client={selectedClient}
                    copy={selectedClient ? copies[k(selectedClient.id, month)] : null}
                    onCopyChange={handleCopyChange}
                    onGenerate={handleGenerateCopy}
                    onRender={handleRender}
                    onRegenImage={handleRegenImage}
                    onDownload={handleDownload}
                    status={selectedClient ? (statusMap[k(selectedClient.id, month)] || 'pending') : 'pending'}
                    onStatusChange={handleStatusChange}
                    generating={generating}
                    rendering={rendering}
                    regeneratingImage={regeneratingImage}
                    downloading={downloading}
                    hasTrends={hasTrends}
                    slidesData={selectedClient ? slidesByClient[k(selectedClient.id, month)] : null}
                    isStale={selectedClient ? !!staleByClient[k(selectedClient.id, month)] : false}
                    hasFalImage={selectedClient ? !!imagesByClient[k(selectedClient.id, month)] : false}
                    showToast={showToast}
                  />
                </section>
              </div>
            )}
          </main>

          {/* Add/Edit modal */}
          <Modal
            isOpen={!!modal}
            onClose={() => setModal(null)}
            title={modal?.mode === 'edit' ? '클라이언트 수정' : '클라이언트 추가'}
          >
            {modal && (
              <ClientForm
                initial={modal.mode === 'edit' ? modal.client : null}
                onSubmit={handleSubmitClient}
                onDelete={modal.mode === 'edit' ? handleDeleteFromForm : null}
                submitting={submitting}
              />
            )}
          </Modal>

          {/* Delete confirmation */}
          <Modal
            isOpen={!!confirmDelete}
            onClose={() => setConfirmDelete(null)}
            title="클라이언트 삭제"
            size="sm"
          >
            {confirmDelete && (
              <div className="space-y-4">
                <p className="text-sm text-slate-300">
                  <span className="font-semibold text-slate-100">{confirmDelete.name}</span>을(를) 정말 삭제하시겠습니까?<br />
                  이 작업은 되돌릴 수 없습니다.
                </p>
                <div className="flex justify-end gap-2">
                  <Button variant="secondary" onClick={() => setConfirmDelete(null)}>취소</Button>
                  <Button variant="danger" onClick={handleConfirmDelete} disabled={submitting}>
                    {submitting ? '삭제 중...' : '삭제'}
                  </Button>
                </div>
              </div>
            )}
          </Modal>

          <Toast toast={toast} onClose={() => setToast(null)} />
        </div>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
